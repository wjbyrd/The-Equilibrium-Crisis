  { id: 11034, sourceGame: "marketGate", q: "A rent ceiling is set below equilibrium. Quantity demanded is 900 apartments and quantity supplied is 600. What occurs?", options: ["A shortage of 300 apartments", "A surplus of 300 apartments", "A shortage of 1,500 apartments", "No effect because ceilings are minimum prices"], a: 0, tag: "price_ceiling", type: "calculation", objective: "LO6.1", difficulty: "medium", conceptCluster: "government_policy", primarySkill: "ceiling_shortage_calculation", secondarySkills: ["binding_price_ceiling"], repairSkill: "ceiling_shortage_calculation", commonError: "adds_qd_and_qs_instead_of_subtracting", feedback: "The shortage is quantity demanded minus quantity supplied: 900 - 600 = 300." },
  { id: 11035, sourceGame: "marketGate", q: "A binding price ceiling tends to reduce the quality of rental housing because:", options: ["Landlords have less incentive to maintain units when price cannot rise", "Tenants always demand less housing at lower prices", "Quantity supplied rises above quantity demanded", "The ceiling is above equilibrium"], a: 0, tag: "price_ceiling", type: "interpretation", objective: "LO6.1", difficulty: "medium", conceptCluster: "government_policy", primarySkill: "ceiling_unintended_consequences", secondarySkills: ["ceiling_shortage_effect"], repairSkill: "binding_price_ceiling", commonError: "misses_nonprice_effects_of_ceiling", feedback: "A binding ceiling can create shortages and reduce incentives to maintain quality." },
  { id: 11036, sourceGame: "marketGate", q: "A minimum wage is set below the equilibrium wage. What is the likely result?", options: ["The minimum wage is not binding", "It creates unemployment", "It creates a labor shortage", "It shifts labor demand right"], a: 0, tag: "price_floor", type: "interpretation", objective: "LO6.2", difficulty: "medium", conceptCluster: "government_policy", primarySkill: "nonbinding_price_floor", secondarySkills: ["binding_price_floor"], repairSkill: "binding_price_floor", commonError: "thinks_all_price_floors_bind", feedback: "A price floor below equilibrium does not prevent the market wage from reaching equilibrium." },
  { id: 11037, sourceGame: "marketGate", q: "A minimum wage is set above equilibrium. Labor supplied is 120,000 and labor demanded is 80,000. What is the labor surplus?", options: ["40,000 workers", "80,000 workers", "120,000 workers", "200,000 workers"], a: 0, tag: "price_floor", type: "calculation", objective: "LO6.2", difficulty: "medium", conceptCluster: "government_policy", primarySkill: "floor_surplus_calculation", secondarySkills: ["minimum_wage_surplus"], repairSkill: "floor_surplus_calculation", commonError: "adds_qs_and_qd_instead_of_subtracting", feedback: "The surplus is quantity supplied minus quantity demanded: 120,000 - 80,000 = 40,000." },
  { id: 11038, sourceGame: "marketGate", q: "A binding price floor in an agricultural market may lead to:", options: ["Unsold surplus output", "A shortage of the crop", "A lower legal price", "A movement down the demand curve caused by lower price"], a: 0, tag: "price_floor", type: "interpretation", objective: "LO6.2", difficulty: "medium", conceptCluster: "government_policy", primarySkill: "floor_surplus_effect", secondarySkills: ["binding_price_floor"], repairSkill: "binding_price_floor", commonError: "confuses_floor_with_ceiling", feedback: "A binding price floor keeps price above equilibrium, so quantity supplied exceeds quantity demanded." },
  { id: 11039, sourceGame: "marketGate", q: "A tax on sellers shifts the supply curve upward because:", options: ["The tax raises the cost of selling each unit", "The tax increases buyers' income", "The tax makes demand perfectly elastic", "The tax eliminates opportunity cost"], a: 0, tag: "taxes", type: "interpretation", objective: "LO6.3", difficulty: "medium", conceptCluster: "government_policy", primarySkill: "tax_shifts_supply", secondarySkills: ["tax_wedge_identification"], repairSkill: "tax_wedge_incidence", commonError: "misses_tax_as_cost_to_sellers", feedback: "A tax on sellers raises the cost of selling each unit, shifting supply upward." },
  { id: 11040, sourceGame: "marketGate", q: "Before a tax, buyers pay $10 and sellers receive $10. After the tax, buyers pay $12 and sellers receive $8. What is the tax wedge?", options: ["$4", "$2", "$8", "$20"], a: 0, tag: "taxes", type: "calculation", objective: "LO6.3", difficulty: "medium", conceptCluster: "government_policy", primarySkill: "tax_wedge_calculation", secondarySkills: ["price_paid_vs_received"], repairSkill: "tax_wedge_incidence", commonError: "uses_change_in_buyer_price_only", feedback: "The wedge is the price buyers pay minus the price sellers receive: $12 - $8 = $4." },
  { id: 11041, sourceGame: "marketGate", q: "A tax reduces the quantity sold from 100 units to 75 units. What is the best interpretation?", options: ["The tax shrinks the size of the market", "The tax eliminates scarcity", "The tax increases both supply and demand", "The tax causes quantity sold to rise"], a: 0, tag: "taxes", type: "interpretation", objective: "LO6.3", difficulty: "medium", conceptCluster: "government_policy", primarySkill: "tax_quantity_effect", secondarySkills: ["tax_wedge_identification"], repairSkill: "tax_wedge_incidence", commonError: "misses_tax_reduces_trades", feedback: "A tax raises the cost of exchange and reduces the quantity traded." },
  { id: 11042, sourceGame: "marketGate", q: "A $6 tax causes buyers to pay $4 more than before and sellers to receive $2 less than before. Who bears more of the tax burden?", options: ["Buyers", "Sellers", "Both sides bear zero burden", "Only the government"], a: 0, tag: "tax_incidence", type: "calculation", objective: "LO6.5", difficulty: "medium", conceptCluster: "government_policy", primarySkill: "tax_burden_calculation", secondarySkills: ["buyer_seller_tax_burden"], repairSkill: "tax_incidence_less_elastic_side", commonError: "looks_only_at_legal_tax_assignment", feedback: "Buyers bear $4 of the $6 tax, while sellers bear $2, so buyers bear more." },
  { id: 11043, sourceGame: "marketGate", q: "A tax is legally imposed on sellers, but buyers pay most of the burden. What explains this?", options: ["Legal assignment does not determine economic burden", "Sellers always avoid all taxes", "Buyers legally mailed the tax payment", "The market must have a price ceiling"], a: 0, tag: "tax_incidence", type: "interpretation", objective: "LO6.4", difficulty: "medium", conceptCluster: "government_policy", primarySkill: "buyer_seller_tax_equivalence", secondarySkills: ["tax_incidence_definition"], repairSkill: "tax_equivalence", commonError: "thinks_legal_tax_assignment_determines_full_burden", feedback: "Tax burden depends on market responses, not just who is legally assigned to pay." },
  { id: 11044, sourceGame: "marketGate", q: "If demand is very inelastic and supply is elastic, who likely bears more of a tax?", options: ["Buyers", "Sellers", "Both sides bear exactly zero", "The side with more firms always bears it"], a: 0, tag: "tax_incidence", type: "interpretation", objective: "LO6.5", difficulty: "medium", conceptCluster: "government_policy", primarySkill: "tax_burden_less_elastic_side", secondarySkills: ["elasticity_and_tax_burden"], repairSkill: "tax_incidence_less_elastic_side", commonError: "thinks_elastic_side_bears_more_burden", feedback: "The less elastic side bears more of the tax burden. Here, that is buyers." },
  { id: 11045, sourceGame: "marketGate", q: "If supply is very inelastic and demand is elastic, who likely bears more of a tax?", options: ["Sellers", "Buyers", "Only the government", "No one because demand is elastic"], a: 0, tag: "tax_incidence", type: "interpretation", objective: "LO6.5", difficulty: "medium", conceptCluster: "government_policy", primarySkill: "tax_burden_less_elastic_side", secondarySkills: ["elasticity_and_tax_burden"], repairSkill: "tax_incidence_less_elastic_side", commonError: "gets_less_elastic_side_backwards", feedback: "The less elastic side bears more of the burden. Here, that is sellers." },
  { id: 11046, sourceGame: "marketGate", q: "A binding price ceiling and a tax both reduce market efficiency, but they do so differently. Which statement is correct?", options: ["A ceiling holds price below equilibrium, while a tax creates a wedge between buyer and seller prices", "A ceiling always creates a surplus, while a tax always raises quantity", "A tax eliminates scarcity, while a ceiling eliminates opportunity cost", "Both policies are the same as a demand increase"], a: 0, tag: "government_policy", type: "interpretation", objective: "LO6.1", difficulty: "medium", conceptCluster: "government_policy", primarySkill: "policy_tool_distinction", secondarySkills: ["binding_price_ceiling", "tax_wedge_identification"], repairSkill: "binding_price_controls", commonError: "confuses_price_control_with_tax_wedge", feedback: "A price ceiling directly limits price, while a tax creates a gap between what buyers pay and sellers receive." },
  { id: 11047, sourceGame: "marketGate", q: "A price floor above equilibrium and a price ceiling below equilibrium both cause problems because:", options: ["They prevent the market price from adjusting to equilibrium", "They eliminate all gains from trade immediately", "They make demand and supply irrelevant", "They always increase the quantity traded"], a: 0, tag: "price_controls", type: "interpretation", objective: "LO6.2", difficulty: "medium", conceptCluster: "government_policy", primarySkill: "binding_price_control_identification", secondarySkills: ["binding_price_ceiling", "binding_price_floor"], repairSkill: "binding_price_controls", commonError: "cannot_identify_why_binding_controls_matter", feedback: "Binding price controls prevent price from moving to equilibrium, creating shortages or surpluses." },
  { id: 11048, sourceGame: "marketGate", q: "A government policy keeps apartment rents below equilibrium. Which outcome is most likely over time?", options: ["Shortages and nonprice rationing", "Surpluses and unsold apartments", "A rightward supply shift caused by lower rent", "An increase in quantity supplied"], a: 0, tag: "price_ceiling", type: "interpretation", objective: "LO6.1", difficulty: "medium", conceptCluster: "government_policy", primarySkill: "ceiling_unintended_consequences", secondarySkills: ["ceiling_shortage_effect"], repairSkill: "binding_price_ceiling", commonError: "misses_nonprice_rationing_under_ceiling", feedback: "A binding rent ceiling creates shortages, so apartments may be rationed through waiting, search costs, or other nonprice methods." },
  { id: 11049, sourceGame: "marketGate", q: "'The side that can walk away more easily pays less of the tax.' What concept am I describing?", options: ["Tax incidence and elasticity", "A binding price floor only", "The circular-flow model", "A positive statement only"], a: 0, tag: "tax_incidence", type: "interpretation", objective: "LO6.5", difficulty: "medium", conceptCluster: "government_policy", primarySkill: "elasticity_and_tax_burden", secondarySkills: ["tax_burden_less_elastic_side"], repairSkill: "tax_incidence_less_elastic_side", commonError: "misses_elasticity_as_escape_ability", feedback: "The more elastic side can respond more easily, so it bears less of the tax burden." },
  { id: 11050, sourceGame: "marketGate", q: "Refer to the PPF graph. Which points are efficient production points?", options: ["A, B, C, D, and E", "Only F", "Only G", "F and G"], a: 0, tag: "ppf", type: "graph", objective: "LO2.2", difficulty: "medium", conceptCluster: "economic_models", primarySkill: "ppf_efficiency_status", secondarySkills: ["attainable_unattainable"], repairSkill: "ppf_efficiency_status", commonError: "confuses_points_on_ppf_with_inside_or_outside_points", image: "ppf.png", feedback: "Points on the PPF are efficient because the economy is using its available resources fully." },
  { id: 11051, sourceGame: "marketGate", q: "Refer to the PPF graph. Which point is attainable but inefficient?", options: ["F", "G", "C", "E"], a: 0, tag: "ppf", type: "graph", objective: "LO2.2", difficulty: "medium", conceptCluster: "economic_models", primarySkill: "ppf_efficiency_status", secondarySkills: ["attainable_unattainable"], repairSkill: "ppf_efficiency_status", commonError: "confuses_inside_ppf_with_unattainable", image: "ppf.png", feedback: "Point F is inside the PPF, so it is attainable but inefficient." },
  { id: 11052, sourceGame: "marketGate", q: "Refer to the PPF graph. Which point is currently unattainable?", options: ["G", "F", "A", "D"], a: 0, tag: "ppf", type: "graph", objective: "LO2.2", difficulty: "medium", conceptCluster: "economic_models", primarySkill: "attainable_unattainable", secondarySkills: ["ppf_efficiency_status"], repairSkill: "ppf_efficiency_status", commonError: "confuses_outside_ppf_with_efficient", image: "ppf.png", feedback: "Point G is outside the PPF, so it is unattainable with current resources and technology." },
  { id: 11053, sourceGame: "marketGate", q: "Refer to the PPF graph. Moving from B to C increases production of Good X by how many units?", options: ["7", "8", "10", "15"], a: 0, tag: "ppf", type: "graph_calculation", objective: "LO2.2", difficulty: "medium", conceptCluster: "economic_models", primarySkill: "ppf_coordinate_reading", secondarySkills: ["ppf_opportunity_cost"], repairSkill: "ppf_coordinate_reading", commonError: "reads_y_axis_change_instead_of_x_axis_change", image: "ppf.png", feedback: "Point B has 8 units of Good X and point C has 15, so Good X increases by 7 units." },
  { id: 11054, sourceGame: "marketGate", q: "Refer to the PPF graph. Moving from B to C requires giving up how many units of Good Y?", options: ["10", "7", "15", "35"], a: 0, tag: "ppf", type: "graph_calculation", objective: "LO2.2", difficulty: "medium", conceptCluster: "economic_models", primarySkill: "ppf_opportunity_cost", secondarySkills: ["ppf_coordinate_reading"], repairSkill: "ppf_opportunity_cost", commonError: "uses_x_axis_change_instead_of_y_axis_loss", image: "ppf.png", feedback: "Good Y falls from 45 at B to 35 at C, so the economy gives up 10 units of Good Y." },
  { id: 11055, sourceGame: "marketGate", q: "Refer to the PPF graph. What is the opportunity cost of moving from C to D?", options: ["15 units of Good Y", "6 units of Good X", "20 units of Good Y", "21 units of Good X"], a: 0, tag: "ppf", type: "graph_calculation", objective: "LO2.2", difficulty: "medium", conceptCluster: "economic_models", primarySkill: "ppf_opportunity_cost", secondarySkills: ["ppf_coordinate_reading"], repairSkill: "ppf_opportunity_cost", commonError: "identifies_gain_in_x_as_the_cost", image: "ppf.png", feedback: "Moving from C to D raises Good X from 15 to 21, but Good Y falls from 35 to 20. The opportunity cost is 15 units of Good Y." },
  { id: 11056, sourceGame: "marketGate", q: "Refer to the PPF graph. What is the opportunity cost per additional unit of Good X when moving from C to D?", options: ["2.5 units of Good Y", "6 units of Good Y", "15 units of Good Y", "0.4 units of Good Y"], a: 0, tag: "ppf", type: "graph_calculation", objective: "LO2.2", difficulty: "medium", conceptCluster: "economic_models", primarySkill: "ppf_opportunity_cost_per_unit", secondarySkills: ["ppf_opportunity_cost"], repairSkill: "ppf_opportunity_cost", commonError: "divides_gain_by_loss_instead_of_loss_by_gain", image: "ppf.png", feedback: "Moving from C to D gains 6 units of Good X and gives up 15 units of Good Y, so 15 / 6 = 2.5 units of Good Y per Good X." },
  { id: 11057, sourceGame: "marketGate", q: "Refer to the PPF graph. What does the bowed-out shape of the PPF suggest?", options: ["Opportunity cost rises as more Good X is produced", "Opportunity cost is always zero", "Good X and Good Y are unlimited", "The economy is always inefficient"], a: 0, tag: "ppf", type: "graph_interpretation", objective: "LO2.2", difficulty: "medium", conceptCluster: "economic_models", primarySkill: "increasing_opportunity_cost", secondarySkills: ["ppf_shape_interpretation"], repairSkill: "increasing_opportunity_cost", commonError: "misses_bowed_shape_as_increasing_opportunity_cost", image: "ppf.png", feedback: "A bowed-out PPF shows increasing opportunity cost as resources are shifted toward producing more of one good." },
  { id: 11058, sourceGame: "marketGate", q: "Refer to the PPF graph. If the economy moves from F to C, what has happened?", options: ["The economy has moved from inefficient production to efficient production", "The economy has moved from unattainable production to attainable production", "The economy has reduced both goods", "The economy has moved outside the PPF"], a: 0, tag: "ppf", type: "graph_interpretation", objective: "LO2.2", difficulty: "medium", conceptCluster: "economic_models", primarySkill: "ppf_efficiency_status", secondarySkills: ["ppf_coordinate_reading"], repairSkill: "ppf_efficiency_status", commonError: "confuses_inside_point_with_outside_point", image: "ppf.png", feedback: "Point F is inside the PPF and point C is on the PPF, so the economy moved from inefficient to efficient production." },
  { id: 11059, sourceGame: "marketGate", q: "Refer to the supply and demand graph. Which equilibrium is formed by D1 and S2?", options: ["Price P1 and Quantity Q2", "Price P2 and Quantity Q1", "Price P3 and Quantity Q2", "Price P2 and Quantity Q3"], a: 0, tag: "equilibrium", type: "graph", objective: "LO4.4", difficulty: "medium", conceptCluster: "supply_demand", primarySkill: "equilibrium_identification", secondarySkills: ["curve_pairing"], repairSkill: "equilibrium_prediction", commonError: "misreads_intersection_of_named_curves", image: "supplydemand1.png", feedback: "D1 and S2 intersect at the middle vertical guide and the lowest horizontal guide, which is Price P1 and Quantity Q2." },
  { id: 11060, sourceGame: "marketGate", q: "Refer to the supply and demand graph. Which equilibrium is formed by D1 and S1?", options: ["Price P2 and Quantity Q1", "Price P1 and Quantity Q2", "Price P3 and Quantity Q2", "Price P2 and Quantity Q3"], a: 0, tag: "equilibrium", type: "graph", objective: "LO4.4", difficulty: "medium", conceptCluster: "supply_demand", primarySkill: "equilibrium_identification", secondarySkills: ["curve_pairing"], repairSkill: "equilibrium_prediction", commonError: "misreads_intersection_of_named_curves", image: "supplydemand1.png", feedback: "D1 and S1 intersect at the left vertical guide and the middle horizontal guide, which is Price P2 and Quantity Q1." },
  { id: 11061, sourceGame: "marketGate", q: "Refer to the supply and demand graph. Which equilibrium is formed by D2 and S2?", options: ["Price P2 and Quantity Q3", "Price P1 and Quantity Q2", "Price P3 and Quantity Q2", "Price P2 and Quantity Q1"], a: 0, tag: "equilibrium", type: "graph", objective: "LO4.4", difficulty: "medium", conceptCluster: "supply_demand", primarySkill: "equilibrium_identification", secondarySkills: ["curve_pairing"], repairSkill: "equilibrium_prediction", commonError: "misreads_intersection_of_named_curves", image: "supplydemand1.png", feedback: "D2 and S2 intersect at the right vertical guide and the middle horizontal guide, which is Price P2 and Quantity Q3." },
  { id: 11062, sourceGame: "marketGate", q: "Refer to the supply and demand graph. If supply shifts from S1 to S2 while demand remains at D1, what happens to equilibrium price and quantity?", options: ["Price falls and quantity rises", "Price rises and quantity falls", "Price falls and quantity falls", "Price rises and quantity rises"], a: 0, tag: "supply", type: "graph_interpretation", objective: "LO4.4", difficulty: "medium", conceptCluster: "supply_demand", primarySkill: "supply_shift_equilibrium_prediction", secondarySkills: ["equilibrium_comparison"], repairSkill: "equilibrium_prediction", commonError: "gets_supply_shift_effect_backwards", image: "supplydemand1.png", feedback: "Moving from D1 with S1 to D1 with S2 lowers equilibrium price from P2 to P1 and raises equilibrium quantity from Q1 to Q2." },
  { id: 11063, sourceGame: "marketGate", q: "Refer to the supply and demand graph. If demand shifts from D1 to D2 while supply remains at S2, what happens to equilibrium price and quantity?", options: ["Price rises and quantity rises", "Price falls and quantity falls", "Price rises and quantity falls", "Price falls and quantity rises"], a: 0, tag: "demand", type: "graph_interpretation", objective: "LO4.4", difficulty: "medium", conceptCluster: "supply_demand", primarySkill: "demand_shift_equilibrium_prediction", secondarySkills: ["equilibrium_comparison"], repairSkill: "equilibrium_prediction", commonError: "gets_demand_shift_effect_backwards", image: "supplydemand1.png", feedback: "Moving from D1 with S2 to D2 with S2 raises equilibrium price from P1 to P2 and raises equilibrium quantity from Q2 to Q3." },
  { id: 11064, sourceGame: "marketGate", q: "Refer to the supply and demand graph. Compared with the equilibrium at D1 and S1, the equilibrium at D2 and S2 shows:", options: ["The same price but a higher quantity", "A lower price and a lower quantity", "A higher price and a lower quantity", "A lower price and the same quantity"], a: 0, tag: "equilibrium", type: "graph_interpretation", objective: "LO4.4", difficulty: "medium", conceptCluster: "supply_demand", primarySkill: "equilibrium_comparison", secondarySkills: ["demand_shift_equilibrium_prediction", "supply_shift_equilibrium_prediction"], repairSkill: "equilibrium_prediction", commonError: "cannot_compare_two_equilibria_correctly", image: "supplydemand1.png", feedback: "D1 and S1 gives Price P2 and Quantity Q1, while D2 and S2 gives Price P2 and Quantity Q3, so price is the same and quantity is higher." },
  { id: 11065, sourceGame: "marketGate", q: "Refer to the supply and demand graph. Which curve shift is shown when equilibrium moves from Price P2, Quantity Q1 to Price P1, Quantity Q2?", options: ["A rightward shift in supply", "A rightward shift in demand", "A leftward shift in demand", "A leftward shift in supply"], a: 0, tag: "supply", type: "graph_interpretation", objective: "LO4.3", difficulty: "medium", conceptCluster: "supply_demand", primarySkill: "supply_shift_direction", secondarySkills: ["equilibrium_comparison"], repairSkill: "supply_shifters", commonError: "mistakes_supply_shift_for_demand_shift", image: "supplydemand1.png", feedback: "The move from D1 with S1 to D1 with S2 lowers price and raises quantity, which matches an increase in supply." },
  { id: 11066, sourceGame: "marketGate", q: "Refer to the supply and demand graph. Which curve shift is shown when equilibrium moves from Price P1, Quantity Q2 to Price P2, Quantity Q3?", options: ["A rightward shift in demand", "A leftward shift in demand", "A leftward shift in supply", "A rightward shift in supply"], a: 0, tag: "demand", type: "graph_interpretation", objective: "LO4.2", difficulty: "medium", conceptCluster: "supply_demand", primarySkill: "demand_shift_direction", secondarySkills: ["equilibrium_comparison"], repairSkill: "demand_shifters", commonError: "mistakes_demand_shift_for_supply_shift", image: "supplydemand1.png", feedback: "The move from D1 with S2 to D2 with S2 raises both price and quantity, which matches an increase in demand." },
  { id: 11067, sourceGame: "marketGate", q: "Refer to the supply and demand graph. If the market begins at D1 and S1, and then supply increases followed by demand increasing, what is the final equilibrium?", options: ["Price P2 and Quantity Q3", "Price P1 and Quantity Q2", "Price P2 and Quantity Q1", "Price P3 and Quantity Q2"], a: 0, tag: "equilibrium", type: "graph_interpretation", objective: "LO4.4", difficulty: "medium", conceptCluster: "supply_demand", primarySkill: "multi_shift_sequence", secondarySkills: ["equilibrium_comparison"], repairSkill: "equilibrium_prediction", commonError: "fails_to_track_two_step_shift_sequence", image: "supplydemand1.png", feedback: "Starting at D1 and S1 gives P2, Q1. A supply increase moves equilibrium to P1, Q2. Then a demand increase moves equilibrium to P2, Q3." },
  { id: 11068, sourceGame: "marketGate", q: "Refer to the price ceiling and price floor graph. What is the market equilibrium price and quantity?", options: ["$30 and 200 units", "$20 and 250 units", "$40 and 150 units", "$50 and 300 units"], a: 0, tag: "equilibrium", type: "graph", objective: "LO4.4", difficulty: "medium", conceptCluster: "government_policy", primarySkill: "equilibrium_identification", secondarySkills: ["graph_reading"], repairSkill: "equilibrium_definition", commonError: "misreads_intersection_of_supply_and_demand", image: "ceilingfloor.png", feedback: "Equilibrium occurs where supply and demand intersect, which is $30 and 200 units." },
  { id: 11069, sourceGame: "marketGate", q: "Refer to the graph. If the government sets a price ceiling at $20, is the price ceiling binding?", options: ["Yes, because it is below the equilibrium price", "No, because it is below the equilibrium price", "Yes, because it is above the equilibrium price", "No, because all price ceilings are nonbinding"], a: 0, tag: "price_ceiling", type: "graph_interpretation", objective: "LO6.1", difficulty: "medium", conceptCluster: "government_policy", primarySkill: "binding_price_ceiling", secondarySkills: ["equilibrium_identification"], repairSkill: "binding_price_ceiling", commonError: "gets_binding_ceiling_direction_backwards", image: "ceilingfloor.png", feedback: "A price ceiling is binding when it is below equilibrium. Here, $20 is below the $30 equilibrium price." },
  { id: 11070, sourceGame: "marketGate", q: "Refer to the graph. At a price ceiling of $20, what is quantity demanded?", options: ["250 units", "150 units", "200 units", "300 units"], a: 0, tag: "price_ceiling", type: "graph", objective: "LO6.1", difficulty: "medium", conceptCluster: "government_policy", primarySkill: "ceiling_quantity_demanded", secondarySkills: ["graph_reading"], repairSkill: "ceiling_shortage_calculation", commonError: "reads_supply_curve_instead_of_demand_curve", image: "ceilingfloor.png", feedback: "At $20, the demand curve shows quantity demanded of 250 units." },
  { id: 11071, sourceGame: "marketGate", q: "Refer to the graph. At a price ceiling of $20, what is quantity supplied?", options: ["150 units", "250 units", "200 units", "100 units"], a: 0, tag: "price_ceiling", type: "graph", objective: "LO6.1", difficulty: "medium", conceptCluster: "government_policy", primarySkill: "ceiling_quantity_supplied", secondarySkills: ["graph_reading"], repairSkill: "ceiling_shortage_calculation", commonError: "reads_demand_curve_instead_of_supply_curve", image: "ceilingfloor.png", feedback: "At $20, the supply curve shows quantity supplied of 150 units." },
  { id: 11072, sourceGame: "marketGate", q: "Refer to the graph. If the government sets a price ceiling at $20, what shortage results?", options: ["100 units", "50 units", "150 units", "400 units"], a: 0, tag: "price_ceiling", type: "graph_calculation", objective: "LO6.1", difficulty: "medium", conceptCluster: "government_policy", primarySkill: "ceiling_shortage_calculation", secondarySkills: ["ceiling_quantity_demanded", "ceiling_quantity_supplied"], repairSkill: "ceiling_shortage_calculation", commonError: "adds_qd_and_qs_instead_of_subtracting", image: "ceilingfloor.png", feedback: "At $20, quantity demanded is 250 and quantity supplied is 150. The shortage is 250 - 150 = 100 units." },
  { id: 11073, sourceGame: "marketGate", q: "Refer to the graph. If the government sets a price floor at $40, is the price floor binding?", options: ["Yes, because it is above the equilibrium price", "No, because it is above the equilibrium price", "Yes, because it is below the equilibrium price", "No, because all price floors are nonbinding"], a: 0, tag: "price_floor", type: "graph_interpretation", objective: "LO6.2", difficulty: "medium", conceptCluster: "government_policy", primarySkill: "binding_price_floor", secondarySkills: ["equilibrium_identification"], repairSkill: "binding_price_floor", commonError: "gets_binding_floor_direction_backwards", image: "ceilingfloor.png", feedback: "A price floor is binding when it is above equilibrium. Here, $40 is above the $30 equilibrium price." },
  { id: 11074, sourceGame: "marketGate", q: "Refer to the graph. At a price floor of $40, what is quantity demanded?", options: ["150 units", "250 units", "200 units", "300 units"], a: 0, tag: "price_floor", type: "graph", objective: "LO6.2", difficulty: "medium", conceptCluster: "government_policy", primarySkill: "floor_quantity_demanded", secondarySkills: ["graph_reading"], repairSkill: "floor_surplus_calculation", commonError: "reads_supply_curve_instead_of_demand_curve", image: "ceilingfloor.png", feedback: "At $40, the demand curve shows quantity demanded of 150 units." },
  { id: 11075, sourceGame: "marketGate", q: "Refer to the graph. At a price floor of $40, what is quantity supplied?", options: ["250 units", "150 units", "200 units", "100 units"], a: 0, tag: "price_floor", type: "graph", objective: "LO6.2", difficulty: "medium", conceptCluster: "government_policy", primarySkill: "floor_quantity_supplied", secondarySkills: ["graph_reading"], repairSkill: "floor_surplus_calculation", commonError: "reads_demand_curve_instead_of_supply_curve", image: "ceilingfloor.png", feedback: "At $40, the supply curve shows quantity supplied of 250 units." },
  { id: 11076, sourceGame: "marketGate", q: "Refer to the graph. If the government sets a price floor at $40, what surplus results?", options: ["100 units", "50 units", "150 units", "400 units"], a: 0, tag: "price_floor", type: "graph_calculation", objective: "LO6.2", difficulty: "medium", conceptCluster: "government_policy", primarySkill: "floor_surplus_calculation", secondarySkills: ["floor_quantity_supplied", "floor_quantity_demanded"], repairSkill: "floor_surplus_calculation", commonError: "adds_qs_and_qd_instead_of_subtracting", image: "ceilingfloor.png", feedback: "At $40, quantity supplied is 250 and quantity demanded is 150. The surplus is 250 - 150 = 100 units." },
  { id: 11077, sourceGame: "marketGate", q: "Refer to the graph. If the government sets a price ceiling at $40, what is the most likely result?", options: ["The price ceiling is not binding", "A shortage of 100 units occurs", "A surplus of 100 units occurs", "The equilibrium quantity falls to 150"], a: 0, tag: "price_ceiling", type: "graph_interpretation", objective: "LO6.1", difficulty: "medium", conceptCluster: "government_policy", primarySkill: "nonbinding_price_ceiling", secondarySkills: ["binding_price_ceiling"], repairSkill: "binding_price_ceiling", commonError: "thinks_all_price_ceilings_bind", image: "ceilingfloor.png", feedback: "A price ceiling above equilibrium is not binding. Since $40 is above the $30 equilibrium price, it does not affect the market." },
  { id: 11078, sourceGame: "marketGate", q: "Refer to the tax incidence graph. What is the original equilibrium price and quantity before the tax?", options: ["$15 and 100 units", "$18 and 80 units", "$12 and 80 units", "$20 and 65 units"], a: 0, tag: "taxes", type: "graph", objective: "LO6.3", difficulty: "medium", conceptCluster: "government_policy", primarySkill: "pre_tax_equilibrium_identification", secondarySkills: ["graph_reading"], repairSkill: "tax_wedge_incidence", commonError: "misreads_pre_tax_intersection", image: "taxincidence.png", feedback: "Before the tax, demand and the original supply curve intersect at $15 and 100 units." },
  { id: 11079, sourceGame: "marketGate", q: "Refer to the tax incidence graph. After the tax, what price do buyers pay?", options: ["$18", "$12", "$15", "$20"], a: 0, tag: "taxes", type: "graph", objective: "LO6.3", difficulty: "medium", conceptCluster: "government_policy", primarySkill: "price_paid_by_buyers", secondarySkills: ["tax_wedge_identification"], repairSkill: "tax_wedge_incidence", commonError: "confuses_buyer_price_with_seller_price", image: "taxincidence.png", feedback: "After the tax, the price buyers pay is read from the demand curve at the new quantity, which is $18." },
  { id: 11080, sourceGame: "marketGate", q: "Refer to the tax incidence graph. After the tax, what price do sellers receive?", options: ["$12", "$18", "$15", "$10"], a: 0, tag: "taxes", type: "graph", objective: "LO6.3", difficulty: "medium", conceptCluster: "government_policy", primarySkill: "price_received_by_sellers", secondarySkills: ["tax_wedge_identification"], repairSkill: "tax_wedge_incidence", commonError: "confuses_seller_price_with_buyer_price", image: "taxincidence.png", feedback: "After the tax, sellers receive $12 per unit after the tax is accounted for." },
  { id: 11081, sourceGame: "marketGate", q: "Refer to the tax incidence graph. What is the amount of the tax per unit?", options: ["$6", "$3", "$12", "$18"], a: 0, tag: "taxes", type: "graph_calculation", objective: "LO6.3", difficulty: "medium", conceptCluster: "government_policy", primarySkill: "tax_wedge_calculation", secondarySkills: ["price_paid_by_buyers", "price_received_by_sellers"], repairSkill: "tax_wedge_incidence", commonError: "uses_only_buyer_price_change_instead_of_full_wedge", image: "taxincidence.png", feedback: "The tax wedge is the difference between what buyers pay and what sellers receive: $18 - $12 = $6." },
  { id: 11082, sourceGame: "marketGate", q: "Refer to the tax incidence graph. How much of the tax burden is paid by buyers?", options: ["$3", "$6", "$12", "$18"], a: 0, tag: "tax_incidence", type: "graph_calculation", objective: "LO6.5", difficulty: "medium", conceptCluster: "government_policy", primarySkill: "buyer_tax_burden_calculation", secondarySkills: ["tax_wedge_calculation"], repairSkill: "tax_incidence_less_elastic_side", commonError: "confuses_total_tax_with_buyer_burden", image: "taxincidence.png", feedback: "Buyers paid $15 before the tax and pay $18 after the tax, so their burden is $3." },
  { id: 11083, sourceGame: "marketGate", q: "Refer to the tax incidence graph. How much of the tax burden is paid by sellers?", options: ["$3", "$6", "$12", "$15"], a: 0, tag: "tax_incidence", type: "graph_calculation", objective: "LO6.5", difficulty: "medium", conceptCluster: "government_policy", primarySkill: "seller_tax_burden_calculation", secondarySkills: ["tax_wedge_calculation"], repairSkill: "tax_incidence_less_elastic_side", commonError: "confuses_total_tax_with_seller_burden", image: "taxincidence.png", feedback: "Sellers received $15 before the tax and receive $12 after the tax, so their burden is $3." },
  { id: 11084, sourceGame: "marketGate", q: "Refer to the tax incidence graph. What happens to the quantity sold after the tax?", options: ["It falls from 100 to 80 units", "It rises from 80 to 100 units", "It stays at 100 units", "It rises from 100 to 120 units"], a: 0, tag: "taxes", type: "graph_interpretation", objective: "LO6.3", difficulty: "medium", conceptCluster: "government_policy", primarySkill: "tax_quantity_effect", secondarySkills: ["pre_tax_equilibrium_identification"], repairSkill: "tax_wedge_incidence", commonError: "misses_tax_reduces_quantity_sold", image: "taxincidence.png", feedback: "The tax reduces the quantity sold from 100 units to 80 units." },
  { id: 11085, sourceGame: "marketGate", q: "Refer to the tax incidence graph. By how many units does the tax reduce the quantity sold?", options: ["20 units", "80 units", "100 units", "180 units"], a: 0, tag: "taxes", type: "graph_calculation", objective: "LO6.3", difficulty: "medium", conceptCluster: "government_policy", primarySkill: "tax_quantity_reduction_calculation", secondarySkills: ["tax_quantity_effect"], repairSkill: "tax_wedge_incidence", commonError: "uses_after_tax_quantity_instead_of_change_in_quantity", image: "taxincidence.png", feedback: "Quantity falls from 100 to 80, so the tax reduces quantity sold by 20 units." },
  { id: 11086, sourceGame: "marketGate", q: "Refer to the tax incidence graph. Who bears more of the tax burden?", options: ["Buyers and sellers share the burden equally", "Buyers bear all of the burden", "Sellers bear all of the burden", "No one bears the burden"], a: 0, tag: "tax_incidence", type: "graph_interpretation", objective: "LO6.5", difficulty: "medium", conceptCluster: "government_policy", primarySkill: "buyer_seller_tax_burden", secondarySkills: ["buyer_tax_burden_calculation", "seller_tax_burden_calculation"], repairSkill: "tax_incidence_less_elastic_side", commonError: "assumes_legal_tax_assignment_determines_burden", image: "taxincidence.png", feedback: "Buyers pay $3 more and sellers receive $3 less, so the burden is split equally." },
  { id: 11087, sourceGame: "marketGate", q: "Refer to the tax incidence graph. Which statement best describes the effect of the tax?", options: ["The tax creates a wedge and reduces the quantity traded", "The tax increases both supply and demand", "The tax raises quantity from 80 to 100", "The tax removes scarcity from the market"], a: 0, tag: "taxes", type: "graph_interpretation", objective: "LO6.3", difficulty: "medium", conceptCluster: "government_policy", primarySkill: "tax_wedge_identification", secondarySkills: ["tax_quantity_effect"], repairSkill: "tax_wedge_incidence", commonError: "misses_tax_wedge_and_market_shrinkage", image: "taxincidence.png", feedback: "The tax creates a wedge between buyer and seller prices and reduces the quantity traded." },
  { id:11088, sourceGame: "nationalLedger", difficulty:"medium", conceptCluster:"gdp_measurement", primarySkill:"income_expenditure_identity", secondarySkills:["gdp_counting_rules"], repairSkill:"income_expenditure_identity", commonError:"Treating spending and income as unrelated totals instead of two sides of the same transaction.", q:"A student says GDP can be measured by adding up either total income or total expenditure. Why is that true?", options:["Every transaction has a buyer and a seller, so spending by one party becomes income for another","GDP only counts income earned by households, not spending","The government adjusts income until it equals spending","Exports and imports must always be equal"], a:0, tag:"gdp_income_expenditure", type:"interpretation", objective:"LO24.1", feedback:"The income and expenditure approaches match because each dollar spent becomes income to someone else." },
  { id:11089, sourceGame: "nationalLedger", difficulty:"medium", conceptCluster:"gdp_measurement", primarySkill:"income_expenditure_identity", secondarySkills:["gdp_counting_rules"], repairSkill:"income_expenditure_identity", commonError:"Treating spending and income as unrelated totals instead of two sides of the same transaction.", q:"Suppose firms sell $900 billion of final goods and households, firms, government, and foreigners buy all of it. What should total income from producing those goods equal?", options:["$0","$450 billion","$900 billion","It depends only on taxes"], a:2, tag:"gdp_income_expenditure", type:"calculation", objective:"LO24.1", feedback:"Total expenditure on final output becomes total income earned from producing that output." },
  { id:11090, sourceGame: "nationalLedger", difficulty:"medium", conceptCluster:"gdp_measurement", primarySkill:"income_expenditure_identity", secondarySkills:["gdp_counting_rules"], repairSkill:"income_expenditure_identity", commonError:"Treating spending and income as unrelated totals instead of two sides of the same transaction.", q:"Which example best shows the income-expenditure identity in action?", options:["A firm sells a $40 meal and the restaurant receives $40 in revenue","A used car is resold and counted twice in GDP","A government transfer payment raises GDP directly","A household saves money under a mattress"], a:0, tag:"gdp_income_expenditure", type:"interpretation", objective:"LO24.1", feedback:"The restaurant sale shows spending by the buyer becoming income to the seller." },
  { id:11091, sourceGame: "nationalLedger", difficulty:"medium", conceptCluster:"gdp_measurement", primarySkill:"income_expenditure_identity", secondarySkills:["gdp_counting_rules"], repairSkill:"income_expenditure_identity", commonError:"Treating spending and income as unrelated totals instead of two sides of the same transaction.", q:"If total income in an economy is $18 trillion and inventories do not create a measurement gap, total expenditure should be:", options:["$9 trillion","$18 trillion","$36 trillion","Impossible to compare"], a:1, tag:"gdp_income_expenditure", type:"calculation", objective:"LO24.1", feedback:"In GDP accounting, total income and total expenditure are two ways of measuring the same economic activity." },
  { id:11092, sourceGame: "nationalLedger", difficulty:"medium", conceptCluster:"gdp_measurement", primarySkill:"gdp_counting_rules", secondarySkills:["intermediate_vs_final_goods"], repairSkill:"gdp_counting_rules", commonError:"Counting transactions that are not current domestic production, such as used goods, financial assets, or foreign production.", q:"Which transaction is counted in U.S. GDP?", options:["A U.S. company buys shares of another company","A U.S. household buys a used refrigerator","A German tourist pays for a hotel room in Florida","A U.S. citizen buys a used car from a neighbor"], a:2, tag:"gdp_definition", type:"trap", objective:"LO24.2", feedback:"The hotel service is produced in the United States, so it counts in U.S. GDP." },
  { id:11093, sourceGame: "nationalLedger", difficulty:"medium", conceptCluster:"gdp_measurement", primarySkill:"intermediate_vs_final_goods", secondarySkills:["gdp_counting_rules"], repairSkill:"intermediate_vs_final_goods", commonError:"Double-counting intermediate goods instead of counting final value or value added.", q:"A farmer sells wheat to a miller for $100. The miller sells flour to a baker for $160. The baker sells bread to consumers for $250. How much is added to GDP?", options:["$100","$160","$250","$510"], a:2, tag:"gdp_definition", type:"calculation", objective:"LO24.2", feedback:"GDP counts the final bread sale of $250, not each intermediate transaction separately." },
  { id:11094, sourceGame: "nationalLedger", difficulty:"medium", conceptCluster:"gdp_measurement", primarySkill:"gdp_counting_rules", secondarySkills:["intermediate_vs_final_goods"], repairSkill:"gdp_counting_rules", commonError:"Counting transactions that are not current domestic production, such as used goods, financial assets, or foreign production.", q:"A laptop produced last year is sold used this year for $700. How does this affect this year's GDP?", options:["GDP rises by $700","GDP rises only if the laptop was imported","GDP does not rise from the used-good sale","GDP rises by the original price"], a:2, tag:"gdp_definition", type:"trap", objective:"LO24.2", feedback:"Used goods are not counted in current GDP because they were counted when first produced." },
  { id:11095, sourceGame: "nationalLedger", difficulty:"medium", conceptCluster:"gdp_measurement", primarySkill:"gdp_counting_rules", secondarySkills:["intermediate_vs_final_goods"], repairSkill:"gdp_counting_rules", commonError:"Counting transactions that are not current domestic production, such as used goods, financial assets, or foreign production.", q:"A homeowner pays a contractor $12,000 to renovate a kitchen. Why is this counted in GDP?", options:["It is a market service produced during the current period","It is a transfer payment","It is a used good","It is counted only if paid in cash"], a:0, tag:"gdp_definition", type:"interpretation", objective:"LO24.2", feedback:"Paid renovation work is current market production and is counted in GDP." },
  { id:11096, sourceGame: "nationalLedger", difficulty:"medium", conceptCluster:"gdp_measurement", primarySkill:"gdp_counting_rules", secondarySkills:["intermediate_vs_final_goods"], repairSkill:"gdp_counting_rules", commonError:"Counting transactions that are not current domestic production, such as used goods, financial assets, or foreign production.", q:"Which item would be excluded from GDP because it is non-market production?", options:["A paid haircut","A restaurant meal","A person mowing their own lawn","A new home purchase"], a:2, tag:"gdp_definition", type:"trap", objective:"LO24.2", feedback:"Unpaid work performed for yourself is generally not counted in GDP." },
  { id:11097, sourceGame: "nationalLedger", difficulty:"medium", conceptCluster:"gdp_components", primarySkill:"imports_exports_nx", secondarySkills:["gdp_components_identity"], repairSkill:"imports_exports_nx", commonError:"Adding imports instead of subtracting them through net exports.", q:"If consumption is $12 trillion, investment is $4 trillion, government purchases are $5 trillion, exports are $3 trillion, and imports are $4 trillion, what is GDP?", options:["$20 trillion","$21 trillion","$24 trillion","$28 trillion"], a:0, tag:"gdp_components", type:"calculation", objective:"LO24.3", feedback:"GDP = C + I + G + NX = 12 + 4 + 5 + (3 - 4) = 20." },
  { id:11098, sourceGame: "nationalLedger", difficulty:"medium", conceptCluster:"gdp_components", primarySkill:"gdp_components_identity", secondarySkills:["imports_exports_nx", "inventory_investment"], repairSkill:"gdp_components_identity", commonError:"Mixing up the GDP expenditure components or forgetting the C + I + G + NX identity.", q:"A household buys a newly built home. In GDP accounting, this is counted as:", options:["Consumption","Investment","Government purchases","Net exports"], a:1, tag:"gdp_components", type:"interpretation", objective:"LO24.3", feedback:"New residential construction is counted as investment, not consumption." },
  { id:11099, sourceGame: "nationalLedger", difficulty:"medium", conceptCluster:"gdp_components", primarySkill:"gdp_components_identity", secondarySkills:["imports_exports_nx", "inventory_investment"], repairSkill:"gdp_components_identity", commonError:"Mixing up the GDP expenditure components or forgetting the C + I + G + NX identity.", q:"A state government pays workers to repair highways. Which GDP component rises?", options:["Consumption","Investment","Government purchases","Net exports"], a:2, tag:"gdp_components", type:"interpretation", objective:"LO24.3", feedback:"Government spending on goods and services is counted as government purchases." },
  { id:11100, sourceGame: "nationalLedger", difficulty:"medium", conceptCluster:"gdp_components", primarySkill:"imports_exports_nx", secondarySkills:["gdp_components_identity"], repairSkill:"imports_exports_nx", commonError:"Adding imports instead of subtracting them through net exports.", q:"If exports are $800 billion and imports are $1.1 trillion, net exports equal:", options:["$300 billion","-$300 billion","$1.9 trillion","-$1.9 trillion"], a:1, tag:"gdp_components", type:"calculation", objective:"LO24.3", feedback:"Net exports = exports - imports = 800 - 1100 = -300 billion." },
  { id:11101, sourceGame: "nationalLedger", difficulty:"medium", conceptCluster:"gdp_components", primarySkill:"inventory_investment", secondarySkills:["gdp_components_identity"], repairSkill:"inventory_investment", commonError:"Excluding unsold current production instead of counting it as inventory investment.", q:"A U.S. firm produces $10 million in goods but sells only $7 million this year. The remaining $3 million is added to inventories. How much is counted in GDP?", options:["$7 million","$3 million","$10 million","$0"], a:2, tag:"gdp_components", type:"calculation", objective:"LO24.3", feedback:"Unsold output is counted as inventory investment, so all $10 million is counted." },
  { id:11102, sourceGame: "nationalLedger", difficulty:"medium", conceptCluster:"gdp_components", primarySkill:"gdp_components_identity", secondarySkills:["imports_exports_nx", "inventory_investment"], repairSkill:"gdp_components_identity", commonError:"Mixing up the GDP expenditure components or forgetting the C + I + G + NX identity.", q:"Which transaction increases investment in GDP accounting?", options:["A household buys groceries","A firm buys new delivery trucks","The government sends unemployment benefits","A consumer buys imported shoes"], a:1, tag:"gdp_components", type:"interpretation", objective:"LO24.3", feedback:"Business purchases of new capital goods are investment." },
  { id:11103, sourceGame: "nationalLedger", difficulty:"medium", conceptCluster:"real_nominal_gdp", primarySkill:"nominal_vs_real_gdp", secondarySkills:["gdp_deflator"], repairSkill:"nominal_vs_real_gdp", commonError:"Confusing price changes with real output changes.", q:"Suppose an economy produces only 10 bikes. In year 1, each bike sells for $100. In year 2, the economy still produces 10 bikes but each sells for $120. What happens?", options:["Nominal GDP rises, but real GDP is unchanged if year 1 is the base year","Real GDP rises, but nominal GDP is unchanged","Both nominal and real GDP must fall","GDP cannot be calculated"], a:0, tag:"real_nominal_gdp", type:"interpretation", objective:"LO24.4", feedback:"Nominal GDP rises because prices rise, while real GDP is unchanged because output did not change." },
  { id:11104, sourceGame: "nationalLedger", difficulty:"medium", conceptCluster:"real_nominal_gdp", primarySkill:"gdp_deflator", secondarySkills:["nominal_vs_real_gdp"], repairSkill:"gdp_deflator", commonError:"Forgetting that the GDP deflator compares nominal GDP to real GDP.", q:"If nominal GDP is $24 trillion and the GDP deflator is 120, real GDP is:", options:["$20 trillion","$24 trillion","$28.8 trillion","$120 trillion"], a:0, tag:"real_nominal_gdp", type:"calculation", objective:"LO24.4", feedback:"Real GDP = nominal GDP / (deflator/100) = 24 / 1.20 = 20 trillion." },
  { id:11105, sourceGame: "nationalLedger", difficulty:"medium", conceptCluster:"real_nominal_gdp", primarySkill:"nominal_vs_real_gdp", secondarySkills:["gdp_deflator"], repairSkill:"nominal_vs_real_gdp", commonError:"Confusing price changes with real output changes.", q:"Which situation would cause real GDP to rise?", options:["Prices rise while output stays the same","Output rises while base-year prices are used","The CPI rises while production is unchanged","Used goods are resold more often"], a:1, tag:"real_nominal_gdp", type:"interpretation", objective:"LO24.4", feedback:"Real GDP rises when actual production rises, not merely when prices rise." },
  { id:11106, sourceGame: "nationalLedger", difficulty:"medium", conceptCluster:"gdp_wellbeing", primarySkill:"gdp_wellbeing_limits", secondarySkills:["gdp_counting_rules"], repairSkill:"gdp_wellbeing_limits", commonError:"Assuming higher GDP automatically means higher overall well-being.", q:"Why can GDP rise while well-being does not clearly improve?", options:["GDP may ignore pollution, leisure loss, and unequal distribution","GDP counts no market activity","GDP only measures imports","GDP excludes all government services"], a:0, tag:"gdp_wellbeing", type:"interpretation", objective:"LO24.5", feedback:"GDP is useful, but it misses important quality-of-life factors." },
  { id:11107, sourceGame: "nationalLedger", difficulty:"medium", conceptCluster:"gdp_wellbeing", primarySkill:"gdp_wellbeing_limits", secondarySkills:["gdp_counting_rules"], repairSkill:"gdp_wellbeing_limits", commonError:"Assuming higher GDP automatically means higher overall well-being.", q:"Which statement is the strongest evaluation of GDP as a welfare measure?", options:["GDP is useless because it excludes happiness","GDP is useful because income matters, but incomplete because it misses non-market and quality-of-life factors","GDP perfectly measures economic well-being","GDP only measures government production"], a:1, tag:"gdp_wellbeing", type:"interpretation", objective:"LO24.5", feedback:"GDP is useful but incomplete as a measure of well-being." },
  { id:11108, sourceGame: "nationalLedger", difficulty:"medium", conceptCluster:"prices_inflation", primarySkill:"cpi_calculation", secondarySkills:["inflation_rate"], repairSkill:"cpi_calculation", commonError:"Using the wrong basket cost or forgetting to multiply by 100.", q:"A CPI basket costs $400 in the base year and $460 this year. What is the CPI this year?", options:["87","115","160","460"], a:1, tag:"cpi_inflation", type:"calculation", objective:"LO25.1", feedback:"CPI = 100 x 460/400 = 115." },
  { id:11109, sourceGame: "nationalLedger", difficulty:"medium", conceptCluster:"prices_inflation", primarySkill:"inflation_rate", secondarySkills:["cpi_calculation"], repairSkill:"inflation_rate", commonError:"Using the CPI point change instead of the percentage change.", q:"If the CPI rises from 150 to 165, what is the inflation rate?", options:["10%","15%","65%","110%"], a:0, tag:"cpi_inflation", type:"calculation", objective:"LO25.1", feedback:"Inflation = (165 - 150)/150 x 100 = 10%." },
  { id:11110, sourceGame: "nationalLedger", difficulty:"medium", conceptCluster:"prices_inflation", primarySkill:"inflation_rate", secondarySkills:["cpi_calculation"], repairSkill:"inflation_rate", commonError:"Using the CPI point change instead of the percentage change.", q:"If the CPI falls from 200 to 190, what happened?", options:["There was 5% inflation","There was 5% deflation","There was 10% inflation","The real interest rate must be zero"], a:1, tag:"cpi_inflation", type:"calculation", objective:"LO25.1", feedback:"The CPI fell by 10 from 200, so the inflation rate is -5%, meaning deflation." },
  { id:11111, sourceGame: "nationalLedger", difficulty:"medium", conceptCluster:"prices_inflation", primarySkill:"cpi_calculation", secondarySkills:["inflation_rate"], repairSkill:"cpi_calculation", commonError:"Using the wrong basket cost or forgetting to multiply by 100.", q:"A basket has 4 pizzas and 2 haircuts. In the base year, pizzas cost $10 and haircuts cost $20. This year, pizzas cost $12 and haircuts cost $25. What is this year's CPI?", options:["100","120","122.5","125"], a:2, tag:"cpi_inflation", type:"calculation", objective:"LO25.1", feedback:"Base basket cost = 4(10)+2(20)=80. Current cost = 4(12)+2(25)=98. CPI = 122.5." },
  { id:11112, sourceGame: "nationalLedger", difficulty:"medium", conceptCluster:"prices_inflation", primarySkill:"cpi_calculation", secondarySkills:["inflation_rate"], repairSkill:"cpi_calculation", commonError:"Using the wrong basket cost or forgetting to multiply by 100.", q:"If the CPI is 140, what does that mean relative to the base year?", options:["The basket costs 40% more than in the base year","The basket costs 140% less than in the base year","Inflation this year is exactly 140%","Real GDP is 140"], a:0, tag:"cpi_inflation", type:"interpretation", objective:"LO25.1", feedback:"A CPI of 140 means the basket costs 40% more than in the base year." },
  { id:11113, sourceGame: "nationalLedger", difficulty:"medium", conceptCluster:"prices_inflation", primarySkill:"substitution_bias", secondarySkills:["quality_new_goods_bias"], repairSkill:"substitution_bias", commonError:"Ignoring that consumers switch toward relatively cheaper goods.", q:"A CPI basket keeps 10 pounds of beef even after beef becomes expensive and consumers switch to chicken. Which CPI problem is this?", options:["Substitution bias","Discouraged-worker bias","GDP deflator bias","Natural-rate bias"], a:0, tag:"cpi_bias", type:"interpretation", objective:"LO25.2", feedback:"A fixed basket can miss consumer substitution toward cheaper goods." },
  { id:11114, sourceGame: "nationalLedger", difficulty:"medium", conceptCluster:"prices_inflation", primarySkill:"substitution_bias", secondarySkills:["quality_new_goods_bias"], repairSkill:"substitution_bias", commonError:"Ignoring that consumers switch toward relatively cheaper goods.", q:"Why does substitution bias usually cause the CPI to overstate inflation?", options:["Consumers can reduce the burden of price increases by buying relatively cheaper substitutes","Consumers never change behavior when prices change","The CPI ignores all prices","The CPI counts used goods twice"], a:0, tag:"cpi_bias", type:"interpretation", objective:"LO25.2", feedback:"If consumers substitute, their actual cost of living may rise less than the fixed basket suggests." },
  { id:11115, sourceGame: "nationalLedger", difficulty:"medium", conceptCluster:"prices_inflation", primarySkill:"quality_new_goods_bias", secondarySkills:["substitution_bias"], repairSkill:"quality_new_goods_bias", commonError:"Treating all price increases as inflation even when quality or product variety improves.", q:"A smartphone costs more than an old flip phone but also provides far more services. Which CPI issue does this illustrate?", options:["Unmeasured quality change","Cyclical unemployment","Net export measurement","GDP identity failure"], a:0, tag:"cpi_bias", type:"interpretation", objective:"LO25.2", feedback:"Some price increases reflect quality improvements, which the CPI may not fully measure." },
  { id:11116, sourceGame: "nationalLedger", difficulty:"medium", conceptCluster:"prices_inflation", primarySkill:"quality_new_goods_bias", secondarySkills:["substitution_bias"], repairSkill:"quality_new_goods_bias", commonError:"Treating all price increases as inflation even when quality or product variety improves.", q:"A new product gives consumers a useful option that did not previously exist. Why can that make the CPI imperfect?", options:["The CPI may miss gains from new variety and improved purchasing power","The CPI counts only unemployment","The CPI automatically falls to zero","The new product must be an intermediate good"], a:0, tag:"cpi_bias", type:"interpretation", objective:"LO25.2", feedback:"New goods can make consumers better off in ways not fully captured by the CPI." },
  { id:11117, sourceGame: "nationalLedger", difficulty:"medium", conceptCluster:"prices_inflation", primarySkill:"quality_new_goods_bias", secondarySkills:["substitution_bias"], repairSkill:"quality_new_goods_bias", commonError:"Treating all price increases as inflation even when quality or product variety improves.", q:"Which example would most likely make the CPI overstate the true rise in the cost of living?", options:["Consumers switch from expensive beef to cheaper chicken","All consumers buy exactly the fixed CPI basket forever","Quality falls but prices fall more","Imports disappear from stores"], a:0, tag:"cpi_bias", type:"trap", objective:"LO25.2", feedback:"Substitution toward cheaper goods means the fixed basket may exaggerate cost increases." },
  { id:11118, sourceGame: "nationalLedger", difficulty:"medium", conceptCluster:"prices_inflation", primarySkill:"cpi_vs_gdp_deflator", secondarySkills:["cpi_calculation"], repairSkill:"cpi_vs_gdp_deflator", commonError:"Confusing a fixed consumer basket with current domestic production prices.", q:"Which price change affects the CPI but not the GDP deflator directly?", options:["A price increase for imported coffee bought by households","A price increase for domestically produced tractors","A price increase for government services","A price increase for domestically produced bread"], a:0, tag:"cpi_vs_deflator", type:"interpretation", objective:"LO25.3", feedback:"Imported consumer goods are included in the CPI but excluded from the GDP deflator." },
  { id:11119, sourceGame: "nationalLedger", difficulty:"medium", conceptCluster:"prices_inflation", primarySkill:"cpi_vs_gdp_deflator", secondarySkills:["cpi_calculation"], repairSkill:"cpi_vs_gdp_deflator", commonError:"Confusing a fixed consumer basket with current domestic production prices.", q:"Which price index better captures prices of all currently produced domestic final goods and services?", options:["CPI","GDP deflator","Unemployment rate","Labor force participation rate"], a:1, tag:"cpi_vs_deflator", type:"definition", objective:"LO25.3", feedback:"The GDP deflator reflects the prices of domestically produced final goods and services." },
  { id:11120, sourceGame: "nationalLedger", difficulty:"medium", conceptCluster:"prices_inflation", primarySkill:"cpi_vs_gdp_deflator", secondarySkills:["cpi_calculation"], repairSkill:"cpi_vs_gdp_deflator", commonError:"Confusing a fixed consumer basket with current domestic production prices.", q:"Why can the GDP deflator change differently from the CPI?", options:["The GDP deflator uses current domestic production, while the CPI uses a fixed consumer basket","They measure exactly the same basket","The GDP deflator only counts imports","The CPI ignores consumer prices"], a:0, tag:"cpi_vs_deflator", type:"interpretation", objective:"LO25.3", feedback:"The CPI and GDP deflator use different baskets and coverage." },
  { id:11121, sourceGame: "nationalLedger", difficulty:"medium", conceptCluster:"prices_inflation", primarySkill:"cpi_vs_gdp_deflator", secondarySkills:["cpi_calculation"], repairSkill:"cpi_vs_gdp_deflator", commonError:"Confusing a fixed consumer basket with current domestic production prices.", q:"A domestically produced machine purchased by a business becomes more expensive. Which index is more likely to capture this directly?", options:["GDP deflator","CPI","Unemployment rate","Labor force participation rate"], a:0, tag:"cpi_vs_deflator", type:"interpretation", objective:"LO25.3", feedback:"Capital goods produced domestically are included in GDP and affect the GDP deflator." },
  { id:11122, sourceGame: "nationalLedger", difficulty:"medium", conceptCluster:"prices_inflation", primarySkill:"inflation_adjustment", secondarySkills:["cpi_calculation"], repairSkill:"inflation_adjustment", commonError:"Comparing nominal dollar amounts across years without adjusting for the price level.", q:"A salary was $30,000 when the CPI was 150. The CPI is now 225. What is that salary in today's dollars?", options:["$20,000","$30,000","$45,000","$67,500"], a:2, tag:"inflation_adjustment", type:"calculation", objective:"LO25.4", feedback:"Today's dollars = 30000 x 225/150 = 45000." },
  { id:11123, sourceGame: "nationalLedger", difficulty:"medium", conceptCluster:"prices_inflation", primarySkill:"inflation_adjustment", secondarySkills:["cpi_calculation"], repairSkill:"inflation_adjustment", commonError:"Comparing nominal dollar amounts across years without adjusting for the price level.", q:"A movie ticket cost $4 when the CPI was 80. The CPI is now 240. What is the ticket price in today's dollars?", options:["$8","$12","$16","$20"], a:1, tag:"inflation_adjustment", type:"calculation", objective:"LO25.4", feedback:"Today's dollars = 4 x 240/80 = 12." },
  { id:11124, sourceGame: "nationalLedger", difficulty:"medium", conceptCluster:"prices_inflation", primarySkill:"inflation_adjustment", secondarySkills:["cpi_calculation"], repairSkill:"inflation_adjustment", commonError:"Comparing nominal dollar amounts across years without adjusting for the price level.", q:"Why is it misleading to compare a $5 wage in 1970 directly to a $15 wage today?", options:["The purchasing power of money changes over time","Wages are not prices","Inflation only affects GDP, not wages","Nominal values are always real values"], a:0, tag:"inflation_adjustment", type:"interpretation", objective:"LO25.4", feedback:"Dollar amounts from different years need to be adjusted for changes in the price level." },
  { id:11125, sourceGame: "nationalLedger", difficulty:"medium", conceptCluster:"prices_inflation", primarySkill:"real_interest_rate", secondarySkills:["inflation_rate"], repairSkill:"real_interest_rate", commonError:"Forgetting to subtract inflation from the nominal interest rate.", q:"If the nominal interest rate is 7% and the inflation rate is 9%, the real interest rate is approximately:", options:["16%","7%","2%","-2%"], a:3, tag:"interest_inflation", type:"calculation", objective:"LO25.5", feedback:"Real interest rate = nominal interest rate - inflation rate = 7% - 9% = -2%." },
  { id:11126, sourceGame: "nationalLedger", difficulty:"medium", conceptCluster:"prices_inflation", primarySkill:"real_interest_rate", secondarySkills:["inflation_rate"], repairSkill:"real_interest_rate", commonError:"Forgetting to subtract inflation from the nominal interest rate.", q:"A bank pays 6% interest and inflation is 2%. What happened to purchasing power in the account?", options:["It rose by about 4%","It fell by about 4%","It rose by 8%","It was unchanged"], a:0, tag:"interest_inflation", type:"interpretation", objective:"LO25.5", feedback:"The real interest rate is about 4%, so purchasing power rises by about 4%." },
  { id:11127, sourceGame: "nationalLedger", difficulty:"medium", conceptCluster:"prices_inflation", primarySkill:"real_interest_rate", secondarySkills:["inflation_rate"], repairSkill:"real_interest_rate", commonError:"Forgetting to subtract inflation from the nominal interest rate.", q:"Which borrower benefits most from unexpectedly high inflation?", options:["A borrower with a fixed nominal interest rate","A lender with a fixed nominal interest rate","A saver earning a low fixed rate","A worker paid only in real wages"], a:0, tag:"interest_inflation", type:"interpretation", objective:"LO25.5", feedback:"Unexpected inflation reduces the real burden of fixed nominal debt." },
  { id:11128, sourceGame: "nationalLedger", difficulty:"medium", conceptCluster:"growth_productivity", primarySkill:"real_gdp_per_person", secondarySkills:["productivity_calculation"], repairSkill:"real_gdp_per_person", commonError:"Comparing total GDP instead of output per person.", q:"Country A grows at 1% per year and Country B grows at 4% per year. What is the most likely long-run result?", options:["The income gap can become much larger over time because growth compounds","Both countries must end with the same income","Country A must always become richer","Growth rates do not affect living standards"], a:0, tag:"growth_differences", type:"interpretation", objective:"LO26.1", feedback:"Small growth-rate differences compound into large long-run income differences." },
  { id:11129, sourceGame: "nationalLedger", difficulty:"medium", conceptCluster:"growth_productivity", primarySkill:"rule_of_70", secondarySkills:["real_gdp_per_person"], repairSkill:"rule_of_70", commonError:"Forgetting that doubling time is approximately 70 divided by the growth rate.", q:"Using the Rule of 70, a country growing at 5% per year doubles its income in about:", options:["7 years","14 years","35 years","70 years"], a:1, tag:"growth_differences", type:"calculation", objective:"LO26.1", feedback:"70 divided by 5 equals about 14 years." },
  { id:11130, sourceGame: "nationalLedger", difficulty:"medium", conceptCluster:"growth_productivity", primarySkill:"rule_of_70", secondarySkills:["real_gdp_per_person"], repairSkill:"rule_of_70", commonError:"Forgetting that doubling time is approximately 70 divided by the growth rate.", q:"Using the Rule of 70, a country growing at 1% per year doubles its income in about:", options:["1 year","10 years","35 years","70 years"], a:3, tag:"growth_differences", type:"calculation", objective:"LO26.1", feedback:"70 divided by 1 equals about 70 years." },
  { id:11131, sourceGame: "nationalLedger", difficulty:"medium", conceptCluster:"growth_productivity", primarySkill:"real_gdp_per_person", secondarySkills:["productivity_calculation"], repairSkill:"real_gdp_per_person", commonError:"Comparing total GDP instead of output per person.", q:"Why can a country that is poor today become much richer over several decades?", options:["Sustained productivity growth can raise real GDP per person","Poor countries cannot grow","Only inflation can increase income","Unemployment must disappear first"], a:0, tag:"growth_differences", type:"interpretation", objective:"LO26.1", feedback:"Long-run growth in productivity can dramatically raise living standards." },
  { id:11132, sourceGame: "nationalLedger", difficulty:"medium", conceptCluster:"growth_productivity", primarySkill:"real_gdp_per_person", secondarySkills:["productivity_calculation"], repairSkill:"real_gdp_per_person", commonError:"Comparing total GDP instead of output per person.", q:"Which comparison best captures differences in living standards across countries?", options:["Real GDP per person","Nominal interest rates only","The number of banks","The unemployment rate alone"], a:0, tag:"growth_differences", type:"definition", objective:"LO26.1", feedback:"Real GDP per person is commonly used to compare living standards." },
  { id:11133, sourceGame: "nationalLedger", difficulty:"medium", conceptCluster:"growth_productivity", primarySkill:"productivity_calculation", secondarySkills:["real_gdp_per_person"], repairSkill:"productivity_calculation", commonError:"Confusing total output with output per unit of labor.", q:"If a firm produces 2,400 units with 300 labor hours, productivity is:", options:["4 units per hour","8 units per hour","300 units per hour","2,400 units per hour"], a:1, tag:"productivity", type:"calculation", objective:"LO26.2", feedback:"Productivity = output/labor hours = 2400/300 = 8 units per hour." },
  { id:11134, sourceGame: "nationalLedger", difficulty:"medium", conceptCluster:"growth_productivity", primarySkill:"productivity_calculation", secondarySkills:["real_gdp_per_person"], repairSkill:"productivity_calculation", commonError:"Confusing total output with output per unit of labor.", q:"If productivity rises from 20 units per worker to 25 units per worker, what is the percentage increase?", options:["5%","20%","25%","50%"], a:2, tag:"productivity", type:"calculation", objective:"LO26.2", feedback:"The increase is 5 on a base of 20, so productivity rises by 25%." },
  { id:11135, sourceGame: "nationalLedger", difficulty:"medium", conceptCluster:"growth_productivity", primarySkill:"productivity_calculation", secondarySkills:["real_gdp_per_person"], repairSkill:"productivity_calculation", commonError:"Confusing total output with output per unit of labor.", q:"A country wants to raise living standards. Why is raising productivity more important than simply working more hours forever?", options:["Higher productivity increases output per worker and supports higher income per person","More hours always reduce GDP","Productivity only matters for inflation","Working hours are the same as net exports"], a:0, tag:"productivity", type:"interpretation", objective:"LO26.2", feedback:"Sustained living-standard gains come from producing more output per worker." },
  { id:11136, sourceGame: "nationalLedger", difficulty:"medium", conceptCluster:"growth_productivity", primarySkill:"productivity_calculation", secondarySkills:["real_gdp_per_person"], repairSkill:"productivity_calculation", commonError:"Confusing total output with output per unit of labor.", q:"If two countries have the same number of workers but one produces twice as much output, the key difference is likely:", options:["Higher productivity","Lower CPI only","Higher unemployment only","Equal physical capital"], a:0, tag:"productivity", type:"interpretation", objective:"LO26.2", feedback:"More output with the same labor means higher productivity." },
  { id:11137, sourceGame: "nationalLedger", difficulty:"medium", conceptCluster:"growth_productivity", primarySkill:"productivity_calculation", secondarySkills:["real_gdp_per_person"], repairSkill:"productivity_calculation", commonError:"Confusing total output with output per unit of labor.", q:"A new irrigation system allows farmers to grow more crops with the same labor. Which productivity factor improved most directly?", options:["Technological knowledge or physical capital","Cyclical unemployment","CPI basket composition","Transfer payments"], a:0, tag:"productivity_factors", type:"interpretation", objective:"LO26.3", feedback:"Better production methods and equipment raise productivity." },
  { id:11138, sourceGame: "nationalLedger", difficulty:"medium", conceptCluster:"growth_productivity", primarySkill:"human_capital", secondarySkills:["productivity_calculation"], repairSkill:"human_capital", commonError:"Confusing worker training and skills with physical equipment.", q:"A nation invests heavily in worker training and apprenticeship programs. Which factor of productivity is most directly increased?", options:["Natural resources","Human capital","Inflation","Net exports"], a:1, tag:"productivity_factors", type:"interpretation", objective:"LO26.3", feedback:"Training and education increase human capital." },
  { id:11139, sourceGame: "nationalLedger", difficulty:"medium", conceptCluster:"growth_productivity", primarySkill:"natural_resources", secondarySkills:["productivity_calculation"], repairSkill:"natural_resources", commonError:"Assuming natural resources alone guarantee high productivity.", q:"A country discovers large deposits of rare minerals used in manufacturing. Which productivity factor increased?", options:["Human capital","Natural resources","CPI quality adjustment","Frictional unemployment"], a:1, tag:"productivity_factors", type:"interpretation", objective:"LO26.3", feedback:"Mineral deposits are natural resources." },
  { id:11140, sourceGame: "nationalLedger", difficulty:"medium", conceptCluster:"growth_productivity", primarySkill:"physical_capital", secondarySkills:["productivity_calculation"], repairSkill:"physical_capital", commonError:"Confusing tools and equipment with worker skills.", q:"A factory adds more machines for each worker. What should happen to output per worker, other things equal?", options:["It should generally rise","It must fall to zero","It is unrelated to productivity","It only changes the CPI"], a:0, tag:"productivity_factors", type:"interpretation", objective:"LO26.3", feedback:"More physical capital per worker generally raises productivity." },
  { id:11141, sourceGame: "nationalLedger", difficulty:"medium", conceptCluster:"growth_productivity", primarySkill:"technological_knowledge", secondarySkills:["productivity_calculation"], repairSkill:"technological_knowledge", commonError:"Confusing better production methods with more labor or more machines.", q:"Which example best illustrates technological knowledge?", options:["A new production process that uses fewer inputs per unit of output","More workers searching for jobs","A higher CPI for imported goods","A larger unemployment insurance payment"], a:0, tag:"productivity_factors", type:"interpretation", objective:"LO26.3", feedback:"Technological knowledge means knowing better ways to produce." },
  { id:11142, sourceGame: "nationalLedger", difficulty:"medium", conceptCluster:"growth_productivity", primarySkill:"productivity_calculation", secondarySkills:["real_gdp_per_person"], repairSkill:"productivity_calculation", commonError:"Confusing total output with output per unit of labor.", q:"Diminishing returns imply that if a country keeps adding capital while labor stays fixed:", options:["Each additional unit of capital eventually adds smaller increases in output","Each additional unit of capital adds larger increases forever","Output must immediately fall","Capital stops being counted in GDP"], a:0, tag:"diminishing_returns", type:"interpretation", objective:"LO26.3", feedback:"Diminishing returns means extra capital becomes less productive as more of it is added." },
  { id:11143, sourceGame: "nationalLedger", difficulty:"medium", conceptCluster:"growth_productivity", primarySkill:"productivity_calculation", secondarySkills:["real_gdp_per_person"], repairSkill:"productivity_calculation", commonError:"Confusing total output with output per unit of labor.", q:"Why might poorer countries experience faster growth than richer countries, other things equal?", options:["The catch-up effect means added capital may have higher returns where capital is scarce","Poor countries cannot use capital","Rich countries always grow faster","Inflation forces poor countries to grow"], a:0, tag:"catch_up_growth", type:"interpretation", objective:"LO26.3", feedback:"The catch-up effect occurs because capital may be especially productive where it is scarce." },
  { id:11144, sourceGame: "nationalLedger", difficulty:"medium", conceptCluster:"growth_productivity", primarySkill:"growth_policy", secondarySkills:["productivity_calculation"], repairSkill:"growth_policy", commonError:"Focusing on short-run spending instead of policies that raise long-run productivity.", q:"Which policy would most likely reduce long-run growth?", options:["Weakening property rights so investors fear losing assets","Improving education","Encouraging saving","Supporting research and development"], a:0, tag:"growth_policy", type:"trap", objective:"LO26.4", feedback:"Weak property rights discourage investment and reduce growth potential." },
  { id:11145, sourceGame: "nationalLedger", difficulty:"medium", conceptCluster:"growth_productivity", primarySkill:"growth_policy", secondarySkills:["productivity_calculation"], repairSkill:"growth_policy", commonError:"Focusing on short-run spending instead of policies that raise long-run productivity.", q:"Why can free trade support productivity growth?", options:["It can allow specialization, access to larger markets, and access to better inputs or technology","It guarantees no workers will lose jobs","It makes inflation impossible","It replaces all investment"], a:0, tag:"growth_policy", type:"interpretation", objective:"LO26.4", feedback:"Trade can raise productivity by improving specialization, competition, and access to inputs or ideas." },
  { id:11146, sourceGame: "nationalLedger", difficulty:"medium", conceptCluster:"growth_productivity", primarySkill:"growth_policy", secondarySkills:["productivity_calculation"], repairSkill:"growth_policy", commonError:"Focusing on short-run spending instead of policies that raise long-run productivity.", q:"A government wants to raise productivity over time. Which policy bundle makes the most sense?", options:["Education, stable property rights, investment incentives, and research support","Higher uncertainty, weaker courts, and lower investment","Banning technology and reducing training","Discouraging saving and closing schools"], a:0, tag:"growth_policy", type:"interpretation", objective:"LO26.4", feedback:"Growth-friendly policies support human capital, capital formation, innovation, and stable institutions." },
  { id:11147, sourceGame: "nationalLedger", difficulty:"medium", conceptCluster:"growth_productivity", primarySkill:"growth_policy", secondarySkills:["productivity_calculation"], repairSkill:"growth_policy", commonError:"Focusing on short-run spending instead of policies that raise long-run productivity.", q:"Why can encouraging saving increase future productivity?", options:["Saving can finance investment in capital goods","Saving directly lowers the unemployment rate to zero","Saving makes the CPI fixed basket disappear","Saving prevents all recessions"], a:0, tag:"growth_policy", type:"interpretation", objective:"LO26.4", feedback:"Saving helps provide funds for investment, which can increase capital and productivity." },
  { id:11148, sourceGame: "nationalLedger", difficulty:"medium", conceptCluster:"labor_market", primarySkill:"labor_force_calculation", secondarySkills:["unemployment_rate", "labor_force_participation"], repairSkill:"labor_force_calculation", commonError:"Forgetting that the labor force includes employed plus unemployed workers.", q:"An economy has 140 million employed people, 10 million unemployed people, and 50 million people not in the labor force. What is the labor force?", options:["140 million","150 million","190 million","200 million"], a:1, tag:"labor_force_stats", type:"calculation", objective:"LO29.1", feedback:"Labor force = employed + unemployed = 140 + 10 = 150 million." },
