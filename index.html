  { id: 18011, q: "The Labor Warden sets a trap: the unemployment rate falls because many jobless workers quit searching. What should a student conclude?", options: ["The labor market may not have improved even though the official unemployment rate fell", "The labor market definitely improved because a lower unemployment rate is always good", "The economy must have higher productivity", "The CPI must have fallen"], a: 0, tag: "unemployment_limits", type: "trap", objective: "LO29.2", difficulty: "mediumBoss", conceptCluster: "labor_force_measurement_limits", primarySkill: "unemployment_rate_limit_interpretation", secondarySkills: ["discouraged_workers", "labor_force_participation"], repairSkill: "unemployment_rate_limits", commonError: "treats_lower_unemployment_rate_as_always_good_news", sourceGame: "equilibriumCrisis", feedback: "A falling unemployment rate can be misleading if people stop looking for work and leave the labor force." },

  // =====================================================
  // SET 5 — PRICE FLOORS + UNEMPLOYMENT + INCENTIVES
  // =====================================================
  { id: 18012, q: "The Labor Warden raises the minimum wage above the equilibrium wage for low-skill labor. What is the expected market result?", options: ["A surplus of labor, meaning more workers want jobs than firms want to hire", "A shortage of labor, meaning firms cannot find enough workers", "No change because price floors never bind", "An automatic increase in productivity"], a: 0, tag: "price_floors", type: "interpretation", objective: "LO6.2", difficulty: "mediumBoss", conceptCluster: "labor_markets_price_controls_unemployment", primarySkill: "binding_price_floor_labor_surplus", secondarySkills: ["minimum_wage_unemployment", "law_of_demand"], repairSkill: "price_floor_surplus", commonError: "thinks_higher_wage_always_increases_employment", sourceGame: "equilibriumCrisis", feedback: "A binding minimum wage is a price floor. It raises the wage above equilibrium and can create a surplus of labor." },
  { id: 18013, q: "At $10 per hour, firms hire 1,000 workers and 1,000 workers want jobs. At a $15 minimum wage, firms want 800 workers and 1,200 workers want jobs. What is the labor surplus?", options: ["400 workers", "200 workers", "800 workers", "1,200 workers"], a: 0, tag: "price_floors", type: "calculation", objective: "LO6.2", difficulty: "mediumBoss", conceptCluster: "labor_markets_price_controls", primarySkill: "labor_surplus_calculation", secondarySkills: ["quantity_supplied_quantity_demanded"], repairSkill: "price_floor_surplus", commonError: "subtracts_new_employment_from_original_employment_only", sourceGame: "equilibriumCrisis", feedback: "The surplus is workers wanting jobs minus workers firms want to hire: 1,200 - 800 = 400." },
  { id: 18014, q: "The Labor Warden asks why a minimum wage can help some workers but hurt others. Which answer is best?", options: ["Workers who keep jobs earn more, but some workers may be priced out of employment", "All workers are guaranteed jobs at the higher wage", "Firms hire more workers because labor is now more expensive", "The CPI stops measuring prices"], a: 0, tag: "minimum_wage", type: "trap", objective: "LO29.4", difficulty: "mediumBoss", conceptCluster: "labor_policy_tradeoffs", primarySkill: "minimum_wage_tradeoff_analysis", secondarySkills: ["price_floor_surplus", "incentives"], repairSkill: "minimum_wage_unemployment", commonError: "sees_policy_benefits_without_tradeoffs", sourceGame: "equilibriumCrisis", feedback: "A higher minimum wage can raise earnings for workers who remain employed, but reduce hiring for others." },

  // =====================================================
  // SET 6 — TAX WEDGES + MARKET SIZE + INCIDENCE
  // =====================================================
  { id: 18015, q: "The Tax Warden places a tax on sellers. Buyers pay a higher price, sellers receive a lower price, and fewer units are sold. What concept ties these effects together?", options: ["A tax wedge that shrinks the market", "A price floor that creates a labor surplus", "Substitution bias in the CPI", "Discouraged-worker measurement"], a: 0, tag: "taxes", type: "interpretation", objective: "LO6.3", difficulty: "mediumBoss", conceptCluster: "taxes_market_equilibrium_incentives", primarySkill: "tax_wedge_market_size", secondarySkills: ["buyers_sellers_share_tax", "equilibrium_quantity"], repairSkill: "tax_wedge", commonError: "thinks_tax_only_affects_the_side_legally_paying_it", sourceGame: "equilibriumCrisis", feedback: "A tax drives a wedge between what buyers pay and sellers receive, reducing the quantity sold." },
  { id: 18016, q: "A tax is legally placed on buyers instead of sellers. What should students remember from tax incidence?", options: ["The legal assignment does not determine the final burden by itself", "Buyers always bear 100% of the burden", "Sellers always bear 100% of the burden", "The tax disappears from the market"], a: 0, tag: "tax_incidence", type: "definition", objective: "LO6.4", difficulty: "mediumBoss", conceptCluster: "tax_incidence_policy_analysis", primarySkill: "legal_vs_economic_tax_incidence", secondarySkills: ["buyer_seller_tax_equivalence"], repairSkill: "tax_incidence_equivalence", commonError: "confuses_statutory_incidence_with_economic_incidence", sourceGame: "equilibriumCrisis", feedback: "Tax incidence depends on market responses, not simply on whether the law says buyers or sellers pay the tax." },
  { id: 18017, q: "The Tax Warden asks which side bears more of a tax burden when demand is less elastic than supply.", options: ["Buyers bear more because they respond less to the price change", "Sellers bear more because buyers can easily leave", "The government bears the burden", "No one bears the burden because taxes do not affect prices"], a: 0, tag: "tax_incidence", type: "trap", objective: "LO6.5", difficulty: "mediumBoss", conceptCluster: "tax_incidence_elasticity", primarySkill: "elasticity_tax_burden", secondarySkills: ["demand_elasticity", "supply_elasticity"], repairSkill: "tax_incidence_elasticity", commonError: "assigns_burden_to_more_elastic_side", sourceGame: "equilibriumCrisis", feedback: "The less elastic side of the market bears more of the tax burden because it has fewer good alternatives." },

  // =====================================================
  // SET 7 — INFLATION + MARKET SIGNALS + PRICE CONTROLS
  // =====================================================
  { id: 18018, q: "The Measure Warden observes that gasoline prices rise after a supply disruption. A city responds with a binding price ceiling. What is the most likely result?", options: ["A shortage because the legal price is held below the market-clearing price", "A surplus because suppliers produce more at the lower price", "No effect because ceilings above equilibrium are always binding", "Higher productivity because gasoline is cheaper"], a: 0, tag: "price_ceilings", type: "interpretation", objective: "LO6.1", difficulty: "mediumBoss", conceptCluster: "inflation_market_signals_price_controls", primarySkill: "binding_price_ceiling_shortage", secondarySkills: ["supply_shift", "market_equilibrium"], repairSkill: "price_ceiling_shortage", commonError: "thinks_lower_legal_price_eliminates_scarcity", sourceGame: "equilibriumCrisis", feedback: "A binding price ceiling below equilibrium creates a shortage because quantity demanded exceeds quantity supplied." },
  { id: 18019, q: "A storm reduces supply while demand stays the same. Before any price control, what happens in the market?", options: ["Equilibrium price rises and equilibrium quantity falls", "Equilibrium price falls and equilibrium quantity rises", "Both price and quantity rise", "Both price and quantity fall"], a: 0, tag: "supply_demand", type: "interpretation", objective: "LO4.4", difficulty: "mediumBoss", conceptCluster: "supply_shocks_market_adjustment", primarySkill: "supply_decrease_equilibrium_effects", secondarySkills: ["market_equilibrium", "price_signals"], repairSkill: "supply_shift_equilibrium", commonError: "confuses_supply_decrease_with_quantity_supplied_decrease", sourceGame: "equilibriumCrisis", feedback: "A decrease in supply shifts supply left, raising equilibrium price and lowering equilibrium quantity." },
  { id: 18020, q: "The Measure Warden says: 'Holding the money price below equilibrium does not erase scarcity; it changes how scarcity is rationed.' What does this mean?", options: ["Shortages can lead to waiting, black markets, favoritism, or quality decline", "Scarcity disappears when prices are legally capped", "All consumers get more of the good", "The CPI cannot measure any price change"], a: 0, tag: "price_ceilings", type: "trap", objective: "LO6.1", difficulty: "mediumBoss", conceptCluster: "price_controls_incentives_unintended_consequences", primarySkill: "nonprice_rationing_interpretation", secondarySkills: ["shortages", "incentives"], repairSkill: "price_ceiling_shortage", commonError: "assumes_price_controls_remove_tradeoffs", sourceGame: "equilibriumCrisis", feedback: "A ceiling can hold down the legal money price, but scarcity still appears through shortages and nonprice rationing." },

  // =====================================================
  // SET 8 — GROWTH POLICY + TRADEOFFS + UNEMPLOYMENT
  // =====================================================
  { id: 18021, q: "The Growth Sentinel says a country spends more on education and infrastructure today to raise future productivity. What core economic idea is present?", options: ["A tradeoff between current resources and future productive capacity", "A guarantee that inflation becomes zero", "A binding price ceiling in labor markets", "A discouraged-worker effect"], a: 0, tag: "growth_policy", type: "interpretation", objective: "LO26.4", difficulty: "mediumBoss", conceptCluster: "growth_policy_tradeoffs", primarySkill: "growth_policy_tradeoff", secondarySkills: ["opportunity_cost", "productivity_growth"], repairSkill: "growth_policy_productivity", commonError: "ignores_current_opportunity_cost_of_investment", sourceGame: "equilibriumCrisis", feedback: "Policies that build future productivity often require giving up resources that could have been used elsewhere today." },
  { id: 18022, q: "A country has more machines per worker, but each additional machine adds less extra output than the one before. What concept is being tested?", options: ["Diminishing returns to capital", "Substitution bias", "Frictional unemployment", "A binding price ceiling"], a: 0, tag: "growth", type: "definition", objective: "LO26.4", difficulty: "mediumBoss", conceptCluster: "growth_capital_diminishing_returns", primarySkill: "diminishing_returns_to_capital", secondarySkills: ["capital_deepening", "productivity_growth"], repairSkill: "diminishing_returns", commonError: "thinks_more_capital_always_creates_constant_growth", sourceGame: "equilibriumCrisis", feedback: "Diminishing returns means each additional unit of capital adds less extra output once capital is already abundant." },
  { id: 18023, q: "The Growth Sentinel gives the final medium trap: a policy boosts productivity over time but temporarily displaces workers in old industries. Which answer best synthesizes the issue?", options: ["Long-run growth can rise while some workers face short-run structural unemployment", "Productivity growth means no one ever loses a job", "Structural unemployment only happens when CPI rises", "Worker displacement proves the economy cannot grow"], a: 0, tag: "structural_unemployment", type: "trap", objective: "LO29.3", difficulty: "mediumBoss", conceptCluster: "growth_structural_change_labor_markets", primarySkill: "growth_structural_unemployment_link", secondarySkills: ["productivity_growth", "labor_market_adjustment"], repairSkill: "structural_unemployment_definition", commonError: "assumes_growth_and_worker_displacement_cannot_coexist", sourceGame: "equilibriumCrisis", feedback: "Productivity growth can raise long-run living standards while creating short-run adjustment costs for workers whose skills no longer match available jobs." }
],
   
finalBoss: [
  // =====================================================
  // SET 1 — REAL WAGES + INFLATION + LABOR INCENTIVES
  // =====================================================
  { id: 19000, q: "The Market Marshal shows wages rising from $20 to $21 while the price index rises from 100 to 110. What happened to the worker's real wage?", options: ["It fell because nominal wages rose 5% while prices rose 10%", "It rose because the worker earns one more dollar per hour", "It stayed constant because both wages and prices increased", "It cannot be analyzed without GDP components"], a: 0, tag: "real_wages", type: "multi_step", objective: "LO25.4", difficulty: "finalBoss", conceptCluster: "inflation_real_wages_labor_markets", primarySkill: "real_wage_inflation_adjustment", secondarySkills: ["percentage_change", "purchasing_power", "labor_incentives"], repairSkill: "real_vs_nominal_values", commonError: "treats_nominal_wage_growth_as_real_wage_growth", sourceGame: "equilibriumCrisis", feedback: "The wage rose 5%, but prices rose 10%, so the worker's purchasing power fell." },
  { id: 19001, q: "A city indexes wages to CPI, but the CPI overstates inflation because consumers substitute away from expensive goods. What is the likely result?", options: ["Real compensation may rise more than intended", "Real compensation must fall", "Nominal wages cannot change", "Workers leave the labor force automatically"], a: 0, tag: "indexation", type: "trap", objective: "LO25.2", difficulty: "finalBoss", conceptCluster: "cpi_bias_indexation_labor_contracts", primarySkill: "indexation_bias_analysis", secondarySkills: ["cpi_substitution_bias", "real_wage_interpretation"], repairSkill: "cpi_bias_types", commonError: "assumes_indexing_to_cpi_perfectly_preserves_real_wages", sourceGame: "equilibriumCrisis", feedback: "If CPI overstates inflation, indexing wages to CPI can raise real compensation more than intended." },
  { id: 19002, q: "Workers receive a 4% COLA, inflation is reported at 4%, but actual cost-of-living inflation is closer to 2.5% because quality improved and substitution occurred. What happened to real wages?", options: ["They likely increased because the COLA exceeded the true rise in living costs", "They definitely fell because reported inflation was positive", "They stayed exactly constant because CPI inflation and COLA match", "They became a transfer payment"], a: 0, tag: "cpi_bias", type: "synthesis", objective: "LO25.2", difficulty: "finalBoss", conceptCluster: "inflation_measurement_real_income", primarySkill: "reported_vs_true_inflation_analysis", secondarySkills: ["cost_of_living_bias", "real_income"], repairSkill: "cpi_bias_interpretation", commonError: "uses_reported_cpi_without_considering_measurement_bias", sourceGame: "equilibriumCrisis", feedback: "If true living costs rose less than the CPI-based COLA, workers gained purchasing power." },

  // =====================================================
  // SET 2 — REAL INTEREST + BORROWERS/LENDERS + EXPECTATIONS
  // =====================================================
  { id: 19003, q: "A borrower signs a loan at 7% nominal interest expecting 3% inflation. Actual inflation turns out to be 8%. Who benefits compared with expectations?", options: ["The borrower, because the real repayment burden is lower than expected", "The lender, because inflation makes repayment more valuable", "Neither side, because nominal interest determines all real outcomes", "The government, because unemployment must fall"], a: 0, tag: "real_interest", type: "synthesis", objective: "LO25.5", difficulty: "finalBoss", conceptCluster: "inflation_expectations_credit_markets", primarySkill: "unexpected_inflation_borrower_lender_effects", secondarySkills: ["real_interest_rate", "purchasing_power"], repairSkill: "real_interest_rate_interpretation", commonError: "thinks_lenders_gain_from_unexpected_inflation", sourceGame: "equilibriumCrisis", feedback: "Unexpectedly high inflation reduces the real value of fixed nominal repayments, helping borrowers and hurting lenders." },
  { id: 19004, q: "A saver earns 6% nominal interest. Inflation is 9%. At the same time, the saver receives a 4% nominal wage increase. Which statement best connects the two effects?", options: ["Both the real return on savings and the real wage fell", "Both the real return and real wage rose", "The real return rose but the real wage fell", "The real wage rose because any raise beats inflation"], a: 0, tag: "real_nominal", type: "multi_step", objective: "LO25.5", difficulty: "finalBoss", conceptCluster: "inflation_real_returns_real_wages", primarySkill: "combined_real_value_analysis", secondarySkills: ["real_interest_rate", "real_wage_interpretation"], repairSkill: "real_vs_nominal_values", commonError: "analyzes_each_nominal_value_without_adjusting_for_inflation", sourceGame: "equilibriumCrisis", feedback: "The real interest rate is about -3%, and the wage increase is below inflation, so both real values fell." },
  { id: 19005, q: "The Market Marshal says: 'Nominal interest is high, but the real reward for saving is low.' Which situation fits that statement?", options: ["Nominal interest is 10% and inflation is 9%", "Nominal interest is 4% and inflation is 0%", "Nominal interest is 3% and inflation is -2%", "Nominal interest is 8% and inflation is 1%"], a: 0, tag: "real_interest", type: "trap", objective: "LO25.5", difficulty: "finalBoss", conceptCluster: "inflation_interest_rate_interpretation", primarySkill: "real_interest_comparison", secondarySkills: ["nominal_minus_inflation"], repairSkill: "real_interest_rate_formula", commonError: "chooses_highest_nominal_rate_instead_of_highest_real_rate", sourceGame: "equilibriumCrisis", feedback: "A 10% nominal rate with 9% inflation gives only about a 1% real return." },

  // =====================================================
  // SET 3 — CPI VS GDP DEFLATOR + IMPORT/SUPPLY SHOCKS
  // =====================================================
  { id: 19006, q: "Imported oil prices rise sharply, but prices of domestically produced goods are mostly unchanged. Which measure is more directly affected?", options: ["CPI, because imported consumer goods can be in the consumer basket", "GDP deflator, because it includes all imported goods", "Both measures rise equally by definition", "Neither measure can change unless unemployment changes"], a: 0, tag: "cpi_vs_deflator", type: "interpretation", objective: "LO25.3", difficulty: "finalBoss", conceptCluster: "price_indexes_imports_measurement", primarySkill: "cpi_vs_gdp_deflator_import_effect", secondarySkills: ["domestic_production", "consumer_basket"], repairSkill: "cpi_vs_deflator", commonError: "thinks_gdp_deflator_includes_import_prices_directly", sourceGame: "equilibriumCrisis", feedback: "CPI can include imported goods bought by consumers, while the GDP deflator tracks prices of domestically produced output." },
  { id: 19007, q: "A domestic technology boom lowers the price of U.S.-made computers and raises output. Which statement best separates CPI from the GDP deflator?", options: ["The GDP deflator reflects domestic production prices; CPI reflects consumer basket prices", "CPI measures only exports while the deflator measures only imports", "The GDP deflator is fixed-basket while CPI automatically changes with GDP", "Both ignore technology-related price changes"], a: 0, tag: "cpi_vs_deflator", type: "trap", objective: "LO25.3", difficulty: "finalBoss", conceptCluster: "price_indexes_technology_output", primarySkill: "price_index_scope_comparison", secondarySkills: ["domestic_output", "consumer_prices"], repairSkill: "cpi_vs_deflator", commonError: "reverses_fixed_basket_and_output_based_indexes", sourceGame: "equilibriumCrisis", feedback: "The GDP deflator follows prices of domestically produced output, while CPI follows the cost of the consumer basket." },
  { id: 19008, q: "The Market Marshal shows CPI rising faster than the GDP deflator after imported food and fuel become more expensive. What is the best interpretation?", options: ["Consumer prices rose partly because imported items became more expensive", "Domestic production prices must have risen faster than consumer prices", "Real GDP must have increased faster than nominal GDP", "Unemployment must be structural"], a: 0, tag: "cpi_vs_deflator", type: "synthesis", objective: "LO25.3", difficulty: "finalBoss", conceptCluster: "inflation_imports_measurement", primarySkill: "diverging_price_indexes_interpretation", secondarySkills: ["import_prices", "consumer_basket"], repairSkill: "cpi_vs_deflator", commonError: "assumes_all_price_indexes_move_for_the_same_reason", sourceGame: "equilibriumCrisis", feedback: "CPI can rise faster when imported consumer items rise in price, because imports affect CPI more directly than the GDP deflator." },

  // =====================================================
  // SET 4 — PRODUCTIVITY + REAL INCOME + LONG-RUN GROWTH
  // =====================================================
  { id: 19009, q: "Country A doubles nominal wages while prices also double. Country B raises output per worker by 25% with stable prices. Which country has the clearer improvement in living standards?", options: ["Country B, because productivity and real output per worker increased", "Country A, because nominal wages doubled", "Both improved equally because wages and output are both economic variables", "Neither can improve living standards without a price ceiling"], a: 0, tag: "productivity", type: "synthesis", objective: "LO26.2", difficulty: "finalBoss", conceptCluster: "productivity_real_income_living_standards", primarySkill: "real_living_standard_comparison", secondarySkills: ["real_vs_nominal_values", "output_per_worker"], repairSkill: "productivity_living_standard_link", commonError: "confuses_nominal_income_growth_with_real_living_standard_growth", sourceGame: "equilibriumCrisis", feedback: "Higher nominal wages do not help if prices rise equally. Higher productivity supports higher real living standards." },
  { id: 19010, q: "A country increases capital per worker for several decades. Growth is strong at first, then slows even though investment continues. What explains the slowdown?", options: ["Diminishing returns to capital", "Substitution bias in CPI", "A discouraged-worker effect", "A binding price ceiling"], a: 0, tag: "diminishing_returns", type: "interpretation", objective: "LO26.4", difficulty: "finalBoss", conceptCluster: "capital_accumulation_growth_slowdown", primarySkill: "diminishing_returns_growth_analysis", secondarySkills: ["capital_per_worker", "productivity_growth"], repairSkill: "diminishing_returns", commonError: "expects_constant_growth_from_repeated_capital_investment", sourceGame: "equilibriumCrisis", feedback: "As capital becomes more abundant, each additional unit tends to add less extra output." },
  { id: 19011, q: "A poorer country adopts existing technology and attracts foreign investment. Its growth rate rises above that of richer countries for a time. What concept fits best?", options: ["Catch-up growth because returns to capital can be higher when capital is scarce", "Cost-of-living bias because the CPI is fixed", "Cyclical unemployment because the economy is in recession", "Tax equivalence because buyers and sellers share taxes"], a: 0, tag: "catch_up_growth", type: "trap", objective: "LO26.4", difficulty: "finalBoss", conceptCluster: "catch_up_growth_capital_productivity", primarySkill: "catch_up_effect_interpretation", secondarySkills: ["capital_scarcity", "foreign_investment"], repairSkill: "catch_up_growth", commonError: "thinks_poor_countries_cannot_grow_faster_than_rich_countries", sourceGame: "equilibriumCrisis", feedback: "Poorer countries can grow quickly when they add capital and technology because the return to new investment can be high." },

  // =====================================================
  // SET 5 — STRUCTURAL CHANGE + UNEMPLOYMENT + PRODUCTIVITY
  // =====================================================
  { id: 19012, q: "Automation raises output per worker but displaces workers whose skills fit the old production process. What is the best synthesis?", options: ["Productivity may rise while structural unemployment increases for some workers", "Productivity must fall because some workers lose jobs", "Unemployment disappears because machines create output", "The CPI must overstate inflation"], a: 0, tag: "structural_unemployment", type: "synthesis", objective: "LO29.3", difficulty: "finalBoss", conceptCluster: "technology_productivity_structural_unemployment", primarySkill: "technology_labor_adjustment_analysis", secondarySkills: ["productivity_growth", "skill_mismatch"], repairSkill: "structural_unemployment_definition", commonError: "assumes_productivity_growth_cannot_coexist_with_job_displacement", sourceGame: "equilibriumCrisis", feedback: "Technology can raise productivity while creating structural unemployment for workers whose skills no longer match available jobs." },
  { id: 19013, q: "A recession reduces demand for restaurant meals, so restaurants lay off workers. Later, demand returns and many are rehired. What type of unemployment best describes the initial layoffs?", options: ["Cyclical unemployment", "Structural unemployment", "Frictional unemployment", "Discouraged employment"], a: 0, tag: "cyclical_unemployment", type: "interpretation", objective: "LO29.3", difficulty: "finalBoss", conceptCluster: "business_cycles_labor_markets", primarySkill: "cyclical_unemployment_identification", secondarySkills: ["aggregate_demand", "short_run_fluctuations"], repairSkill: "unemployment_types", commonError: "calls_all_job_loss_structural_unemployment", sourceGame: "equilibriumCrisis", feedback: "Layoffs caused by a recession or weak demand are cyclical unemployment." },
  { id: 19014, q: "A worker quits to search for a better job in a growing industry, while another worker loses a job because their old industry has permanently declined. Which pairing is correct?", options: ["First is frictional; second is structural", "First is structural; second is frictional", "Both are cyclical", "Both are not in the labor force"], a: 0, tag: "unemployment_types", type: "trap", objective: "LO29.3", difficulty: "finalBoss", conceptCluster: "labor_market_adjustment_unemployment_types", primarySkill: "unemployment_type_comparison", secondarySkills: ["frictional_unemployment", "structural_unemployment"], repairSkill: "unemployment_types", commonError: "confuses_job_search_with_skill_or_industry_mismatch", sourceGame: "equilibriumCrisis", feedback: "Job search unemployment is frictional. Mismatch caused by lasting industry change is structural." },

  // =====================================================
  // SET 6 — PRICE CONTROLS + LABOR MARKETS + POLICY TRADEOFFS
  // =====================================================
  { id: 19015, q: "A binding minimum wage raises pay for workers who keep jobs but reduces hiring for low-skill labor. What is the strongest policy interpretation?", options: ["The policy creates a tradeoff between higher wages for some and job loss for others", "The policy eliminates scarcity in labor markets", "The policy guarantees higher employment and higher wages for all workers", "The policy only changes CPI and has no employment effects"], a: 0, tag: "minimum_wage", type: "synthesis", objective: "LO6.2", difficulty: "finalBoss", conceptCluster: "price_floors_labor_policy_tradeoffs", primarySkill: "minimum_wage_policy_tradeoff", secondarySkills: ["labor_surplus", "incentives", "unemployment"], repairSkill: "price_floor_surplus", commonError: "analyzes_policy_benefits_without_costs", sourceGame: "equilibriumCrisis", feedback: "A binding wage floor can help workers who remain employed while making it harder for others to find jobs." },
  { id: 19016, q: "A city imposes rent control below equilibrium. Rent is lower for some tenants, but apartments become scarce and quality declines. Which chain is best?", options: ["Binding ceiling → shortage → nonprice rationing and lower maintenance incentives", "Binding floor → surplus → higher apartment quality", "Tax wedge → higher seller revenue → no shortage", "CPI bias → labor force exit → real wage growth"], a: 0, tag: "price_ceilings", type: "multi_step", objective: "LO6.1", difficulty: "finalBoss", conceptCluster: "price_controls_shortages_incentives", primarySkill: "price_ceiling_consequence_chain", secondarySkills: ["shortage", "nonprice_rationing", "incentives"], repairSkill: "price_ceiling_shortage", commonError: "stops_at_lower_legal_price_without_following_shortage_effects", sourceGame: "equilibriumCrisis", feedback: "A binding ceiling creates shortages and changes incentives, often producing waiting, rationing, black markets, or quality decline." },
  { id: 19017, q: "A price ceiling is imposed during an inflation spike. Official prices stop rising, but buyers wait longer and pay side fees. What is the best interpretation?", options: ["The legal money price is capped, but the full cost to buyers may still rise", "Inflation is fully eliminated because the listed price cannot rise", "The good becomes less scarce", "The CPI must perfectly capture waiting time"], a: 0, tag: "price_controls_inflation", type: "trap", objective: "LO6.1", difficulty: "finalBoss", conceptCluster: "inflation_price_controls_hidden_costs", primarySkill: "full_price_nonmoney_cost_analysis", secondarySkills: ["shortages", "opportunity_cost", "cpi_limits"], repairSkill: "nonprice_rationing", commonError: "equates_legal_price_with_total_economic_cost", sourceGame: "equilibriumCrisis", feedback: "A price ceiling can hide costs in waiting time, side payments, lower quality, or black markets." },

  // =====================================================
  // SET 7 — TAX INCIDENCE + ELASTICITY + MARKET SHRINKAGE
  // =====================================================
  { id: 19018, q: "A tax is placed on a good with very inelastic demand and elastic supply. Which outcome is most likely?", options: ["Buyers bear most of the burden and quantity falls relatively little", "Sellers bear most of the burden and quantity rises", "Buyers and sellers split the burden exactly equally by law", "The tax has no effect because supply is elastic"], a: 0, tag: "tax_incidence", type: "synthesis", objective: "LO6.5", difficulty: "finalBoss", conceptCluster: "tax_incidence_elasticity_market_size", primarySkill: "tax_burden_elasticity_analysis", secondarySkills: ["inelastic_demand", "tax_wedge", "quantity_response"], repairSkill: "tax_incidence_elasticity", commonError: "places_burden_on_more_elastic_side", sourceGame: "equilibriumCrisis", feedback: "The less elastic side bears more of the tax burden. With inelastic demand, buyers bear more and quantity changes less." },
  { id: 19019, q: "A tax on sellers shifts supply upward, raises the price buyers pay, lowers the price sellers receive, and reduces quantity. What is the best overall description?", options: ["The tax creates a wedge and shrinks the market", "The tax creates a price floor and expands the market", "The tax only affects sellers because they mail the check", "The tax eliminates deadweight loss"], a: 0, tag: "taxes", type: "multi_step", objective: "LO6.3", difficulty: "finalBoss", conceptCluster: "tax_wedge_market_adjustment", primarySkill: "tax_wedge_equilibrium_chain", secondarySkills: ["supply_shift", "buyer_price", "seller_price"], repairSkill: "tax_wedge", commonError: "focuses_on_legal_payment_instead_of_market_adjustment", sourceGame: "equilibriumCrisis", feedback: "A tax wedge separates buyer and seller prices and reduces the equilibrium quantity traded." },
  { id: 19020, q: "The Market Marshal asks why a tax on buyers and an equal tax on sellers lead to similar market outcomes. What is the best answer?", options: ["Both create the same wedge between what buyers pay and sellers receive", "Only seller taxes reduce quantity", "Only buyer taxes change demand", "The legal taxpayer always bears the full burden"], a: 0, tag: "tax_equivalence", type: "trap", objective: "LO6.4", difficulty: "finalBoss", conceptCluster: "tax_equivalence_market_incidence", primarySkill: "buyer_seller_tax_equivalence", secondarySkills: ["tax_wedge", "economic_incidence"], repairSkill: "tax_incidence_equivalence", commonError: "confuses_statutory_tax_assignment_with_equilibrium_outcome", sourceGame: "equilibriumCrisis", feedback: "Whether the tax is legally placed on buyers or sellers, the market adjusts around the wedge between buyer and seller prices." },

  // =====================================================
  // SET 8 — LABOR FORCE MEASUREMENT + MACRO INTERPRETATION
  // =====================================================
  { id: 19021, q: "Employment rises by 100,000, unemployment rises by 50,000, and labor-force participation rises. What likely happened?", options: ["More people entered the labor force, and not all found jobs immediately", "The labor force must have shrunk", "The unemployment rate must be zero", "Everyone who entered the labor force became employed"], a: 0, tag: "labor_force", type: "synthesis", objective: "LO29.1", difficulty: "finalBoss", conceptCluster: "labor_force_statistics_interpretation", primarySkill: "labor_force_flow_analysis", secondarySkills: ["employment", "unemployment", "participation_rate"], repairSkill: "labor_force_calculation", commonError: "sees_rising_unemployment_as_always_job_destruction", sourceGame: "equilibriumCrisis", feedback: "Unemployment can rise when more people enter the labor force and some are still searching." },
  { id: 19022, q: "The unemployment rate falls, but employment does not rise and labor-force participation falls. What is the most careful conclusion?", options: ["The labor market may look better only because people stopped searching", "The labor market definitely improved", "Productivity must have risen", "Inflation must have fallen"], a: 0, tag: "unemployment_limits", type: "trap", objective: "LO29.2", difficulty: "finalBoss", conceptCluster: "labor_force_participation_unemployment_limits", primarySkill: "unemployment_rate_quality_check", secondarySkills: ["discouraged_workers", "labor_force_participation"], repairSkill: "unemployment_rate_limits", commonError: "treats_lower_unemployment_rate_as_unambiguous_improvement", sourceGame: "equilibriumCrisis", feedback: "A lower unemployment rate is not always good news if people left the labor force instead of finding jobs." },
  { id: 19023, q: "Adult population is 250 million, employed workers are 155 million, and unemployed workers are 10 million. What are the unemployment rate and labor-force participation rate?", options: ["Unemployment rate ≈ 6.1%; labor-force participation rate = 66%", "Unemployment rate = 4%; labor-force participation rate = 62%", "Unemployment rate ≈ 6.5%; labor-force participation rate = 60%", "Unemployment rate = 10%; labor-force participation rate = 66%"], a: 0, tag: "labor_force_calculation", type: "calculation", objective: "LO29.1", difficulty: "finalBoss", conceptCluster: "labor_force_statistics_calculation", primarySkill: "unemployment_and_lfpr_calculation", secondarySkills: ["labor_force_definition", "percentage_calculation"], repairSkill: "labor_force_calculation", commonError: "divides_unemployed_by_adult_population_for_unemployment_rate", sourceGame: "equilibriumCrisis", feedback: "Labor force = 155 + 10 = 165 million. Unemployment rate = 10/165 ≈ 6.1%. LFPR = 165/250 = 66%." }

easy: [
  { id: 10000, sourceGame: "marketGate", q: "What is scarcity?", options: ["Limited resources and unlimited wants", "Too many goods in a market", "A legal limit on price", "A market with no buyers"], a: 0, tag: "scarcity", type: "definition", objective: "LO1.1", difficulty: "easy", conceptCluster: "core_principles", primarySkill: "scarcity_definition", secondarySkills: ["tradeoff_identification"], repairSkill: "scarcity_definition", commonError: "confuses_scarcity_with_shortage", feedback: "Scarcity means resources are limited while human wants are unlimited." },
  { id: 10001, sourceGame: "marketGate", q: "A student can either study for an exam or work a shift, but not both. What does this illustrate?", options: ["A tradeoff", "A tax wedge", "A price ceiling", "A surplus"], a: 0, tag: "tradeoffs", type: "interpretation", objective: "LO1.1", difficulty: "easy", conceptCluster: "core_principles", primarySkill: "tradeoff_identification", secondarySkills: ["scarcity_definition"], repairSkill: "tradeoff_identification", commonError: "confuses_tradeoff_with_money_cost", feedback: "A tradeoff exists because choosing one option means giving up another." },
  { id: 10002, sourceGame: "marketGate", q: "Opportunity cost is best defined as:", options: ["The value of the next best alternative given up", "The total money spent on a choice", "The price sellers receive", "The amount of tax collected"], a: 0, tag: "opportunity_cost", type: "definition", objective: "LO1.2", difficulty: "easy", conceptCluster: "core_principles", primarySkill: "opportunity_cost_definition", secondarySkills: ["tradeoff_identification"], repairSkill: "opportunity_cost_definition", commonError: "treats_opportunity_cost_as_only_money_cost", feedback: "Opportunity cost is the value of the next best alternative you give up." },
  { id: 10003, sourceGame: "marketGate", q: "You attend a concert instead of working a shift that pays $75. What is part of your opportunity cost?", options: ["The $75 in forgone wages", "Only the price of the concert ticket", "Only the time spent driving", "The market equilibrium price"], a: 0, tag: "opportunity_cost", type: "interpretation", objective: "LO1.2", difficulty: "easy", conceptCluster: "core_principles", primarySkill: "opportunity_cost_identification", secondarySkills: ["opportunity_cost_definition"], repairSkill: "opportunity_cost_definition", commonError: "ignores_forgone_alternative", feedback: "The wages you give up are part of the opportunity cost of attending the concert." },
  { id: 10004, sourceGame: "marketGate", q: "A rational person takes an action when:", options: ["Marginal benefit is greater than marginal cost", "Total cost is always higher than total benefit", "There is no opportunity cost", "The action is popular"], a: 0, tag: "marginal", type: "definition", objective: "LO1.3", difficulty: "easy", conceptCluster: "core_principles", primarySkill: "marginal_benefit_cost_rule", secondarySkills: ["marginal_reasoning_identification"], repairSkill: "marginal_benefit_cost_decision", commonError: "compares_total_values_instead_of_marginal_values", feedback: "Marginal reasoning compares the extra benefit to the extra cost." },
  { id: 10005, sourceGame: "marketGate", q: "You buy one more study guide because the extra benefit exceeds the extra cost. What kind of reasoning is this?", options: ["Marginal reasoning", "Tax incidence", "Circular-flow reasoning", "Price ceiling analysis"], a: 0, tag: "marginal", type: "interpretation", objective: "LO1.3", difficulty: "easy", conceptCluster: "core_principles", primarySkill: "marginal_reasoning_identification", secondarySkills: ["marginal_benefit_cost_rule"], repairSkill: "marginal_benefit_cost_decision", commonError: "misses_extra_or_one_more_language", feedback: "The phrase one more points to marginal reasoning." },
  { id: 10006, sourceGame: "marketGate", q: "If the marginal benefit of an action is $30 and the marginal cost is $20, what should a rational person do?", options: ["Take the action", "Avoid the action", "Ignore the marginal benefit", "Choose only by total cost"], a: 0, tag: "marginal", type: "calculation", objective: "LO1.3", difficulty: "easy", conceptCluster: "core_principles", primarySkill: "marginal_benefit_cost_decision", secondarySkills: ["basic_net_benefit"], repairSkill: "marginal_benefit_cost_decision", commonError: "gets_mb_mc_rule_backwards", feedback: "Because marginal benefit is greater than marginal cost, the action is worth taking." },
  { id: 10007, sourceGame: "marketGate", q: "An incentive is:", options: ["Something that induces people to act", "A legal maximum price", "A point outside the PPF", "A market shortage"], a: 0, tag: "incentives", type: "definition", objective: "LO1.4", difficulty: "easy", conceptCluster: "core_principles", primarySkill: "incentive_definition", secondarySkills: ["behavior_response_to_incentives"], repairSkill: "incentive_definition", commonError: "confuses_incentive_with_policy_result", feedback: "An incentive is a reward or punishment that changes behavior." },
  { id: 10008, sourceGame: "marketGate", q: "Gas prices rise and more consumers buy fuel-efficient cars. What principle does this show?", options: ["People respond to incentives", "Trade eliminates scarcity", "Taxes are always paid by sellers", "Supply must shift left"], a: 0, tag: "incentives", type: "interpretation", objective: "LO1.4", difficulty: "easy", conceptCluster: "core_principles", primarySkill: "behavior_response_to_incentives", secondarySkills: ["incentive_definition"], repairSkill: "incentive_definition", commonError: "misses_behavioral_response", feedback: "Higher gas prices create an incentive to change behavior." },
  { id: 10009, sourceGame: "marketGate", q: "Trade can make people better off because:", options: ["People can specialize and exchange", "Everyone becomes self-sufficient", "Scarcity disappears", "Prices no longer matter"], a: 0, tag: "trade", type: "definition", objective: "LO1.5", difficulty: "easy", conceptCluster: "core_principles", primarySkill: "gains_from_trade", secondarySkills: ["specialization"], repairSkill: "gains_from_trade", commonError: "thinks_trade_requires_one_side_to_lose", feedback: "Trade allows specialization and exchange, which can benefit both sides." },
  { id: 10010, sourceGame: "marketGate", q: "A market economy usually allocates resources through:", options: ["Decisions of households and firms interacting in markets", "A single planner choosing every price", "Random assignment of goods", "Only government production"], a: 0, tag: "markets", type: "definition", objective: "LO1.6", difficulty: "easy", conceptCluster: "core_principles", primarySkill: "market_allocation_definition", secondarySkills: ["price_signal_allocation"], repairSkill: "market_allocation_definition", commonError: "confuses_market_allocation_with_command_allocation", feedback: "Markets allocate resources through decentralized decisions by buyers and sellers." },
  { id: 10011, sourceGame: "marketGate", q: "Pollution from a factory that harms nearby residents is an example of:", options: ["A negative externality", "A price floor", "A perfectly efficient market", "A positive statement"], a: 0, tag: "market_failure", type: "interpretation", objective: "LO1.6", difficulty: "easy", conceptCluster: "core_principles", primarySkill: "externality_identification", secondarySkills: ["market_failure_types"], repairSkill: "market_failure_types", commonError: "confuses_externality_with_private_cost", feedback: "Pollution affects bystanders, so it is a negative externality." },
  { id: 10012, sourceGame: "marketGate", q: "A public good is usually:", options: ["Hard to exclude people from and shared by many users", "Always sold by one monopoly firm", "A legal maximum price", "A substitute for every other good"], a: 0, tag: "market_failure", type: "definition", objective: "LO1.6", difficulty: "easy", conceptCluster: "core_principles", primarySkill: "public_good_definition", secondarySkills: ["market_failure_types"], repairSkill: "market_failure_types", commonError: "confuses_public_good_with_government_provided_good", feedback: "Public goods are generally nonexcludable and nonrival." },
  { id: 10013, sourceGame: "marketGate", q: "A seller with substantial influence over the market price has:", options: ["Market power", "A price ceiling", "A PPF", "A circular flow"], a: 0, tag: "market_failure", type: "definition", objective: "LO1.6", difficulty: "easy", conceptCluster: "core_principles", primarySkill: "market_power_definition", secondarySkills: ["market_failure_types"], repairSkill: "market_failure_types", commonError: "confuses_market_power_with_high_demand", feedback: "Market power exists when a buyer or seller can influence price." },
  { id: 10014, sourceGame: "marketGate", q: "Which situation is most likely a market failure?", options: ["A factory pollutes a river used by nearby households", "A buyer voluntarily purchases coffee", "A seller lowers price during a sale", "A student chooses to study"], a: 0, tag: "market_failure", type: "interpretation", objective: "LO1.6", difficulty: "easy", conceptCluster: "core_principles", primarySkill: "market_failure_identification", secondarySkills: ["externality_identification"], repairSkill: "market_failure_types", commonError: "thinks_any_unwanted_outcome_is_market_failure", feedback: "Pollution that harms third parties is a market failure because the full cost is not reflected in the market." },
  { id: 10015, sourceGame: "marketGate", q: "Efficiency means:", options: ["Society gets the most from its scarce resources", "Prosperity is distributed equally", "Every price is fixed by law", "Every firm earns the same profit"], a: 0, tag: "tradeoffs", type: "definition", objective: "LO1.1", difficulty: "easy", conceptCluster: "core_principles", primarySkill: "efficiency_definition", secondarySkills: ["equality_vs_efficiency"], repairSkill: "efficiency_vs_equality", commonError: "confuses_efficiency_with_equality", feedback: "Efficiency means getting the most possible from scarce resources." },
  { id: 10016, sourceGame: "marketGate", q: "Equality means:", options: ["Prosperity is distributed more uniformly among society's members", "Society gets the most output from resources", "Prices always rise", "Markets always fail"], a: 0, tag: "tradeoffs", type: "definition", objective: "LO1.1", difficulty: "easy", conceptCluster: "core_principles", primarySkill: "equality_definition", secondarySkills: ["equality_vs_efficiency"], repairSkill: "efficiency_vs_equality", commonError: "confuses_equality_with_efficiency", feedback: "Equality concerns how prosperity is distributed across society." },
  { id: 10017, sourceGame: "marketGate", q: "Economists use models because models:", options: ["Simplify reality to help explain the world", "Include every detail of reality", "Eliminate the need for assumptions", "Replace all data"], a: 0, tag: "models", type: "definition", objective: "LO2.1", difficulty: "easy", conceptCluster: "economic_thinking", primarySkill: "model_purpose", secondarySkills: ["assumptions_role"], repairSkill: "model_purpose", commonError: "thinks_models_must_include_every_detail", feedback: "Models simplify reality so economists can focus on the key relationships." },
  { id: 10018, sourceGame: "marketGate", q: "In economics, assumptions are mainly used to:", options: ["Simplify analysis", "Hide facts from students", "Guarantee perfect predictions", "Replace all evidence"], a: 0, tag: "models", type: "definition", objective: "LO2.1", difficulty: "easy", conceptCluster: "economic_thinking", primarySkill: "assumptions_role", secondarySkills: ["model_purpose"], repairSkill: "model_purpose", commonError: "thinks_assumptions_are_errors", feedback: "Assumptions simplify analysis by helping isolate important relationships." },
  { id: 10019, sourceGame: "marketGate", q: "The circular-flow model shows how dollars, goods and services, and resources move between:", options: ["Households and firms", "Only banks and government", "Only buyers and foreign countries", "Only workers and taxes"], a: 0, tag: "circular_flow", type: "definition", objective: "LO2.2", difficulty: "easy", conceptCluster: "economic_models", primarySkill: "circular_flow_components", secondarySkills: ["households_firms_roles"], repairSkill: "circular_flow_components", commonError: "confuses_circular_flow_with_ppf", feedback: "The circular-flow model shows flows between households and firms." },
  { id: 10020, sourceGame: "marketGate", q: "In the simple circular-flow model, households usually supply:", options: ["Factors of production", "Finished goods and services", "Price ceilings", "Tax wedges"], a: 0, tag: "circular_flow", type: "interpretation", objective: "LO2.2", difficulty: "easy", conceptCluster: "economic_models", primarySkill: "households_firms_roles", secondarySkills: ["circular_flow_components"], repairSkill: "circular_flow_components", commonError: "reverses_household_and_firm_roles", feedback: "Households supply factors of production such as labor, land, and capital." },
  { id: 10021, sourceGame: "marketGate", q: "In the simple circular-flow model, firms usually supply:", options: ["Goods and services", "Only labor", "Only household income", "Only public goods"], a: 0, tag: "circular_flow", type: "interpretation", objective: "LO2.2", difficulty: "easy", conceptCluster: "economic_models", primarySkill: "firms_role_circular_flow", secondarySkills: ["households_firms_roles"], repairSkill: "circular_flow_components", commonError: "reverses_firm_and_household_roles", feedback: "Firms produce and sell goods and services." },
  { id: 10022, sourceGame: "marketGate", q: "A production possibilities frontier shows:", options: ["The combinations of two goods an economy can produce with current resources and technology", "The exact market price of a good", "Only government spending", "Only the unemployment rate"], a: 0, tag: "ppf", type: "definition", objective: "LO2.2", difficulty: "easy", conceptCluster: "economic_models", primarySkill: "ppf_definition", secondarySkills: ["attainable_unattainable"], repairSkill: "ppf_definition", commonError: "confuses_ppf_with_market_supply_curve", feedback: "A PPF shows possible production combinations with current resources and technology." },
  { id: 10023, sourceGame: "marketGate", q: "A point inside the PPF usually means:", options: ["Resources are not being used efficiently", "The point is unattainable", "The economy has no tradeoffs", "The economy is beyond its resources"], a: 0, tag: "ppf", type: "interpretation", objective: "LO2.2", difficulty: "easy", conceptCluster: "economic_models", primarySkill: "ppf_efficiency_status", secondarySkills: ["attainable_unattainable"], repairSkill: "ppf_efficiency_status", commonError: "confuses_inside_ppf_with_unattainable", feedback: "A point inside the PPF is attainable but inefficient." },
  { id: 10024, sourceGame: "marketGate", q: "A point outside the PPF is:", options: ["Unattainable with current resources and technology", "Efficient but always chosen", "A price floor", "A market surplus"], a: 0, tag: "ppf", type: "interpretation", objective: "LO2.2", difficulty: "easy", conceptCluster: "economic_models", primarySkill: "attainable_unattainable", secondarySkills: ["ppf_efficiency_status"], repairSkill: "ppf_efficiency_status", commonError: "confuses_outside_ppf_with_efficient", feedback: "A point outside the PPF cannot be reached with current resources and technology." },
  { id: 10025, sourceGame: "marketGate", q: "Moving along a PPF usually means:", options: ["Producing more of one good and less of another", "Producing more of every good without cost", "Creating a tax wedge", "Changing only the price level"], a: 0, tag: "ppf", type: "interpretation", objective: "LO2.2", difficulty: "easy", conceptCluster: "economic_models", primarySkill: "ppf_tradeoff", secondarySkills: ["opportunity_cost_definition"], repairSkill: "ppf_opportunity_cost", commonError: "misses_tradeoff_on_ppf", feedback: "Moving along the PPF shows a tradeoff between two goods." },
  { id: 10026, sourceGame: "marketGate", q: "An outward shift of the PPF usually represents:", options: ["Economic growth", "A shortage", "A binding price ceiling", "A decrease in demand"], a: 0, tag: "ppf", type: "definition", objective: "LO2.2", difficulty: "easy", conceptCluster: "economic_models", primarySkill: "ppf_growth", secondarySkills: ["attainable_unattainable"], repairSkill: "ppf_growth", commonError: "confuses_growth_with_movement_along_ppf", feedback: "An outward shift means the economy can produce more than before." },
  { id: 10027, sourceGame: "marketGate", q: "If moving from point A to point B on a PPF gives up 6 units of corn to gain 3 units of wheat, the opportunity cost per wheat is:", options: ["2 units of corn", "3 units of corn", "6 units of corn", "18 units of corn"], a: 0, tag: "ppf", type: "calculation", objective: "LO2.2", difficulty: "easy", conceptCluster: "economic_models", primarySkill: "ppf_opportunity_cost", secondarySkills: ["opportunity_cost_calculation"], repairSkill: "ppf_opportunity_cost", commonError: "divides_gain_by_loss_instead_of_loss_by_gain", feedback: "Opportunity cost per wheat is corn given up divided by wheat gained: 6 / 3 = 2." },
  { id: 10028, sourceGame: "marketGate", q: "Microeconomics studies:", options: ["How individual households and firms make decisions", "Only economy-wide inflation", "Only national unemployment", "Only central bank policy"], a: 0, tag: "micro_macro", type: "definition", objective: "LO2.3", difficulty: "easy", conceptCluster: "economic_thinking", primarySkill: "microeconomics_definition", secondarySkills: ["micro_vs_macro"], repairSkill: "micro_vs_macro", commonError: "confuses_micro_with_macro", feedback: "Microeconomics studies households, firms, and individual markets." },
  { id: 10029, sourceGame: "marketGate", q: "Macroeconomics studies:", options: ["Economy-wide issues such as inflation, unemployment, and growth", "Only one firm's production plan", "Only one household's grocery choices", "Only one product's demand curve"], a: 0, tag: "micro_macro", type: "definition", objective: "LO2.3", difficulty: "easy", conceptCluster: "economic_thinking", primarySkill: "macroeconomics_definition", secondarySkills: ["micro_vs_macro"], repairSkill: "micro_vs_macro", commonError: "confuses_macro_with_individual_market", feedback: "Macroeconomics studies economy-wide forces." },
  { id: 10030, sourceGame: "marketGate", q: "Which question is most clearly microeconomic?", options: ["How many workers should a coffee shop hire?", "What causes national inflation?", "Why did national unemployment rise?", "How fast is GDP growing?"], a: 0, tag: "micro_macro", type: "interpretation", objective: "LO2.3", difficulty: "easy", conceptCluster: "economic_thinking", primarySkill: "micro_vs_macro", secondarySkills: ["microeconomics_definition"], repairSkill: "micro_vs_macro", commonError: "misses_individual_firm_market_focus", feedback: "A single firm's hiring decision is microeconomic." },
  { id: 10031, sourceGame: "marketGate", q: "A positive statement is:", options: ["A claim about how the world is", "A claim about how the world should be", "A statement that is always morally good", "A statement made only by policymakers"], a: 0, tag: "positive_normative", type: "definition", objective: "LO2.4", difficulty: "easy", conceptCluster: "economic_thinking", primarySkill: "positive_statement_definition", secondarySkills: ["positive_vs_normative"], repairSkill: "positive_vs_normative", commonError: "confuses_positive_with_good_or_approval", feedback: "Positive statements describe or predict how the world is." },
  { id: 10032, sourceGame: "marketGate", q: "A normative statement is:", options: ["A claim about how the world should be", "A testable claim about how the world is", "A demand schedule", "A supply curve"], a: 0, tag: "positive_normative", type: "definition", objective: "LO2.4", difficulty: "easy", conceptCluster: "economic_thinking", primarySkill: "normative_statement_definition", secondarySkills: ["positive_vs_normative"], repairSkill: "positive_vs_normative", commonError: "confuses_normative_with_false", feedback: "Normative statements involve judgments about what should happen." },
  { id: 10033, sourceGame: "marketGate", q: "Which statement is positive?", options: ["A rent ceiling below equilibrium will reduce available rental units.", "The city should make rent cheaper.", "Rent control is unfair.", "The best policy is always lower rent."], a: 0, tag: "positive_normative", type: "interpretation", objective: "LO2.4", difficulty: "easy", conceptCluster: "economic_thinking", primarySkill: "positive_vs_normative", secondarySkills: ["policy_statement_classification"], repairSkill: "positive_vs_normative", commonError: "uses_policy_topic_to_assume_normative", feedback: "This is positive because it makes a testable claim about what the policy will do." },
  { id: 10034, sourceGame: "marketGate", q: "When economists recommend what policy government should choose, they are acting mainly as:", options: ["Policy advisers", "Only data recorders", "Price takers", "Households"], a: 0, tag: "policy", type: "definition", objective: "LO2.5", difficulty: "easy", conceptCluster: "economic_thinking", primarySkill: "economist_policy_role", secondarySkills: ["positive_vs_normative"], repairSkill: "economist_roles", commonError: "confuses_scientist_role_with_policy_advisor_role", feedback: "When economists recommend policy, they are acting as policy advisers." },
  { id: 10035, sourceGame: "marketGate", q: "A competitive market has:", options: ["Many buyers and sellers with little individual influence over price", "One seller who controls the price", "Only government buyers", "No price signals"], a: 0, tag: "competitive_market", type: "definition", objective: "LO4.1", difficulty: "easy", conceptCluster: "supply_demand", primarySkill: "competitive_market_definition", secondarySkills: ["price_taker_definition"], repairSkill: "competitive_market_definition", commonError: "confuses_competitive_market_with_one_dominant_seller", feedback: "A competitive market has many buyers and sellers, each with little control over price." },
  { id: 10036, sourceGame: "marketGate", q: "A price taker is a buyer or seller who:", options: ["Accepts the market price as given", "Sets the market price alone", "Creates a legal maximum price", "Always avoids trade"], a: 0, tag: "competitive_market", type: "definition", objective: "LO4.1", difficulty: "easy", conceptCluster: "supply_demand", primarySkill: "price_taker_definition", secondarySkills: ["competitive_market_definition"], repairSkill: "competitive_market_definition", commonError: "confuses_price_taker_with_price_maker", feedback: "A price taker accepts the market price because no single buyer or seller controls it." },
  { id: 10037, sourceGame: "marketGate", q: "The law of demand says that, other things equal:", options: ["As price falls, quantity demanded rises", "As price falls, demand always shifts left", "As price rises, supply shifts left", "As price rises, quantity demanded rises"], a: 0, tag: "demand", type: "definition", objective: "LO4.2", difficulty: "easy", conceptCluster: "supply_demand", primarySkill: "law_of_demand", secondarySkills: ["movement_vs_demand_shift"], repairSkill: "law_of_demand", commonError: "confuses_quantity_demanded_with_demand_shift", feedback: "The law of demand says price and quantity demanded move in opposite directions." },
  { id: 10038, sourceGame: "marketGate", q: "When the price of a good falls, what happens to quantity demanded?", options: ["Quantity demanded increases", "Demand decreases", "Supply increases", "The demand curve shifts left"], a: 0, tag: "demand", type: "interpretation", objective: "LO4.2", difficulty: "easy", conceptCluster: "supply_demand", primarySkill: "movement_vs_demand_shift", secondarySkills: ["law_of_demand"], repairSkill: "movement_vs_demand_shift", commonError: "treats_own_price_change_as_demand_shift", feedback: "A change in the good's own price causes movement along the demand curve." },
  { id: 10039, sourceGame: "marketGate", q: "A change in which factor would shift the demand curve?", options: ["Consumer income", "The good's own price", "Movement along the curve", "Quantity supplied"], a: 0, tag: "demand", type: "definition", objective: "LO4.2", difficulty: "easy", conceptCluster: "supply_demand", primarySkill: "demand_shifters_income", secondarySkills: ["movement_vs_demand_shift"], repairSkill: "demand_shifters", commonError: "thinks_own_price_shifts_demand", feedback: "Income is a demand shifter. The good's own price changes quantity demanded." },
  { id: 10040, sourceGame: "marketGate", q: "If income rises and tablets are a normal good, what happens to demand for tablets?", options: ["Demand increases", "Demand decreases", "Quantity demanded decreases because price changed", "Supply decreases"], a: 0, tag: "demand", type: "interpretation", objective: "LO4.2", difficulty: "easy", conceptCluster: "supply_demand", primarySkill: "demand_shifters_income", secondarySkills: ["normal_good_income"], repairSkill: "demand_shifters", commonError: "confuses_income_change_with_movement_along_demand", feedback: "For a normal good, higher income increases demand." },
  { id: 10041, sourceGame: "marketGate", q: "Two goods are substitutes when:", options: ["One good can be used in place of the other", "They must be used together", "One is always inferior", "Both are supplied by government"], a: 0, tag: "demand", type: "definition", objective: "LO4.2", difficulty: "easy", conceptCluster: "supply_demand", primarySkill: "substitute_good_definition", secondarySkills: ["demand_shifters_related_goods"], repairSkill: "related_goods_demand", commonError: "confuses_substitutes_with_complements", feedback: "Substitutes are goods that can replace one another." },
  { id: 10042, sourceGame: "marketGate", q: "Two goods are complements when:", options: ["They are commonly used together", "They can always replace one another", "Both are price ceilings", "Neither has demand"], a: 0, tag: "demand", type: "definition", objective: "LO4.2", difficulty: "easy", conceptCluster: "supply_demand", primarySkill: "complement_good_definition", secondarySkills: ["demand_shifters_related_goods"], repairSkill: "related_goods_demand", commonError: "confuses_complements_with_substitutes", feedback: "Complements are goods used together." },
  { id: 10043, sourceGame: "marketGate", q: "If the price of a substitute for iPhones falls, what happens to demand for iPhones?", options: ["Demand for iPhones decreases", "Demand for iPhones increases", "Supply of iPhones increases", "Quantity demanded of iPhones increases because iPhone price fell"], a: 0, tag: "demand", type: "interpretation", objective: "LO4.2", difficulty: "easy", conceptCluster: "supply_demand", primarySkill: "demand_shifters_related_goods", secondarySkills: ["substitute_good_definition"], repairSkill: "related_goods_demand", commonError: "gets_substitute_price_effect_backwards", feedback: "If a substitute gets cheaper, buyers shift away from the original good." },
  { id: 10044, sourceGame: "marketGate", q: "If the price of printer ink rises, what likely happens to demand for printers?", options: ["Demand for printers decreases", "Demand for printers increases", "Supply of printers increases", "Quantity supplied of printers increases"], a: 0, tag: "demand", type: "interpretation", objective: "LO4.2", difficulty: "easy", conceptCluster: "supply_demand", primarySkill: "demand_shifters_related_goods", secondarySkills: ["complement_good_definition"], repairSkill: "related_goods_demand", commonError: "gets_complement_price_effect_backwards", feedback: "Printers and ink are complements, so higher ink prices reduce demand for printers." },
  { id: 10045, sourceGame: "marketGate", q: "The law of supply says that, other things equal:", options: ["As price rises, quantity supplied rises", "As price rises, demand rises", "As price falls, quantity supplied rises", "As price falls, supply shifts right"], a: 0, tag: "supply", type: "definition", objective: "LO4.3", difficulty: "easy", conceptCluster: "supply_demand", primarySkill: "law_of_supply", secondarySkills: ["movement_vs_supply_shift"], repairSkill: "law_of_supply", commonError: "confuses_supply_with_demand_direction", feedback: "The law of supply says price and quantity supplied move in the same direction." },
  { id: 10046, sourceGame: "marketGate", q: "If the price of a good rises, what happens to quantity supplied?", options: ["Quantity supplied increases", "Supply decreases", "Demand increases", "The supply curve shifts left"], a: 0, tag: "supply", type: "interpretation", objective: "LO4.3", difficulty: "easy", conceptCluster: "supply_demand", primarySkill: "movement_vs_supply_shift", secondarySkills: ["law_of_supply"], repairSkill: "movement_vs_supply_shift", commonError: "treats_own_price_change_as_supply_shift", feedback: "A change in the good's own price causes movement along the supply curve." },
  { id: 10047, sourceGame: "marketGate", q: "Which change would shift the supply curve?", options: ["A change in input costs", "A change in the good's own price", "A change in quantity demanded", "A movement along demand"], a: 0, tag: "supply", type: "definition", objective: "LO4.3", difficulty: "easy", conceptCluster: "supply_demand", primarySkill: "supply_shifters_input_costs", secondarySkills: ["movement_vs_supply_shift"], repairSkill: "supply_shifters", commonError: "thinks_own_price_shifts_supply", feedback: "Input costs shift supply. The good's own price changes quantity supplied." },
  { id: 10048, sourceGame: "marketGate", q: "If the cost of steel rises for car producers, what happens to the supply of cars?", options: ["Supply decreases", "Supply increases", "Demand decreases", "Quantity demanded increases"], a: 0, tag: "supply", type: "interpretation", objective: "LO4.3", difficulty: "easy", conceptCluster: "supply_demand", primarySkill: "supply_shifters_input_costs", secondarySkills: ["supply_shift_direction"], repairSkill: "supply_shifters", commonError: "gets_input_cost_effect_backwards", feedback: "Higher input costs make production more expensive, so supply decreases." },
  { id: 10049, sourceGame: "marketGate", q: "An improvement in production technology usually causes:", options: ["Supply to increase", "Demand to decrease", "Quantity demanded to fall because price changed", "A binding price floor"], a: 0, tag: "supply", type: "interpretation", objective: "LO4.3", difficulty: "easy", conceptCluster: "supply_demand", primarySkill: "supply_shifters_technology", secondarySkills: ["supply_shift_direction"], repairSkill: "supply_shifters", commonError: "misses_technology_as_supply_shifter", feedback: "Better technology makes production easier or cheaper, shifting supply right." },
  { id: 10050, sourceGame: "marketGate", q: "Market equilibrium occurs where:", options: ["Quantity demanded equals quantity supplied", "Demand is always greater than supply", "Supply is always greater than demand", "Government fixes the price"], a: 0, tag: "equilibrium", type: "definition", objective: "LO4.4", difficulty: "easy", conceptCluster: "supply_demand", primarySkill: "equilibrium_definition", secondarySkills: ["surplus_shortage_identification"], repairSkill: "equilibrium_definition", commonError: "confuses_equilibrium_with_highest_price", feedback: "At equilibrium, quantity demanded equals quantity supplied." },
  { id: 10051, sourceGame: "marketGate", q: "If the market price is above equilibrium, the market has:", options: ["A surplus", "A shortage", "A binding price ceiling", "No quantity supplied"], a: 0, tag: "surplus_shortage", type: "interpretation", objective: "LO4.4", difficulty: "easy", conceptCluster: "supply_demand", primarySkill: "surplus_identification", secondarySkills: ["equilibrium_definition"], repairSkill: "surplus_shortage_identification", commonError: "reverses_surplus_and_shortage", feedback: "A price above equilibrium creates a surplus because quantity supplied exceeds quantity demanded." },
  { id: 10052, sourceGame: "marketGate", q: "If the market price is below equilibrium, the market has:", options: ["A shortage", "A surplus", "Excess supply", "No demand"], a: 0, tag: "surplus_shortage", type: "interpretation", objective: "LO4.4", difficulty: "easy", conceptCluster: "supply_demand", primarySkill: "shortage_identification", secondarySkills: ["equilibrium_definition"], repairSkill: "surplus_shortage_identification", commonError: "reverses_surplus_and_shortage", feedback: "A price below equilibrium creates a shortage because quantity demanded exceeds quantity supplied." },
  { id: 10053, sourceGame: "marketGate", q: "If demand increases and supply does not change, what happens to equilibrium price?", options: ["It increases", "It decreases", "It must stay the same", "It becomes illegal"], a: 0, tag: "equilibrium", type: "interpretation", objective: "LO4.4", difficulty: "easy", conceptCluster: "supply_demand", primarySkill: "demand_shift_equilibrium_price", secondarySkills: ["market_change_prediction"], repairSkill: "equilibrium_prediction", commonError: "gets_demand_shift_price_effect_backwards", feedback: "An increase in demand raises equilibrium price when supply is unchanged." },
  { id: 10054, sourceGame: "marketGate", q: "If supply increases and demand does not change, what happens to equilibrium price?", options: ["It decreases", "It increases", "It must become a price ceiling", "It disappears"], a: 0, tag: "equilibrium", type: "interpretation", objective: "LO4.4", difficulty: "easy", conceptCluster: "supply_demand", primarySkill: "supply_shift_equilibrium_price", secondarySkills: ["market_change_prediction"], repairSkill: "equilibrium_prediction", commonError: "gets_supply_shift_price_effect_backwards", feedback: "An increase in supply lowers equilibrium price when demand is unchanged." },
  { id: 10055, sourceGame: "marketGate", q: "Prices help allocate scarce resources by:", options: ["Sending signals to buyers and sellers", "Eliminating scarcity", "Preventing all shortages forever", "Making opportunity cost disappear"], a: 0, tag: "price_signal", type: "definition", objective: "LO4.5", difficulty: "easy", conceptCluster: "supply_demand", primarySkill: "price_signal_allocation", secondarySkills: ["market_allocation_definition"], repairSkill: "price_signal_allocation", commonError: "thinks_prices_only_transfer_money", feedback: "Prices send signals that help buyers and sellers adjust behavior." },
  { id: 10056, sourceGame: "marketGate", q: "When a good becomes scarce and its price rises, buyers are encouraged to:", options: ["Buy less or look for substitutes", "Demand more because price is higher", "Ignore the price signal", "Shift supply left"], a: 0, tag: "price_signal", type: "interpretation", objective: "LO4.5", difficulty: "easy", conceptCluster: "supply_demand", primarySkill: "buyer_response_to_price_signal", secondarySkills: ["law_of_demand"], repairSkill: "price_signal_allocation", commonError: "confuses_buyer_response_with_supplier_response", feedback: "Higher prices encourage buyers to buy less or look for substitutes." },
  { id: 10057, sourceGame: "marketGate", q: "When a good's price rises, sellers are generally encouraged to:", options: ["Produce more of the good", "Buy less of the good", "Shift demand left", "Create a price ceiling"], a: 0, tag: "price_signal", type: "interpretation", objective: "LO4.5", difficulty: "easy", conceptCluster: "supply_demand", primarySkill: "seller_response_to_price_signal", secondarySkills: ["law_of_supply"], repairSkill: "price_signal_allocation", commonError: "confuses_seller_response_with_buyer_response", feedback: "Higher prices encourage sellers to supply more." },
  { id: 10058, sourceGame: "marketGate", q: "A legal maximum price is called:", options: ["A price ceiling", "A price floor", "Tax incidence", "Consumer surplus"], a: 0, tag: "price_ceiling", type: "definition", objective: "LO6.1", difficulty: "easy", conceptCluster: "government_policy", primarySkill: "price_ceiling_definition", secondarySkills: ["binding_price_ceiling"], repairSkill: "price_ceiling_definition", commonError: "confuses_ceiling_with_floor", feedback: "A price ceiling is a legal maximum price." },
  { id: 10059, sourceGame: "marketGate", q: "A price ceiling is binding when it is set:", options: ["Below the equilibrium price", "Above the equilibrium price", "At any seller's preferred price", "Only on producers"], a: 0, tag: "price_ceiling", type: "definition", objective: "LO6.1", difficulty: "easy", conceptCluster: "government_policy", primarySkill: "binding_price_ceiling", secondarySkills: ["price_ceiling_definition"], repairSkill: "binding_price_ceiling", commonError: "gets_binding_ceiling_direction_backwards", feedback: "A ceiling must be below equilibrium to prevent price from rising to equilibrium." },
  { id: 10060, sourceGame: "marketGate", q: "A binding price ceiling creates:", options: ["A shortage", "A surplus", "More supply than demand", "A tax wedge"], a: 0, tag: "price_ceiling", type: "interpretation", objective: "LO6.1", difficulty: "easy", conceptCluster: "government_policy", primarySkill: "ceiling_shortage_effect", secondarySkills: ["binding_price_ceiling"], repairSkill: "binding_price_ceiling", commonError: "confuses_ceiling_shortage_with_floor_surplus", feedback: "A binding price ceiling keeps price too low, so quantity demanded exceeds quantity supplied." },
  { id: 10061, sourceGame: "marketGate", q: "A city sets rent at $800 when equilibrium rent is $1,200. This rent ceiling is:", options: ["Binding", "Not binding", "A price floor", "A tax"], a: 0, tag: "price_ceiling", type: "interpretation", objective: "LO6.1", difficulty: "easy", conceptCluster: "government_policy", primarySkill: "binding_price_ceiling", secondarySkills: ["ceiling_shortage_effect"], repairSkill: "binding_price_ceiling", commonError: "misses_ceiling_below_equilibrium", feedback: "The ceiling is below equilibrium, so it is binding." },
  { id: 10062, sourceGame: "marketGate", q: "At a binding price ceiling, quantity demanded is 70 and quantity supplied is 45. What is the shortage?", options: ["25 units", "45 units", "70 units", "115 units"], a: 0, tag: "price_ceiling", type: "calculation", objective: "LO6.1", difficulty: "easy", conceptCluster: "government_policy", primarySkill: "ceiling_shortage_calculation", secondarySkills: ["binding_price_ceiling"], repairSkill: "ceiling_shortage_calculation", commonError: "adds_qd_and_qs_instead_of_subtracting", feedback: "Shortage equals quantity demanded minus quantity supplied: 70 - 45 = 25." },
  { id: 10063, sourceGame: "marketGate", q: "A legal minimum price is called:", options: ["A price floor", "A price ceiling", "A shortage", "A demand shift"], a: 0, tag: "price_floor", type: "definition", objective: "LO6.2", difficulty: "easy", conceptCluster: "government_policy", primarySkill: "price_floor_definition", secondarySkills: ["binding_price_floor"], repairSkill: "price_floor_definition", commonError: "confuses_floor_with_ceiling", feedback: "A price floor is a legal minimum price." },
  { id: 10064, sourceGame: "marketGate", q: "A price floor is binding when it is set:", options: ["Above the equilibrium price", "Below the equilibrium price", "At zero", "Only on buyers"], a: 0, tag: "price_floor", type: "definition", objective: "LO6.2", difficulty: "easy", conceptCluster: "government_policy", primarySkill: "binding_price_floor", secondarySkills: ["price_floor_definition"], repairSkill: "binding_price_floor", commonError: "gets_binding_floor_direction_backwards", feedback: "A floor must be above equilibrium to prevent price from falling to equilibrium." },
  { id: 10065, sourceGame: "marketGate", q: "A binding price floor creates:", options: ["A surplus", "A shortage", "A decrease in supply", "A price ceiling"], a: 0, tag: "price_floor", type: "interpretation", objective: "LO6.2", difficulty: "easy", conceptCluster: "government_policy", primarySkill: "floor_surplus_effect", secondarySkills: ["binding_price_floor"], repairSkill: "binding_price_floor", commonError: "confuses_floor_surplus_with_ceiling_shortage", feedback: "A binding price floor keeps price too high, so quantity supplied exceeds quantity demanded." },
  { id: 10066, sourceGame: "marketGate", q: "A minimum wage set above equilibrium usually creates:", options: ["A labor surplus, or unemployment", "A labor shortage", "A decrease in labor supply", "A tax wedge only on buyers"], a: 0, tag: "price_floor", type: "interpretation", objective: "LO6.2", difficulty: "easy", conceptCluster: "government_policy", primarySkill: "minimum_wage_surplus", secondarySkills: ["floor_surplus_effect"], repairSkill: "binding_price_floor", commonError: "misses_minimum_wage_as_price_floor", feedback: "A binding minimum wage is a price floor in the labor market and creates a surplus of labor." },
  { id: 10067, sourceGame: "marketGate", q: "At a binding price floor, quantity supplied is 90 and quantity demanded is 50. What is the surplus?", options: ["40 units", "50 units", "90 units", "140 units"], a: 0, tag: "price_floor", type: "calculation", objective: "LO6.2", difficulty: "easy", conceptCluster: "government_policy", primarySkill: "floor_surplus_calculation", secondarySkills: ["binding_price_floor"], repairSkill: "floor_surplus_calculation", commonError: "adds_qs_and_qd_instead_of_subtracting", feedback: "Surplus equals quantity supplied minus quantity demanded: 90 - 50 = 40." },
  { id: 10068, sourceGame: "marketGate", q: "A tax on a good generally causes the quantity sold to:", options: ["Decrease", "Increase", "Stay exactly the same always", "Become unlimited"], a: 0, tag: "taxes", type: "definition", objective: "LO6.3", difficulty: "easy", conceptCluster: "government_policy", primarySkill: "tax_quantity_effect", secondarySkills: ["tax_wedge_identification"], repairSkill: "tax_wedge_incidence", commonError: "thinks_tax_only_changes_revenue_not_quantity", feedback: "A tax raises the effective cost of trade, so the quantity sold falls." },
  { id: 10069, sourceGame: "marketGate", q: "A tax creates a wedge between:", options: ["The price buyers pay and the price sellers receive", "Demand and consumer income only", "Two different PPFs", "Positive and normative statements"], a: 0, tag: "taxes", type: "definition", objective: "LO6.3", difficulty: "easy", conceptCluster: "government_policy", primarySkill: "tax_wedge_identification", secondarySkills: ["price_paid_vs_received"], repairSkill: "tax_wedge_incidence", commonError: "misses_wedge_between_buyer_price_and_seller_price", feedback: "A tax drives a wedge between what buyers pay and what sellers receive." },
  { id: 10070, sourceGame: "marketGate", q: "After a tax, buyers pay $12 and sellers receive $9. What is the tax per unit?", options: ["$3", "$9", "$12", "$21"], a: 0, tag: "taxes", type: "calculation", objective: "LO6.3", difficulty: "easy", conceptCluster: "government_policy", primarySkill: "tax_wedge_calculation", secondarySkills: ["price_paid_vs_received"], repairSkill: "tax_wedge_incidence", commonError: "adds_buyer_price_and_seller_price", feedback: "The tax wedge is the difference between what buyers pay and sellers receive: $12 - $9 = $3." },
  { id: 10071, sourceGame: "marketGate", q: "If buyers pay $15 after a tax and sellers receive $10, the wedge is:", options: ["$5", "$10", "$15", "$25"], a: 0, tag: "taxes", type: "calculation", objective: "LO6.3", difficulty: "easy", conceptCluster: "government_policy", primarySkill: "tax_wedge_calculation", secondarySkills: ["price_paid_vs_received"], repairSkill: "tax_wedge_incidence", commonError: "confuses_price_paid_with_tax_amount", feedback: "The wedge is the difference between buyer price and seller price: $15 - $10 = $5." },
