  { id:12088, sourceGame: "nationalLedger", difficulty:"hard", conceptCluster:"gdp_measurement", primarySkill:"gdp_counting_rules", secondarySkills:["intermediate_vs_final_goods"], repairSkill:"gdp_counting_rules", commonError:"Counting transactions that are not current domestic production, such as used goods, financial assets, or foreign production.", q:"A U.S. company produces $2 million of software in Ireland and sells it to customers in Europe. How does this affect U.S. GDP?", options:["It does not count in U.S. GDP because the production occurred outside U.S. borders","It counts in U.S. GDP because the firm is U.S.-owned","It counts as U.S. government purchases","It counts only if the software is downloaded in the U.S."], a:0, tag:"gdp_definition", type:"trap", objective:"LO24.2", feedback:"GDP is based on production within a country's borders, not ownership of the firm." },
  { id:12089, sourceGame: "nationalLedger", difficulty:"hard", conceptCluster:"gdp_measurement", primarySkill:"gdp_counting_rules", secondarySkills:["intermediate_vs_final_goods"], repairSkill:"gdp_counting_rules", commonError:"Counting transactions that are not current domestic production, such as used goods, financial assets, or foreign production.", q:"A Canadian company produces cars in Tennessee and sells them to U.S. households. How are those cars treated in U.S. GDP?", options:["They count because they were produced inside the United States","They do not count because the company is foreign-owned","They count only as imports","They count only as transfer payments"], a:0, tag:"gdp_definition", type:"interpretation", objective:"LO24.2", feedback:"GDP counts production within national borders, regardless of whether the producer is domestically or foreign owned." },
  { id:12090, sourceGame: "nationalLedger", difficulty:"hard", conceptCluster:"gdp_measurement", primarySkill:"gdp_counting_rules", secondarySkills:["intermediate_vs_final_goods"], repairSkill:"gdp_counting_rules", commonError:"Counting transactions that are not current domestic production, such as used goods, financial assets, or foreign production.", q:"A firm buys steel for $80, adds labor and capital services, and sells a machine for $230 to another firm. If the machine is newly produced and used in production, how much does GDP increase?", options:["$230","$150","$80","$310"], a:0, tag:"gdp_definition", type:"calculation", objective:"LO24.2", feedback:"The newly produced machine is a final capital good, so its full market value of $230 is counted." },
  { id:12091, sourceGame: "nationalLedger", difficulty:"hard", conceptCluster:"gdp_measurement", primarySkill:"gdp_counting_rules", secondarySkills:["intermediate_vs_final_goods"], repairSkill:"gdp_counting_rules", commonError:"Counting transactions that are not current domestic production, such as used goods, financial assets, or foreign production.", q:"A household pays $2,000 for illegal services and $2,000 for legal market services. Which statement best explains the GDP issue?", options:["The legal market service is counted, while illegal or hidden activity is often missed even if production occurred","Both are always fully counted because all services are visible","Neither counts because services are excluded from GDP","Only illegal activity counts because it is current production"], a:0, tag:"gdp_definition", type:"trap", objective:"LO24.2", feedback:"GDP aims to count market production, but illegal or hidden activity is often excluded or poorly measured." },
  { id:12092, sourceGame: "nationalLedger", difficulty:"hard", conceptCluster:"gdp_measurement", primarySkill:"gdp_counting_rules", secondarySkills:["intermediate_vs_final_goods"], repairSkill:"gdp_counting_rules", commonError:"Counting transactions that are not current domestic production, such as used goods, financial assets, or foreign production.", q:"A restaurant buys $300 of ingredients and sells meals for $900. Customers leave $100 in tips for servers. Ignoring any other complications, what is the strongest GDP interpretation?", options:["The $900 meal sales count as final services, and tips are income for service labor but not a separate final good","GDP counts $1,300 because ingredients, meals, and tips all stack","GDP counts only $300 because ingredients are tangible","GDP excludes restaurant services"], a:0, tag:"gdp_definition", type:"multi-step", objective:"LO24.2", feedback:"The meal service is the final output. Tips are income connected to service labor, not a separate final product stacked on top." },
  { id:12093, sourceGame: "nationalLedger", difficulty:"hard", conceptCluster:"gdp_components", primarySkill:"gdp_components_identity", secondarySkills:["imports_exports_nx", "inventory_investment"], repairSkill:"gdp_components_identity", commonError:"Mixing up the GDP expenditure components or forgetting the C + I + G + NX identity.", q:"A household buys a newly built house for $300,000, a used car for $15,000, and $5,000 of groceries. What amount is added to GDP from these purchases?", options:["$305,000","$320,000","$20,000","$300,000"], a:0, tag:"gdp_components", type:"calculation", objective:"LO24.3", feedback:"The new house and groceries count. The used car resale does not add to current GDP, so GDP rises by $305,000." },
  { id:12094, sourceGame: "nationalLedger", difficulty:"hard", conceptCluster:"gdp_components", primarySkill:"imports_exports_nx", secondarySkills:["gdp_components_identity"], repairSkill:"imports_exports_nx", commonError:"Adding imports instead of subtracting them through net exports.", q:"Suppose C = $14T, I = $4T, G = $5T, exports = $3T, and imports = $4.5T. What is GDP?", options:["$21.5T","$23T","$24.5T","$30.5T"], a:0, tag:"gdp_components", type:"calculation", objective:"LO24.3", feedback:"GDP = C + I + G + NX = 14 + 4 + 5 + (3 - 4.5) = 21.5." },
  { id:12095, sourceGame: "nationalLedger", difficulty:"hard", conceptCluster:"gdp_components", primarySkill:"gdp_components_identity", secondarySkills:["imports_exports_nx", "inventory_investment"], repairSkill:"gdp_components_identity", commonError:"Mixing up the GDP expenditure components or forgetting the C + I + G + NX identity.", q:"A government sends $1,000 unemployment checks to households, and households spend the full amount on groceries. What is the GDP effect?", options:["The transfer itself is not counted, but the grocery purchases count as consumption if they buy current final goods","Both the transfer and groceries count, so GDP rises by $2,000","Neither counts because government is involved","Only the transfer counts as government purchases"], a:0, tag:"gdp_components", type:"trap", objective:"LO24.3", feedback:"Transfer payments are not purchases of current goods and services, but later household spending can count as consumption." },
  { id:12096, sourceGame: "nationalLedger", difficulty:"hard", conceptCluster:"gdp_components", primarySkill:"gdp_components_identity", secondarySkills:["imports_exports_nx", "inventory_investment"], repairSkill:"gdp_components_identity", commonError:"Mixing up the GDP expenditure components or forgetting the C + I + G + NX identity.", q:"A U.S. household buys a $40,000 car produced in Germany. In U.S. GDP accounting, what happens?", options:["Consumption rises by $40,000 and net exports fall by $40,000, so U.S. GDP is unchanged","Consumption rises and GDP rises by $40,000","Investment rises and imports are ignored","Government purchases rise and GDP is unchanged"], a:0, tag:"gdp_components", type:"multi-step", objective:"LO24.3", feedback:"Imported consumer goods enter consumption but are subtracted through imports in net exports, so domestic GDP does not rise." },
  { id:12097, sourceGame: "nationalLedger", difficulty:"hard", conceptCluster:"gdp_components", primarySkill:"inventory_investment", secondarySkills:["gdp_components_identity"], repairSkill:"inventory_investment", commonError:"Excluding unsold current production instead of counting it as inventory investment.", q:"A U.S. firm builds $100 million of equipment domestically and sells $70 million of it this year, keeping $30 million in inventory. What is counted in GDP?", options:["$100 million because unsold output is inventory investment","$70 million because only sold goods count","$30 million because only inventory counts","$0 because business equipment is excluded"], a:0, tag:"gdp_components", type:"calculation", objective:"LO24.3", feedback:"Current production counts whether sold or added to inventories, so all $100 million counts." },
  { id:12098, sourceGame: "nationalLedger", difficulty:"hard", conceptCluster:"real_nominal_gdp", primarySkill:"gdp_deflator", secondarySkills:["nominal_vs_real_gdp"], repairSkill:"gdp_deflator", commonError:"Forgetting that the GDP deflator compares nominal GDP to real GDP.", q:"Nominal GDP rises from $20T to $22T while real GDP rises from $18T to $18.9T. What is the best interpretation?", options:["Both prices and real output likely rose","Only real output rose","Only prices rose","Neither prices nor output changed"], a:0, tag:"real_nominal_gdp", type:"interpretation", objective:"LO24.4", feedback:"Real GDP rose 5%, while nominal GDP rose 10%, so both output and prices likely increased." },
  { id:12099, sourceGame: "nationalLedger", difficulty:"hard", conceptCluster:"real_nominal_gdp", primarySkill:"gdp_deflator", secondarySkills:["nominal_vs_real_gdp"], repairSkill:"gdp_deflator", commonError:"Forgetting that the GDP deflator compares nominal GDP to real GDP.", q:"If nominal GDP is $30T and real GDP is $25T, what is the GDP deflator?", options:["120","83.3","55","125"], a:0, tag:"real_nominal_gdp", type:"calculation", objective:"LO24.4", feedback:"GDP deflator = nominal GDP / real GDP x 100 = 30/25 x 100 = 120." },
  { id:12100, sourceGame: "nationalLedger", difficulty:"hard", conceptCluster:"real_nominal_gdp", primarySkill:"nominal_vs_real_gdp", secondarySkills:["gdp_deflator"], repairSkill:"nominal_vs_real_gdp", commonError:"Confusing price changes with real output changes.", q:"An economy produces 100 units at $5 in year 1 and 110 units at $6 in year 2. Using year 1 as the base year, what is year 2 real GDP?", options:["$550","$600","$660","$500"], a:0, tag:"real_nominal_gdp", type:"calculation", objective:"LO24.4", feedback:"Real GDP uses base-year prices, so year 2 real GDP = 110 x $5 = $550." },
  { id:12101, sourceGame: "nationalLedger", difficulty:"hard", conceptCluster:"real_nominal_gdp", primarySkill:"nominal_vs_real_gdp", secondarySkills:["gdp_deflator"], repairSkill:"nominal_vs_real_gdp", commonError:"Confusing price changes with real output changes.", q:"An economy produces only apples. Quantity rises from 1,000 to 1,100 and price rises from $2 to $3. What happens to nominal and real GDP using the first year as base?", options:["Nominal GDP rises by more than real GDP","Real GDP rises by more than nominal GDP","Nominal GDP falls while real GDP rises","Both are unchanged"], a:0, tag:"real_nominal_gdp", type:"multi-step", objective:"LO24.4", feedback:"Nominal GDP reflects both higher quantity and higher price, while real GDP only reflects higher quantity." },
  { id:12102, sourceGame: "nationalLedger", difficulty:"hard", conceptCluster:"gdp_wellbeing", primarySkill:"gdp_wellbeing_limits", secondarySkills:["gdp_counting_rules"], repairSkill:"gdp_wellbeing_limits", commonError:"Assuming higher GDP automatically means higher overall well-being.", q:"A country cuts pollution regulations, output rises, but air quality worsens and illness increases. What does this show about GDP?", options:["GDP may rise even when broader well-being does not clearly improve","GDP must fall when pollution rises","GDP fully captures health and environmental costs","GDP excludes all production by regulated firms"], a:0, tag:"gdp_wellbeing", type:"interpretation", objective:"LO24.5", feedback:"GDP counts production but does not fully capture environmental damage or health costs." },
  { id:12103, sourceGame: "nationalLedger", difficulty:"hard", conceptCluster:"gdp_wellbeing", primarySkill:"gdp_wellbeing_limits", secondarySkills:["gdp_counting_rules"], repairSkill:"gdp_wellbeing_limits", commonError:"Assuming higher GDP automatically means higher overall well-being.", q:"Which scenario best shows why GDP per person is more useful than total GDP for comparing living standards?", options:["A country's GDP doubles while its population triples","A country's exports rise faster than imports","A country sells more used cars","A country changes its CPI base year"], a:0, tag:"gdp_wellbeing", type:"interpretation", objective:"LO24.5", feedback:"If population grows faster than GDP, average income may fall even though total GDP rises." },
  { id:12104, sourceGame: "nationalLedger", difficulty:"hard", conceptCluster:"gdp_wellbeing", primarySkill:"gdp_wellbeing_limits", secondarySkills:["gdp_counting_rules"], repairSkill:"gdp_wellbeing_limits", commonError:"Assuming higher GDP automatically means higher overall well-being.", q:"Two countries have equal GDP per person, but one has more leisure, cleaner air, and lower crime. What is the strongest conclusion?", options:["GDP per person misses some important parts of well-being","The cleaner country must have lower real GDP","GDP perfectly ranks living standards","Crime and leisure are already fully included in GDP"], a:0, tag:"gdp_wellbeing", type:"interpretation", objective:"LO24.5", feedback:"GDP per person is useful but incomplete because it misses non-market quality-of-life factors." },
  { id:12105, sourceGame: "nationalLedger", difficulty:"hard", conceptCluster:"prices_inflation", primarySkill:"cpi_calculation", secondarySkills:["inflation_rate"], repairSkill:"cpi_calculation", commonError:"Using the wrong basket cost or forgetting to multiply by 100.", q:"A CPI basket has 3 books and 2 meals. Base-year prices are $20 per book and $10 per meal. Current prices are $25 per book and $15 per meal. What is the current CPI?", options:["131.25","125","150","80"], a:0, tag:"cpi_inflation", type:"calculation", objective:"LO25.1", feedback:"Base cost = 3(20)+2(10)=80. Current cost = 3(25)+2(15)=105. CPI = 100 x 105/80 = 131.25." },
  { id:12106, sourceGame: "nationalLedger", difficulty:"hard", conceptCluster:"prices_inflation", primarySkill:"inflation_rate", secondarySkills:["cpi_calculation"], repairSkill:"inflation_rate", commonError:"Using the CPI point change instead of the percentage change.", q:"If the CPI rises from 125 to 155, what is the inflation rate?", options:["24%","30%","19.4%","55%"], a:0, tag:"cpi_inflation", type:"calculation", objective:"LO25.1", feedback:"Inflation = (155 - 125)/125 x 100 = 24%." },
  { id:12107, sourceGame: "nationalLedger", difficulty:"hard", conceptCluster:"prices_inflation", primarySkill:"inflation_rate", secondarySkills:["cpi_calculation"], repairSkill:"inflation_rate", commonError:"Using the CPI point change instead of the percentage change.", q:"A basket costs $900 in the base year, $1,080 last year, and $1,188 this year. What is this year's inflation rate?", options:["10%","18.8%","32%","8.8%"], a:0, tag:"cpi_inflation", type:"calculation", objective:"LO25.1", feedback:"Last year's CPI is 120 and this year's CPI is 132, so inflation is 10%." },
  { id:12108, sourceGame: "nationalLedger", difficulty:"hard", conceptCluster:"prices_inflation", primarySkill:"cpi_calculation", secondarySkills:["inflation_rate"], repairSkill:"cpi_calculation", commonError:"Using the wrong basket cost or forgetting to multiply by 100.", q:"If the CPI is 250 today and was 200 five years ago, what is the total inflation over the period?", options:["25%","50%","20%","250%"], a:0, tag:"cpi_inflation", type:"calculation", objective:"LO25.1", feedback:"Inflation = (250 - 200)/200 x 100 = 25%." },
  { id:12109, sourceGame: "nationalLedger", difficulty:"hard", conceptCluster:"prices_inflation", primarySkill:"substitution_bias", secondarySkills:["quality_new_goods_bias"], repairSkill:"substitution_bias", commonError:"Ignoring that consumers switch toward relatively cheaper goods.", q:"A fixed CPI basket shows inflation of 12%, but households avoided much of the increase by switching away from the goods with the largest price increases. What is the likely issue?", options:["The CPI may overstate the rise in the cost of living because of substitution bias","The CPI must understate inflation because substitution is illegal","The GDP deflator must be zero","The nominal interest rate must equal 12%"], a:0, tag:"cpi_bias", type:"interpretation", objective:"LO25.2", feedback:"Substitution bias means consumers can reduce the actual cost increase by switching purchases, but the fixed basket may miss that." },
  { id:12110, sourceGame: "nationalLedger", difficulty:"hard", conceptCluster:"prices_inflation", primarySkill:"quality_new_goods_bias", secondarySkills:["substitution_bias"], repairSkill:"quality_new_goods_bias", commonError:"Treating all price increases as inflation even when quality or product variety improves.", q:"A phone price rises 20%, but the new model has twice the storage, better battery life, and better cameras. Why might measured inflation be overstated?", options:["Some of the price increase reflects quality improvement rather than a higher cost for the same product","All quality improvements are counted as unemployment","The phone is an intermediate good","The CPI excludes consumer electronics entirely"], a:0, tag:"cpi_bias", type:"interpretation", objective:"LO25.2", feedback:"If quality improves, a price increase may exaggerate the true increase in the cost of living." },
  { id:12111, sourceGame: "nationalLedger", difficulty:"hard", conceptCluster:"prices_inflation", primarySkill:"quality_new_goods_bias", secondarySkills:["substitution_bias"], repairSkill:"quality_new_goods_bias", commonError:"Treating all price increases as inflation even when quality or product variety improves.", q:"Which CPI problem is most directly tied to the fact that consumers gain from products that did not exist in the base year?", options:["Introduction of new goods","Cyclical unemployment","Net export subtraction","Natural rate adjustment"], a:0, tag:"cpi_bias", type:"definition", objective:"LO25.2", feedback:"New goods can improve consumer welfare before the fixed CPI basket fully captures them." },
  { id:12112, sourceGame: "nationalLedger", difficulty:"hard", conceptCluster:"prices_inflation", primarySkill:"substitution_bias", secondarySkills:["quality_new_goods_bias"], repairSkill:"substitution_bias", commonError:"Ignoring that consumers switch toward relatively cheaper goods.", q:"Suppose beef rises from $10 to $20 and chicken rises from $10 to $12. The CPI basket assumes consumers still buy equal amounts of beef and chicken, but consumers buy much more chicken. What is the main measurement problem?", options:["The fixed basket misses substitution toward chicken","The CPI ignores all food prices","The GDP deflator cannot measure domestic goods","The real interest rate becomes negative"], a:0, tag:"cpi_bias", type:"multi-step", objective:"LO25.2", feedback:"Consumers switch toward relatively cheaper chicken, so the fixed basket can overstate inflation." },
  { id:12113, sourceGame: "nationalLedger", difficulty:"hard", conceptCluster:"prices_inflation", primarySkill:"quality_new_goods_bias", secondarySkills:["substitution_bias"], repairSkill:"quality_new_goods_bias", commonError:"Treating all price increases as inflation even when quality or product variety improves.", q:"Which statement gives the best overall critique of the CPI?", options:["It is useful for measuring consumer price changes, but it can mismeasure cost of living because of substitution, new goods, and quality changes","It is useless because no prices are included","It perfectly measures welfare","It measures only business investment prices"], a:0, tag:"cpi_bias", type:"interpretation", objective:"LO25.2", feedback:"The CPI is useful, but it is not a perfect cost-of-living measure." },
  { id:12114, sourceGame: "nationalLedger", difficulty:"hard", conceptCluster:"prices_inflation", primarySkill:"cpi_vs_gdp_deflator", secondarySkills:["cpi_calculation"], repairSkill:"cpi_vs_gdp_deflator", commonError:"Confusing a fixed consumer basket with current domestic production prices.", q:"Oil imported from abroad becomes more expensive and is heavily used by consumers. What happens to CPI and the GDP deflator, all else equal?", options:["CPI rises more directly because imports are in consumer purchases, while the GDP deflator excludes imported production","Both indexes ignore imported oil","The GDP deflator rises directly, but CPI cannot","Neither index can change"], a:0, tag:"cpi_vs_deflator", type:"interpretation", objective:"LO25.3", feedback:"Imported consumer goods affect the CPI but are not part of domestic production measured by the GDP deflator." },
  { id:12115, sourceGame: "nationalLedger", difficulty:"hard", conceptCluster:"prices_inflation", primarySkill:"cpi_vs_gdp_deflator", secondarySkills:["cpi_calculation"], repairSkill:"cpi_vs_gdp_deflator", commonError:"Confusing a fixed consumer basket with current domestic production prices.", q:"A domestically produced factory robot rises in price and is purchased by firms. Which index is more directly affected?", options:["GDP deflator","CPI","Unemployment rate","Labor force participation rate"], a:0, tag:"cpi_vs_deflator", type:"interpretation", objective:"LO25.3", feedback:"Domestically produced capital goods are included in GDP and affect the GDP deflator." },
  { id:12116, sourceGame: "nationalLedger", difficulty:"hard", conceptCluster:"prices_inflation", primarySkill:"cpi_vs_gdp_deflator", secondarySkills:["cpi_calculation"], repairSkill:"cpi_vs_gdp_deflator", commonError:"Confusing a fixed consumer basket with current domestic production prices.", q:"Why does the GDP deflator not rely on a fixed basket in the same way as the CPI?", options:["It reflects the prices of currently produced goods and services, so the basket changes as production changes","It measures only one product","It ignores prices","It only includes imported goods"], a:0, tag:"cpi_vs_deflator", type:"definition", objective:"LO25.3", feedback:"The GDP deflator changes with the composition of current domestic production." },
  { id:12117, sourceGame: "nationalLedger", difficulty:"hard", conceptCluster:"prices_inflation", primarySkill:"cpi_vs_gdp_deflator", secondarySkills:["cpi_calculation"], repairSkill:"cpi_vs_gdp_deflator", commonError:"Confusing a fixed consumer basket with current domestic production prices.", q:"If consumers buy more imported goods and fewer domestically produced goods, why might CPI and GDP deflator diverge?", options:["CPI includes imported consumer goods, while the GDP deflator focuses on domestic production","Both indexes are based only on labor force statistics","The GDP deflator includes imports twice","The CPI excludes all consumer purchases"], a:0, tag:"cpi_vs_deflator", type:"interpretation", objective:"LO25.3", feedback:"Different coverage of imports can cause CPI and GDP deflator movements to differ." },
  { id:12118, sourceGame: "nationalLedger", difficulty:"hard", conceptCluster:"prices_inflation", primarySkill:"inflation_adjustment", secondarySkills:["cpi_calculation"], repairSkill:"inflation_adjustment", commonError:"Comparing nominal dollar amounts across years without adjusting for the price level.", q:"A wage was $18,000 when the CPI was 90. The CPI is now 270. What is the wage in today's dollars?", options:["$54,000","$27,000","$6,000","$36,000"], a:0, tag:"inflation_adjustment", type:"calculation", objective:"LO25.4", feedback:"Today's dollars = 18000 x 270/90 = 54000." },
  { id:12119, sourceGame: "nationalLedger", difficulty:"hard", conceptCluster:"prices_inflation", primarySkill:"inflation_adjustment", secondarySkills:["cpi_calculation"], repairSkill:"inflation_adjustment", commonError:"Comparing nominal dollar amounts across years without adjusting for the price level.", q:"A tuition bill was $4,000 when the CPI was 125. In today's dollars, it equals $6,400. What is today's CPI?", options:["200","160","250","80"], a:0, tag:"inflation_adjustment", type:"calculation", objective:"LO25.4", feedback:"6400 = 4000 x today's CPI/125, so today's CPI = 200." },
  { id:12120, sourceGame: "nationalLedger", difficulty:"hard", conceptCluster:"prices_inflation", primarySkill:"inflation_adjustment", secondarySkills:["cpi_calculation"], repairSkill:"inflation_adjustment", commonError:"Comparing nominal dollar amounts across years without adjusting for the price level.", q:"A salary is $72,000 today when the CPI is 240. What was its equivalent value in year-T dollars when the CPI was 160?", options:["$48,000","$72,000","$108,000","$32,000"], a:0, tag:"inflation_adjustment", type:"calculation", objective:"LO25.4", feedback:"Year-T dollars = 72000 x 160/240 = 48000." },
  { id:12121, sourceGame: "nationalLedger", difficulty:"hard", conceptCluster:"prices_inflation", primarySkill:"real_interest_rate", secondarySkills:["inflation_rate"], repairSkill:"real_interest_rate", commonError:"Forgetting to subtract inflation from the nominal interest rate.", q:"If a lender charges 9% nominal interest and expected inflation is 4%, what real return does the lender expect?", options:["5%","13%","4%","-5%"], a:0, tag:"interest_inflation", type:"calculation", objective:"LO25.5", feedback:"Expected real interest rate = nominal rate - expected inflation = 9% - 4% = 5%." },
  { id:12122, sourceGame: "nationalLedger", difficulty:"hard", conceptCluster:"prices_inflation", primarySkill:"real_interest_rate", secondarySkills:["inflation_rate"], repairSkill:"real_interest_rate", commonError:"Forgetting to subtract inflation from the nominal interest rate.", q:"A borrower agrees to repay a loan at 6% nominal interest. Inflation unexpectedly rises from 2% to 8%. Who is helped, other things equal?", options:["The borrower, because the real repayment burden falls","The lender, because the real return rises","Neither side, because inflation does not affect real payments","Only the government, because GDP falls"], a:0, tag:"interest_inflation", type:"interpretation", objective:"LO25.5", feedback:"Unexpected inflation lowers the real value of fixed nominal repayments, helping borrowers." },
  { id:12123, sourceGame: "nationalLedger", difficulty:"hard", conceptCluster:"prices_inflation", primarySkill:"real_interest_rate", secondarySkills:["inflation_rate"], repairSkill:"real_interest_rate", commonError:"Forgetting to subtract inflation from the nominal interest rate.", q:"If nominal interest is 4% and inflation is 7%, what does the real interest rate imply?", options:["Purchasing power falls by about 3%","Purchasing power rises by about 11%","Purchasing power rises by 4%","Inflation is irrelevant"], a:0, tag:"interest_inflation", type:"interpretation", objective:"LO25.5", feedback:"Real interest = 4% - 7% = -3%, so purchasing power falls." },
  { id:12124, sourceGame: "nationalLedger", difficulty:"hard", conceptCluster:"prices_inflation", primarySkill:"real_interest_rate", secondarySkills:["inflation_rate"], repairSkill:"real_interest_rate", commonError:"Forgetting to subtract inflation from the nominal interest rate.", q:"Which statement best explains why inflation matters for interest rates?", options:["The nominal rate shows dollar growth, while the real rate shows purchasing-power growth","The real rate ignores inflation","The nominal rate is always lower than inflation","Inflation only affects unemployment, not borrowing"], a:0, tag:"interest_inflation", type:"interpretation", objective:"LO25.5", feedback:"The real rate adjusts nominal interest for inflation to show changes in purchasing power." },
  { id:12125, sourceGame: "nationalLedger", difficulty:"hard", conceptCluster:"growth_productivity", primarySkill:"rule_of_70", secondarySkills:["real_gdp_per_person"], repairSkill:"rule_of_70", commonError:"Forgetting that doubling time is approximately 70 divided by the growth rate.", q:"Country A grows at 2% and Country B grows at 5%. Using the Rule of 70, how much sooner does Country B double its income?", options:["About 21 years sooner","About 3 years sooner","About 35 years sooner","About 70 years sooner"], a:0, tag:"growth_differences", type:"calculation", objective:"LO26.1", feedback:"Country A doubles in about 35 years; Country B doubles in about 14 years, so B doubles about 21 years sooner." },
  { id:12126, sourceGame: "nationalLedger", difficulty:"hard", conceptCluster:"growth_productivity", primarySkill:"real_gdp_per_person", secondarySkills:["productivity_calculation"], repairSkill:"real_gdp_per_person", commonError:"Comparing total GDP instead of output per person.", q:"A country with lower current income grows rapidly for several decades and catches up to richer countries. Which concept best explains this possibility?", options:["Sustained growth and the catch-up effect","CPI substitution bias","Cyclical unemployment","Transfer payment accounting"], a:0, tag:"growth_differences", type:"interpretation", objective:"LO26.1", feedback:"Growth compounds over time, and poorer countries may grow faster when capital is scarce." },
  { id:12127, sourceGame: "nationalLedger", difficulty:"hard", conceptCluster:"growth_productivity", primarySkill:"real_gdp_per_person", secondarySkills:["productivity_calculation"], repairSkill:"real_gdp_per_person", commonError:"Comparing total GDP instead of output per person.", q:"If real GDP per person rises from $20,000 to $26,000, what is the percentage increase?", options:["30%","23.1%","6%","130%"], a:0, tag:"growth_differences", type:"calculation", objective:"LO26.1", feedback:"Growth = (26000 - 20000)/20000 x 100 = 30%." },
  { id:12128, sourceGame: "nationalLedger", difficulty:"hard", conceptCluster:"growth_productivity", primarySkill:"real_gdp_per_person", secondarySkills:["productivity_calculation"], repairSkill:"real_gdp_per_person", commonError:"Comparing total GDP instead of output per person.", q:"Which country likely has the higher living standard, holding other quality-of-life factors aside?", options:["Country A with real GDP of $1T and population of 10M","Country B with real GDP of $2T and population of 80M","Country C with nominal GDP of $3T but unknown prices","Country D with higher inflation"], a:0, tag:"growth_differences", type:"multi-step", objective:"LO26.1", feedback:"Country A has real GDP per person of $100,000; Country B has $25,000." },
  { id:12129, sourceGame: "nationalLedger", difficulty:"hard", conceptCluster:"growth_productivity", primarySkill:"real_gdp_per_person", secondarySkills:["productivity_calculation"], repairSkill:"real_gdp_per_person", commonError:"Comparing total GDP instead of output per person.", q:"Why can rankings of countries by income change dramatically over time?", options:["Different growth rates compound over many years","Nominal GDP is always constant","Population never changes","The Rule of 70 prevents poor countries from growing"], a:0, tag:"growth_differences", type:"interpretation", objective:"LO26.1", feedback:"Long-run differences in growth rates can greatly change relative income levels." },
  { id:12130, sourceGame: "nationalLedger", difficulty:"hard", conceptCluster:"growth_productivity", primarySkill:"productivity_calculation", secondarySkills:["real_gdp_per_person"], repairSkill:"productivity_calculation", commonError:"Confusing total output with output per unit of labor.", q:"A factory produces $900,000 of output using 30 workers. What is output per worker?", options:["$30,000","$300,000","$900,000","$27,000,000"], a:0, tag:"productivity", type:"calculation", objective:"LO26.2", feedback:"Productivity = output/workers = 900000/30 = 30000 per worker." },
  { id:12131, sourceGame: "nationalLedger", difficulty:"hard", conceptCluster:"growth_productivity", primarySkill:"productivity_calculation", secondarySkills:["real_gdp_per_person"], repairSkill:"productivity_calculation", commonError:"Confusing total output with output per unit of labor.", q:"Output rises from 10,000 units to 12,000 units while labor rises from 100 workers to 150 workers. What happens to productivity?", options:["It falls from 100 units per worker to 80 units per worker","It rises from 100 units per worker to 120 units per worker","It stays at 100 units per worker","It cannot be calculated"], a:0, tag:"productivity", type:"multi-step", objective:"LO26.2", feedback:"Initial productivity is 100; new productivity is 12000/150 = 80, so productivity falls." },
  { id:12132, sourceGame: "nationalLedger", difficulty:"hard", conceptCluster:"growth_productivity", primarySkill:"productivity_calculation", secondarySkills:["real_gdp_per_person"], repairSkill:"productivity_calculation", commonError:"Confusing total output with output per unit of labor.", q:"A country raises total output by adding more workers, but output per worker does not rise. What is the best conclusion?", options:["Total GDP may rise, but productivity and average living standards may not improve much","Real GDP per person must double","Productivity must rise because output rose","Inflation must fall"], a:0, tag:"productivity", type:"interpretation", objective:"LO26.2", feedback:"More workers can raise total output without raising output per worker." },
  { id:12133, sourceGame: "nationalLedger", difficulty:"hard", conceptCluster:"growth_productivity", primarySkill:"productivity_calculation", secondarySkills:["real_gdp_per_person"], repairSkill:"productivity_calculation", commonError:"Confusing total output with output per unit of labor.", q:"Workers produce 500 units in 1,000 hours before training and 650 units in 1,000 hours after training. What happened?", options:["Productivity rose from 0.5 to 0.65 units per hour","Productivity fell from 2 to 1.54 units per hour","Productivity stayed constant","Output rose but productivity cannot change"], a:0, tag:"productivity", type:"calculation", objective:"LO26.2", feedback:"Productivity is output per hour: 500/1000 = 0.5 and 650/1000 = 0.65." },
  { id:12134, sourceGame: "nationalLedger", difficulty:"hard", conceptCluster:"growth_productivity", primarySkill:"physical_capital", secondarySkills:["productivity_calculation"], repairSkill:"physical_capital", commonError:"Confusing tools and equipment with worker skills.", q:"A country buys more machines, improves schools, and adopts better production software. Which productivity factors are increasing?", options:["Physical capital, human capital, and technological knowledge","Only natural resources","Only inflation adjustment","Only cyclical employment"], a:0, tag:"productivity_factors", type:"multi-step", objective:"LO26.3", feedback:"Machines raise physical capital, schools raise human capital, and software/process improvements reflect technological knowledge." },
  { id:12135, sourceGame: "nationalLedger", difficulty:"hard", conceptCluster:"growth_productivity", primarySkill:"physical_capital", secondarySkills:["productivity_calculation"], repairSkill:"physical_capital", commonError:"Confusing tools and equipment with worker skills.", q:"Two countries have similar workers and technology, but one has far more equipment per worker. Which difference most directly explains higher productivity?", options:["More physical capital per worker","More discouraged workers","Higher CPI bias","Lower nominal interest"], a:0, tag:"productivity_factors", type:"interpretation", objective:"LO26.3", feedback:"More equipment per worker generally raises output per worker." },
  { id:12136, sourceGame: "nationalLedger", difficulty:"hard", conceptCluster:"growth_productivity", primarySkill:"physical_capital", secondarySkills:["productivity_calculation"], repairSkill:"physical_capital", commonError:"Confusing tools and equipment with worker skills.", q:"A country with strong education but weak roads, ports, and electricity may still struggle with productivity because it lacks:", options:["Physical capital and infrastructure","Human capital","CPI measurement","Frictional unemployment"], a:0, tag:"productivity_factors", type:"interpretation", objective:"LO26.3", feedback:"Infrastructure is part of the physical capital that helps workers produce efficiently." },
  { id:12137, sourceGame: "nationalLedger", difficulty:"hard", conceptCluster:"growth_productivity", primarySkill:"natural_resources", secondarySkills:["productivity_calculation"], repairSkill:"natural_resources", commonError:"Assuming natural resources alone guarantee high productivity.", q:"A new farming method raises output per acre without increasing land, labor, or machinery. Which factor is most directly responsible?", options:["Technological knowledge","Natural resources","Labor force participation","Inflation"], a:0, tag:"productivity_factors", type:"interpretation", objective:"LO26.3", feedback:"A better method of production is technological knowledge." },
  { id:12138, sourceGame: "nationalLedger", difficulty:"hard", conceptCluster:"growth_productivity", primarySkill:"human_capital", secondarySkills:["productivity_calculation"], repairSkill:"human_capital", commonError:"Confusing worker training and skills with physical equipment.", q:"Which example best illustrates human capital rather than technological knowledge?", options:["Workers complete advanced training in machine repair","A firm invents a new production algorithm","A country discovers oil","A government measures inflation"], a:0, tag:"productivity_factors", type:"trap", objective:"LO26.3", feedback:"Training workers increases human capital; an invention or method itself is technological knowledge." },
  { id:12139, sourceGame: "nationalLedger", difficulty:"hard", conceptCluster:"growth_productivity", primarySkill:"human_capital", secondarySkills:["productivity_calculation"], repairSkill:"human_capital", commonError:"Confusing worker training and skills with physical equipment.", q:"Why does capital deepening eventually face limits if technology and human capital do not improve?", options:["Diminishing returns mean each extra machine adds less output when workers already have many machines","Capital is never useful","Natural resources become irrelevant","Output per worker must become zero"], a:0, tag:"diminishing_returns", type:"interpretation", objective:"LO26.3", feedback:"Diminishing returns limit the gains from adding more capital alone." },
  { id:12140, sourceGame: "nationalLedger", difficulty:"hard", conceptCluster:"growth_productivity", primarySkill:"physical_capital", secondarySkills:["productivity_calculation"], repairSkill:"physical_capital", commonError:"Confusing tools and equipment with worker skills.", q:"A poor country has little capital per worker. A new investment project adds basic equipment to farms and factories. Why might returns be high?", options:["Because capital is scarce, the marginal product of additional capital can be large","Because diminishing returns never exist in poor countries","Because inflation makes machines cheaper in real terms","Because GDP excludes capital"], a:0, tag:"catch_up_growth", type:"interpretation", objective:"LO26.3", feedback:"The catch-up effect comes from high returns to capital where capital is scarce." },
  { id:12141, sourceGame: "nationalLedger", difficulty:"hard", conceptCluster:"growth_productivity", primarySkill:"growth_policy", secondarySkills:["productivity_calculation"], repairSkill:"growth_policy", commonError:"Focusing on short-run spending instead of policies that raise long-run productivity.", q:"Which policy mix is most likely to support sustained productivity growth rather than only a temporary boost?", options:["Education, investment, property rights, trade openness, and research support","One-time stimulus checks only","Price ceilings on all capital goods","Discouraging foreign investment and innovation"], a:0, tag:"growth_policy", type:"interpretation", objective:"LO26.4", feedback:"Sustained growth comes from policies that improve capital, skills, innovation, and institutions." },
  { id:12142, sourceGame: "nationalLedger", difficulty:"hard", conceptCluster:"growth_productivity", primarySkill:"growth_policy", secondarySkills:["productivity_calculation"], repairSkill:"growth_policy", commonError:"Focusing on short-run spending instead of policies that raise long-run productivity.", q:"Why might political instability reduce long-run growth?", options:["It discourages investment because firms and households fear future losses or rule changes","It automatically increases human capital","It guarantees higher saving","It makes diminishing returns disappear"], a:0, tag:"growth_policy", type:"interpretation", objective:"LO26.4", feedback:"Investment is less likely when property rights and future rules are uncertain." },
  { id:12143, sourceGame: "nationalLedger", difficulty:"hard", conceptCluster:"growth_productivity", primarySkill:"growth_policy", secondarySkills:["productivity_calculation"], repairSkill:"growth_policy", commonError:"Focusing on short-run spending instead of policies that raise long-run productivity.", q:"A government restricts foreign direct investment to protect domestic firms. What is a possible long-run cost?", options:["Less access to capital, technology, and productivity improvements","Guaranteed faster catch-up growth","No effect on capital accumulation","Automatic increase in human capital"], a:0, tag:"growth_policy", type:"interpretation", objective:"LO26.4", feedback:"Foreign investment can bring capital and technology, so restricting it may slow productivity growth." },
  { id:12144, sourceGame: "nationalLedger", difficulty:"hard", conceptCluster:"growth_productivity", primarySkill:"growth_policy", secondarySkills:["productivity_calculation"], repairSkill:"growth_policy", commonError:"Focusing on short-run spending instead of policies that raise long-run productivity.", q:"Why can research and development policies raise living standards even if they do not immediately raise output?", options:["They can increase technological knowledge, which raises future productivity","They directly count as discouraged workers","They lower GDP by definition","They only change the CPI basket"], a:0, tag:"growth_policy", type:"interpretation", objective:"LO26.4", feedback:"R&D can improve production methods and technologies that raise future output per worker." },
  { id:12145, sourceGame: "nationalLedger", difficulty:"hard", conceptCluster:"labor_market", primarySkill:"labor_force_participation", secondarySkills:["labor_force_calculation"], repairSkill:"labor_force_participation", commonError:"Using unemployed workers instead of the labor force in the participation formula.", q:"An economy has 180 million employed, 12 million unemployed, and 68 million not in the labor force. What are the unemployment rate and labor force participation rate?", options:["6.25% unemployment and 73.85% participation","6.67% unemployment and 69.23% participation","4.62% unemployment and 73.85% participation","6.25% unemployment and 69.23% participation"], a:0, tag:"labor_force_stats", type:"multi-step", objective:"LO29.1", feedback:"Labor force = 192M; unemployment = 12/192 = 6.25%; adult population = 260M; participation = 192/260 = 73.85%." },
  { id:12146, sourceGame: "nationalLedger", difficulty:"hard", conceptCluster:"labor_market", primarySkill:"unemployment_rate", secondarySkills:["labor_force_calculation", "labor_force_participation"], repairSkill:"unemployment_rate", commonError:"Dividing unemployed workers by the whole population instead of the labor force.", q:"An economy has 95 employed, 5 unemployed, and 50 not in the labor force. Ten people who were not in the labor force begin looking for work but do not find jobs. What is the new unemployment rate?", options:["13.6%","5%","10%","15%"], a:0, tag:"labor_force_stats", type:"multi-step", objective:"LO29.1", feedback:"Unemployed rises to 15 and labor force rises to 110, so unemployment = 15/110 = 13.6%." },
  { id:12147, sourceGame: "nationalLedger", difficulty:"hard", conceptCluster:"labor_market", primarySkill:"unemployment_rate", secondarySkills:["labor_force_calculation", "labor_force_participation"], repairSkill:"unemployment_rate", commonError:"Dividing unemployed workers by the whole population instead of the labor force.", q:"An economy has 100 employed and 20 unemployed. Five unemployed workers find jobs, while five others stop looking. What happens to the unemployment rate?", options:["It falls because unemployment decreases and the labor force shrinks","It rises because employment rises","It stays unchanged because ten workers changed status","It becomes zero"], a:0, tag:"labor_force_stats", type:"multi-step", objective:"LO29.1", feedback:"Unemployed falls to 10 and labor force falls to 115, so the unemployment rate falls from 16.7% to about 8.7%." },
  { id:12148, sourceGame: "nationalLedger", difficulty:"hard", conceptCluster:"labor_market", primarySkill:"unemployment_rate", secondarySkills:["labor_force_calculation", "labor_force_participation"], repairSkill:"unemployment_rate", commonError:"Dividing unemployed workers by the whole population instead of the labor force.", q:"If the unemployment rate falls because many jobless workers stop searching, what is the best interpretation?", options:["The labor market may not have improved even though measured unemployment fell","Employment must have increased strongly","Structural unemployment disappeared","GDP must have increased"], a:0, tag:"labor_force_stats", type:"interpretation", objective:"LO29.1", feedback:"A falling unemployment rate can be misleading if discouraged workers leave the labor force." },
  { id:12149, sourceGame: "nationalLedger", difficulty:"hard", conceptCluster:"labor_market", primarySkill:"labor_force_participation", secondarySkills:["labor_force_calculation"], repairSkill:"labor_force_participation", commonError:"Using unemployed workers instead of the labor force in the participation formula.", q:"Adult population is 250 million, labor force participation is 64%, and unemployment is 8 million. How many people are employed?", options:["152 million","160 million","242 million","168 million"], a:0, tag:"labor_force_stats", type:"calculation", objective:"LO29.1", feedback:"Labor force = 0.64 x 250 = 160 million. Employed = 160 - 8 = 152 million." },
  { id:12150, sourceGame: "nationalLedger", difficulty:"hard", conceptCluster:"labor_market", primarySkill:"employment_classification", secondarySkills:["discouraged_workers"], repairSkill:"employment_classification", commonError:"Classifying people by desire for work instead of paid work and active search status.", q:"A person has no job, wants work, is available, but has not searched in six weeks because they think no jobs exist. How is this person classified and why does it matter?", options:["Not in the labor force; this can make unemployment look lower than labor market weakness suggests","Unemployed; all jobless people are counted","Employed; wanting work is enough","Structurally employed; skills do not matter"], a:0, tag:"employment_categories", type:"interpretation", objective:"LO29.2", feedback:"Without active search, discouraged workers are not counted as unemployed, which can understate weakness." },
  { id:12151, sourceGame: "nationalLedger", difficulty:"hard", conceptCluster:"labor_market", primarySkill:"employment_classification", secondarySkills:["discouraged_workers"], repairSkill:"employment_classification", commonError:"Classifying people by desire for work instead of paid work and active search status.", q:"A worker has a part-time job but wants full-time work. How is the worker officially classified?", options:["Employed, even though the situation may show underemployment","Unemployed because the worker wants more hours","Not in the labor force because the job is part time","Discouraged because the worker is dissatisfied"], a:0, tag:"employment_categories", type:"trap", objective:"LO29.2", feedback:"Part-time workers are counted as employed, even when they would prefer full-time work." },
  { id:12152, sourceGame: "nationalLedger", difficulty:"hard", conceptCluster:"labor_market", primarySkill:"employment_classification", secondarySkills:["discouraged_workers"], repairSkill:"employment_classification", commonError:"Classifying people by desire for work instead of paid work and active search status.", q:"Which case creates the biggest problem for interpreting the official unemployment rate?", options:["A large increase in discouraged workers","A worker voluntarily switches jobs and searches for one week","A student works part time by choice","A retiree remains retired"], a:0, tag:"employment_categories", type:"interpretation", objective:"LO29.2", feedback:"Discouraged workers are excluded from measured unemployment, hiding some labor market distress." },
  { id:12153, sourceGame: "nationalLedger", difficulty:"hard", conceptCluster:"labor_market", primarySkill:"discouraged_workers", secondarySkills:["employment_classification"], repairSkill:"discouraged_workers", commonError:"Counting discouraged workers as unemployed even after they stop actively searching.", q:"A laid-off engineer searches actively for work in the same field. A retired teacher does not want work. A discouraged factory worker wants work but stopped searching. Who is counted as unemployed?", options:["Only the laid-off engineer","The engineer and retired teacher","The engineer and discouraged factory worker","All three"], a:0, tag:"employment_categories", type:"multi-step", objective:"LO29.2", feedback:"Only jobless people actively searching are counted as unemployed." },
  { id:12154, sourceGame: "nationalLedger", difficulty:"hard", conceptCluster:"labor_market", primarySkill:"employment_classification", secondarySkills:["discouraged_workers"], repairSkill:"employment_classification", commonError:"Classifying people by desire for work instead of paid work and active search status.", q:"Why does the official unemployment rate miss some labor market pain?", options:["It excludes discouraged workers and does not distinguish full-time from involuntary part-time work","It counts all adults as unemployed","It includes no employed workers","It measures only inflation"], a:0, tag:"employment_categories", type:"interpretation", objective:"LO29.2", feedback:"The unemployment rate is useful but misses discouraged workers and underemployment." },
  { id:12155, sourceGame: "nationalLedger", difficulty:"hard", conceptCluster:"labor_market", primarySkill:"cyclical_unemployment", secondarySkills:["natural_rate"], repairSkill:"cyclical_unemployment", commonError:"Confusing recession-driven unemployment with natural unemployment.", q:"A recession causes restaurants to lay off workers. At the same time, some workers quit jobs to search for better matches. Which types of unemployment are present?", options:["Cyclical and frictional","Only structural","Only frictional","Only natural unemployment from unions"], a:0, tag:"unemployment_types", type:"multi-step", objective:"LO29.3", feedback:"Recession layoffs are cyclical; voluntary job search is frictional." },
  { id:12156, sourceGame: "nationalLedger", difficulty:"hard", conceptCluster:"labor_market", primarySkill:"structural_unemployment", secondarySkills:["natural_rate"], repairSkill:"structural_unemployment", commonError:"Confusing permanent mismatch with short-run job search or weak demand.", q:"A city loses manufacturing jobs permanently, but health care jobs expand and require different credentials. Which unemployment type dominates?", options:["Structural unemployment","Frictional unemployment","Cyclical unemployment","Seasonal unemployment only"], a:0, tag:"unemployment_types", type:"interpretation", objective:"LO29.3", feedback:"A mismatch between worker skills and available jobs is structural unemployment." },
  { id:12157, sourceGame: "nationalLedger", difficulty:"hard", conceptCluster:"labor_market", primarySkill:"frictional_unemployment", secondarySkills:["natural_rate"], repairSkill:"frictional_unemployment", commonError:"Confusing normal job search with skill mismatch or recession layoffs.", q:"Which example is most clearly frictional rather than structural unemployment?", options:["A worker leaves one accounting job and searches for another accounting job in the same city","A miner cannot find work after mines permanently close","A worker is laid off because recession reduces demand","A cashier loses work because all stores automate checkout permanently"], a:0, tag:"unemployment_types", type:"trap", objective:"LO29.3", feedback:"Short-term search between similar jobs is frictional unemployment." },
  { id:12158, sourceGame: "nationalLedger", difficulty:"hard", conceptCluster:"labor_market", primarySkill:"cyclical_unemployment", secondarySkills:["natural_rate"], repairSkill:"cyclical_unemployment", commonError:"Confusing recession-driven unemployment with natural unemployment.", q:"Cyclical unemployment differs from the natural rate because cyclical unemployment:", options:["Rises during downturns when aggregate demand is weak","Exists only because workers search for better jobs","Is caused by long-run skill mismatch only","Is always zero when inflation rises"], a:0, tag:"unemployment_types", type:"definition", objective:"LO29.3", feedback:"Cyclical unemployment is tied to business-cycle downturns." },
  { id:12159, sourceGame: "nationalLedger", difficulty:"hard", conceptCluster:"labor_market", primarySkill:"structural_unemployment", secondarySkills:["natural_rate"], repairSkill:"structural_unemployment", commonError:"Confusing permanent mismatch with short-run job search or weak demand.", q:"A software worker is unemployed for three weeks while comparing offers. A former textile worker is unemployed for two years because local factories closed. What is the best classification?", options:["The software worker is frictionally unemployed; the textile worker is structurally unemployed","Both are cyclically unemployed","Both are frictionally unemployed","The software worker is not in the labor force"], a:0, tag:"unemployment_types", type:"multi-step", objective:"LO29.3", feedback:"Short job search is frictional; long-term mismatch after industry decline is structural." },
  { id:12160, sourceGame: "nationalLedger", difficulty:"hard", conceptCluster:"labor_market", primarySkill:"minimum_wage_surplus", secondarySkills:["unions_efficiency_wages"], repairSkill:"minimum_wage_surplus", commonError:"Forgetting that a binding wage floor creates a surplus when labor supplied exceeds labor demanded.", q:"A binding minimum wage raises hourly pay for workers who keep jobs but reduces low-skill employment. What is the strongest economic interpretation?", options:["The policy creates a tradeoff between higher wages for some and reduced employment opportunities for others","The policy must help every worker equally","The policy eliminates structural unemployment","The policy has no effect if firms dislike it"], a:0, tag:"labor_market_policy", type:"interpretation", objective:"LO29.4", feedback:"A binding wage floor can raise wages for some workers while creating a labor surplus." },
  { id:12161, sourceGame: "nationalLedger", difficulty:"hard", conceptCluster:"labor_market", primarySkill:"frictional_unemployment", secondarySkills:["natural_rate"], repairSkill:"frictional_unemployment", commonError:"Confusing normal job search with skill mismatch or recession layoffs.", q:"Unemployment insurance increases from 12 weeks to 40 weeks. What is the likely tradeoff?", options:["Better income protection but potentially longer job search and higher frictional unemployment","Lower income protection and shorter unemployment spells only","Immediate elimination of structural unemployment","A guaranteed fall in labor force participation to zero"], a:0, tag:"labor_market_policy", type:"interpretation", objective:"LO29.4", feedback:"Unemployment insurance helps workers smooth income but can reduce urgency to accept work quickly." },
  { id:12162, sourceGame: "nationalLedger", difficulty:"hard", conceptCluster:"labor_market", primarySkill:"unions_efficiency_wages", secondarySkills:["minimum_wage_surplus"], repairSkill:"unions_efficiency_wages", commonError:"Missing how above-equilibrium wages can create unemployment even when they have benefits.", q:"A union contract raises wages above the competitive equilibrium. Which workers are most likely hurt?", options:["Workers who would have been hired at the lower equilibrium wage but are not hired at the union wage","All union workers who keep their jobs","Only retired workers","Only consumers of imported goods"], a:0, tag:"labor_market_policy", type:"interpretation", objective:"LO29.4", feedback:"Above-equilibrium wages can reduce labor demanded, hurting workers who cannot get hired." },
  { id:12163, sourceGame: "nationalLedger", difficulty:"hard", conceptCluster:"labor_market", primarySkill:"unions_efficiency_wages", secondarySkills:["minimum_wage_surplus"], repairSkill:"unions_efficiency_wages", commonError:"Missing how above-equilibrium wages can create unemployment even when they have benefits.", q:"Why might a firm voluntarily pay an efficiency wage above equilibrium?", options:["To reduce turnover, attract better applicants, and encourage effort","To create CPI substitution bias","To guarantee all unemployed workers get jobs","To make nominal GDP equal real GDP"], a:0, tag:"labor_market_policy", type:"definition", objective:"LO29.4", feedback:"Efficiency wages can be profitable if they improve worker quality, effort, morale, or retention." },
  { id:12164, sourceGame: "nationalLedger", difficulty:"hard", conceptCluster:"labor_market", primarySkill:"natural_rate", secondarySkills:["frictional_unemployment", "structural_unemployment"], repairSkill:"natural_rate", commonError:"Assuming healthy economies should have zero unemployment.", q:"In a healthy economy, unemployment is still 4.5%. Which explanation best fits the natural rate?", options:["Workers are still searching for jobs and some skills still do not match available positions","All unemployment must be cyclical","The economy must be in recession","The unemployment data must be impossible"], a:0, tag:"natural_unemployment", type:"interpretation", objective:"LO29.5", feedback:"The natural rate remains positive because frictional and structural unemployment persist even in normal times." }
],

elite: [
  { id: 13000, sourceGame: "marketGate", q: "A city caps rent below equilibrium to help renters. In the short run, some renters pay less, but many cannot find apartments and landlords reduce maintenance. Which answer best explains the full economic result?", options: ["The legal price falls, but shortage, rationing, and quality decline create hidden costs", "The policy eliminates scarcity because rent is lower", "The policy creates a surplus because quantity supplied rises", "The market reaches equilibrium because demand and supply adjust immediately"], a: 0, tag: "price_ceiling", type: "integration", objective: "LO6.1", difficulty: "elite", conceptCluster: "government_policy", primarySkill: "ceiling_unintended_consequences", secondarySkills: ["shortage_identification", "nonmoney_rationing_costs"], repairSkill: "binding_price_ceiling", commonError: "focuses_only_on_lower_legal_price", feedback: "A binding rent ceiling lowers the legal price but creates a shortage, rationing, search costs, and weaker maintenance incentives." },
  { id: 13001, sourceGame: "marketGate", q: "A minimum wage is set above equilibrium. Some workers earn more, firms demand fewer workers, and more workers want jobs. What is the best synthesis?", options: ["The wage floor benefits some employed workers but creates a labor surplus for others", "The wage floor increases both labor demanded and labor supplied", "The wage floor is nonbinding because workers prefer higher wages", "The wage floor eliminates the opportunity cost of working"], a: 0, tag: "price_floor", type: "integration", objective: "LO6.2", difficulty: "elite", conceptCluster: "government_policy", primarySkill: "minimum_wage_surplus", secondarySkills: ["binding_price_floor", "incentives_behavior"], repairSkill: "binding_price_floor", commonError: "counts_only_workers_who_keep_jobs", feedback: "A binding minimum wage raises wages for some workers but creates a surplus of labor because labor supplied exceeds labor demanded." },
  { id: 13002, sourceGame: "marketGate", q: "A tax on gasoline raises the price paid by drivers, lowers the price received by sellers, and reduces gallons sold. Which concept chain is correct?", options: ["Tax wedge → shared burden → lower quantity traded", "Price ceiling → shortage → higher quantity traded", "Demand increase → higher price → higher quantity", "PPF shift → economic growth → lower price"], a: 0, tag: "taxes", type: "integration", objective: "LO6.3", difficulty: "elite", conceptCluster: "government_policy", primarySkill: "tax_wedge_and_quantity_effect", secondarySkills: ["tax_incidence_definition", "tax_quantity_effect"], repairSkill: "tax_wedge_incidence", commonError: "sees_tax_as_only_a_price_increase", feedback: "A tax creates a wedge between buyer and seller prices, splits the burden, and reduces the quantity traded." },
  { id: 13003, sourceGame: "marketGate", q: "A policy analyst says a tax legally placed on sellers will be paid entirely by sellers. What is wrong with this claim?", options: ["Legal assignment does not determine economic incidence", "Sellers always pass the entire tax to buyers", "Buyers always avoid taxes completely", "A seller tax is the same as a price floor"], a: 0, tag: "tax_incidence", type: "trap", objective: "LO6.4", difficulty: "elite", conceptCluster: "government_policy", primarySkill: "legal_vs_economic_tax_incidence", secondarySkills: ["buyer_seller_tax_equivalence"], repairSkill: "tax_equivalence", commonError: "thinks_legal_assignment_determines_full_burden", feedback: "Economic tax burden depends on market responses and elasticities, not only on who legally sends payment." },
  { id: 13004, sourceGame: "marketGate", q: "A $12 tax causes buyers to pay $7 more and sellers to receive $5 less. Demand is likely less elastic than supply because:", options: ["Buyers bear more of the tax burden", "Sellers bear more of the tax burden", "The legal tax must have been placed on buyers", "The tax increased quantity sold"], a: 0, tag: "tax_incidence", type: "multi-step", objective: "LO6.5", difficulty: "elite", conceptCluster: "government_policy", primarySkill: "infer_elasticity_from_tax_burden", secondarySkills: ["tax_burden_less_elastic_side", "tax_burden_calculation"], repairSkill: "tax_incidence_less_elastic_side", commonError: "thinks_larger_burden_means_more_elastic_side", feedback: "The less elastic side bears more of the tax burden. Buyers bear $7, so demand is likely less elastic." },
  { id: 13005, sourceGame: "marketGate", q: "A drought reduces supply of wheat while a health trend increases demand for wheat bread. What can be predicted with certainty in the wheat market?", options: ["Price rises, but quantity is ambiguous", "Quantity rises, but price is ambiguous", "Both price and quantity must rise", "Both price and quantity must fall"], a: 0, tag: "equilibrium", type: "trap", objective: "LO4.4", difficulty: "elite", conceptCluster: "supply_demand", primarySkill: "double_shift_ambiguous_quantity", secondarySkills: ["demand_increase_market_effect", "supply_decrease_market_effect"], repairSkill: "equilibrium_prediction", commonError: "assumes_demand_effect_dominates_supply_effect", feedback: "Demand increases and supply decreases both push price up, but quantity depends on which shift is larger." },
  { id: 13006, sourceGame: "marketGate", q: "Consumer interest in a product falls while new technology lowers production costs. What can be predicted with certainty?", options: ["Price falls, but quantity is ambiguous", "Quantity rises, but price is ambiguous", "Both price and quantity rise", "Both price and quantity fall"], a: 0, tag: "equilibrium", type: "trap", objective: "LO4.4", difficulty: "elite", conceptCluster: "supply_demand", primarySkill: "double_shift_ambiguous_quantity", secondarySkills: ["demand_decrease_market_effect", "supply_increase_market_effect"], repairSkill: "equilibrium_prediction", commonError: "assumes_supply_effect_dominates_demand_effect", feedback: "A demand decrease and supply increase both lower price, but quantity is ambiguous." },
  { id: 13007, sourceGame: "marketGate", q: "A celebrity endorsement increases demand for a product at the same time input costs rise. What can be predicted with certainty?", options: ["Equilibrium price rises", "Equilibrium quantity rises", "Equilibrium quantity falls", "Equilibrium price falls"], a: 0, tag: "equilibrium", type: "trap", objective: "LO4.4", difficulty: "elite", conceptCluster: "supply_demand", primarySkill: "demand_increase_supply_decrease", secondarySkills: ["double_shift_ambiguous_quantity"], repairSkill: "equilibrium_prediction", commonError: "claims_quantity_change_is_certain", feedback: "Demand rises and supply falls. Both raise price, but quantity is ambiguous." },
  { id: 13008, sourceGame: "marketGate", q: "A city creates a low legal parking fee below equilibrium. Drivers spend extra time circling for spaces, miss class, and compete for limited spots. What is the best economic interpretation?", options: ["The ceiling lowers the money price but raises nonmoney costs through shortage and rationing", "The ceiling creates a surplus of parking spaces", "The ceiling is nonbinding because drivers still pay with time", "The ceiling shifts demand left"], a: 0, tag: "price_ceiling", type: "application", objective: "LO6.1", difficulty: "elite", conceptCluster: "government_policy", primarySkill: "nonmoney_rationing_costs", secondarySkills: ["ceiling_shortage_effect"], repairSkill: "binding_price_ceiling", commonError: "ignores_time_cost_as_part_of_full_price", feedback: "A binding price ceiling can lower the posted price while raising search and waiting costs." },
  { id: 13009, sourceGame: "marketGate", q: "A government wants to make a good affordable, so it imposes a price ceiling. Which condition must hold for the policy to actually affect the market?", options: ["The ceiling must be below equilibrium price", "The ceiling must be above equilibrium price", "The ceiling must equal quantity demanded", "The ceiling must be imposed on sellers only"], a: 0, tag: "price_ceiling", type: "trap", objective: "LO6.1", difficulty: "elite", conceptCluster: "government_policy", primarySkill: "binding_price_ceiling", secondarySkills: ["nonbinding_price_ceiling"], repairSkill: "binding_price_ceiling", commonError: "thinks_all_price_ceilings_affect_markets", feedback: "A price ceiling only binds if it is below the equilibrium price." },
  { id: 13010, sourceGame: "marketGate", q: "A government wants to raise producer income, so it imposes a price floor. Which condition must hold for the policy to actually affect the market?", options: ["The floor must be above equilibrium price", "The floor must be below equilibrium price", "The floor must equal zero", "The floor must reduce supply"], a: 0, tag: "price_floor", type: "trap", objective: "LO6.2", difficulty: "elite", conceptCluster: "government_policy", primarySkill: "binding_price_floor", secondarySkills: ["nonbinding_price_floor"], repairSkill: "binding_price_floor", commonError: "thinks_all_price_floors_affect_markets", feedback: "A price floor only binds if it is above the equilibrium price." },
  { id: 13011, sourceGame: "marketGate", q: "A city sets rent below equilibrium. Quantity demanded is 80,000 and quantity supplied is 52,000. Renters who get apartments save $300 each, but 28,000 renters are rationed out. What is the best conclusion?", options: ["The policy creates winners and losers; the lower legal price does not mean all renters benefit", "All renters benefit because the legal price is lower", "Landlords benefit because quantity supplied rises", "The market clears because the legal price is lower"], a: 0, tag: "price_ceiling", type: "integration", objective: "LO6.1", difficulty: "elite", conceptCluster: "government_policy", primarySkill: "ceiling_distributional_tradeoff", secondarySkills: ["ceiling_shortage_calculation", "nonmoney_rationing_costs"], repairSkill: "binding_price_ceiling", commonError: "assumes_target_group_all_benefits", feedback: "Some renters gain lower rent, but others lose access because the ceiling creates a shortage." },
  { id: 13012, sourceGame: "marketGate", q: "A minimum wage rises from $10 to $15. At $15, firms demand 70,000 workers and 120,000 workers want jobs. What is the labor surplus and what is one likely adjustment?", options: ["50,000 workers; firms may automate or reduce hours", "50,000 workers; firms must hire all workers", "190,000 workers; firms may increase labor demand", "70,000 workers; workers stop supplying labor"], a: 0, tag: "price_floor", type: "multi-step", objective: "LO6.2", difficulty: "elite", conceptCluster: "government_policy", primarySkill: "minimum_wage_surplus_calculation", secondarySkills: ["incentives_behavior"], repairSkill: "floor_surplus_calculation", commonError: "adds_labor_supplied_and_demanded", feedback: "Labor surplus is 120,000 - 70,000 = 50,000. Firms may respond by reducing hours, automating, or hiring fewer workers." },
  { id: 13013, sourceGame: "marketGate", q: "A tax is imposed on a good with highly inelastic demand and elastic supply. Which policy outcome is most likely?", options: ["Buyers bear most of the burden and quantity falls relatively little", "Sellers bear most of the burden and quantity falls dramatically", "Buyers bear no burden because sellers legally pay", "The tax creates a surplus equal to the tax"], a: 0, tag: "tax_incidence", type: "integration", objective: "LO6.5", difficulty: "elite", conceptCluster: "government_policy", primarySkill: "elasticity_tax_quantity_burden", secondarySkills: ["tax_burden_less_elastic_side", "tax_quantity_effect"], repairSkill: "tax_incidence_less_elastic_side", commonError: "separates_elasticity_from_quantity_response", feedback: "Inelastic demand means buyers bear more and reduce quantity less in response to the tax." },
  { id: 13014, sourceGame: "marketGate", q: "A tax is imposed on a good with elastic demand and highly inelastic supply. Which result is most likely?", options: ["Sellers bear most of the burden", "Buyers bear most of the burden", "Demand increases because the tax is high", "The legal assignment alone determines burden"], a: 0, tag: "tax_incidence", type: "integration", objective: "LO6.5", difficulty: "elite", conceptCluster: "government_policy", primarySkill: "elasticity_tax_burden", secondarySkills: ["tax_burden_less_elastic_side"], repairSkill: "tax_incidence_less_elastic_side", commonError: "thinks_buyers_always_bear_consumption_taxes", feedback: "The less elastic side bears more. If supply is highly inelastic, sellers bear most of the tax." },
  { id: 13015, sourceGame: "marketGate", q: "A market begins in equilibrium. A tax is imposed, and quantity falls from 1,000 to 850. Buyers pay $4 more and sellers receive $6 less. What is the tax revenue?", options: ["$8,500", "$10,000", "$3,400", "$5,100"], a: 0, tag: "taxes", type: "multi-step", objective: "LO6.3", difficulty: "elite", conceptCluster: "government_policy", primarySkill: "tax_revenue_from_burden_split", secondarySkills: ["tax_wedge_calculation", "tax_quantity_effect"], repairSkill: "tax_wedge_incidence", commonError: "uses_original_quantity_or_one_side_burden_only", feedback: "The tax is $4 + $6 = $10 per unit. Revenue is $10 × 850 = $8,500." },
  { id: 13016, sourceGame: "marketGate", q: "A market starts at price $40. After a tax, buyers pay $46 and sellers receive $34. Quantity sold falls from 500 to 420. What is total tax revenue?", options: ["$5,040", "$2,520", "$6,000", "$12,000"], a: 0, tag: "taxes", type: "multi-step", objective: "LO6.3", difficulty: "elite", conceptCluster: "government_policy", primarySkill: "tax_revenue_calculation", secondarySkills: ["tax_wedge_calculation"], repairSkill: "tax_wedge_incidence", commonError: "uses_pre_tax_quantity_or_buyer_price_change_only", feedback: "The tax is $46 - $34 = $12. Tax revenue is $12 × 420 = $5,040." },
  { id: 13017, sourceGame: "marketGate", q: "A market starts at price $40. After a tax, buyers pay $46 and sellers receive $34. Quantity sold is 420. What is the total buyer-side burden?", options: ["$2,520", "$5,040", "$1,680", "$14,280"], a: 0, tag: "tax_incidence", type: "multi-step", objective: "LO6.5", difficulty: "elite", conceptCluster: "government_policy", primarySkill: "total_buyer_tax_burden", secondarySkills: ["buyer_tax_burden_calculation"], repairSkill: "tax_incidence_less_elastic_side", commonError: "uses_full_tax_instead_of_buyer_price_increase", feedback: "Buyers pay $6 more per unit than before. Total buyer burden is $6 × 420 = $2,520." },
  { id: 13018, sourceGame: "marketGate", q: "A market starts at price $40. After a tax, buyers pay $46 and sellers receive $34. Quantity sold is 420. What is the total seller-side burden?", options: ["$2,520", "$5,040", "$1,680", "$14,280"], a: 0, tag: "tax_incidence", type: "multi-step", objective: "LO6.5", difficulty: "elite", conceptCluster: "government_policy", primarySkill: "total_seller_tax_burden", secondarySkills: ["seller_tax_burden_calculation"], repairSkill: "tax_incidence_less_elastic_side", commonError: "uses_full_tax_instead_of_seller_price_drop", feedback: "Sellers receive $6 less per unit than before. Total seller burden is $6 × 420 = $2,520." },
  { id: 13019, sourceGame: "marketGate", q: "A tax is imposed on sellers. Before the tax, price is $20 and quantity is 300. After the tax, buyers pay $24, sellers receive $18, and quantity is 240. Which statement is correct?", options: ["The tax is $6, buyers bear $4 per unit, sellers bear $2 per unit, and quantity falls", "The tax is $4 and sellers bear all of it", "The tax is $2 and buyers bear all of it", "The tax is $42 because buyer and seller prices are added"], a: 0, tag: "tax_incidence", type: "multi-step", objective: "LO6.5", difficulty: "elite", conceptCluster: "government_policy", primarySkill: "tax_wedge_burden_quantity_synthesis", secondarySkills: ["tax_wedge_calculation", "tax_quantity_effect"], repairSkill: "tax_wedge_incidence", commonError: "adds_prices_or_ignores_original_price", feedback: "The wedge is $24 - $18 = $6. Buyers pay $4 more than before and sellers receive $2 less. Quantity falls from 300 to 240." },
  { id: 13020, sourceGame: "marketGate", q: "A seller tax and a buyer tax of the same size create the same wedge in the same market. What should students conclude?", options: ["The market outcome is equivalent even if the legal payer differs", "The seller tax always hurts sellers more", "The buyer tax always hurts buyers more", "Only the tax on sellers reduces quantity"], a: 0, tag: "taxes", type: "trap", objective: "LO6.4", difficulty: "elite", conceptCluster: "government_policy", primarySkill: "buyer_seller_tax_equivalence", secondarySkills: ["tax_wedge_identification"], repairSkill: "tax_equivalence", commonError: "legal_assignment_controls_outcome", feedback: "Equivalent taxes on buyers or sellers create the same wedge and market outcome." },
  { id: 13021, sourceGame: "marketGate", q: "A student says, 'The price rose after the tax, so buyers paid the entire tax.' What is the flaw?", options: ["Buyers' burden is only the price increase above the old equilibrium, not the full wedge unless sellers receive the old price", "Any price increase means buyers pay everything", "Sellers cannot bear taxes if buyers pay more", "Tax incidence is unrelated to prices"], a: 0, tag: "tax_incidence", type: "trap", objective: "LO6.5", difficulty: "elite", conceptCluster: "government_policy", primarySkill: "buyer_burden_vs_tax_wedge", secondarySkills: ["seller_tax_burden_calculation"], repairSkill: "tax_incidence_less_elastic_side", commonError: "confuses_price_increase_with_full_tax", feedback: "Buyers bear the part of the tax reflected in the higher price they pay; sellers bear the part reflected in the lower price they receive." },
  { id: 13022, sourceGame: "marketGate", q: "A product gets cheaper because supply increases. Students say demand increased because quantity sold rose. What is the error?", options: ["They confused an increase in quantity demanded with an increase in demand", "They correctly identified a demand shift", "They confused a price floor with a price ceiling", "They ignored that supply can never change price"], a: 0, tag: "demand", type: "trap", objective: "LO4.2", difficulty: "elite", conceptCluster: "supply_demand", primarySkill: "movement_vs_demand_shift", secondarySkills: ["supply_shift_equilibrium_prediction"], repairSkill: "movement_vs_demand_shift", commonError: "calls_quantity_demanded_change_demand_increase", feedback: "If price falls because supply increases, buyers move along the demand curve. Quantity demanded rises, but demand itself does not shift." },
  { id: 13023, sourceGame: "marketGate", q: "A product gets more expensive because demand increases. Sellers produce more at the higher price. Students say supply increased. What is the error?", options: ["They confused an increase in quantity supplied with an increase in supply", "They correctly identified a supply shift", "They confused demand with quantity demanded", "They ignored that equilibrium cannot change"], a: 0, tag: "supply", type: "trap", objective: "LO4.3", difficulty: "elite", conceptCluster: "supply_demand", primarySkill: "movement_vs_supply_shift", secondarySkills: ["demand_shift_equilibrium_prediction"], repairSkill: "movement_vs_supply_shift", commonError: "calls_quantity_supplied_change_supply_increase", feedback: "Sellers move along the supply curve when price rises. Quantity supplied increases, but supply does not shift." },
  { id: 13024, sourceGame: "marketGate", q: "A city subsidizes apartment construction while also imposing a binding rent ceiling. Which combined result is most likely?", options: ["The subsidy pushes supply right, but the binding ceiling can still create rationing if price remains below equilibrium", "The subsidy makes the ceiling irrelevant in all cases", "The ceiling shifts demand left and eliminates scarcity", "The policy must create a surplus because supply increases"], a: 0, tag: "government_policy", type: "integration", objective: "LO6.1", difficulty: "elite", conceptCluster: "government_policy", primarySkill: "mixed_policy_supply_ceiling", secondarySkills: ["supply_shifters", "binding_price_ceiling"], repairSkill: "binding_price_ceiling", commonError: "assumes_one_policy_fully_cancels_the_other", feedback: "A supply subsidy can ease shortage pressure, but a binding ceiling can still hold price below equilibrium and cause rationing." },
  { id: 13025, sourceGame: "marketGate", q: "A tax on cigarettes reduces smoking less than expected but raises substantial revenue. What is the most likely explanation?", options: ["Demand is relatively inelastic", "Demand is perfectly elastic", "Supply increased after the tax", "The tax created a price floor"], a: 0, tag: "tax_incidence", type: "application", objective: "LO6.5", difficulty: "elite", conceptCluster: "government_policy", primarySkill: "infer_inelastic_demand_from_tax_outcome", secondarySkills: ["tax_quantity_effect"], repairSkill: "tax_incidence_less_elastic_side", commonError: "thinks_small_quantity_change_means_tax_failed", feedback: "If quantity falls only a little after a tax, demand is likely relatively inelastic." },
