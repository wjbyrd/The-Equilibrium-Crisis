<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1">
    
<!-- Title can be changed to whatever the game needs -->
<title>The Equilibrium Crisis</title>
   
<style>
/* =========================================
   1. VISUAL DESIGN — SAFE TO EDIT

You can change:
- Colors
- Background images
- Fonts
- Glow effects

Do NOT rename IDs (#gameBox, #mazeTrack, etc.)
or you will break JavaScript connections.
========================================= */
/* =========================================
   1. VISUAL DESIGN — THE EQUILIBRIUM CRISIS
========================================= */
body {
    font-family: 'Rajdhani', Arial, sans-serif;
    margin: 0;
    padding: 0;
    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    overflow-x: hidden;
    color: #eef6ff;
    background: url('question_background_image.png');
    background-size: cover;
    background-position: center;
}

/* Economic Realm overlay — civic, luminous, not noir */
body::after{
    content:"";
    position:fixed;
    inset:0;
    background:
        radial-gradient(circle at center,
            rgba(56,189,248,0.10),
            rgba(15,23,42,0.36) 48%,
            rgba(2,6,23,0.78) 100%);
    pointer-events:none;
    z-index:-1;
}

.dungeon-container {
    position: relative;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    gap: 40px;
    width: 100%;
    max-width: 1100px;
    margin-top: 20px;
}

/* CENTER BLOCK */
.start-content{
    width: 100%;
    max-width: 460px;
    display:flex;
    flex-direction:column;
    align-items:center;   
    text-align:center;
    padding: 28px 30px;
    border-radius: 18px;
}

/* TITLE — civic gold */
.title{
    font-size:64px;
    letter-spacing:4px;
    margin-bottom:10px;
    color:#f7d982;
    text-align:center;
    text-shadow:
        0 0 10px rgba(240,200,106,0.72),
        0 0 24px rgba(56,189,248,0.26),
        0 3px 8px rgba(0,0,0,0.92);
}

/* SUBTITLE — holographic blue */
.subtitle{
    font-size:34px;
    margin-bottom:35px;
    letter-spacing:2px;
    text-align:center;
    color:#c7ecff;
    text-shadow:
        0 0 12px rgba(56,189,248,0.42),
        0 0 26px rgba(14,165,233,0.22),
        0 2px 6px rgba(0,0,0,0.88);
}

/* TAGLINE */
.tagline{
    margin-bottom:30px;
    font-style:italic;
    opacity:0.92;
	text-align:center;
    color:#e0f2fe;
    text-shadow:
        0 0 10px rgba(56,189,248,0.22),
        0 2px 6px rgba(0,0,0,0.88);
}

/* INPUT — civic access panel */
.name-input{
    width:100%;
    max-width:320px;
    text-align:center;
    padding:15px;
    border-radius:10px;
    border:1px solid rgba(56,189,248,0.42);   
    background: rgba(3,10,24,0.82);          
    color:#eef6ff;                             
    font-size:20px;
    margin-bottom:20px;
    outline:none;
    box-shadow:
        0 0 12px rgba(56,189,248,0.24),
        inset 0 0 12px rgba(0,0,0,0.72);
}

.name-input:focus{
    border-color: rgba(247,217,130,0.88);
    box-shadow:
        0 0 16px rgba(247,217,130,0.42),
        0 0 34px rgba(56,189,248,0.30),
        inset 0 0 12px rgba(0,0,0,0.78);
}

.start-btn{
    width:100%;
    max-width:320px;
}

.secondary-start-btn{
    margin-top: 10px;
    background: linear-gradient(180deg, #1d4d73, #04101f);
    border-color: rgba(247,217,130,0.56);
    color: #f7d982;
}

/* PLACEHOLDER */
#emailInput::placeholder,
#username::placeholder{
    color: rgba(224,242,254,0.55);
    font-style: italic;
    letter-spacing: 0.5px;
    text-align: center;
}

/* =========================================
   2. CORE GAME CONTAINER (#gameBox)
========================================= */

#gameBox {
    max-width: 750px;
    flex:1;
    min-width:0;
    width:100%;
    margin: 0;
    padding: 18px 20px;
    text-align: center;

    background:
        radial-gradient(circle at center,
            rgba(139,92,246,0.14) 0%,
            rgba(15,23,42,0.60) 46%,
            rgba(20,12,42,0.94) 74%,
            rgba(2,6,23,0.99) 100%);

    backdrop-filter: blur(6px);
    border-radius: 14px;
    box-sizing: border-box;

    box-shadow:
        0 0 22px rgba(139,92,246,0.20),
        0 0 58px rgba(56,189,248,0.11),
        0 0 72px rgba(15,23,42,0.72),
        inset 0 0 42px rgba(0,0,0,0.78);

    border: 1px solid rgba(167,139,250,0.36);
    animation: torchFlicker 6s infinite;
    transition: box-shadow .3s ease, border-color .3s ease;
    position: relative;
}

/* Boss state styling — triggered during boss fights (DO NOT REMOVE) */	
#gameBox.boss-mode {
    border: 2px solid rgba(247,217,130,0.88);
    box-shadow:
        0 0 30px rgba(247,217,130,0.42),
        0 0 62px rgba(56,189,248,0.34),
        inset 0 0 46px rgba(0,0,0,0.86);
}

.boss-icon{
    width: 28px;
    height: 28px;
    object-fit: contain;
    pointer-events: none;
}

/* Tier 1 — The Warden */
.boss10 .boss-icon{
    filter:
        drop-shadow(0 0 6px rgba(56,189,248,0.88))
        drop-shadow(0 0 14px rgba(247,217,130,0.48));
}

/* Tier 2 — The Breaker */
.boss20 .boss-icon{
    filter:
        drop-shadow(0 0 8px rgba(14,165,233,0.94))
        drop-shadow(0 0 18px rgba(56,189,248,0.56));
}

/* Tier 3 — The Marshal */
.boss30 .boss-icon{
    filter:
        drop-shadow(0 0 10px rgba(247,217,130,0.96))
        drop-shadow(0 0 25px rgba(56,189,248,0.62));
}

/* Damage effect when boss/player is hit (visual feedback) */	
.hit {
    box-shadow:
        0 0 52px rgba(185,28,28,0.64),
        0 0 30px rgba(247,217,130,0.30),
        inset 0 0 44px rgba(2,6,23,0.90) !important;
    animation: hitshake 0.4s ease;
}

/* Autosave indicator — positioned relative to gameBox */	
#autosave {
    position: absolute;
    top: 15px;
    right: 15px;
    font-size: 11px;
    opacity: 0.58;
    font-style: italic;
    color: #c7ecff;
    text-shadow: 0 0 6px rgba(56,189,248,0.42);
}

/* Adds a graph box for questions with graphs */	
#questionImageBox{
    margin: 0 auto 12px auto;
    text-align: center;
    display: none;
}

#questionImageBox img{
    max-width: 100%;
    width: 420px;
    height: auto;
    border-radius: 10px;
    border: 1px solid rgba(247,217,130,0.26);
    box-shadow:
        0 0 14px rgba(56,189,248,0.22),
        0 0 30px rgba(15,23,42,0.72),
        0 0 28px rgba(0,0,0,0.74);
}

/* =========================================
   3. TEXT & TYPOGRAPHY SYSTEM
========================================= */

h2 {
    text-shadow:
        0 0 10px rgba(229,231,235,0.22),
        0 0 22px rgba(56,189,248,0.20),
        0 2px 6px rgba(0,0,0,0.88);
    margin-bottom: 5px;
}

/* Main question text — keep readable and centered */	
#question {
    font-size: clamp(20px, 4vw, 22px);
    line-height: 1.4;
    font-weight: 600;
    margin: 14px 0;
    color: #eef6ff;
    text-shadow:
        0 2px 5px rgba(0,0,0,0.90),
        0 0 8px rgba(56,189,248,0.14);
}

/* Boss/summary title — high emphasis text */	
.boss-title {
    font-size: 28px;
    font-weight: bold;
    margin-bottom: 15px;
    display: block;
    color: #f7d982;
    text-shadow:
        0 0 10px rgba(247,217,130,0.68),
        0 0 28px rgba(56,189,248,0.30),
        0 3px 8px rgba(0,0,0,0.92);
}

/* Area/zone label — subtle contextual info */	
.area-title {
    color: #c7ecff;
    font-size: 14px;
    letter-spacing: 3px;
    text-transform: uppercase;
    margin-bottom: 15px;
    text-shadow:
        0 0 8px rgba(56,189,248,0.34),
        0 2px 5px rgba(0,0,0,0.88);
}

/* Boss summary text — left-aligned for readability */	
.boss-q {
    font-style: normal;
    line-height: 1.5;
    font-size: 24px;
    border-left: 3px solid #f7d982;
    padding-left: 15px;
    margin: 20px 0;
    text-align: left;
    color: #eef6ff;
    box-shadow: -4px 0 12px rgba(56,189,248,0.24);
    text-shadow: 0 2px 5px rgba(0,0,0,0.88);
}

/* Optional hint display (calculation or guidance) */	
.hint-box {
    font-size: 13px;
    color: #f7d982;
    margin-top: 15px;
    opacity: 0.86;
    height: 18px;
    text-shadow:
        0 0 6px rgba(247,217,130,0.30),
        0 0 12px rgba(56,189,248,0.16);
}

/* Temporary feedback text (auto fades out) */
.fade-out-text {
    animation: fadeOut 5s forwards;
    font-weight: bold;
    color: #f9e7ad;
    text-shadow:
        0 0 8px rgba(247,217,130,0.52),
        0 0 18px rgba(56,189,248,0.24),
        0 2px 5px rgba(0,0,0,0.88);
}

/* Add styling to Chancellor text */	
#message {
    margin-top: 10px;
    font-style: italic;
    letter-spacing: 0.5px;
    text-align: center;
    color: #e0f2fe;
    opacity: 0.9;
    text-shadow:
        0 0 7px rgba(56,189,248,0.24),
        0 2px 5px rgba(0,0,0,0.88);
}

/* Equilibrium Crisis override */
.equilibrium-crisis #message,
.economic-realm #message {
    color: #c7ecff;
    font-size: 17px;
    font-style: italic;
    margin-top: 12px;
    margin-bottom: 6px;
    font-weight: 600;
    letter-spacing: 1px;
    text-shadow:
        0 0 8px rgba(56,189,248,0.48),
        0 0 18px rgba(247,217,130,0.18),
        0 2px 6px rgba(0,0,0,0.88);
}

/* =========================================
   4. BUTTONS & INTERACTION
========================================= */

/* Base button styling — applies to all buttons */	
button {
    padding: 12px 22px;
    margin: 6px;
    font-size: 16px;
    cursor: pointer;
    background: linear-gradient(180deg, #12304f, #04101f);
    color: #eef6ff;
    border: 1px solid rgba(56,189,248,0.36);
    border-radius: 8px;
    box-shadow:
       0 0 12px rgba(56,189,248,0.20),
       0 0 24px rgba(15,23,42,0.54),
       inset 0 0 10px rgba(0,0,0,0.74);
    transition: all 0.15s ease;
}

/* Hover feedback — improves interactivity */	
button:hover {
    background: linear-gradient(180deg, #1d4d73, #0b2238);
    border-color: rgba(247,217,130,0.72);
    box-shadow:
        0 0 18px rgba(56,189,248,0.36),
        0 0 34px rgba(247,217,130,0.24),
        inset 0 0 12px rgba(0,0,0,0.72);
    transform: translateY(-2px) scale(1.02);
}

/* Click feedback — simulates button press */	
button:active {
    transform: scale(0.96);
}

/* Answer container — controls layout of choices */	
.answers {
    display: flex;
    flex-direction: column;
    justify-content: center;
    gap: 12px;
    width: 100%;
}

/* Individual answer buttons — flexible sizing */	
.answers button {
    flex: 1 1 100%;
    min-height: 60px;
    max-width: 100%;
    padding: 15px;
    font-size: 18px;
    margin: 0;
    background: linear-gradient(180deg,
        rgba(11,34,56,0.96),
        rgba(2,8,18,0.98));
    color: #eef6ff;
    border: 1px solid rgba(56,189,248,0.30);
    box-shadow:
        0 0 10px rgba(56,189,248,0.18),
        0 0 18px rgba(247,217,130,0.10),
        inset 0 0 14px rgba(0,0,0,0.78);
}

/* Answer hover — a little brighter than base */	
.answers button:hover {
    background: linear-gradient(180deg,
        rgba(19,57,86,0.98),
        rgba(8,24,42,0.98));
    border-color: rgba(247,217,130,0.66);
    box-shadow:
        0 0 18px rgba(56,189,248,0.34),
        0 0 34px rgba(247,217,130,0.22),
        inset 0 0 14px rgba(0,0,0,0.74);
}

/* Utility button (fullscreen toggle) — safe to restyle or move */	
.fullscreenBtn {
    position: absolute;
    top: 12px;
    left: 12px;
    padding: 6px 12px;
    font-size: 12px;
    letter-spacing: 1px;
    text-transform: uppercase;
    color: #e0f2fe;
    background: linear-gradient(180deg, #12304f, #04101f);
    border: 1px solid rgba(56,189,248,0.32);
    border-radius: 6px;
    cursor: pointer;
    box-shadow:
        0 0 10px rgba(56,189,248,0.22),
        inset 0 0 7px rgba(0,0,0,0.80);
    transition: all 0.15s ease;
}

.fullscreenBtn:hover {
    background: linear-gradient(180deg, #1d4d73, #0b2238);
    border-color: rgba(247,217,130,0.62);
    box-shadow:
        0 0 16px rgba(56,189,248,0.34),
        inset 0 0 8px rgba(0,0,0,0.76);
}

.fullscreenBtn:active {
    transform: scale(0.95);
    box-shadow:
        0 0 8px rgba(56,189,248,0.28),
        inset 0 0 10px rgba(0,0,0,0.86);
}

.return-menu-btn{
    position: absolute;
    top: 12px;
    right: 12px;
    padding: 6px 12px;
    font-size: 12px;
    letter-spacing: 1px;
    text-transform: uppercase;
    color: #e0f2fe;
    background: linear-gradient(180deg, #12304f, #04101f);
    border: 1px solid rgba(56,189,248,0.32);
    border-radius: 6px;
    cursor: pointer;
    box-shadow:
        0 0 10px rgba(56,189,248,0.22),
        inset 0 0 7px rgba(0,0,0,0.80);
    transition: all 0.15s ease;
}

.return-menu-btn:hover {
    color: #f7d982;
    background: linear-gradient(180deg, #1d4d73, #0b2238);
    border-color: rgba(247,217,130,0.62);
    box-shadow:
        0 0 16px rgba(56,189,248,0.34),
        inset 0 0 8px rgba(0,0,0,0.76);
}

.return-menu-btn:active {
    transform: scale(0.95);
}
	
.continue-btn {
    background: linear-gradient(180deg, #1d4d73, #04101f);
    color: #f7d982;
    font-weight: bold;
    padding: 14px 40px;
    font-size: 18px;
    border-radius: 8px;
    border: 1px solid rgba(247,217,130,0.56);
    cursor: pointer;
    box-shadow:
        0 0 16px rgba(56,189,248,0.32),
        0 0 34px rgba(247,217,130,0.22),
        inset 0 0 12px rgba(0,0,0,0.76);
    transition: all 0.15s ease;
}

.continue-btn:hover {
    background: linear-gradient(180deg, #24628f, #0b2238);
    box-shadow:
        0 0 24px rgba(56,189,248,0.46),
        0 0 42px rgba(247,217,130,0.28),
        inset 0 0 12px rgba(0,0,0,0.74);
    transform: scale(1.03);
}

#continueBtn:active {
    transform: scale(0.97);
    box-shadow:
        0 0 10px rgba(56,189,248,0.30),
        inset 0 0 10px rgba(0,0,0,0.82);
}

/* =========================================
   5. PROGRESS & MAZE TRACK
========================================= */

/* Progress bar container — background track */	
#progressBar {
    width: 100%;
    height: 22px;
    background: linear-gradient(180deg,
        rgba(3,10,24,0.96),
        rgba(2,6,23,0.98));
    border-radius: 12px;
    margin-bottom: 20px;
    overflow: hidden;
    border: 1px solid rgba(56,189,248,0.26);
    box-shadow:
        inset 0 0 12px rgba(0,0,0,0.86),
        0 0 10px rgba(56,189,248,0.18);
}

/* Progress fill — width controlled by JS */		
#progressFill {
    height: 100%;
    width: 0%;
    background: linear-gradient(90deg,
        #0b2238,
        #38bdf8,
        #f7d982);
    box-shadow:
        0 0 12px rgba(56,189,248,0.44),
        0 0 22px rgba(247,217,130,0.28);
    transition: width 0.4s ease;
}

/* Maze grid layout — 10 columns = 30 total rooms */		
#mazeTrack {
    display: grid;
    grid-template-columns: repeat(10, 36px);
    justify-content: center;
    gap: 10px;
    margin: 25px auto;
}

/* Individual room cell — default state */		
.maze-box {
    width: 36px;
    height: 36px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 20px;
    border-radius: 6px;
    background: linear-gradient(180deg,
        rgba(11,34,56,0.72),
        rgba(2,6,23,0.94));
    border: 1px solid rgba(56,189,248,0.20);
    box-shadow:
        inset 0 0 10px rgba(0,0,0,0.80),
        0 0 5px rgba(56,189,248,0.12);
    transition: all 0.3s ease;
}

/* Current room highlight — animated pulse */		
.maze-box.active {
    background: radial-gradient(circle,
        rgba(56,189,248,0.46),
        rgba(11,34,56,0.58),
        rgba(2,6,23,0.98));
    border: 2px solid #f7d982;
    box-shadow:
        0 0 12px rgba(56,189,248,0.72),
        0 0 24px rgba(247,217,130,0.36),
        inset 0 0 12px rgba(0,0,0,0.72);
    z-index: 10;
    animation: activePulse 1s infinite alternate;
}

/* Completed tile */		
.maze-box.completed {
    background: linear-gradient(180deg,
        rgba(19,57,86,0.72),
        rgba(3,10,24,0.96));
    border-color: rgba(247,217,130,0.36);
    box-shadow:
        0 0 8px rgba(56,189,248,0.26),
        inset 0 0 10px rgba(0,0,0,0.76);
}

/* Boss room highlights: 10, 20, 30 */
.maze-box:nth-child(10) {
    text-shadow:
        0 0 8px #38bdf8,
        0 0 18px rgba(247,217,130,0.58);
}

.maze-box:nth-child(20) {
    text-shadow:
        0 0 8px #0ea5e9,
        0 0 18px rgba(56,189,248,0.62);
}

.maze-box:nth-child(30) {
    text-shadow:
        0 0 10px #f7d982,
        0 0 24px rgba(56,189,248,0.64),
        0 0 34px rgba(0,0,0,0.68);
}

/* Streak styling — Equilibrium Crisis */
.streak {
    display:inline-flex;
    align-items:center;
    gap:10px;
    font-weight:600;
    letter-spacing:0.5px;
    color: rgba(238,246,255,0.96);
    text-shadow:
        0 0 7px rgba(56,189,248,0.32),
        0 2px 5px rgba(0,0,0,0.88);
}

.streak-icon {
    width:22px;
    height:22px;
    object-fit:contain;
    border-radius:50%;
    filter:
        drop-shadow(0 0 8px rgba(247,217,130,0.72))
        drop-shadow(0 0 15px rgba(56,189,248,0.36));
    background: radial-gradient(circle,
        rgba(247,217,130,0.36) 0%,
        rgba(56,189,248,0.24) 42%,
        transparent 72%);
    animation: pulseControl 2.2s ease-in-out infinite;
}
	
/* =========================================
   6. ARTIFACT SYSTEM (REWARDS) — THE EQUILIBRIUM CRISIS
========================================= */

/* Reward popup — appears after boss victory */	
#artifactDrop {
    margin-top: 20px;
    padding: 14px;
    background: radial-gradient(circle at center,
        rgba(56,189,248,0.18),
        rgba(15,42,64,0.70) 42%,
        rgba(4,14,28,0.94) 68%,
        rgba(2,6,23,0.99));
    border-radius: 12px;
    border: 1px solid rgba(247,217,130,0.38);
    box-shadow:
        0 0 22px rgba(56,189,248,0.24),
        0 0 44px rgba(247,217,130,0.16),
        inset 0 0 30px rgba(0,0,0,0.78);
    text-align: center;
}

/* Artifact image in popup */		
#artifactImage {
    width: 96px;
    margin-bottom: 8px;
}

#artifactDrop img {
    filter:
        drop-shadow(0 0 14px rgba(56,189,248,0.64))
        drop-shadow(0 0 26px rgba(247,217,130,0.36))
        drop-shadow(0 0 34px rgba(0,0,0,0.64));
}

/* Persistent artifact collection display (top panel) */		
#artifactVault {
    margin-top: -6px;
    width: 220px;
    padding: 18px;
    border-radius: 12px;
    background: radial-gradient(circle at top,
        rgba(56,189,248,0.16),
        rgba(15,42,64,0.70) 44%,
        rgba(4,14,28,0.94) 70%,
        rgba(2,6,23,0.99));
    border: 1px solid rgba(56,189,248,0.26);
    box-shadow:
        0 0 20px rgba(56,189,248,0.20),
        0 0 38px rgba(247,217,130,0.12),
        inset 0 0 30px rgba(0,0,0,0.78);
    text-align: center;
}

#artifactVault h3 {
    color: #f7d982;
    text-shadow:
        0 0 10px rgba(247,217,130,0.48),
        0 0 18px rgba(56,189,248,0.20),
        0 2px 6px rgba(0,0,0,0.88);
}

/* Layout container for artifact slots */		
.vaultRow {
    display: flex;
    justify-content: center;
    align-items:flex-end;
    gap: 15px;
    flex-wrap:wrap;
}

/* Individual artifact slot (default = locked state) */    	
.artifactSlot {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    min-width: 70px;
    text-align:center;
    opacity: .28;
    transition: all .4s ease;
}

/* Locked artifact image (dimmed effect) */    		
.artifactSlot img {
    width: 45px;
    margin-bottom:4px;
    filter:
        brightness(0.30)
        contrast(0.92)
        saturate(0.78);
    transition: all .4s ease;
}

/* Artifact label text */		
.artifactSlot span {
    display: block;
    font-size: 13px;
    color: rgba(224,242,254,0.44);
    margin-top: 8px;
    line-height: 1.2;
}

/* Glow + animation for unlocked artifacts */		
.artifactSlot.unlocked {
    opacity: 1;
    transform: scale(1.05);
}

.artifactSlot.unlocked img {
    filter:
        drop-shadow(0 0 14px rgba(247,217,130,0.76))
        drop-shadow(0 0 26px rgba(56,189,248,0.44))
        drop-shadow(0 0 34px rgba(15,42,64,0.62));
    animation: relicPulse 2.5s ease-in-out infinite;
    backface-visibility: hidden;
    transform: translateZ(0);
}

.artifactSlot.unlocked span {
    color: #eef6ff;
    font-weight: 600;
    text-shadow:
        0 0 7px rgba(56,189,248,0.34),
        0 0 14px rgba(247,217,130,0.18),
        0 2px 5px rgba(0,0,0,0.88);
}

/* =========================================
   7. BOSS EFFECTS & ATMOSPHERE — THE EQUILIBRIUM CRISIS
========================================= */

/* Hit animation — triggered when boss takes damage */		
.boss-shake {
    animation: bossShake 0.5s cubic-bezier(.36,.07,.19,.97) both;
}

/* Boss image display — includes floating animation */	
.bossIcon {
    width: 96px;
    height: auto;
    display: block;
    margin: 0 auto 12px auto;
    animation: bossFloat 4s ease-in-out infinite;
}

/* Boss 1 — The Keeper of Scarcity */
.breakerGlow,
.signalBreakerGlow {
    filter:
        drop-shadow(0 0 12px rgba(56,189,248,0.72))
        drop-shadow(0 0 24px rgba(247,217,130,0.42))
        drop-shadow(0 0 34px rgba(0,0,0,0.80));
}

/* Boss 2 — The Warden of Elasticity */
.measureWardenGlow,
.wardenGlow {
    filter:
        drop-shadow(0 0 14px rgba(14,165,233,0.88))
        drop-shadow(0 0 28px rgba(56,189,248,0.44))
        drop-shadow(0 0 36px rgba(247,217,130,0.18))
        drop-shadow(0 0 38px rgba(0,0,0,0.84));
}

/* Boss 3 — The Arbiter of the Equilibrium Crisis */
.marshalGlow,
.marketMarshalGlow {
    filter:
        drop-shadow(0 0 16px rgba(247,217,130,0.92))
        drop-shadow(0 0 34px rgba(56,189,248,0.48))
        drop-shadow(0 0 46px rgba(15,42,64,0.66))
        drop-shadow(0 0 52px rgba(0,0,0,0.88));
}

/* Ambient torch effect — decorative, shown during gameplay */	
.torch {
    position: absolute;
    width: 70px;
    top: 30px;
    z-index: 10;
    animation: torchFlicker 3s infinite alternate;
    pointer-events: none;
    opacity: .9;
    filter:
        drop-shadow(0 0 12px rgba(56,189,248,0.44))

/* Torch positioning (left/right sides of screen) */
.left-torch {
    left: 18px;
}

.right-torch {
    right: 18px;

}

========================================= */

/* =========================================
   9. ANIMATION SYSTEM — THE EQUILIBRIUM CRISIS
========================================= */

/* Ambient civic-light flicker */
@keyframes torchFlicker {
  0%, 100% {
    filter: brightness(1);
  }
  25% {
    filter: brightness(1.04) saturate(1.04);
  }
  50% {
    filter: brightness(0.97) saturate(0.99);
  }
  75% {
    filter: brightness(1.03) saturate(1.03);
  }
}

/* Damage feedback */
@keyframes hitshake {
  0% { transform: translateX(0); }
  25% { transform: translateX(-8px); }
  50% { transform: translateX(8px); }
  75% { transform: translateX(-6px); }
  100% { transform: translateX(0); }
}

/* Boss hit feedback */
@keyframes bossShake {
  10%, 90% { transform: translate3d(-1px, 0, 0); }
  20%, 80% { transform: translate3d(2px, 0, 0); }
  30%, 50%, 70% { transform: translate3d(-4px, 0, 0); }
  40%, 60% { transform: translate3d(4px, 0, 0); }
}

/* Current room pulse — Equilibrium Crisis */
@keyframes activePulse {
  0% {
    transform: scale(1.06);
    box-shadow:
      0 0 8px rgba(56,189,248,0.56),
      0 0 16px rgba(247,217,130,0.22),
      inset 0 0 10px rgba(0,0,0,0.66);
  }
  45% {
    transform: scale(1.13);
    box-shadow:
      0 0 18px rgba(56,189,248,0.78),
      0 0 32px rgba(247,217,130,0.34),
      0 0 42px rgba(15,42,64,0.68),
      inset 0 0 12px rgba(0,0,0,0.70);
  }
  70% {
    transform: scale(1.09);
    box-shadow:
      0 0 12px rgba(56,189,248,0.62),
      0 0 24px rgba(247,217,130,0.24),
      0 0 30px rgba(15,42,64,0.60),
      inset 0 0 11px rgba(0,0,0,0.70);
  }
  100% {
    transform: scale(1.11);
    box-shadow:
      0 0 15px rgba(56,189,248,0.68),
      0 0 30px rgba(247,217,130,0.30),
      0 0 38px rgba(2,6,23,0.70),
      inset 0 0 12px rgba(0,0,0,0.72);
  }
}

/* Victory title glow */
@keyframes victoryGlow {
  0%, 100% {
    transform: scale(1);
    text-shadow:
      0 0 10px rgba(247,217,130,0.72),
      0 0 18px rgba(56,189,248,0.24),
      0 2px 6px rgba(0,0,0,0.92);
  }
  50% {
    transform: scale(1.08);
    text-shadow:
      0 0 24px rgba(247,217,130,0.92),
      0 0 42px rgba(56,189,248,0.42),
      0 0 52px rgba(15,42,64,0.68),
      0 3px 8px rgba(0,0,0,0.92);
  }
}

/* Idle boss movement */
@keyframes bossFloat {
  0%, 100% { transform: translateY(0); }
  50% { transform: translateY(-6px); }
}

/* Temporary feedback text fade-out */
@keyframes fadeOut {
  0%, 70% { opacity: 1; }
  100% { opacity: 0; }
}

/* Guide idle movement */
@keyframes wizardFloat {
  0%,100% { transform: translateY(0); }
  50% { transform: translateY(-5px); }
}

/* General UI entrance */
@keyframes fadeIn {
  from {
    opacity: 0;
    transform: translateY(8px);
  }
  to {
    opacity: 1;
    transform: translateY(0);
  }
}

/* Artifact pulse — Equilibrium Crisis */
@keyframes relicPulse {
  0%,100% {
    transform: scale(1.05);
    filter:
      drop-shadow(0 0 8px rgba(247,217,130,0.68))
      drop-shadow(0 0 18px rgba(56,189,248,0.30))
      drop-shadow(0 0 24px rgba(0,0,0,0.62));
  }
  50% {
    transform: scale(1.1);
    filter:
      drop-shadow(0 0 16px rgba(247,217,130,0.90))
      drop-shadow(0 0 30px rgba(56,189,248,0.42))
      drop-shadow(0 0 38px rgba(15,42,64,0.68));
  }
}

/* Streak icon pulse */
@keyframes pulseControl {
  0%,100% {
    transform: scale(1);
    opacity: 0.9;
  }
  50% {
    transform: scale(1.08);
    opacity: 1;
  }
}

/* =========================================
   12. MOBILE RESPONSIVE SYSTEM — SAFE TO EDIT (WITH LIMITS)
=========================================

This section controls how the game behaves on phones.

GOAL:
- Fit gameplay into a single screen as much as possible
- Reduce vertical scrolling
- Keep buttons thumb-friendly

-----------------------------------------
SAFE TO EDIT:
- font sizes (clamp values)
- spacing (gap, padding, margin)
- grid layout (answers: 1fr 1fr vs 1fr)
- wizard size (make smaller/larger)

-----------------------------------------
USE CAUTION:
- removing elements entirely (may break flow)
- changing flex direction randomly
- making buttons too small (hurts usability)

-----------------------------------------
DO NOT MODIFY:
- IDs (#gameShell, #gameBox, #wizardBox)
- core layout structure

-----------------------------------------
COMMON CUSTOM CHANGES:
- Want bigger buttons? Increase min-height
- Want less scrolling? Reduce padding/gaps
- Want simpler UI? Hide artifact labels

-----------------------------------------
TIP:
Mobile design is about SPACE, not style.
Every pixel matters.

========================================= */

function updateSoundToggle(){

  [bgMusic, bossMusic, finalBossMusic, sfxMilestone, sfxVictory, sfxBossHit, sfxCorrect, sfxWrong]
    .filter(Boolean)
    .forEach(audio => {
      audio.muted = isMuted;
    });
}

function toggleGameSound(){
  soundEnabled = !soundEnabled;
  localStorage.setItem("gauntletSoundEnabled", soundEnabled ? "true" : "false");
  setAllGameAudioMuted(!soundEnabled);
  updateSoundToggle();
}

function restoreSoundSetting(){
  const saved = localStorage.getItem("gauntletSoundEnabled");
  soundEnabled = saved !== "false";
  setAllGameAudioMuted(!soundEnabled);
  updateSoundToggle();
}

restoreSoundSetting();
	 
function goFullscreen(){
let el = document.documentElement;

// Check if we are ALREADY in fullscreen
let isFullscreen = document.fullscreenElement || document.webkitFullscreenElement;

if (!isFullscreen) {
        // ENTER Fullscreen
        if (el.requestFullscreen) {
            el.requestFullscreen();
        } else if (el.webkitRequestFullscreen) {
            el.webkitRequestFullscreen();
        } else if (el.msRequestFullscreen) {
            el.msRequestFullscreen();
        }
    } else {
        // EXIT Fullscreen (Crucial for iOS to reset the state)
        if (document.exitFullscreen) {
            document.exitFullscreen();
        } else if (document.webkitExitFullscreen) {
            document.webkitExitFullscreen();
        }
    }
}

function addRealmStat(key, amount = 1){
    const current = parseInt(localStorage.getItem(key) || "0", 10);
    localStorage.setItem(key, String((Number.isFinite(current) ? current : 0) + amount));
}

function setRealmFlag(key){
    localStorage.setItem(key, "true");
}

function updateRealmMaxStat(key, value){
    const numericValue = Number(value || 0);
    const current = parseInt(localStorage.getItem(key) || "0", 10);

    if(Number.isFinite(numericValue) && numericValue > (Number.isFinite(current) ? current : 0)){
        localStorage.setItem(key, String(numericValue));
    }
}

function getMissionAchievementPrefix(){
    return `economicRealm_${REALM_MISSION_KEY}`;
}

    localStorage.setItem(`${getMissionAchievementPrefix()}_legendaryComplete`, "true");

}

    setMissionArtifactCount(artifactCount);
}

function recordTimedTrialAchievementStats(accuracy, reachedRoom){
    const safeAccuracy = Number.isFinite(Number(accuracy)) ? Number(accuracy) : 0;
    const safeRoom = Number.isFinite(Number(reachedRoom)) ? Number(reachedRoom) : 0;

    updateRealmMaxStat("equilibriumCrisisTimedBestRoom", safeRoom);
    updateRealmMaxStat("equilibriumCrisisTimedBestAccuracy", safeAccuracy);

    updateRealmMaxStat("economicRealm_timedBestRoom", safeRoom);
    updateRealmMaxStat("economicRealm_timedBestAccuracy", safeAccuracy);

    updateRealmMaxStat(`${getMissionAchievementPrefix()}_timedBestRoom`, safeRoom);
    updateRealmMaxStat(`${getMissionAchievementPrefix()}_timedBestAccuracy`, safeAccuracy);

    if(safeRoom >= 30 && safeAccuracy >= 80){
        setRealmFlag(REALM_TRIAL_BY_CLOCK_KEY);
        setRealmFlag(`${getMissionAchievementPrefix()}_trial_by_clock_complete`);
    }
}

function recordRealmCorrectAnswer(){
    addRealmStat(REALM_TOTAL_CORRECT_KEY, 1);
}

function recordRealmStreak(value){
    updateRealmMaxStat(REALM_BEST_STREAK_KEY, value);

}

}

function recordBossDefeatForAchievements(){

        setRealmFlag(`${getMissionAchievementPrefix()}_perfect_calibration_complete`);

}

function checkReturnAndRebuildAchievement(){

function generatePseudonymFromEmail(email) {
    const titles = [
        "Axiom", "Ledger", "Vector", "Meridian", "Signal", "Cipher",
        "Frontier", "Equity", "Oracle", "Index", "Summit", "Nexus",
        "Vault", "Prism", "Civic", "Astral", "Beacon", "Horizon"
    ];

    const roles = [
        "Appraiser", "Cartographer", "Arbiter", "Custodian", "Warden", "Registrar",
        "Archivist", "Surveyor", "Magistrate", "Keeper", "Analyst", "Mediator",
        "Steward", "Scribe", "Sentinel", "Marshal", "Seeker", "Auditor"
    ];

    let hash = 0;
    const cleanEmail = email.trim().toLowerCase();

    for (let i = 0; i < cleanEmail.length; i++) {
        hash = ((hash << 5) - hash) + cleanEmail.charCodeAt(i);
        hash |= 0;
    }

    const positiveHash = Math.abs(hash);

    const title = titles[positiveHash % titles.length];
    const role = roles[Math.floor(positiveHash / titles.length) % roles.length];
    const number = 1000 + (positiveHash % 9000);

    return `${title}${role}${number}`;
}

    }

    if(q.includes("tax") || q.includes("tax wedge")) {
        return "LO6.3_tax_effects";
    }

return `${tag}_${type}`;}

function inferSkill(question){
    if(!question) return null;

    const q = (question.q || "").toLowerCase();
    const tag = (question.tag || "").toLowerCase();

    if(tag === "demand" || tag === "quantity_demanded"){
        if(q.includes("price rises") || q.includes("price falls") || q.includes("quantity demanded")){
            return "movement_vs_demand_shift";
        }
        if(q.includes("income") || q.includes("substitute") || q.includes("complement") || q.includes("taste") || q.includes("expectation")){
            return "demand_shifters";
        }
    }

    if(tag === "supply" || tag === "quantity_supplied"){
        if(q.includes("price rises") || q.includes("price falls") || q.includes("quantity supplied")){
            return "movement_vs_supply_shift";
        }
        if(q.includes("input") || q.includes("technology") || q.includes("seller") || q.includes("tax") || q.includes("subsidy")){
            return "supply_shifters";
        }
    }

    if(tag === "price_ceiling") return "binding_price_ceiling";
    if(tag === "price_floor") return "binding_price_floor";
    if(tag === "taxes" || tag === "tax_incidence") return "tax_wedge_incidence";
    if(tag === "opportunity_cost") return "opportunity_cost_calculation";
    if(tag === "ppf") return "ppf_opportunity_cost";
    if(tag === "positive_normative") return "positive_vs_normative";

    return null;
}

function getObjectiveBucket(question){
    const objectiveKey = inferObjective(question);
    if(!masteryState.byObjective[objectiveKey]){
        masteryState.byObjective[objectiveKey] = {
            attempts: 0,
            correct: 0,
            avgTime: 0
        };
    }
    return masteryState.byObjective[objectiveKey];
}

function getObjectiveAccuracy(question){
    return getAccuracy(getObjectiveBucket(question));
}

function getObjectiveFluency(question){
    return getFluency(getObjectiveBucket(question), question?.type || "default");
}

function updateBucket(bucket, isCorrect, responseTime){
    if(!bucket) return;
    bucket.attempts++;
    if(isCorrect) bucket.correct++;
    bucket.avgTime = bucket.avgTime === 0
        ? responseTime
        : Math.round((bucket.avgTime * 0.7) + (responseTime * 0.3));
}

function getAccuracy(bucket){
    if(!bucket || !bucket.attempts) return null;
    return bucket.correct / bucket.attempts;
}

function getTimeRatio(bucket, type){
    if(!bucket || !bucket.attempts || !bucket.avgTime) return 1;
    return bucket.avgTime / getTypeTargetMs(type);
}

function getFluency(bucket, type){
    const acc = getAccuracy(bucket);
    if(acc === null) return 0;
    const timeRatio = getTimeRatio(bucket, type);
    return acc - clamp((timeRatio - 1) * 0.25, 0, 0.35);
}

function getTagAccuracy(tag){
    return getAccuracy(getTagBucket(tag));
}

function getTagTypeAccuracy(tag, type){
    return getAccuracy(getTypeBucket(tag, type));
}

function getTagFluency(tag){
    return getFluency(getTagBucket(tag), "default");
}

function getTagTypeFluency(tag, type){
    return getFluency(getTypeBucket(tag, type), type || "default");
}

function recordAdaptiveAttempt(question, isCorrect, responseTime){
    if(!question || !question.tag) return;

    const tagBucket = getTagBucket(question.tag);
    const typeBucket = getTypeBucket(question.tag, question.type);
    const objectiveBucket = getObjectiveBucket(question);
	const skillBucket = getSkillBucket(question);

    updateBucket(tagBucket, isCorrect, responseTime);
    updateBucket(typeBucket, isCorrect, responseTime);
    updateBucket(objectiveBucket, isCorrect, responseTime);
	updateBucket(skillBucket, isCorrect, responseTime);

    masteryState.recent.push({
        correct: !!isCorrect,
        responseTime,
        tag: question.tag,
        type: question.type || "default",
        objective: currentQuestion.objective || inferObjective(currentQuestion),
		skill: getSkillKey(question)
    });

    if(masteryState.recent.length > 20){
        masteryState.recent.shift();
    }
}

function getRecentPerformance(windowSize = 8){
    const recent = masteryState.recent.slice(-windowSize);
    if(recent.length === 0){
        return { accuracy: 0, avgCorrectRatio: 1.2, count: 0 };
    }

    const correct = recent.filter(x => x.correct);
    const avgCorrectRatio = correct.length
        ? correct.reduce((sum, item) => sum + (item.responseTime / getTypeTargetMs(item.type)), 0) / correct.length
        : 2;

    return {
        accuracy: recent.filter(x => x.correct).length / recent.length,
        avgCorrectRatio,
        count: recent.length
    };
}

function getWeakestTag(){
    const entries = Object.keys(masteryState.byTag);

    if(entries.length === 0){
        const fallback = Object.entries(conceptMemory || {}).sort((a,b) => b[1]-a[1])[0];
        return fallback ? fallback[0] : null;
    }

    let weakestTag = null;
    let weakestScore = -Infinity;

    entries.forEach(tag => {
        const fluency = getTagFluency(tag);
        const weakness = (conceptMemory[tag] || 0) + (1 - (fluency ?? 0));

        if(weakness > weakestScore){
            weakestScore = weakness;
            weakestTag = tag;
        }
    });

    return weakestTag;
}

function getStrongestTag(){
    const entries = Object.keys(masteryState.byTag);
    if(entries.length === 0) return null;

    let strongestTag = null;
    let strongestScore = -Infinity;

    entries.forEach(tag => {
        const fluency = getTagFluency(tag);
        const strength = (fluency === null ? 0 : fluency) - ((conceptMemory[tag] || 0) * 0.15);
        if(strength > strongestScore){
            strongestScore = strength;
            strongestTag = tag;
        }
    });

    return strongestTag;
}

function getBossObjectiveKey(question){
    if(!question) return null;

    const rawObjective = question.objective || inferObjective(question);
    if(!rawObjective) return null;

    const match = String(rawObjective).match(/^LO\d+\.\d+/);
    return match ? match[0] : rawObjective;
}

function getObjectiveFamilyStats(objectiveKey){
    let attempts = 0;
    let correct = 0;
    let weightedTime = 0;

    Object.keys(masteryState.byObjective || {}).forEach(key => {
        if(key === objectiveKey || key.startsWith(objectiveKey + "_")){
            const bucket = masteryState.byObjective[key];
            if(!bucket) return;

            attempts += bucket.attempts || 0;
            correct += bucket.correct || 0;
            weightedTime += (bucket.avgTime || 0) * (bucket.attempts || 0);
        }
    });

    return {
        attempts,
        correct,
        accuracy: attempts ? correct / attempts : null,
        avgTime: attempts ? weightedTime / attempts : 0
    };
}

function getWeakestBossObjective(bank){
    if(!Array.isArray(bank) || bank.length === 0) return null;

    const objectives = [...new Set(
        bank.map(q => getBossObjectiveKey(q)).filter(Boolean)
    )];

    const eligibleObjectives = objectives.filter(obj =>
        bank.filter(q => getBossObjectiveKey(q) === obj).length >= 3
    );

    if(eligibleObjectives.length === 0) return null;

    let weakestObjective = null;
    let weakestScore = -Infinity;

    eligibleObjectives.forEach(obj => {
        const stats = getObjectiveFamilyStats(obj);

        let score = 0.25;

        if(stats.accuracy !== null){
            score = (1 - stats.accuracy) * 2;
            score += Math.min(stats.attempts, 5) * 0.08;
        }

        const recentMisses = (masteryState.recent || []).filter(item => {
            const itemObjective = item.objective || "";
            return (itemObjective === obj || itemObjective.startsWith(obj + "_")) && !item.correct;
        }).length;

        score += recentMisses * 0.25;

        if(stats.avgTime && stats.avgTime > TYPE_TIME_TARGETS.default){
            score += 0.15;
        }

        if(score > weakestScore){
            weakestScore = score;
            weakestObjective = obj;
        }
    });

    return weakestObjective || eligibleObjectives[Math.floor(Math.random() * eligibleObjectives.length)];
}
	 
function getSelectionProfile(){
    const recent = getRecentPerformance(8);
    const strongestTag = getStrongestTag();
    const strongestFluency = strongestTag ? getTagFluency(strongestTag) : 0;

    return {
        recentAccuracy: recent.accuracy,
        avgCorrectRatio: recent.avgCorrectRatio,
        strongestTag,
        strongestFluency,
        mediumReady: streak >= 5 && recent.count >= 5 && recent.accuracy >= 0.8,
        hardReady: streak >= 8 && recent.count >= 6 && recent.accuracy >= 0.88 && recent.avgCorrectRatio <= 1.2 && strongestFluency >= 0.72,
        eliteReady: streak >= 14 && recent.count >= 8 && recent.accuracy >= 0.92 && recent.avgCorrectRatio <= 1.05 && strongestFluency >= 0.82
    };
}

function determineSelectionPurpose(profile){
    if(profile.recentAccuracy === 0 && getRecentPerformance(8).count === 0) return "support";
    if(profile.eliteReady) return "stretch";
    if(profile.recentAccuracy < 0.65) return "repair";
    if(profile.recentAccuracy < 0.8) return "confirm";
    if(profile.hardReady) return "challenge";
    return "diversify";
}

function shouldTriggerDetour(question){
    if(!question || !question.tag) return false;
    const tagWeakness = conceptMemory[question.tag] || 0;
    const typeBucket = getTypeBucket(question.tag, question.type);
    const typeAccuracy = getAccuracy(typeBucket);
    const objectiveAccuracy = getObjectiveAccuracy(question);

    return tagWeakness >= 2.2
        || (typeBucket && typeBucket.attempts >= 2 && typeAccuracy !== null && typeAccuracy < 0.6)
        || (objectiveAccuracy !== null && objectiveAccuracy < 0.5 && getObjectiveBucket(question).attempts >= 2);
}

function planRemediation(question, responseTime){
    if(!question || !question.tag) return null;

    const expected = getTypeTargetMs(question.type);
    const objectiveBucket = getObjectiveBucket(question);
    const objectiveAccuracy = getAccuracy(objectiveBucket);
    const objectiveAttempts = objectiveBucket?.attempts || 0;
    const carelessMiss = responseTime < expected * 0.55 && (objectiveAccuracy === null || objectiveAccuracy >= 0.45);
    const repeatedObjectiveMiss = objectiveAttempts >= 2 && objectiveAccuracy !== null && objectiveAccuracy < 0.6;
    const slowStruggle = responseTime > expected * 1.2;
	const skill = getSkillKey(question);

    return {
        active: true,
        stage: carelessMiss ? "bridge" : "repair",
        tag: question.tag,
        objective: currentQuestion.objective || inferObjective(currentQuestion),
		skill: skill,
		commonError: question.commonError || null,
        sourceType: question.type || "default",
        returnRoom: room,
        originQuestionId: question.id || null,
        careless: carelessMiss,
        repeatedObjectiveMiss,
        slowStruggle
    };
}

function getQuestionsMatchingNeed(pool, objectiveKey, tag, excludeIds = [], skillKey = null){
    if(!Array.isArray(pool) || pool.length === 0) return [];

    let candidates = pool.filter(q => !excludeIds.includes(q.id));

    if(skillKey){
        let skillMatches = candidates.filter(q =>
            q.primarySkill === skillKey || q.repairSkill === skillKey
        );
        if(skillMatches.length > 0) return skillMatches;
    }

    let objectiveMatches = candidates.filter(q => inferObjective(q) === objectiveKey);
    if(objectiveMatches.length > 0) return objectiveMatches;

    let tagMatches = candidates.filter(q => q.tag === tag);
    if(tagMatches.length > 0) return tagMatches;

    return candidates;
}

function pickRemediationFromBank(poolName, objectiveKey, tag, purpose = "confirm", skillKey = null){
    const pool = questionBanks[poolName] || [];
    const recentIds = (questionHistory[poolName] || []).slice(-10);

    let candidates = getQuestionsMatchingNeed(pool, objectiveKey, tag, recentIds, skillKey);

    if(candidates.length === 0){
        candidates = getQuestionsMatchingNeed(pool, objectiveKey, tag, [], skillKey);
    }

    if(candidates.length === 0) return null;

    const picked = weightedPick(candidates, {
        mode: purpose === "challenge" ? "challenge" : "support",
        preferredTypes: purpose === "challenge" ? ELITE_PREFERRED_TYPES : [],
        purpose
    });

    if(!questionHistory[poolName]) questionHistory[poolName] = [];
    questionHistory[poolName].push(picked.id);
    if(questionHistory[poolName].length > 15) questionHistory[poolName].shift();

    if(picked.tag){
        tagHistory.push(picked.tag);
        if(tagHistory.length > 10) tagHistory.shift();
    }

    return picked;
}

function getRemediationQuestion(state){
    if(!state || !state.active) return null;

    const excludeIds = [state.originQuestionId].filter(Boolean);

    if(state.stage === "repair"){
        if(state.skill && microSkillRepairPools[state.skill]){
            const skillRepairPool = microSkillRepairPools[state.skill] || [];
            const skillRepairCandidates = getQuestionsMatchingNeed(
                skillRepairPool,
                state.objective,
                state.tag,
                excludeIds,
                state.skill
            );

            if(skillRepairCandidates.length > 0){
                return weightedPick(skillRepairCandidates, {
                    mode: "support",
                    purpose: "repair"
                });
            }
        }

        const repairPool = microSkillRepairPools[state.skill] || [];
        const repairCandidates = getQuestionsMatchingNeed(
            repairPool,
            state.objective,
            state.tag,
            excludeIds,
            state.skill
        );

        if(repairCandidates.length > 0){
            return weightedPick(repairCandidates, {
                mode: "support",
                purpose: "repair"
            });
        }
    }

    if(state.stage === "bridge"){
        if(state.skill && microSkillBridgePools[state.skill]){
            const skillBridgePool = microSkillBridgePools[state.skill] || [];
            const skillBridgeCandidates = getQuestionsMatchingNeed(
                skillBridgePool,
                state.objective,
                state.tag,
                excludeIds,
                state.skill
            );

            if(skillBridgeCandidates.length > 0){
                return weightedPick(skillBridgeCandidates, {
                    mode: "support",
                    purpose: "confirm"
                });
            }
        }

        const allBridgePool = Object.values(microSkillBridgePools || {})
            .reduce((all, pool) => all.concat(pool), []);

        const bridgeCandidates = getQuestionsMatchingNeed(
            allBridgePool,
            state.objective,
            state.tag,
            excludeIds,
            state.skill
        );

        if(bridgeCandidates.length > 0){
            return weightedPick(bridgeCandidates, {
                mode: "support",
                purpose: "confirm"
            });
        }
    }

    const retestPoolName = getRetestPoolName();

    return pickRemediationFromBank(
        retestPoolName,
        state.objective,
        state.tag,
        state.stage === "retest" ? "challenge" : "confirm",
        state.skill
    );
}
function weightedPick(pool, options = {}){
    const {
        mode = "support",
        preferredTypes = [],
        purpose = "diversify"
    } = options;

    let totalWeight = 0;

    let weights = pool.map(q => {
        let w = 1;
        const tagAccuracy = q.tag ? getTagAccuracy(q.tag) : null;
        const typeAccuracy = (q.tag && q.type) ? getTagTypeAccuracy(q.tag, q.type) : null;
        const objectiveAccuracy = getObjectiveAccuracy(q);
        const tagFluency = q.tag ? getTagFluency(q.tag) : 0;
        const typeFluency = (q.tag && q.type) ? getTagTypeFluency(q.tag, q.type) : 0;
        const objectiveFluency = getObjectiveFluency(q);
        const conceptWeakness = q.tag ? (conceptMemory[q.tag] || 0) : 0;

        let recentCount = tagHistory.filter(t => t === q.tag).length;

        if(mode === "challenge"){
            w += clamp(tagFluency || 0, 0, 1.2) * 0.9;
            w += clamp(typeFluency || 0, 0, 1.0) * 0.6;
            w += clamp(objectiveFluency || 0, 0, 1.0) * 0.5;
            w += getTypePressure(q.type || "default");
            if(preferredTypes.includes(q.type)) w += 1.1;
            if(purpose === "stretch") w += 0.8;
        } else {
            const tagNeed = tagAccuracy === null ? 0.45 : (1 - tagAccuracy);
            const typeNeed = typeAccuracy === null ? 0.35 : (1 - typeAccuracy);
            const objectiveNeed = objectiveAccuracy === null ? 0.35 : (1 - objectiveAccuracy);
            const slowPenalty = clamp((getTimeRatio(getTypeBucket(q.tag, q.type), q.type) - 1), 0, 1.2);

            w += Math.min(conceptWeakness, 2.2);
            w += tagNeed * 0.7;
            w += typeNeed * 0.55;
            w += objectiveNeed * 0.85;
            w += slowPenalty * 0.35;

            if(purpose === "repair" && objectiveNeed > 0.35) w += 0.9;
            if(purpose === "confirm" && typeNeed > 0.25) w += 0.5;
        }

        // Coverage boost
        if(recentCount === 0){
            w += purpose === "diversify" ? 0.7 : 0.4;
        }

        w = Math.min(w, mode === "challenge" ? 5.5 : 4.5);
        totalWeight += w;
        return { q, w };
    });

    let r = Math.random() * totalWeight;

    for(let item of weights){
        r -= item.w;
        if(r <= 0){
            return item.q;
        }
    }

    return weights[weights.length - 1].q;
}

function getAdaptiveQuestion(poolName, targetTag = null, options = {}){
    let pool = questionBanks[poolName] || questionBanks.hard || questionBanks.medium || questionBanks.easy || [];
    const { mode = "support", preferredTypes = [], purpose = "diversify" } = options;

    if(!pool || pool.length === 0){
        return {
            id: 999999,
            q: "No question pool is available for this room. Check the questionBanks configuration.",
            options: ["Continue", "Continue", "Continue", "Continue"],
            a: 0,
            tag: "system",
            type: "default",
            objective: "system_check",
            feedback: "A question pool is missing."
        };
    }

    // --- 🎯 TARGET SPECIFIC TAG IF PROVIDED ---
    if(targetTag){
        let filtered = pool.filter(q => q.tag === targetTag);

        if(filtered.length >= Math.max(4, pool.length * 0.2)){
            pool = filtered;
        }
    }

    let recent = questionHistory[poolName].slice(-10);

    let available = pool.filter(q => !recent.includes(q.id));

    if(available.length < 3){
        available = pool.filter(q => !questionHistory[poolName].slice(-5).includes(q.id));
    }

    if(available.length === 0){
        available = pool.filter(q => !questionHistory[poolName].slice(-3).includes(q.id));
    }

    if(available.length === 0){
        available = pool;
    }

    let lastTags = tagHistory.slice(-2);

    let tagFiltered = available.filter(q => {
        return !(lastTags.length === 2 && lastTags.every(t => t === q.tag));
    });

    if(tagFiltered.length >= 3){
        available = tagFiltered;
    }

    console.log("AVAILABLE:", available.map(q => q.id));

    let picked = weightedPick(available, { mode, preferredTypes, purpose });

    console.log("PICKED:", picked.id);
    console.log("RECENT:", questionHistory[poolName]);

    questionHistory[poolName].push(picked.id);
    if(questionHistory[poolName].length > 15){
        questionHistory[poolName].shift();
    }

    if(picked.tag){
        tagHistory.push(picked.tag);
        if(tagHistory.length > 10){
            tagHistory.shift();
        }
    }

    return picked;
}

let activeModalConfirmAction = null;
let activeModalCancelAction = null;

function showGameModal({
    title = "Signal Warning",
    text = "",
    confirmText = "Continue",
    cancelText = "",
    onConfirm = null,
    onCancel = null
} = {}){
    const modal = document.getElementById("gameModal");
    const titleEl = document.getElementById("gameModalTitle");
    const textEl = document.getElementById("gameModalText");

    }

    activeModalConfirmAction = onConfirm;
    activeModalCancelAction = onCancel;

    titleEl.innerText = title;
    textEl.innerText = text;
    confirmBtn.innerText = confirmText;

    if(cancelText){
        cancelBtn.innerText = cancelText;
        cancelBtn.style.display = "inline-block";

    closeGameModal();

    if(typeof action === "function"){
        action();
    }
};

cancelBtn.onclick = function(){
    const action = activeModalCancelAction;
    closeGameModal();

    if(typeof action === "function"){
        action();
    }
};
}

function closeGameModal(){
    const modal = document.getElementById("gameModal");
    if(modal) modal.style.display = "none";

    activeModalConfirmAction = null;

}

function initializeRunForMode(mode){
    gameMode = mode || "standard";

    const autosave = document.getElementById("autosave");
    if(autosave){
        autosave.innerText = gameMode === "timed"
            ? "⏱ Timed Trial Active"
            : gameMode === "exam"
                ? "✎ Exam Drill Active"
                : gameMode === "legendary"
                    ? "🔥 Legendary Mode Active"
                    : gameMode === "bossRush"
                        ? "⚔ Boss Rush Active"
                        : "💾 Crisis Route Preserved";
    }

    if(gameMode === "timed"){
        startTimedModeClock();
    } else {
        stopTimedModeClock();
    }
}

function startTimedModeClock(){
    timedModeEndTime = Date.now() + timedModeDurationMs;

    const hud = document.getElementById("timedModeHud");
    if(hud) hud.style.display = "flex";

    updateTimedModeClock();

    if(timedModeTimerInterval){
        clearInterval(timedModeTimerInterval);
    }

    timedModeTimerInterval = setInterval(updateTimedModeClock, 250);
}

function stopTimedModeClock(){
    if(timedModeTimerInterval){
        clearInterval(timedModeTimerInterval);
        timedModeTimerInterval = null;
    }

    const hud = document.getElementById("timedModeHud");
    if(hud) hud.style.display = "none";

    const timerDisplay = document.getElementById("timerDisplay");
    if(timerDisplay){
        timerDisplay.classList.remove("timer-warning");
        timerDisplay.innerText = "10:00";
    }
}

function updateTimedModeClock(){
    if(gameMode !== "timed" || !timedModeEndTime) return;

    const remainingMs = Math.max(0, timedModeEndTime - Date.now());
    const totalSeconds = Math.ceil(remainingMs / 1000);
    const minutes = Math.floor(totalSeconds / 60);
    const seconds = totalSeconds % 60;

    const timerDisplay = document.getElementById("timerDisplay");
    if(timerDisplay){
        timerDisplay.innerText = `${minutes}:${String(seconds).padStart(2, "0")}`;
        timerDisplay.classList.toggle("timer-warning", remainingMs <= 60 * 1000);
    }

    if(remainingMs <= 0){
        endTimedModeRun();
    }
}

function endTimedModeRun(){
    if(gameMode !== "timed") return;

    stopTimedModeClock();
    gameMode = "timed-complete";

    const accuracy = totalAttempts > 0
        ? Math.round((correctAnswers / totalAttempts) * 100)
        : 0;

    const bestRoom = Number(localStorage.getItem("equilibriumCrisisTimedBestRoom") || 0);
    if(timedHighestRoom > bestRoom){
        localStorage.setItem("equilibriumCrisisTimedBestRoom", String(timedHighestRoom));
    }

    localStorage.setItem("equilibriumCrisisTimedLastRoom", String(room));
    localStorage.setItem("equilibriumCrisisTimedLastHighestRoom", String(timedHighestRoom));
    localStorage.setItem("equilibriumCrisisTimedLastAccuracy", String(accuracy));
    localStorage.setItem("equilibriumCrisisTimedLastAttempts", String(totalAttempts));
    localStorage.setItem("equilibriumCrisisTimedLastStreak", String(maxStreak));
    localStorage.setItem("equilibriumCrisisTimedLastSetbacks", String(timedSetbacks));
    recordTimedTrialAchievementStats(accuracy, timedHighestRoom);

    sendGameData({
        runID: runID,
        game: "The Equilibrium Crisis",
        event: "timed_complete",
        user: username,
        email: studentEmail,
        room: room,
        questionId: 0,
        correct: 1,
        tag: "",
        type: "",
        objective: "",
        responseTime: 0,
        attempt: totalAttempts,
        streak: streak,
        elapsedTime: startTime ? (Date.now() - startTime) : 0,
        adaptiveMode: "timed_complete",
        totalTime: timedModeDurationMs,
        accuracy: accuracy / 100,
        maxStreak: maxStreak,
        totalAttempts: totalAttempts
    });

    document.getElementById("bossMessage").innerText = "";
    document.getElementById("formulaHint").innerText = "";
    document.getElementById("artifactDrop").style.display = "none";
    document.getElementById("questionImageBox").style.display = "none";

    document.getElementById("question").innerHTML = `
        <span class="boss-title">TIME EXPIRED</span>
        <div class="boss-q">
            You reached as far as Room ${timedHighestRoom}.<br><br>
            Final Room: ${room}<br>
            Accuracy: ${accuracy}%<br>
            Total Attempts: ${totalAttempts}<br>
            Best Streak: ${maxStreak}<br>
            Setbacks Taken: ${timedSetbacks}
        </div>
    `;

    document.getElementById("answers").innerHTML = `
        <button class="continue-btn" onclick="restartTimedMode()">Retry Timed Trial</button>
        <button class="continue-btn" onclick="returnToModeSelectFromRun()">Choose Another Crisis Run</button>
    `;

    document.getElementById("message").innerText = "The trial ends. The market remembers.";
}

function getDifficultyForMode(){
    if(gameMode === "exam" || gameMode === "timed"){
        return (room <= 10) ? "easy"
            : (room <= 20) ? "medium"
            : "hard";
    }

    if(gameMode === "legendary"){
        return (room === 10 || room === 20 || room === 30)
            ? "legendaryBoss"
            : "legendary";
    }

    if(gameMode === "bossRush"){
        return (room <= 10) ? "easyBoss"
            : (room <= 20) ? "mediumBoss"
            : "finalBoss";
    }

    return (room <= 9) ? "easy"
         : (room === 10) ? "easyBoss"
         : (room <= 19) ? "medium"
         : (room === 20) ? "mediumBoss"
         : (room <= 29) ? "hard"
         : "finalBoss";
}

  {"id":14004,sourceGame:"marketGate","q":"Refer to the PPF graph. Why does the opportunity cost of Good X rise as production moves from A toward E?","options":["Resources are increasingly less suited to producing additional X","Resources become perfectly adaptable between X and Y","The economy has escaped scarcity by moving along the curve","The money price of X must fall as X production rises"],"a":0,"tag":"ppf","type":"graph_interpretation","objective":"LO2.2","difficulty":"legendary","conceptCluster":"legendary_market_gate","primarySkill":"increasing_opportunity_cost","secondarySkills":[],"repairSkill":"increasing_opportunity_cost","commonError":"legendary_near_match_error","feedback":"A bowed-out PPF reflects increasing opportunity cost because resources are not equally suited to both goods.","image":"ppf.png"},
  {"id":14005,sourceGame:"marketGate","q":"A planner can produce more emergency generators only by pulling engineers away from water-system repairs. The first 10 generators cost 2 repairs, but the next 10 cost 6 repairs. What is the best interpretation of this production choice?","options":["Opportunity cost rises because resources are not equally adaptable across uses","Opportunity cost falls because the planner learns to produce generators faster","Opportunity cost disappears because both outputs are public priorities","Opportunity cost is only the dollar wage paid to the engineers"],"a":0,"tag":"ppf","type":"multi-step","objective":"LO2.2","difficulty":"legendary","conceptCluster":"legendary_market_gate","primarySkill":"increasing_opportunity_cost","secondarySkills":[],"repairSkill":"increasing_opportunity_cost","commonError":"legendary_near_match_error","feedback":"The increasing repair sacrifice shows increasing opportunity cost, not just a money-cost problem."},
{ "id": 14006, sourceGame: "marketGate", "q": "A city can repair 12 bridges or reopen 4 schools with the same crews. After shifting the easiest crews to schools, reopening 4 more schools would require giving up 18 bridge repairs. What does this show?", "options": ["Increasing opportunity cost because resources are not equally suited to both tasks", "Constant opportunity cost because schools and bridges use the same crews", "No opportunity cost because both projects help the public", "A demand shift because schools became more popular"], "a": 0, "tag": "ppf", "type": "multi-step", "objective": "LO2.2", "difficulty": "legendary", "conceptCluster": "legendary_market_gate", "primarySkill": "increasing_opportunity_cost", "secondarySkills": ["resource_specialization", "tradeoff_analysis"], "repairSkill": "increasing_opportunity_cost", "commonError": "treats_public_projects_as_costless", "feedback": "The rising bridge sacrifice shows increasing opportunity cost caused by specialized resources." },
{ "id": 14007, sourceGame: "marketGate", "q": "Refer to a bowed-out PPF. Moving from point A to B costs 4 units of Y for 5 units of X. Moving from D to E costs 14 units of Y for 5 units of X. What is the best interpretation?", "options": ["The opportunity cost of X rises as more X is produced", "The opportunity cost of X falls as more X is produced", "The economy has eliminated scarcity", "The PPF must be a straight line"], "a": 0, "tag": "ppf", "type": "graph_interpretation", "objective": "LO2.2", "difficulty": "legendary", "conceptCluster": "legendary_market_gate", "primarySkill": "increasing_opportunity_cost", "secondarySkills": ["ppf_shape", "opportunity_cost"], "repairSkill": "increasing_opportunity_cost", "commonError": "confuses_total_output_with_marginal_tradeoff", "feedback": "On a bowed-out PPF, producing more of one good usually requires giving up larger amounts of the other good." },
{ "id": 14008, sourceGame: "marketGate", "q": "An economy is inside its PPF because workers and machines are idle. Which change moves it toward efficiency but does not represent long-run growth?", "options": ["Putting idle workers and machines back to work on the existing frontier", "Inventing new technology that shifts the frontier outward", "Discovering new natural resources that expand production possibilities", "Training workers so the economy can produce more of both goods than before"], "a": 0, "tag": "ppf", "type": "trap", "objective": "LO2.2", "difficulty": "legendary", "conceptCluster": "legendary_market_gate", "primarySkill": "efficiency_vs_growth", "secondarySkills": ["idle_resources", "ppf_shift"], "repairSkill": "ppf_efficiency_status", "commonError": "confuses_movement_to_frontier_with_outward_shift", "feedback": "Using idle resources moves the economy toward the existing frontier. Growth shifts the frontier outward." },
{ "id": 14009, sourceGame: "marketGate", "q": "A PPF shifts outward for both goods after worker training improves. Which chapter connection is being tested?", "options": ["Human capital raises productive capacity", "A price ceiling creates a shortage", "A tax wedge reduces market size", "A positive statement becomes normative"], "a": 0, "tag": "ppf", "type": "synthesis", "objective": "LO2.2", "difficulty": "legendary", "conceptCluster": "legendary_market_gate", "primarySkill": "ppf_growth_source", "secondarySkills": ["human_capital", "productive_capacity"], "repairSkill": "ppf_shift_growth", "commonError": "treats_worker_training_as_movement_along_ppf_only", "feedback": "Better worker training improves human capital and can shift the PPF outward." },
{ "id": 14010, sourceGame: "marketGate", "q": "A student says, 'Point outside the PPF is inefficient because the economy is not producing there.' What is wrong with that statement?", "options": ["A point outside the PPF is unattainable with current resources, not merely inefficient", "A point outside the PPF is always efficient", "A point outside the PPF shows idle resources", "A point outside the PPF means opportunity cost is zero"], "a": 0, "tag": "ppf", "type": "trap", "objective": "LO2.2", "difficulty": "legendary", "conceptCluster": "legendary_market_gate", "primarySkill": "ppf_efficiency_status", "secondarySkills": ["attainable_vs_unattainable"], "repairSkill": "ppf_efficiency_status", "commonError": "confuses_unattainable_with_inefficient", "feedback": "Inside the PPF is inefficient. Outside the PPF is unattainable with current resources and technology." },
{ "id": 14011, sourceGame: "marketGate", "q": "A college student can work 20 hours and study 5 hours, or work 10 hours and study 18 hours. What is the opportunity cost of gaining 13 study hours?", "options": ["10 hours of work", "13 hours of work", "18 hours of study", "Zero because studying is productive"], "a": 0, "tag": "opportunity_cost", "type": "calculation", "objective": "LO1.2", "difficulty": "legendary", "conceptCluster": "legendary_market_gate", "primarySkill": "opportunity_cost_calculation", "secondarySkills": ["tradeoff_identification"], "repairSkill": "opportunity_cost_definition", "commonError": "uses_gain_in_chosen_activity_as_cost", "feedback": "The student gains 13 study hours by giving up 10 work hours, so the opportunity cost is 10 work hours." },
{ "id": 14012, sourceGame: "marketGate", "q": "A manager has already spent $40,000 developing a product. Finishing it costs $12,000 more and is expected to bring in $18,000. What should the manager do using marginal reasoning?", "options": ["Finish it because the marginal benefit exceeds the marginal cost", "Cancel it because total cost is $52,000", "Finish it because sunk costs should determine the choice", "Cancel it because marginal cost is always bad"], "a": 0, "tag": "marginal", "type": "multi-step", "objective": "LO1.3", "difficulty": "legendary", "conceptCluster": "legendary_market_gate", "primarySkill": "marginal_benefit_cost_decision", "secondarySkills": ["sunk_cost_trap"], "repairSkill": "marginal_benefit_cost_decision", "commonError": "includes_sunk_cost_in_marginal_decision", "feedback": "The $40,000 is sunk. The relevant comparison is $18,000 in added benefit versus $12,000 in added cost." },
{ "id": 14013, sourceGame: "marketGate", "q": "A new safety rule reduces accident risk but also forces firms to cut output because compliance uses scarce labor and equipment. What core idea is most directly involved?", "options": ["Policy choices involve tradeoffs even when the goal is worthwhile", "Government rules eliminate opportunity cost", "Scarcity applies only to consumers", "Efficiency and equality always move in the same direction"], "a": 0, "tag": "tradeoffs", "type": "synthesis", "objective": "LO1.1", "difficulty": "legendary", "conceptCluster": "legendary_market_gate", "primarySkill": "policy_tradeoff_analysis", "secondarySkills": ["scarcity", "opportunity_cost"], "repairSkill": "tradeoff_identification", "commonError": "ignores_tradeoffs_when_policy_goal_is_good", "feedback": "Even worthwhile policies use scarce resources and create tradeoffs." },
{ "id": 14014, sourceGame: "marketGate", "q": "A PPF is straight rather than bowed out. What does that imply about opportunity cost?", "options": ["Opportunity cost is constant because resources shift between goods at a constant rate", "Opportunity cost is increasing because all PPFs are bowed outward", "Opportunity cost is zero because production is efficient", "Opportunity cost is impossible to calculate from a PPF"], "a": 0, "tag": "ppf", "type": "trap", "objective": "LO2.2", "difficulty": "legendary", "conceptCluster": "legendary_market_gate", "primarySkill": "constant_vs_increasing_opportunity_cost", "secondarySkills": ["ppf_shape"], "repairSkill": "ppf_opportunity_cost", "commonError": "assumes_all_ppfs_show_increasing_opportunity_cost", "feedback": "A straight-line PPF represents constant opportunity cost." },

{ "id": 14021, sourceGame: "marketGate", "q": "Demand for laptops rises while a chip shortage reduces supply. Without knowing curve sizes, what can be said with confidence?", "options": ["Equilibrium price rises, while equilibrium quantity is ambiguous", "Equilibrium quantity rises, while equilibrium price is ambiguous", "Both price and quantity must fall", "Both price and quantity must rise"], "a": 0, "tag": "equilibrium", "type": "multi-step", "objective": "LO4.4", "difficulty": "legendary", "conceptCluster": "legendary_market_gate", "primarySkill": "simultaneous_shifts", "secondarySkills": ["demand_increase", "supply_decrease"], "repairSkill": "simultaneous_shifts", "commonError": "forces_quantity_direction_without_curve_size", "feedback": "Demand rising pushes price up and quantity up; supply falling pushes price up and quantity down. Price rises, quantity is ambiguous." },
{ "id": 14022, sourceGame: "marketGate", "q": "Demand for restaurant meals falls while lower food costs increase supply. Without exact curve sizes, what is the strongest conclusion?", "options": ["Equilibrium price falls, while equilibrium quantity is ambiguous", "Equilibrium quantity falls, while equilibrium price is ambiguous", "Both price and quantity must rise", "Both price and quantity must fall"], "a": 0, "tag": "equilibrium", "type": "multi-step", "objective": "LO4.4", "difficulty": "legendary", "conceptCluster": "legendary_market_gate", "primarySkill": "simultaneous_shifts", "secondarySkills": ["demand_decrease", "supply_increase"], "repairSkill": "simultaneous_shifts", "commonError": "assumes_quantity_must_follow_demand_shift_only", "feedback": "Demand falling lowers price and quantity; supply rising lowers price and raises quantity. Price falls, quantity is ambiguous." },
{ "id": 14023, sourceGame: "marketGate", "q": "The price of tablets falls, and consumers buy more tablets. No non-price determinant changed. What happened?", "options": ["Quantity demanded increased through movement along the demand curve", "Demand increased and the curve shifted right", "Supply increased and the curve shifted right", "Demand decreased because price fell"], "a": 0, "tag": "demand", "type": "trap", "objective": "LO4.2", "difficulty": "legendary", "conceptCluster": "legendary_market_gate", "primarySkill": "movement_vs_shift", "secondarySkills": ["law_of_demand"], "repairSkill": "movement_vs_shift", "commonError": "calls_price_change_a_demand_shift", "feedback": "A change in the good's own price causes movement along demand, not a demand shift." },
{ "id": 14024, sourceGame: "marketGate", "q": "The price of a substitute for coffee rises. What happens in the coffee market, holding other factors constant?", "options": ["Demand for coffee increases, raising equilibrium price and quantity", "Quantity demanded of coffee decreases along the same curve", "Supply of coffee increases because coffee is now profitable", "Demand for coffee decreases because substitutes are now expensive"], "a": 0, "tag": "demand", "type": "interpretation", "objective": "LO4.2", "difficulty": "legendary", "conceptCluster": "legendary_market_gate", "primarySkill": "related_goods_demand_shift", "secondarySkills": ["substitutes", "equilibrium_effects"], "repairSkill": "demand_shifters", "commonError": "confuses_substitutes_with_complements", "feedback": "When a substitute becomes more expensive, demand for the original good rises." },
{ "id": 14025, sourceGame: "marketGate", "q": "The price of peanut butter falls. What happens to the demand for jelly, assuming they are complements?", "options": ["Demand for jelly increases", "Quantity demanded of jelly falls along the same curve", "Supply of jelly decreases", "Demand for jelly decreases because peanut butter is cheaper"], "a": 0, "tag": "demand", "type": "trap", "objective": "LO4.2", "difficulty": "legendary", "conceptCluster": "legendary_market_gate", "primarySkill": "complement_demand_shift", "secondarySkills": ["related_goods", "demand_shifters"], "repairSkill": "demand_shifters", "commonError": "moves_along_jelly_demand_when_related_good_price_changes", "feedback": "A lower price for a complement increases demand for the related good." },
{ "id": 14026, sourceGame: "marketGate", "q": "Input costs rise for producers of bicycles. At the same time, consumer income rises and bicycles are a normal good. What is the clearest prediction?", "options": ["Equilibrium price rises, while equilibrium quantity is ambiguous", "Equilibrium quantity rises, while price is ambiguous", "Both price and quantity must fall", "Price must fall because income rose"], "a": 0, "tag": "equilibrium", "type": "synthesis", "objective": "LO4.4", "difficulty": "legendary", "conceptCluster": "legendary_market_gate", "primarySkill": "simultaneous_shifts", "secondarySkills": ["supply_decrease", "demand_increase", "normal_good"], "repairSkill": "simultaneous_shifts", "commonError": "tracks_only_one_curve_shift", "feedback": "Higher input costs decrease supply, while higher income increases demand. Both push price up; quantity is ambiguous." },
{ "id": 14027, sourceGame: "marketGate", "q": "A technological improvement reduces production costs while consumer tastes shift away from the good. What is the strongest prediction?", "options": ["Equilibrium price falls, while equilibrium quantity is ambiguous", "Equilibrium quantity falls, while price is ambiguous", "Both price and quantity must rise", "Price must rise because technology improved"], "a": 0, "tag": "equilibrium", "type": "synthesis", "objective": "LO4.4", "difficulty": "legendary", "conceptCluster": "legendary_market_gate", "primarySkill": "simultaneous_shifts", "secondarySkills": ["supply_increase", "demand_decrease"], "repairSkill": "simultaneous_shifts", "commonError": "assumes_technology_always_raises_price", "feedback": "Supply increase lowers price; demand decrease also lowers price. Quantity is ambiguous because the shifts push quantity in opposite directions." },
{ "id": 14028, sourceGame: "marketGate", "q": "A market price is above equilibrium. What pressure does the market create and why?", "options": ["Downward pressure on price because quantity supplied exceeds quantity demanded", "Upward pressure on price because quantity demanded exceeds quantity supplied", "No pressure because high prices clear every market", "Downward pressure on quantity demanded because demand shifts left"], "a": 0, "tag": "equilibrium", "type": "interpretation", "objective": "LO4.4", "difficulty": "legendary", "conceptCluster": "legendary_market_gate", "primarySkill": "surplus_market_adjustment", "secondarySkills": ["quantity_supplied", "quantity_demanded"], "repairSkill": "surplus_shortage_adjustment", "commonError": "confuses_surplus_with_shortage", "feedback": "A price above equilibrium creates a surplus, so sellers have an incentive to lower price." },
{ "id": 14029, sourceGame: "marketGate", "q": "A market price is below equilibrium. What pressure does the market create and why?", "options": ["Upward pressure on price because quantity demanded exceeds quantity supplied", "Downward pressure on price because quantity supplied exceeds quantity demanded", "No pressure because buyers prefer low prices", "A supply increase because the legal price is low"], "a": 0, "tag": "equilibrium", "type": "interpretation", "objective": "LO4.4", "difficulty": "legendary", "conceptCluster": "legendary_market_gate", "primarySkill": "shortage_market_adjustment", "secondarySkills": ["quantity_demanded", "quantity_supplied"], "repairSkill": "surplus_shortage_adjustment", "commonError": "confuses_shortage_with_surplus", "feedback": "A price below equilibrium creates a shortage, so buyers compete and push price upward." },
{ "id": 14030, sourceGame: "marketGate", "q": "A coffee shop sees more customers after a celebrity endorsement. At the same time, wages for baristas rise. What outcome is certain if both effects are strong but unknown in size?", "options": ["Price rises; quantity is ambiguous", "Quantity rises; price is ambiguous", "Both price and quantity fall", "Price falls; quantity rises"], "a": 0, "tag": "equilibrium", "type": "multi-step", "objective": "LO4.4", "difficulty": "legendary", "conceptCluster": "legendary_market_gate", "primarySkill": "simultaneous_shifts", "secondarySkills": ["demand_increase", "supply_decrease", "input_costs"], "repairSkill": "simultaneous_shifts", "commonError": "assumes_popularity_always_raises_quantity", "feedback": "Demand increases and supply decreases. Both raise price, but quantity depends on which shift is larger." },
{ "id": 14031, sourceGame: "marketGate", "q": "A new production method makes shoes cheaper to produce. At the same time, a fashion shift makes shoes less popular. What is certain?", "options": ["Price falls; quantity is ambiguous", "Quantity falls; price is ambiguous", "Both price and quantity rise", "Price rises; quantity falls"], "a": 0, "tag": "equilibrium", "type": "multi-step", "objective": "LO4.4", "difficulty": "legendary", "conceptCluster": "legendary_market_gate", "primarySkill": "simultaneous_shifts", "secondarySkills": ["supply_increase", "demand_decrease"], "repairSkill": "simultaneous_shifts", "commonError": "assumes_less_popularity_always_lowers_quantity_and_price_only", "feedback": "Supply increases and demand decreases. Both lower price, but quantity is ambiguous." },
{ "id": 14032, sourceGame: "marketGate", "q": "A hurricane destroys supply while households expect prices to rise tomorrow and rush to buy today. What is the strongest prediction for today's market?", "options": ["Price rises; quantity is ambiguous", "Quantity rises; price is ambiguous", "Both price and quantity fall", "Price falls; quantity rises"], "a": 0, "tag": "equilibrium", "type": "synthesis", "objective": "LO4.4", "difficulty": "legendary", "conceptCluster": "legendary_market_gate", "primarySkill": "expectations_and_supply_shock", "secondarySkills": ["demand_increase", "supply_decrease"], "repairSkill": "simultaneous_shifts", "commonError": "ignores_expectations_as_demand_shifter", "feedback": "Expected future price increases raise current demand, while the hurricane lowers supply. Price rises; quantity is ambiguous." },
{ "id": 14033, sourceGame: "marketGate", "q": "A student says, 'Demand increased because the price rose.' What is the correct response?", "options": ["That reverses the logic; a demand increase can raise price, but a price rise alone causes movement along demand", "That is correct because demand always means the current price", "That describes a supply increase", "That proves the good is inferior"], "a": 0, "tag": "demand", "type": "trap", "objective": "LO4.2", "difficulty": "legendary", "conceptCluster": "legendary_market_gate", "primarySkill": "movement_vs_shift", "secondarySkills": ["causal_reasoning"], "repairSkill": "movement_vs_shift", "commonError": "uses_price_change_as_evidence_of_demand_shift_without_shifter", "feedback": "A price rise can be caused by a demand increase, but the price rise itself does not shift demand." },
{ "id": 14034, sourceGame: "marketGate", "q": "Both supply and demand decrease. Without curve sizes, what is the strongest conclusion?", "options": ["Equilibrium quantity falls, while equilibrium price is ambiguous", "Equilibrium price falls, while quantity is ambiguous", "Both price and quantity must rise", "Both price and quantity must stay constant"], "a": 0, "tag": "equilibrium", "type": "multi-step", "objective": "LO4.4", "difficulty": "legendary", "conceptCluster": "legendary_market_gate", "primarySkill": "simultaneous_shifts", "secondarySkills": ["demand_decrease", "supply_decrease"], "repairSkill": "simultaneous_shifts", "commonError": "forces_price_direction_without_curve_size", "feedback": "Both shifts reduce quantity. Demand decrease lowers price, while supply decrease raises price, so price is ambiguous." },
