  { id: 10072, sourceGame: "marketGate", q: "A tax levied on sellers and an equal tax levied on buyers are generally:", options: ["Equivalent in their market effects", "Completely unrelated", "Opposite in their effect on quantity", "Always paid only by sellers"], a: 0, tag: "taxes", type: "definition", objective: "LO6.4", difficulty: "easy", conceptCluster: "government_policy", primarySkill: "buyer_seller_tax_equivalence", secondarySkills: ["tax_wedge_identification"], repairSkill: "tax_equivalence", commonError: "thinks_legal_tax_assignment_determines_full_burden", feedback: "A tax on buyers or sellers creates the same wedge and similar market effects." },
  { id: 10073, sourceGame: "marketGate", q: "Tax incidence means:", options: ["How the burden of a tax is divided between buyers and sellers", "The legal maximum price", "The number of firms in a market", "The quantity demanded at every price"], a: 0, tag: "tax_incidence", type: "definition", objective: "LO6.5", difficulty: "easy", conceptCluster: "government_policy", primarySkill: "tax_incidence_definition", secondarySkills: ["buyer_seller_tax_burden"], repairSkill: "tax_incidence_less_elastic_side", commonError: "confuses_tax_incidence_with_tax_collection", feedback: "Tax incidence is about who bears the burden of the tax, not just who sends the payment." },
  { id: 10074, sourceGame: "marketGate", q: "The side of the market that is less elastic usually bears:", options: ["More of the tax burden", "None of the tax burden", "Only the legal paperwork", "All of the producer surplus"], a: 0, tag: "tax_incidence", type: "definition", objective: "LO6.5", difficulty: "easy", conceptCluster: "government_policy", primarySkill: "tax_burden_less_elastic_side", secondarySkills: ["elasticity_and_tax_burden"], repairSkill: "tax_incidence_less_elastic_side", commonError: "thinks_more_elastic_side_bears_more_tax", feedback: "The less elastic side bears more of the tax burden because it responds less to price changes." },
  { id: 10075, sourceGame: "marketGate", q: "If demand is less elastic than supply, who bears more of a tax?", options: ["Buyers", "Sellers", "Neither side", "Only the government"], a: 0, tag: "tax_incidence", type: "interpretation", objective: "LO6.5", difficulty: "easy", conceptCluster: "government_policy", primarySkill: "tax_burden_less_elastic_side", secondarySkills: ["tax_incidence_definition"], repairSkill: "tax_incidence_less_elastic_side", commonError: "gets_less_elastic_side_backwards", feedback: "Buyers bear more because demand is less elastic than supply." },
  { id: 10076, sourceGame: "marketGate", q: "If supply is less elastic than demand, who bears more of a tax?", options: ["Sellers", "Buyers", "Neither side", "Only outside firms"], a: 0, tag: "tax_incidence", type: "interpretation", objective: "LO6.5", difficulty: "easy", conceptCluster: "government_policy", primarySkill: "tax_burden_less_elastic_side", secondarySkills: ["tax_incidence_definition"], repairSkill: "tax_incidence_less_elastic_side", commonError: "gets_less_elastic_side_backwards", feedback: "Sellers bear more because supply is less elastic than demand." },
  { id: 10077, sourceGame: "marketGate", q: "A price ceiling below equilibrium and a price floor above equilibrium are both:", options: ["Binding price controls", "Examples of market equilibrium", "Taxes on sellers", "Demand shifters"], a: 0, tag: "price_controls", type: "interpretation", objective: "LO6.1", difficulty: "easy", conceptCluster: "government_policy", primarySkill: "binding_price_control_identification", secondarySkills: ["binding_price_ceiling", "binding_price_floor"], repairSkill: "binding_price_controls", commonError: "cannot_distinguish_binding_from_nonbinding_controls", feedback: "Both controls are binding because they prevent the market from reaching equilibrium." },
  { id: 10078, sourceGame: "marketGate", q: "Which policy would most likely create a shortage?", options: ["A binding price ceiling", "A binding price floor", "A tax wedge", "An outward PPF shift"], a: 0, tag: "price_ceiling", type: "interpretation", objective: "LO6.1", difficulty: "easy", conceptCluster: "government_policy", primarySkill: "ceiling_shortage_effect", secondarySkills: ["binding_price_ceiling"], repairSkill: "binding_price_ceiling", commonError: "confuses_shortage_with_surplus", feedback: "A binding price ceiling creates a shortage because price is held below equilibrium." },
  { id: 10079, sourceGame: "marketGate", q: "Which policy would most likely create a surplus?", options: ["A binding price floor", "A binding price ceiling", "A decrease in supply", "A positive statement"], a: 0, tag: "price_floor", type: "interpretation", objective: "LO6.2", difficulty: "easy", conceptCluster: "government_policy", primarySkill: "floor_surplus_effect", secondarySkills: ["binding_price_floor"], repairSkill: "binding_price_floor", commonError: "confuses_surplus_with_shortage", feedback: "A binding price floor creates a surplus because price is held above equilibrium." },
  { id:10080, sourceGame: "nationalLedger", difficulty:"easy", conceptCluster:"gdp_measurement", primarySkill:"income_expenditure_identity", secondarySkills:["gdp_counting_rules"], repairSkill:"income_expenditure_identity", commonError:"Treating spending and income as unrelated totals instead of two sides of the same transaction.", q:"In the circular flow of income and expenditure, why does total income equal total expenditure?", options:["Every dollar spent by a buyer becomes income for a seller","Government sets income equal to spending","Exports always equal imports","Savings are never counted"], a:0, tag:"gdp_income_expenditure", type:"definition", objective:"LO24.1", feedback:"Income equals expenditure because one person's spending becomes another person's income." },
  { id:10081, sourceGame: "nationalLedger", difficulty:"easy", conceptCluster:"gdp_measurement", primarySkill:"income_expenditure_identity", secondarySkills:["gdp_counting_rules"], repairSkill:"income_expenditure_identity", commonError:"Treating spending and income as unrelated totals instead of two sides of the same transaction.", q:"If households spend $500 billion buying goods and services, what happens to sellers' income in the basic income-expenditure logic?", options:["It rises by $500 billion","It falls by $500 billion","It is unchanged","It only rises if taxes fall"], a:0, tag:"gdp_income_expenditure", type:"interpretation", objective:"LO24.1", feedback:"Spending by buyers becomes income for sellers, so seller income rises by the same amount." },
  { id:10082, sourceGame: "nationalLedger", difficulty:"easy", conceptCluster:"gdp_measurement", primarySkill:"income_expenditure_identity", secondarySkills:["gdp_counting_rules"], repairSkill:"income_expenditure_identity", commonError:"Treating spending and income as unrelated totals instead of two sides of the same transaction.", q:"GDP measures which two sides of economic activity?", options:["Total income and total expenditure","Taxes and imports","Profits and inflation","Wages and unemployment"], a:0, tag:"gdp_income_expenditure", type:"definition", objective:"LO24.1", feedback:"GDP can be measured as total income or total expenditure because those two sides are linked." },
  { id:10083, sourceGame: "nationalLedger", difficulty:"easy", conceptCluster:"gdp_measurement", primarySkill:"income_expenditure_identity", secondarySkills:["gdp_counting_rules"], repairSkill:"income_expenditure_identity", commonError:"Treating spending and income as unrelated totals instead of two sides of the same transaction.", q:"If total expenditure in an economy is $20 trillion, what is total income in the basic GDP accounting identity?", options:["$20 trillion","$10 trillion","$40 trillion","It cannot be determined"], a:0, tag:"gdp_income_expenditure", type:"calculation", objective:"LO24.1", feedback:"In the basic circular-flow logic, total expenditure equals total income." },
  { id:10084, sourceGame: "nationalLedger", difficulty:"easy", conceptCluster:"gdp_measurement", primarySkill:"gdp_counting_rules", secondarySkills:["intermediate_vs_final_goods"], repairSkill:"gdp_counting_rules", commonError:"Counting transactions that are not current domestic production, such as used goods, financial assets, or foreign production.", q:"Which statement best defines GDP?", options:["The market value of all final goods and services produced within a country in a given period","The total value of all used goods sold in a year","The total income earned only by government workers","The total amount of money printed by the central bank"], a:0, tag:"gdp_definition", type:"definition", objective:"LO24.2", feedback:"GDP is the market value of final goods and services produced within a country during a period." },
  { id:10085, sourceGame: "nationalLedger", difficulty:"easy", conceptCluster:"gdp_measurement", primarySkill:"gdp_counting_rules", secondarySkills:["intermediate_vs_final_goods"], repairSkill:"gdp_counting_rules", commonError:"Counting transactions that are not current domestic production, such as used goods, financial assets, or foreign production.", q:"A newly produced car sold to a household is counted in GDP because it is:", options:["A final good produced in the current period","A used good resold in the current period","An intermediate good","A financial asset"], a:0, tag:"gdp_definition", type:"interpretation", objective:"LO24.2", feedback:"Newly produced final goods are counted in GDP." },
  { id:10086, sourceGame: "nationalLedger", difficulty:"easy", conceptCluster:"gdp_measurement", primarySkill:"intermediate_vs_final_goods", secondarySkills:["gdp_counting_rules"], repairSkill:"intermediate_vs_final_goods", commonError:"Double-counting intermediate goods instead of counting final value or value added.", q:"Why are intermediate goods usually not counted separately in GDP?", options:["Their value is already included in the final good","They are always imported","They are not produced by firms","They have no market price"], a:0, tag:"gdp_definition", type:"definition", objective:"LO24.2", feedback:"Counting intermediate goods separately would double count their value." },
  { id:10087, sourceGame: "nationalLedger", difficulty:"easy", conceptCluster:"gdp_measurement", primarySkill:"intermediate_vs_final_goods", secondarySkills:["gdp_counting_rules"], repairSkill:"intermediate_vs_final_goods", commonError:"Double-counting intermediate goods instead of counting final value or value added.", q:"A bakery buys flour for $20 and sells bread for $50. What value is counted in GDP from the final bread sale?", options:["$50","$20","$70","$30 only"], a:0, tag:"gdp_definition", type:"calculation", objective:"LO24.2", feedback:"GDP counts the final good, so the bread sale counts as $50." },
  { id:10088, sourceGame: "nationalLedger", difficulty:"easy", conceptCluster:"gdp_measurement", primarySkill:"gdp_counting_rules", secondarySkills:["intermediate_vs_final_goods"], repairSkill:"gdp_counting_rules", commonError:"Counting transactions that are not current domestic production, such as used goods, financial assets, or foreign production.", q:"Which purchase is not counted in current GDP?", options:["Buying a used textbook from another student","Buying a newly produced textbook","Buying a new laptop made domestically","Paying for a haircut"], a:0, tag:"gdp_definition", type:"trap", objective:"LO24.2", feedback:"Used goods were counted when first produced, so resale does not count in current GDP." },
  { id:10089, sourceGame: "nationalLedger", difficulty:"easy", conceptCluster:"gdp_components", primarySkill:"gdp_components_identity", secondarySkills:["imports_exports_nx", "inventory_investment"], repairSkill:"gdp_components_identity", commonError:"Mixing up the GDP expenditure components or forgetting the C + I + G + NX identity.", q:"Which of the following is one of the four components of GDP expenditure?", options:["Consumption","Inflation","Unemployment","Depreciation"], a:0, tag:"gdp_components", type:"definition", objective:"LO24.3", feedback:"Consumption is one of the four expenditure components of GDP." },
  { id:10090, sourceGame: "nationalLedger", difficulty:"easy", conceptCluster:"gdp_components", primarySkill:"gdp_components_identity", secondarySkills:["imports_exports_nx", "inventory_investment"], repairSkill:"gdp_components_identity", commonError:"Mixing up the GDP expenditure components or forgetting the C + I + G + NX identity.", q:"The GDP expenditure identity is:", options:["Y = C + I + G + NX","Y = C - I + G - NX","Y = wages + prices + taxes","Y = inflation + unemployment"], a:0, tag:"gdp_components", type:"definition", objective:"LO24.3", feedback:"GDP expenditure is consumption plus investment plus government purchases plus net exports." },
  { id:10091, sourceGame: "nationalLedger", difficulty:"easy", conceptCluster:"gdp_components", primarySkill:"gdp_components_identity", secondarySkills:["imports_exports_nx", "inventory_investment"], repairSkill:"gdp_components_identity", commonError:"Mixing up the GDP expenditure components or forgetting the C + I + G + NX identity.", q:"If C = 10, I = 3, G = 4, and NX = -1, what is GDP?", options:["16","18","14","10"], a:0, tag:"gdp_components", type:"calculation", objective:"LO24.3", feedback:"GDP = 10 + 3 + 4 - 1 = 16." },
  { id:10092, sourceGame: "nationalLedger", difficulty:"easy", conceptCluster:"gdp_components", primarySkill:"imports_exports_nx", secondarySkills:["gdp_components_identity"], repairSkill:"imports_exports_nx", commonError:"Adding imports instead of subtracting them through net exports.", q:"Net exports are calculated as:", options:["Exports minus imports","Imports minus exports","Consumption minus investment","Government purchases minus taxes"], a:0, tag:"gdp_components", type:"definition", objective:"LO24.3", feedback:"Net exports equal exports minus imports." },
  { id:10093, sourceGame: "nationalLedger", difficulty:"easy", conceptCluster:"gdp_components", primarySkill:"gdp_components_identity", secondarySkills:["imports_exports_nx", "inventory_investment"], repairSkill:"gdp_components_identity", commonError:"Mixing up the GDP expenditure components or forgetting the C + I + G + NX identity.", q:"A household buys groceries. Which GDP component does this most directly enter?", options:["Consumption","Investment","Government purchases","Net exports"], a:0, tag:"gdp_components", type:"interpretation", objective:"LO24.3", feedback:"Household spending on goods and services is consumption." },
  { id:10094, sourceGame: "nationalLedger", difficulty:"easy", conceptCluster:"gdp_components", primarySkill:"gdp_components_identity", secondarySkills:["imports_exports_nx", "inventory_investment"], repairSkill:"gdp_components_identity", commonError:"Mixing up the GDP expenditure components or forgetting the C + I + G + NX identity.", q:"A firm buys new machinery to produce more output. Which GDP component does this enter?", options:["Investment","Consumption","Government purchases","Net exports"], a:0, tag:"gdp_components", type:"interpretation", objective:"LO24.3", feedback:"Business spending on capital goods is investment." },
  { id:10095, sourceGame: "nationalLedger", difficulty:"easy", conceptCluster:"real_nominal_gdp", primarySkill:"nominal_vs_real_gdp", secondarySkills:["gdp_deflator"], repairSkill:"nominal_vs_real_gdp", commonError:"Confusing price changes with real output changes.", q:"Nominal GDP values output using:", options:["Current-year prices","Base-year prices","Only imported prices","Only wage rates"], a:0, tag:"real_nominal_gdp", type:"definition", objective:"LO24.4", feedback:"Nominal GDP uses current prices." },
  { id:10096, sourceGame: "nationalLedger", difficulty:"easy", conceptCluster:"real_nominal_gdp", primarySkill:"nominal_vs_real_gdp", secondarySkills:["gdp_deflator"], repairSkill:"nominal_vs_real_gdp", commonError:"Confusing price changes with real output changes.", q:"Real GDP values output using:", options:["Base-year prices","Current-year prices","Only export prices","Only consumer prices"], a:0, tag:"real_nominal_gdp", type:"definition", objective:"LO24.4", feedback:"Real GDP uses constant base-year prices to remove the effect of price changes." },
  { id:10097, sourceGame: "nationalLedger", difficulty:"easy", conceptCluster:"real_nominal_gdp", primarySkill:"gdp_deflator", secondarySkills:["nominal_vs_real_gdp"], repairSkill:"gdp_deflator", commonError:"Forgetting that the GDP deflator compares nominal GDP to real GDP.", q:"If nominal GDP rises but real GDP does not, what likely happened?", options:["Prices rose but actual output did not","Actual output rose but prices fell","Imports disappeared","Unemployment must be zero"], a:0, tag:"real_nominal_gdp", type:"interpretation", objective:"LO24.4", feedback:"Nominal GDP can rise because prices rise, even if real output does not." },
  { id:10098, sourceGame: "nationalLedger", difficulty:"easy", conceptCluster:"gdp_wellbeing", primarySkill:"gdp_wellbeing_limits", secondarySkills:["gdp_counting_rules"], repairSkill:"gdp_wellbeing_limits", commonError:"Assuming higher GDP automatically means higher overall well-being.", q:"GDP is an imperfect measure of well-being because it excludes:", options:["Leisure and environmental quality","Final goods and services","Market production","Government purchases"], a:0, tag:"gdp_wellbeing", type:"definition", objective:"LO24.5", feedback:"GDP misses some things that matter for well-being, such as leisure and environmental quality." },
  { id:10099, sourceGame: "nationalLedger", difficulty:"easy", conceptCluster:"gdp_wellbeing", primarySkill:"gdp_wellbeing_limits", secondarySkills:["gdp_counting_rules"], repairSkill:"gdp_wellbeing_limits", commonError:"Assuming higher GDP automatically means higher overall well-being.", q:"Which statement about GDP and well-being is most accurate?", options:["Higher GDP often helps, but GDP is not a complete measure of well-being","GDP perfectly measures happiness","GDP ignores all market activity","GDP only measures inflation"], a:0, tag:"gdp_wellbeing", type:"interpretation", objective:"LO24.5", feedback:"GDP is useful, but it does not capture every part of economic well-being." },
  { id:10100, sourceGame: "nationalLedger", difficulty:"easy", conceptCluster:"prices_inflation", primarySkill:"cpi_calculation", secondarySkills:["inflation_rate"], repairSkill:"cpi_calculation", commonError:"Using the wrong basket cost or forgetting to multiply by 100.", q:"The consumer price index measures:", options:["The cost of a fixed basket of goods and services over time","The unemployment rate","The value of exports","The number of workers in the labor force"], a:0, tag:"cpi_inflation", type:"definition", objective:"LO25.1", feedback:"The CPI tracks the cost of a fixed basket of consumer goods and services." },
  { id:10101, sourceGame: "nationalLedger", difficulty:"easy", conceptCluster:"prices_inflation", primarySkill:"inflation_rate", secondarySkills:["cpi_calculation"], repairSkill:"inflation_rate", commonError:"Using the CPI point change instead of the percentage change.", q:"The inflation rate is usually calculated as:", options:["The percentage change in the price index","The level of GDP divided by population","Exports minus imports","The number of unemployed divided by population"], a:0, tag:"cpi_inflation", type:"definition", objective:"LO25.1", feedback:"Inflation is the percentage change in a price index such as the CPI." },
  { id:10102, sourceGame: "nationalLedger", difficulty:"easy", conceptCluster:"prices_inflation", primarySkill:"inflation_rate", secondarySkills:["cpi_calculation"], repairSkill:"inflation_rate", commonError:"Using the CPI point change instead of the percentage change.", q:"If the CPI rises from 100 to 110, what is the inflation rate?", options:["10%","5%","110%","1%"], a:0, tag:"cpi_inflation", type:"calculation", objective:"LO25.1", feedback:"The CPI increased by 10 points from a base of 100, so inflation is 10%." },
  { id:10103, sourceGame: "nationalLedger", difficulty:"easy", conceptCluster:"prices_inflation", primarySkill:"cpi_calculation", secondarySkills:["inflation_rate"], repairSkill:"cpi_calculation", commonError:"Using the wrong basket cost or forgetting to multiply by 100.", q:"If the basket costs $200 in the base year and $250 this year, what is the CPI this year?", options:["125","80","250","50"], a:0, tag:"cpi_inflation", type:"calculation", objective:"LO25.1", feedback:"CPI = 100 x 250/200 = 125." },
  { id:10104, sourceGame: "nationalLedger", difficulty:"easy", conceptCluster:"prices_inflation", primarySkill:"inflation_rate", secondarySkills:["cpi_calculation"], repairSkill:"inflation_rate", commonError:"Using the CPI point change instead of the percentage change.", q:"If the CPI rises from 120 to 132, what is the inflation rate?", options:["10%","12%","20%","32%"], a:0, tag:"cpi_inflation", type:"calculation", objective:"LO25.1", feedback:"Inflation = (132 - 120) / 120 x 100 = 10%." },
  { id:10105, sourceGame: "nationalLedger", difficulty:"easy", conceptCluster:"prices_inflation", primarySkill:"quality_new_goods_bias", secondarySkills:["substitution_bias"], repairSkill:"quality_new_goods_bias", commonError:"Treating all price increases as inflation even when quality or product variety improves.", q:"One reason the CPI can overstate inflation is:", options:["Consumers substitute toward relatively cheaper goods","Consumers never change what they buy","The CPI includes only exports","The CPI ignores consumer prices"], a:0, tag:"cpi_bias", type:"definition", objective:"LO25.2", feedback:"The CPI uses a fixed basket, so it can miss substitution toward cheaper goods." },
  { id:10106, sourceGame: "nationalLedger", difficulty:"easy", conceptCluster:"prices_inflation", primarySkill:"substitution_bias", secondarySkills:["quality_new_goods_bias"], repairSkill:"substitution_bias", commonError:"Ignoring that consumers switch toward relatively cheaper goods.", q:"Substitution bias occurs when:", options:["Consumers switch toward goods that become relatively cheaper, but the CPI does not fully capture that","Workers leave the labor force","GDP rises faster than income","Exports equal imports"], a:0, tag:"cpi_bias", type:"definition", objective:"LO25.2", feedback:"Substitution bias happens because the CPI fixed basket may not reflect how consumers adjust." },
  { id:10107, sourceGame: "nationalLedger", difficulty:"easy", conceptCluster:"prices_inflation", primarySkill:"quality_new_goods_bias", secondarySkills:["substitution_bias"], repairSkill:"quality_new_goods_bias", commonError:"Treating all price increases as inflation even when quality or product variety improves.", q:"The introduction of new goods can make the CPI imperfect because:", options:["New goods increase consumer choice and purchasing power in ways the CPI may miss","New goods are always intermediate goods","New goods are never consumed","New goods only affect unemployment"], a:0, tag:"cpi_bias", type:"interpretation", objective:"LO25.2", feedback:"New goods can improve well-being, but the CPI may not fully capture that gain." },
  { id:10108, sourceGame: "nationalLedger", difficulty:"easy", conceptCluster:"prices_inflation", primarySkill:"quality_new_goods_bias", secondarySkills:["substitution_bias"], repairSkill:"quality_new_goods_bias", commonError:"Treating all price increases as inflation even when quality or product variety improves.", q:"Unmeasured quality improvement causes CPI problems because:", options:["A higher price may partly reflect a better product","Quality is always falling","The CPI only measures wages","Quality changes are illegal"], a:0, tag:"cpi_bias", type:"interpretation", objective:"LO25.2", feedback:"If goods improve in quality, price increases may overstate the rise in the cost of living." },
  { id:10109, sourceGame: "nationalLedger", difficulty:"easy", conceptCluster:"prices_inflation", primarySkill:"cpi_vs_gdp_deflator", secondarySkills:["cpi_calculation"], repairSkill:"cpi_vs_gdp_deflator", commonError:"Confusing a fixed consumer basket with current domestic production prices.", q:"Which price index uses a fixed basket of consumer goods?", options:["CPI","GDP deflator","Unemployment rate","Labor force participation rate"], a:0, tag:"cpi_vs_deflator", type:"definition", objective:"LO25.3", feedback:"The CPI uses a fixed basket of consumer goods and services." },
  { id:10110, sourceGame: "nationalLedger", difficulty:"easy", conceptCluster:"prices_inflation", primarySkill:"cpi_vs_gdp_deflator", secondarySkills:["cpi_calculation"], repairSkill:"cpi_vs_gdp_deflator", commonError:"Confusing a fixed consumer basket with current domestic production prices.", q:"The GDP deflator is based on:", options:["Goods and services produced domestically","Only imported consumer goods","Only food and energy","Only used goods"], a:0, tag:"cpi_vs_deflator", type:"definition", objective:"LO25.3", feedback:"The GDP deflator reflects prices of domestically produced goods and services." },
  { id:10111, sourceGame: "nationalLedger", difficulty:"easy", conceptCluster:"prices_inflation", primarySkill:"cpi_vs_gdp_deflator", secondarySkills:["cpi_calculation"], repairSkill:"cpi_vs_gdp_deflator", commonError:"Confusing a fixed consumer basket with current domestic production prices.", q:"An imported television bought by consumers affects which index more directly?", options:["CPI","GDP deflator","Unemployment rate","Labor force"], a:0, tag:"cpi_vs_deflator", type:"interpretation", objective:"LO25.3", feedback:"Imported consumer goods are included in the CPI but not the GDP deflator." },
  { id:10112, sourceGame: "nationalLedger", difficulty:"easy", conceptCluster:"prices_inflation", primarySkill:"cpi_vs_gdp_deflator", secondarySkills:["cpi_calculation"], repairSkill:"cpi_vs_gdp_deflator", commonError:"Confusing a fixed consumer basket with current domestic production prices.", q:"Which statement correctly compares the CPI and GDP deflator?", options:["The CPI uses a fixed consumer basket, while the GDP deflator reflects current domestic production","They are exactly the same index","The CPI includes only investment goods","The GDP deflator includes only imports"], a:0, tag:"cpi_vs_deflator", type:"interpretation", objective:"LO25.3", feedback:"The CPI and GDP deflator both measure prices, but they use different baskets." },
  { id:10113, sourceGame: "nationalLedger", difficulty:"easy", conceptCluster:"prices_inflation", primarySkill:"inflation_adjustment", secondarySkills:["cpi_calculation"], repairSkill:"inflation_adjustment", commonError:"Comparing nominal dollar amounts across years without adjusting for the price level.", q:"To convert a dollar amount from the past into today's dollars, you should use:", options:["A price index ratio","The unemployment rate","Exports minus imports","The labor force"], a:0, tag:"inflation_adjustment", type:"definition", objective:"LO25.4", feedback:"Dollar figures across time should be adjusted with a price index." },
  { id:10114, sourceGame: "nationalLedger", difficulty:"easy", conceptCluster:"prices_inflation", primarySkill:"inflation_adjustment", secondarySkills:["cpi_calculation"], repairSkill:"inflation_adjustment", commonError:"Comparing nominal dollar amounts across years without adjusting for the price level.", q:"If a wage was $10 when the CPI was 100 and the CPI is now 150, what is the wage in today's dollars?", options:["$15","$10","$6.67","$150"], a:0, tag:"inflation_adjustment", type:"calculation", objective:"LO25.4", feedback:"Today’s dollars = 10 x 150/100 = $15." },
  { id:10115, sourceGame: "nationalLedger", difficulty:"easy", conceptCluster:"prices_inflation", primarySkill:"inflation_adjustment", secondarySkills:["cpi_calculation"], repairSkill:"inflation_adjustment", commonError:"Comparing nominal dollar amounts across years without adjusting for the price level.", q:"If a price was $40 when the CPI was 80 and the CPI is now 120, what is the price in today's dollars?", options:["$60","$30","$40","$120"], a:0, tag:"inflation_adjustment", type:"calculation", objective:"LO25.4", feedback:"Today’s dollars = 40 x 120/80 = $60." },
  { id:10116, sourceGame: "nationalLedger", difficulty:"easy", conceptCluster:"prices_inflation", primarySkill:"real_interest_rate", secondarySkills:["inflation_rate"], repairSkill:"real_interest_rate", commonError:"Forgetting to subtract inflation from the nominal interest rate.", q:"The nominal interest rate is:", options:["The interest rate usually reported before correcting for inflation","The interest rate after subtracting inflation","Always equal to zero","The same as the unemployment rate"], a:0, tag:"interest_inflation", type:"definition", objective:"LO25.5", feedback:"The nominal interest rate is the stated or reported interest rate before adjusting for inflation." },
  { id:10117, sourceGame: "nationalLedger", difficulty:"easy", conceptCluster:"prices_inflation", primarySkill:"real_interest_rate", secondarySkills:["inflation_rate"], repairSkill:"real_interest_rate", commonError:"Forgetting to subtract inflation from the nominal interest rate.", q:"The real interest rate is approximately:", options:["Nominal interest rate minus inflation rate","Nominal interest rate plus inflation rate","Inflation rate minus unemployment rate","GDP divided by population"], a:0, tag:"interest_inflation", type:"definition", objective:"LO25.5", feedback:"The real interest rate adjusts the nominal rate for inflation." },
  { id:10118, sourceGame: "nationalLedger", difficulty:"easy", conceptCluster:"prices_inflation", primarySkill:"real_interest_rate", secondarySkills:["inflation_rate"], repairSkill:"real_interest_rate", commonError:"Forgetting to subtract inflation from the nominal interest rate.", q:"If the nominal interest rate is 8% and inflation is 3%, what is the real interest rate?", options:["5%","11%","3%","8%"], a:0, tag:"interest_inflation", type:"calculation", objective:"LO25.5", feedback:"Real interest rate = 8% - 3% = 5%." },
  { id:10119, sourceGame: "nationalLedger", difficulty:"easy", conceptCluster:"prices_inflation", primarySkill:"real_interest_rate", secondarySkills:["inflation_rate"], repairSkill:"real_interest_rate", commonError:"Forgetting to subtract inflation from the nominal interest rate.", q:"If inflation rises while the nominal interest rate stays the same, the real interest rate:", options:["Falls","Rises","Does not change","Becomes the CPI"], a:0, tag:"interest_inflation", type:"interpretation", objective:"LO25.5", feedback:"Higher inflation reduces the real interest rate when the nominal rate is unchanged." },
  { id:10120, sourceGame: "nationalLedger", difficulty:"easy", conceptCluster:"growth_productivity", primarySkill:"real_gdp_per_person", secondarySkills:["productivity_calculation"], repairSkill:"real_gdp_per_person", commonError:"Comparing total GDP instead of output per person.", q:"Economic growth is usually measured by increases in:", options:["Real GDP per person","Nominal prices only","The unemployment rate","Imports only"], a:0, tag:"growth_differences", type:"definition", objective:"LO26.1", feedback:"Real GDP per person is commonly used to compare living standards and growth." },
  { id:10121, sourceGame: "nationalLedger", difficulty:"easy", conceptCluster:"growth_productivity", primarySkill:"real_gdp_per_person", secondarySkills:["productivity_calculation"], repairSkill:"real_gdp_per_person", commonError:"Comparing total GDP instead of output per person.", q:"Why do small differences in growth rates matter over long periods?", options:["They compound into large differences in income","They immediately eliminate unemployment","They make inflation impossible","They force imports to equal exports"], a:0, tag:"growth_differences", type:"interpretation", objective:"LO26.1", feedback:"Growth compounds, so small annual differences can become large over decades." },
  { id:10122, sourceGame: "nationalLedger", difficulty:"easy", conceptCluster:"growth_productivity", primarySkill:"rule_of_70", secondarySkills:["real_gdp_per_person"], repairSkill:"rule_of_70", commonError:"Forgetting that doubling time is approximately 70 divided by the growth rate.", q:"The Rule of 70 estimates:", options:["How long it takes a variable to double","The unemployment rate","The CPI basket cost","The size of net exports"], a:0, tag:"growth_differences", type:"definition", objective:"LO26.1", feedback:"The Rule of 70 estimates doubling time by dividing 70 by the growth rate." },
  { id:10123, sourceGame: "nationalLedger", difficulty:"easy", conceptCluster:"growth_productivity", primarySkill:"rule_of_70", secondarySkills:["real_gdp_per_person"], repairSkill:"rule_of_70", commonError:"Forgetting that doubling time is approximately 70 divided by the growth rate.", q:"If a country grows at 2% per year, the Rule of 70 says income doubles in about:", options:["35 years","70 years","14 years","2 years"], a:0, tag:"growth_differences", type:"calculation", objective:"LO26.1", feedback:"70 divided by 2 equals about 35 years." },
  { id:10124, sourceGame: "nationalLedger", difficulty:"easy", conceptCluster:"growth_productivity", primarySkill:"rule_of_70", secondarySkills:["real_gdp_per_person"], repairSkill:"rule_of_70", commonError:"Forgetting that doubling time is approximately 70 divided by the growth rate.", q:"If a country grows at 7% per year, income doubles in about:", options:["10 years","20 years","70 years","7 years"], a:0, tag:"growth_differences", type:"calculation", objective:"LO26.1", feedback:"70 divided by 7 equals about 10 years." },
  { id:10125, sourceGame: "nationalLedger", difficulty:"easy", conceptCluster:"growth_productivity", primarySkill:"productivity_calculation", secondarySkills:["real_gdp_per_person"], repairSkill:"productivity_calculation", commonError:"Confusing total output with output per unit of labor.", q:"Productivity is best defined as:", options:["Output produced per unit of labor input","The unemployment rate","The inflation rate","Government spending per person"], a:0, tag:"productivity", type:"definition", objective:"LO26.2", feedback:"Productivity measures output per unit of labor input." },
  { id:10126, sourceGame: "nationalLedger", difficulty:"easy", conceptCluster:"growth_productivity", primarySkill:"productivity_calculation", secondarySkills:["real_gdp_per_person"], repairSkill:"productivity_calculation", commonError:"Confusing total output with output per unit of labor.", q:"Why is productivity important for living standards?", options:["Higher productivity allows workers to produce more goods and services","Higher productivity always means higher inflation","Productivity only affects imports","Productivity measures joblessness"], a:0, tag:"productivity", type:"interpretation", objective:"LO26.2", feedback:"A country can consume more when its workers produce more output per worker." },
  { id:10127, sourceGame: "nationalLedger", difficulty:"easy", conceptCluster:"growth_productivity", primarySkill:"productivity_calculation", secondarySkills:["real_gdp_per_person"], repairSkill:"productivity_calculation", commonError:"Confusing total output with output per unit of labor.", q:"If an economy produces 1,000 units with 100 workers, productivity is:", options:["10 units per worker","100 units per worker","1,000 units per worker","0.1 units per worker"], a:0, tag:"productivity", type:"calculation", objective:"LO26.2", feedback:"Productivity = output/workers = 1000/100 = 10 units per worker." },
  { id:10128, sourceGame: "nationalLedger", difficulty:"easy", conceptCluster:"growth_productivity", primarySkill:"productivity_calculation", secondarySkills:["real_gdp_per_person"], repairSkill:"productivity_calculation", commonError:"Confusing total output with output per unit of labor.", q:"If output is 500 and labor hours are 50, productivity is:", options:["10 units per hour","50 units per hour","500 units per hour","5 units per hour"], a:0, tag:"productivity", type:"calculation", objective:"LO26.2", feedback:"Productivity = 500/50 = 10 units per hour." },
  { id:10129, sourceGame: "nationalLedger", difficulty:"easy", conceptCluster:"growth_productivity", primarySkill:"physical_capital", secondarySkills:["productivity_calculation"], repairSkill:"physical_capital", commonError:"Confusing tools and equipment with worker skills.", q:"Physical capital refers to:", options:["Equipment and structures used to produce goods and services","The number of unemployed workers","The price level","Only natural resources"], a:0, tag:"productivity_factors", type:"definition", objective:"LO26.3", feedback:"Physical capital includes tools, machines, buildings, and equipment used in production." },
  { id:10130, sourceGame: "nationalLedger", difficulty:"easy", conceptCluster:"growth_productivity", primarySkill:"human_capital", secondarySkills:["productivity_calculation"], repairSkill:"human_capital", commonError:"Confusing worker training and skills with physical equipment.", q:"Human capital refers to:", options:["Worker knowledge and skills from education, training, and experience","Machines used in production","Oil, land, and minerals","The CPI basket"], a:0, tag:"productivity_factors", type:"definition", objective:"LO26.3", feedback:"Human capital is the knowledge and skill workers bring to production." },
  { id:10131, sourceGame: "nationalLedger", difficulty:"easy", conceptCluster:"growth_productivity", primarySkill:"natural_resources", secondarySkills:["productivity_calculation"], repairSkill:"natural_resources", commonError:"Assuming natural resources alone guarantee high productivity.", q:"Natural resources are:", options:["Inputs provided by nature such as land, minerals, and oil","Government purchases","Consumer price indexes","Transfer payments"], a:0, tag:"productivity_factors", type:"definition", objective:"LO26.3", feedback:"Natural resources are inputs into production supplied by nature." },
  { id:10132, sourceGame: "nationalLedger", difficulty:"easy", conceptCluster:"growth_productivity", primarySkill:"technological_knowledge", secondarySkills:["productivity_calculation"], repairSkill:"technological_knowledge", commonError:"Confusing better production methods with more labor or more machines.", q:"Technological knowledge means:", options:["Society's understanding of the best ways to produce goods and services","The number of workers unemployed","The level of transfer payments","The market basket used for CPI"], a:0, tag:"productivity_factors", type:"definition", objective:"LO26.3", feedback:"Technological knowledge is know-how about production methods." },
  { id:10133, sourceGame: "nationalLedger", difficulty:"easy", conceptCluster:"growth_productivity", primarySkill:"human_capital", secondarySkills:["productivity_calculation"], repairSkill:"human_capital", commonError:"Confusing worker training and skills with physical equipment.", q:"If workers receive better training, which productivity factor has increased?", options:["Human capital","Natural resources","Inflation","Net exports"], a:0, tag:"productivity_factors", type:"interpretation", objective:"LO26.3", feedback:"Training raises human capital." },
  { id:10134, sourceGame: "nationalLedger", difficulty:"easy", conceptCluster:"growth_productivity", primarySkill:"physical_capital", secondarySkills:["productivity_calculation"], repairSkill:"physical_capital", commonError:"Confusing tools and equipment with worker skills.", q:"If a firm gives workers better machines, which productivity factor has increased?", options:["Physical capital per worker","Natural resource depletion","Inflation bias","Frictional unemployment"], a:0, tag:"productivity_factors", type:"interpretation", objective:"LO26.3", feedback:"Better machines increase physical capital per worker." },
  { id:10135, sourceGame: "nationalLedger", difficulty:"easy", conceptCluster:"growth_productivity", primarySkill:"productivity_calculation", secondarySkills:["real_gdp_per_person"], repairSkill:"productivity_calculation", commonError:"Confusing total output with output per unit of labor.", q:"Diminishing returns to capital means:", options:["Each additional unit of capital adds less extra output as capital rises","Capital always reduces output","Technology stops mattering","Workers never benefit from machines"], a:0, tag:"diminishing_returns", type:"definition", objective:"LO26.3", feedback:"Diminishing returns means extra capital still helps, but by smaller amounts as capital accumulates." },
  { id:10136, sourceGame: "nationalLedger", difficulty:"easy", conceptCluster:"growth_productivity", primarySkill:"productivity_calculation", secondarySkills:["real_gdp_per_person"], repairSkill:"productivity_calculation", commonError:"Confusing total output with output per unit of labor.", q:"The catch-up effect suggests that poorer countries may grow faster because:", options:["They can get larger gains from additional capital","They never face inflation","They have no unemployment","They do not need investment"], a:0, tag:"catch_up_growth", type:"interpretation", objective:"LO26.3", feedback:"Poorer countries may have less capital, so new capital can produce larger gains." },
  { id:10137, sourceGame: "nationalLedger", difficulty:"easy", conceptCluster:"growth_productivity", primarySkill:"growth_policy", secondarySkills:["productivity_calculation"], repairSkill:"growth_policy", commonError:"Focusing on short-run spending instead of policies that raise long-run productivity.", q:"Which policy is most likely to support long-run productivity growth?", options:["Encouraging saving and investment","Discouraging education","Weakening property rights","Blocking useful technology"], a:0, tag:"growth_policy", type:"interpretation", objective:"LO26.4", feedback:"Saving and investment help build capital and support growth." },
  { id:10138, sourceGame: "nationalLedger", difficulty:"easy", conceptCluster:"growth_productivity", primarySkill:"growth_policy", secondarySkills:["productivity_calculation"], repairSkill:"growth_policy", commonError:"Focusing on short-run spending instead of policies that raise long-run productivity.", q:"Why can education policy raise economic growth?", options:["It increases human capital","It directly lowers all prices","It removes all taxes","It makes GDP equal imports"], a:0, tag:"growth_policy", type:"interpretation", objective:"LO26.4", feedback:"Education builds human capital, which can raise productivity." },
  { id:10139, sourceGame: "nationalLedger", difficulty:"easy", conceptCluster:"growth_productivity", primarySkill:"growth_policy", secondarySkills:["productivity_calculation"], repairSkill:"growth_policy", commonError:"Focusing on short-run spending instead of policies that raise long-run productivity.", q:"Which policy environment is best for investment and growth?", options:["Stable property rights and political stability","Frequent confiscation of property","Banning trade and innovation","High uncertainty about ownership"], a:0, tag:"growth_policy", type:"interpretation", objective:"LO26.4", feedback:"Investment is more likely when property rights are stable and political institutions are reliable." },
  { id:10140, sourceGame: "nationalLedger", difficulty:"easy", conceptCluster:"labor_market", primarySkill:"labor_force_calculation", secondarySkills:["unemployment_rate", "labor_force_participation"], repairSkill:"labor_force_calculation", commonError:"Forgetting that the labor force includes employed plus unemployed workers.", q:"The labor force equals:", options:["Employed plus unemployed","Adult population plus retirees","Unemployed plus not in labor force","Employed minus unemployed"], a:0, tag:"labor_force_stats", type:"definition", objective:"LO29.1", feedback:"The labor force includes people who are employed and unemployed." },
  { id:10141, sourceGame: "nationalLedger", difficulty:"easy", conceptCluster:"labor_market", primarySkill:"unemployment_rate", secondarySkills:["labor_force_calculation", "labor_force_participation"], repairSkill:"unemployment_rate", commonError:"Dividing unemployed workers by the whole population instead of the labor force.", q:"The unemployment rate is calculated as:", options:["Unemployed divided by labor force times 100","Unemployed divided by adult population times 100","Employed divided by unemployed times 100","Not in labor force divided by employed times 100"], a:0, tag:"labor_force_stats", type:"definition", objective:"LO29.1", feedback:"The unemployment rate is unemployed workers divided by the labor force." },
  { id:10142, sourceGame: "nationalLedger", difficulty:"easy", conceptCluster:"labor_market", primarySkill:"labor_force_participation", secondarySkills:["labor_force_calculation"], repairSkill:"labor_force_participation", commonError:"Using unemployed workers instead of the labor force in the participation formula.", q:"The labor force participation rate is calculated as:", options:["Labor force divided by adult population times 100","Unemployed divided by labor force times 100","Employed divided by unemployed times 100","Inflation divided by GDP times 100"], a:0, tag:"labor_force_stats", type:"definition", objective:"LO29.1", feedback:"Labor force participation measures the share of adults in the labor force." },
  { id:10143, sourceGame: "nationalLedger", difficulty:"easy", conceptCluster:"labor_market", primarySkill:"labor_force_calculation", secondarySkills:["unemployment_rate", "labor_force_participation"], repairSkill:"labor_force_calculation", commonError:"Forgetting that the labor force includes employed plus unemployed workers.", q:"If 90 people are employed and 10 are unemployed, what is the labor force?", options:["100","90","10","80"], a:0, tag:"labor_force_stats", type:"calculation", objective:"LO29.1", feedback:"Labor force = employed + unemployed = 90 + 10 = 100." },
  { id:10144, sourceGame: "nationalLedger", difficulty:"easy", conceptCluster:"labor_market", primarySkill:"unemployment_rate", secondarySkills:["labor_force_calculation", "labor_force_participation"], repairSkill:"unemployment_rate", commonError:"Dividing unemployed workers by the whole population instead of the labor force.", q:"If 10 people are unemployed and the labor force is 100, what is the unemployment rate?", options:["10%","90%","100%","1%"], a:0, tag:"labor_force_stats", type:"calculation", objective:"LO29.1", feedback:"Unemployment rate = 10/100 x 100 = 10%." },
  { id:10145, sourceGame: "nationalLedger", difficulty:"easy", conceptCluster:"labor_market", primarySkill:"labor_force_participation", secondarySkills:["labor_force_calculation"], repairSkill:"labor_force_participation", commonError:"Using unemployed workers instead of the labor force in the participation formula.", q:"If the labor force is 160 million and the adult population is 250 million, what is the labor force participation rate?", options:["64%","40%","160%","25%"], a:0, tag:"labor_force_stats", type:"calculation", objective:"LO29.1", feedback:"Labor force participation = 160/250 x 100 = 64%." },
  { id:10146, sourceGame: "nationalLedger", difficulty:"easy", conceptCluster:"labor_market", primarySkill:"employment_classification", secondarySkills:["discouraged_workers"], repairSkill:"employment_classification", commonError:"Classifying people by desire for work instead of paid work and active search status.", q:"A person with a paid job is classified as:", options:["Employed","Unemployed","Not in the labor force","Discouraged only"], a:0, tag:"employment_categories", type:"definition", objective:"LO29.2", feedback:"A person with a paid job is employed." },
  { id:10147, sourceGame: "nationalLedger", difficulty:"easy", conceptCluster:"labor_market", primarySkill:"employment_classification", secondarySkills:["discouraged_workers"], repairSkill:"employment_classification", commonError:"Classifying people by desire for work instead of paid work and active search status.", q:"A person without a job who has actively looked for work in the last four weeks is classified as:", options:["Unemployed","Employed","Not in the labor force","Retired only"], a:0, tag:"employment_categories", type:"definition", objective:"LO29.2", feedback:"Someone without a job who is actively looking is unemployed." },
  { id:10148, sourceGame: "nationalLedger", difficulty:"easy", conceptCluster:"labor_market", primarySkill:"employment_classification", secondarySkills:["discouraged_workers"], repairSkill:"employment_classification", commonError:"Classifying people by desire for work instead of paid work and active search status.", q:"A retired person who is not looking for work is classified as:", options:["Not in the labor force","Unemployed","Employed","Structurally unemployed"], a:0, tag:"employment_categories", type:"interpretation", objective:"LO29.2", feedback:"People not working and not looking for work are not in the labor force." },
  { id:10149, sourceGame: "nationalLedger", difficulty:"easy", conceptCluster:"labor_market", primarySkill:"discouraged_workers", secondarySkills:["employment_classification"], repairSkill:"discouraged_workers", commonError:"Counting discouraged workers as unemployed even after they stop actively searching.", q:"A discouraged worker is usually counted as:", options:["Not in the labor force","Unemployed","Employed","Part of GDP"], a:0, tag:"employment_categories", type:"definition", objective:"LO29.2", feedback:"Discouraged workers are not counted as unemployed because they are not actively looking for work." },
  { id:10150, sourceGame: "nationalLedger", difficulty:"easy", conceptCluster:"labor_market", primarySkill:"frictional_unemployment", secondarySkills:["natural_rate"], repairSkill:"frictional_unemployment", commonError:"Confusing normal job search with skill mismatch or recession layoffs.", q:"Frictional unemployment is caused by:", options:["The time it takes workers to search for suitable jobs","A long-term mismatch between skills and jobs","A recession lowering demand","A price index rising"], a:0, tag:"unemployment_types", type:"definition", objective:"LO29.3", feedback:"Frictional unemployment comes from job search and matching." },
  { id:10151, sourceGame: "nationalLedger", difficulty:"easy", conceptCluster:"labor_market", primarySkill:"structural_unemployment", secondarySkills:["natural_rate"], repairSkill:"structural_unemployment", commonError:"Confusing permanent mismatch with short-run job search or weak demand.", q:"Structural unemployment is caused by:", options:["A mismatch between worker skills and available jobs","Workers moving between jobs briefly","A temporary vacation","GDP accounting rules"], a:0, tag:"unemployment_types", type:"definition", objective:"LO29.3", feedback:"Structural unemployment occurs when workers' skills or locations do not match available jobs." },
  { id:10152, sourceGame: "nationalLedger", difficulty:"easy", conceptCluster:"labor_market", primarySkill:"cyclical_unemployment", secondarySkills:["natural_rate"], repairSkill:"cyclical_unemployment", commonError:"Confusing recession-driven unemployment with natural unemployment.", q:"Cyclical unemployment is associated with:", options:["Downturns in the business cycle","Normal job search only","A fixed CPI basket","Higher physical capital"], a:0, tag:"unemployment_types", type:"definition", objective:"LO29.3", feedback:"Cyclical unemployment rises during recessions or weak economic conditions." },
  { id:10153, sourceGame: "nationalLedger", difficulty:"easy", conceptCluster:"labor_market", primarySkill:"structural_unemployment", secondarySkills:["natural_rate"], repairSkill:"structural_unemployment", commonError:"Confusing permanent mismatch with short-run job search or weak demand.", q:"A worker quits one job and spends two weeks looking for a better one. This is:", options:["Frictional unemployment","Structural unemployment","Cyclical unemployment","Not in the labor force"], a:0, tag:"unemployment_types", type:"interpretation", objective:"LO29.3", feedback:"Short-term job search is frictional unemployment." },
  { id:10154, sourceGame: "nationalLedger", difficulty:"easy", conceptCluster:"labor_market", primarySkill:"structural_unemployment", secondarySkills:["natural_rate"], repairSkill:"structural_unemployment", commonError:"Confusing permanent mismatch with short-run job search or weak demand.", q:"A factory worker loses a job because the industry permanently shifts to automation and the worker lacks new skills. This is:", options:["Structural unemployment","Frictional unemployment","Cyclical unemployment","Inflation"], a:0, tag:"unemployment_types", type:"interpretation", objective:"LO29.3", feedback:"A lasting skills mismatch is structural unemployment." },
  { id:10155, sourceGame: "nationalLedger", difficulty:"easy", conceptCluster:"labor_market", primarySkill:"cyclical_unemployment", secondarySkills:["natural_rate"], repairSkill:"cyclical_unemployment", commonError:"Confusing recession-driven unemployment with natural unemployment.", q:"A worker loses a job because a recession causes customers to spend less. This is:", options:["Cyclical unemployment","Frictional unemployment","Structural unemployment","Natural unemployment"], a:0, tag:"unemployment_types", type:"interpretation", objective:"LO29.3", feedback:"Job loss from weak demand during a recession is cyclical unemployment." },
  { id:10156, sourceGame: "nationalLedger", difficulty:"easy", conceptCluster:"labor_market", primarySkill:"frictional_unemployment", secondarySkills:["natural_rate"], repairSkill:"frictional_unemployment", commonError:"Confusing normal job search with skill mismatch or recession layoffs.", q:"Unemployment insurance may increase frictional unemployment because it can:", options:["Reduce the urgency of job search","Eliminate all job search","Lower every wage to zero","Remove workers from the adult population"], a:0, tag:"labor_market_policy", type:"interpretation", objective:"LO29.4", feedback:"Unemployment insurance can reduce the cost of continued job search, which may lengthen unemployment spells." },
  { id:10157, sourceGame: "nationalLedger", difficulty:"easy", conceptCluster:"labor_market", primarySkill:"minimum_wage_surplus", secondarySkills:["unions_efficiency_wages"], repairSkill:"minimum_wage_surplus", commonError:"Forgetting that a binding wage floor creates a surplus when labor supplied exceeds labor demanded.", q:"A binding minimum wage can create unemployment because it:", options:["Raises the wage above equilibrium and creates a surplus of labor","Lowers wages below equilibrium","Increases labor demand above labor supply","Makes all workers employed"], a:0, tag:"labor_market_policy", type:"interpretation", objective:"LO29.4", feedback:"A binding minimum wage can create a surplus of labor, meaning more workers want jobs than firms want to hire." },
  { id:10158, sourceGame: "nationalLedger", difficulty:"easy", conceptCluster:"labor_market", primarySkill:"unions_efficiency_wages", secondarySkills:["minimum_wage_surplus"], repairSkill:"unions_efficiency_wages", commonError:"Missing how above-equilibrium wages can create unemployment even when they have benefits.", q:"Unions can contribute to unemployment when they:", options:["Push wages above equilibrium in unionized labor markets","Lower wages below equilibrium","Remove all bargaining power from workers","Make labor demand vertical"], a:0, tag:"labor_market_policy", type:"interpretation", objective:"LO29.4", feedback:"Union wage bargaining can raise wages above equilibrium and reduce the quantity of labor demanded." },
  { id:10159, sourceGame: "nationalLedger", difficulty:"easy", conceptCluster:"labor_market", primarySkill:"natural_rate", secondarySkills:["frictional_unemployment", "structural_unemployment"], repairSkill:"natural_rate", commonError:"Assuming healthy economies should have zero unemployment.", q:"The natural rate of unemployment exists because:", options:["Even in the long run, frictional and structural unemployment remain","Cyclical unemployment is always zero in recessions","No one ever changes jobs","The labor force never changes"], a:0, tag:"natural_unemployment", type:"definition", objective:"LO29.5", feedback:"The natural rate reflects unemployment that remains from normal job search and structural mismatches." }
],
	
medium: [
  { id: 11000, sourceGame: "marketGate", q: "A student spends Saturday working instead of studying. If the lost study time lowers her exam score, what is the best economic interpretation?", options: ["The lost study time is part of the opportunity cost of working", "The wage she earns is not relevant to the decision", "There is no tradeoff because she earned money", "This is a price ceiling problem"], a: 0, tag: "opportunity_cost", type: "interpretation", objective: "LO1.2", difficulty: "medium", conceptCluster: "core_principles", primarySkill: "opportunity_cost_identification", secondarySkills: ["tradeoff_identification"], repairSkill: "opportunity_cost_definition", commonError: "ignores_nonmoney_opportunity_cost", feedback: "Opportunity cost includes what is given up, including time and the value of the next best alternative." },
  { id: 11001, sourceGame: "marketGate", q: "A business owner already spent $2,000 on a project. Finishing the project costs another $500 and will bring in $800. What should matter for the decision?", options: ["The extra $500 cost and extra $800 benefit", "The full $2,500 spent across the whole project", "Only the sunk $2,000", "Only whether the project feels successful"], a: 0, tag: "marginal", type: "interpretation", objective: "LO1.3", difficulty: "medium", conceptCluster: "core_principles", primarySkill: "marginal_benefit_cost_decision", secondarySkills: ["sunk_cost_avoidance"], repairSkill: "marginal_benefit_cost_decision", commonError: "includes_sunk_cost_in_marginal_decision", feedback: "The decision should compare the additional cost of finishing with the additional benefit." },
  { id: 11002, sourceGame: "marketGate", q: "A city offers a small cash reward for recycling, and recycling rises. What is the best explanation?", options: ["The reward changed incentives", "The city eliminated scarcity", "The reward shifted the PPF inward", "The policy created a price floor"], a: 0, tag: "incentives", type: "interpretation", objective: "LO1.4", difficulty: "medium", conceptCluster: "core_principles", primarySkill: "behavior_response_to_incentives", secondarySkills: ["incentive_definition"], repairSkill: "incentive_definition", commonError: "misses_reward_as_incentive", feedback: "The reward changed the payoff from recycling, so people responded to the incentive." },
  { id: 11003, sourceGame: "marketGate", q: "A new toll reduces traffic on a busy road. What does this show?", options: ["People respond to the higher cost of using the road", "Scarcity has been eliminated", "The road is now a public good", "Demand for driving must have increased"], a: 0, tag: "incentives", type: "interpretation", objective: "LO1.4", difficulty: "medium", conceptCluster: "core_principles", primarySkill: "behavior_response_to_incentives", secondarySkills: ["opportunity_cost_identification"], repairSkill: "incentive_definition", commonError: "misses_cost_as_incentive", feedback: "The toll raises the cost of using the road, which gives drivers an incentive to change behavior." },
  { id: 11004, sourceGame: "marketGate", q: "A worker can produce 10 reports or 5 presentations in a day. What is the opportunity cost of one presentation?", options: ["2 reports", "5 reports", "10 reports", "50 reports"], a: 0, tag: "opportunity_cost", type: "calculation", objective: "LO1.2", difficulty: "medium", conceptCluster: "core_principles", primarySkill: "opportunity_cost_calculation", secondarySkills: ["tradeoff_identification"], repairSkill: "opportunity_cost_calculation", commonError: "divides_new_good_by_given_up_good", feedback: "Giving up 10 reports to gain 5 presentations means each presentation costs 2 reports." },
  { id: 11005, sourceGame: "marketGate", q: "A policy improves equality but reduces total output. What tradeoff is being shown?", options: ["Efficiency versus equality", "Supply versus quantity supplied", "Positive versus normative", "Ceiling versus floor"], a: 0, tag: "tradeoffs", type: "interpretation", objective: "LO1.1", difficulty: "medium", conceptCluster: "core_principles", primarySkill: "efficiency_vs_equality", secondarySkills: ["tradeoff_identification"], repairSkill: "efficiency_vs_equality", commonError: "misses_policy_tradeoff_between_output_and_distribution", feedback: "The policy improves distribution but reduces total output, so the tradeoff is efficiency versus equality." },
  { id: 11006, sourceGame: "marketGate", q: "A firm pollutes because it does not pay the full social cost of production. What is the market problem?", options: ["A negative externality", "A binding price floor", "A positive statement", "A movement along supply"], a: 0, tag: "market_failure", type: "interpretation", objective: "LO1.6", difficulty: "medium", conceptCluster: "core_principles", primarySkill: "externality_identification", secondarySkills: ["market_failure_types"], repairSkill: "market_failure_types", commonError: "confuses_external_cost_with_private_cost", feedback: "The firm imposes costs on others that are not reflected in its private cost, which is a negative externality." },
  { id: 11007, sourceGame: "marketGate", q: "A market has one dominant seller that can influence price. Why might the market outcome be inefficient?", options: ["Market power can distort price and quantity", "Scarcity disappears when one seller dominates", "Opportunity cost no longer applies", "Positive statements become normative"], a: 0, tag: "market_failure", type: "interpretation", objective: "LO1.6", difficulty: "medium", conceptCluster: "core_principles", primarySkill: "market_power_effect", secondarySkills: ["market_power_definition"], repairSkill: "market_failure_types", commonError: "thinks_market_power_only_means_large_firm_not_distortion", feedback: "Market power can allow a seller to influence price and reduce market efficiency." },
  { id: 11008, sourceGame: "marketGate", q: "A simplified model leaves out many real-world details. Why is that useful?", options: ["It helps isolate the main relationships being studied", "It proves the model is false", "It makes assumptions unnecessary", "It guarantees the model predicts perfectly"], a: 0, tag: "models", type: "interpretation", objective: "LO2.1", difficulty: "medium", conceptCluster: "economic_thinking", primarySkill: "model_purpose", secondarySkills: ["assumptions_role"], repairSkill: "model_purpose", commonError: "thinks_simplification_makes_model_useless", feedback: "Models simplify reality so economists can focus on the most important forces." },
  { id: 11009, sourceGame: "marketGate", q: "An economist uses a PPF to show how producing more military goods requires producing fewer consumer goods. What is the model showing?", options: ["Tradeoffs and opportunity cost", "Tax incidence", "A binding price ceiling", "A market surplus"], a: 0, tag: "ppf", type: "interpretation", objective: "LO2.2", difficulty: "medium", conceptCluster: "economic_models", primarySkill: "ppf_tradeoff", secondarySkills: ["opportunity_cost_definition"], repairSkill: "ppf_opportunity_cost", commonError: "misses_ppf_as_tradeoff_model", feedback: "The PPF shows tradeoffs because producing more of one good requires giving up some of another." },
  { id: 11010, sourceGame: "marketGate", q: "An economy moves from a point inside its PPF to a point on the PPF. What happened?", options: ["It used idle resources more efficiently", "It reached an unattainable point", "It created a tax wedge", "It shifted demand left"], a: 0, tag: "ppf", type: "interpretation", objective: "LO2.2", difficulty: "medium", conceptCluster: "economic_models", primarySkill: "ppf_efficiency_status", secondarySkills: ["attainable_unattainable"], repairSkill: "ppf_efficiency_status", commonError: "confuses_movement_to_frontier_with_growth", feedback: "Moving from inside the PPF to the frontier means resources are being used more efficiently." },
  { id: 11011, sourceGame: "marketGate", q: "An economy gets better technology for producing both goods. What happens to its PPF?", options: ["It shifts outward", "It shifts inward", "It becomes a price ceiling", "It creates a shortage"], a: 0, tag: "ppf", type: "interpretation", objective: "LO2.2", difficulty: "medium", conceptCluster: "economic_models", primarySkill: "ppf_growth", secondarySkills: ["technology_growth"], repairSkill: "ppf_growth", commonError: "confuses_growth_with_movement_along_ppf", feedback: "Better technology increases productive capacity, shifting the PPF outward." },
  { id: 11012, sourceGame: "marketGate", q: "A point is outside the PPF today but becomes attainable after an increase in capital and technology. What changed?", options: ["The economy's productive capacity increased", "The market price was fixed", "Demand decreased", "The economy moved inside the PPF"], a: 0, tag: "ppf", type: "interpretation", objective: "LO2.2", difficulty: "medium", conceptCluster: "economic_models", primarySkill: "ppf_growth", secondarySkills: ["attainable_unattainable"], repairSkill: "ppf_growth", commonError: "does_not_connect_growth_to_attainability", feedback: "More capital and better technology increase what the economy can produce." },
  { id: 11013, sourceGame: "marketGate", q: "An economist says, 'A higher minimum wage will reduce employment among low-skill workers.' What kind of statement is this?", options: ["Positive", "Normative", "A price floor", "A circular-flow claim"], a: 0, tag: "positive_normative", type: "interpretation", objective: "LO2.4", difficulty: "medium", conceptCluster: "economic_thinking", primarySkill: "positive_vs_normative", secondarySkills: ["policy_statement_classification"], repairSkill: "positive_vs_normative", commonError: "assumes_policy_topic_means_normative", feedback: "This is positive because it makes a testable claim about cause and effect." },
  { id: 11014, sourceGame: "marketGate", q: "An economist says, 'The government should raise the minimum wage.' What kind of statement is this?", options: ["Normative", "Positive", "A demand schedule", "A tax wedge"], a: 0, tag: "positive_normative", type: "interpretation", objective: "LO2.4", difficulty: "medium", conceptCluster: "economic_thinking", primarySkill: "positive_vs_normative", secondarySkills: ["policy_statement_classification"], repairSkill: "positive_vs_normative", commonError: "misses_should_language", feedback: "This is normative because it says what policy should be chosen." },
  { id: 11015, sourceGame: "marketGate", q: "A firm decides how much labor to hire at one restaurant. Which branch of economics is this?", options: ["Microeconomics", "Macroeconomics", "Tax incidence", "Circular-flow accounting only"], a: 0, tag: "micro_macro", type: "interpretation", objective: "LO2.3", difficulty: "medium", conceptCluster: "economic_thinking", primarySkill: "micro_vs_macro", secondarySkills: ["microeconomics_definition"], repairSkill: "micro_vs_macro", commonError: "confuses_firm_decision_with_macro_topic", feedback: "A single firm's hiring decision is microeconomics." },
  { id: 11016, sourceGame: "marketGate", q: "A report studies why inflation rose across the entire economy. Which branch of economics is this?", options: ["Macroeconomics", "Microeconomics", "Price ceiling analysis", "Opportunity cost only"], a: 0, tag: "micro_macro", type: "interpretation", objective: "LO2.3", difficulty: "medium", conceptCluster: "economic_thinking", primarySkill: "micro_vs_macro", secondarySkills: ["macroeconomics_definition"], repairSkill: "micro_vs_macro", commonError: "confuses_economy_wide_issue_with_single_market", feedback: "Inflation across the whole economy is a macroeconomic topic." },
  { id: 11017, sourceGame: "marketGate", q: "The price of streaming subscriptions rises, and consumers buy fewer subscriptions. What happened?", options: ["Quantity demanded decreased", "Demand decreased", "Supply increased", "Demand shifted right"], a: 0, tag: "demand", type: "interpretation", objective: "LO4.2", difficulty: "medium", conceptCluster: "supply_demand", primarySkill: "movement_vs_demand_shift", secondarySkills: ["law_of_demand"], repairSkill: "movement_vs_demand_shift", commonError: "treats_own_price_change_as_demand_shift", feedback: "A change in the good's own price changes quantity demanded, not demand." },
  { id: 11018, sourceGame: "marketGate", q: "Consumers expect laptop prices to rise next month, so more laptops are purchased today. What happens to current demand for laptops?", options: ["Demand increases", "Quantity demanded decreases", "Supply decreases", "Demand stays fixed because only current price matters"], a: 0, tag: "demand", type: "interpretation", objective: "LO4.2", difficulty: "medium", conceptCluster: "supply_demand", primarySkill: "demand_shifters_expectations", secondarySkills: ["demand_shifters"], repairSkill: "demand_shifters", commonError: "misses_expectations_as_demand_shifter", feedback: "Expectations about higher future prices can increase demand today." },
  { id: 11019, sourceGame: "marketGate", q: "A popular celebrity endorsement makes more buyers want a product at every price. What happens?", options: ["Demand shifts right", "Quantity demanded falls", "Supply shifts left", "The product's own price changed"], a: 0, tag: "demand", type: "interpretation", objective: "LO4.2", difficulty: "medium", conceptCluster: "supply_demand", primarySkill: "demand_shifters_tastes", secondarySkills: ["demand_shift_direction"], repairSkill: "demand_shifters", commonError: "confuses_taste_change_with_price_movement", feedback: "A change in tastes shifts demand; more buyers wanting the product shifts demand right." },
  { id: 11020, sourceGame: "marketGate", q: "The price of tablets rises. What happens in the market for tablet cases, a complement?", options: ["Demand for tablet cases decreases", "Demand for tablet cases increases", "Supply of tablet cases increases", "Quantity supplied of tablets decreases"], a: 0, tag: "demand", type: "interpretation", objective: "LO4.2", difficulty: "medium", conceptCluster: "supply_demand", primarySkill: "demand_shifters_related_goods", secondarySkills: ["complement_good_definition"], repairSkill: "related_goods_demand", commonError: "gets_complement_price_effect_backwards", feedback: "If tablets become more expensive, fewer tablets are bought, reducing demand for tablet cases." },
  { id: 11021, sourceGame: "marketGate", q: "The price of tea rises. If coffee is a substitute for tea, what happens to demand for coffee?", options: ["Demand for coffee increases", "Demand for coffee decreases", "Quantity demanded of coffee decreases because coffee price changed", "Supply of coffee decreases"], a: 0, tag: "demand", type: "interpretation", objective: "LO4.2", difficulty: "medium", conceptCluster: "supply_demand", primarySkill: "demand_shifters_related_goods", secondarySkills: ["substitute_good_definition"], repairSkill: "related_goods_demand", commonError: "gets_substitute_price_effect_backwards", feedback: "When a substitute becomes more expensive, demand for the other good rises." },
  { id: 11022, sourceGame: "marketGate", q: "The price of a good falls, and sellers produce less of it. What happened?", options: ["Quantity supplied decreased", "Supply decreased", "Demand increased", "Supply shifted right"], a: 0, tag: "supply", type: "interpretation", objective: "LO4.3", difficulty: "medium", conceptCluster: "supply_demand", primarySkill: "movement_vs_supply_shift", secondarySkills: ["law_of_supply"], repairSkill: "movement_vs_supply_shift", commonError: "treats_own_price_change_as_supply_shift", feedback: "A change in the good's own price changes quantity supplied, not supply." },
  { id: 11023, sourceGame: "marketGate", q: "A new machine lowers the cost of producing shoes. What happens to the supply of shoes?", options: ["Supply increases", "Supply decreases", "Demand decreases", "Quantity demanded decreases"], a: 0, tag: "supply", type: "interpretation", objective: "LO4.3", difficulty: "medium", conceptCluster: "supply_demand", primarySkill: "supply_shifters_technology", secondarySkills: ["supply_shift_direction"], repairSkill: "supply_shifters", commonError: "misses_technology_as_supply_shifter", feedback: "Lower production costs from better technology shift supply right." },
  { id: 11024, sourceGame: "marketGate", q: "Several sellers leave the market. What happens to market supply?", options: ["Supply decreases", "Supply increases", "Demand decreases", "Quantity supplied rises"], a: 0, tag: "supply", type: "interpretation", objective: "LO4.3", difficulty: "medium", conceptCluster: "supply_demand", primarySkill: "supply_shifters_number_of_sellers", secondarySkills: ["supply_shift_direction"], repairSkill: "supply_shifters", commonError: "misses_number_of_sellers_as_supply_shifter", feedback: "Fewer sellers means less market supply at each price." },
  { id: 11025, sourceGame: "marketGate", q: "An input used to make pizza becomes more expensive. What is the likely effect in the pizza market?", options: ["Supply decreases and price rises", "Supply increases and price falls", "Demand increases and price rises", "Quantity demanded increases because cost rose"], a: 0, tag: "supply", type: "interpretation", objective: "LO4.3", difficulty: "medium", conceptCluster: "supply_demand", primarySkill: "supply_shifters_input_costs", secondarySkills: ["equilibrium_prediction"], repairSkill: "supply_shifters", commonError: "gets_input_cost_equilibrium_effect_backwards", feedback: "Higher input costs decrease supply, which tends to raise price." },
  { id: 11026, sourceGame: "marketGate", q: "Demand for a product increases while supply stays the same. What happens to equilibrium price and quantity?", options: ["Price rises and quantity rises", "Price falls and quantity falls", "Price rises and quantity falls", "Price falls and quantity rises"], a: 0, tag: "equilibrium", type: "interpretation", objective: "LO4.4", difficulty: "medium", conceptCluster: "supply_demand", primarySkill: "demand_shift_equilibrium_prediction", secondarySkills: ["market_change_prediction"], repairSkill: "equilibrium_prediction", commonError: "gets_demand_increase_effect_backwards", feedback: "An increase in demand raises both equilibrium price and equilibrium quantity." },
  { id: 11027, sourceGame: "marketGate", q: "Supply for a product decreases while demand stays the same. What happens to equilibrium price and quantity?", options: ["Price rises and quantity falls", "Price falls and quantity rises", "Price rises and quantity rises", "Price falls and quantity falls"], a: 0, tag: "equilibrium", type: "interpretation", objective: "LO4.4", difficulty: "medium", conceptCluster: "supply_demand", primarySkill: "supply_shift_equilibrium_prediction", secondarySkills: ["market_change_prediction"], repairSkill: "equilibrium_prediction", commonError: "gets_supply_decrease_effect_backwards", feedback: "A decrease in supply raises equilibrium price and lowers equilibrium quantity." },
  { id: 11028, sourceGame: "marketGate", q: "A market price is too low. Quantity demanded is greater than quantity supplied. What pressure should occur in an unregulated market?", options: ["Price should rise", "Price should fall", "Supply should vanish", "Demand must be zero"], a: 0, tag: "surplus_shortage", type: "interpretation", objective: "LO4.4", difficulty: "medium", conceptCluster: "supply_demand", primarySkill: "shortage_price_pressure", secondarySkills: ["shortage_identification"], repairSkill: "surplus_shortage_identification", commonError: "gets_shortage_price_pressure_backwards", feedback: "A shortage creates upward pressure on price as buyers compete for limited goods." },
  { id: 11029, sourceGame: "marketGate", q: "A market price is too high. Quantity supplied is greater than quantity demanded. What pressure should occur in an unregulated market?", options: ["Price should fall", "Price should rise", "Demand must increase at every price", "Supply must shift left immediately"], a: 0, tag: "surplus_shortage", type: "interpretation", objective: "LO4.4", difficulty: "medium", conceptCluster: "supply_demand", primarySkill: "surplus_price_pressure", secondarySkills: ["surplus_identification"], repairSkill: "surplus_shortage_identification", commonError: "gets_surplus_price_pressure_backwards", feedback: "A surplus creates downward pressure on price as sellers compete to sell the extra output." },
  { id: 11030, sourceGame: "marketGate", q: "A hurricane destroys part of the orange crop. What is the likely result in the orange market?", options: ["Supply decreases, price rises, and quantity falls", "Demand increases, price rises, and quantity rises", "Supply increases, price falls, and quantity rises", "Quantity demanded rises because supply fell"], a: 0, tag: "supply", type: "interpretation", objective: "LO4.4", difficulty: "medium", conceptCluster: "supply_demand", primarySkill: "supply_decrease_market_effect", secondarySkills: ["equilibrium_prediction"], repairSkill: "equilibrium_prediction", commonError: "confuses_supply_shock_with_demand_increase", feedback: "A crop loss reduces supply, which raises price and lowers equilibrium quantity." },
  { id: 11031, sourceGame: "marketGate", q: "A new health report says blueberries are especially beneficial. What likely happens in the blueberry market?", options: ["Demand increases, price rises, and quantity rises", "Supply decreases, price rises, and quantity falls", "Demand decreases, price falls, and quantity falls", "Quantity supplied falls because demand rose"], a: 0, tag: "demand", type: "interpretation", objective: "LO4.4", difficulty: "medium", conceptCluster: "supply_demand", primarySkill: "demand_increase_market_effect", secondarySkills: ["equilibrium_prediction"], repairSkill: "equilibrium_prediction", commonError: "confuses_demand_shift_with_supply_shift", feedback: "A favorable taste or information change increases demand, raising price and quantity." },
  { id: 11032, sourceGame: "marketGate", q: "The legal money price is low, but people wait in long lines. What policy likely caused this?", options: ["A binding price ceiling", "A binding price floor", "A tax on sellers", "An outward PPF shift"], a: 0, tag: "price_ceiling", type: "interpretation", objective: "LO6.1", difficulty: "medium", conceptCluster: "government_policy", primarySkill: "ceiling_shortage_effect", secondarySkills: ["nonmoney_rationing_costs"], repairSkill: "binding_price_ceiling", commonError: "misses_waiting_as_shortage_rationing", feedback: "A binding price ceiling creates a shortage, so nonprice rationing like waiting can appear." },
  { id: 11033, sourceGame: "marketGate", q: "A rent ceiling is set above the equilibrium rent. What is the likely result?", options: ["The ceiling is not binding and has no effect", "The ceiling creates a shortage", "The ceiling creates a surplus", "The ceiling shifts supply right"], a: 0, tag: "price_ceiling", type: "interpretation", objective: "LO6.1", difficulty: "medium", conceptCluster: "government_policy", primarySkill: "nonbinding_price_ceiling", secondarySkills: ["binding_price_ceiling"], repairSkill: "binding_price_ceiling", commonError: "thinks_all_price_ceilings_bind", feedback: "A price ceiling above equilibrium does not prevent the market price from reaching equilibrium." },
