  { id:14150, sourceGame: "nationalLedger", difficulty:"legendary", conceptCluster:"growth_productivity", primarySkill:"growth_policy", secondarySkills:["productivity_calculation"], repairSkill:"growth_policy", commonError:"Focusing on short-run spending instead of policies that raise long-run productivity.", q:"A country encourages saving but has corrupt courts and frequent asset seizure. Why might investment still remain weak?", options:["People may save, but weak property rights reduce the incentive to commit funds to productive investment","Saving always guarantees investment","Courts affect only unemployment statistics","Asset seizure increases capital accumulation"], a:0, tag:"growth_policy", type:"interpretation", objective:"LO26.4", feedback:"Saving supports investment only when institutions make investment secure enough to undertake." },
  { id:14151, sourceGame: "nationalLedger", difficulty:"legendary", conceptCluster:"growth_productivity", primarySkill:"growth_policy", secondarySkills:["productivity_calculation"], repairSkill:"growth_policy", commonError:"Focusing on short-run spending instead of policies that raise long-run productivity.", q:"A government blocks foreign investment to protect domestic firms. What long-run growth cost is most plausible?", options:["Less capital inflow, less technology transfer, and weaker productivity growth","Higher productivity from isolation by definition","Immediate doubling of human capital","Elimination of diminishing returns"], a:0, tag:"growth_policy", type:"interpretation", objective:"LO26.4", feedback:"Foreign investment can bring capital, technology, and management know-how." },
  { id:14152, sourceGame: "nationalLedger", difficulty:"legendary", conceptCluster:"growth_productivity", primarySkill:"growth_policy", secondarySkills:["productivity_calculation"], repairSkill:"growth_policy", commonError:"Focusing on short-run spending instead of policies that raise long-run productivity.", q:"A country invests in education but prevents firms from adopting new technology. What is the main problem?", options:["Human capital may not translate fully into productivity without complementary technology and capital","Education is unrelated to productivity","Technology always reduces human capital","Growth depends only on natural resources"], a:0, tag:"growth_policy", type:"integration", objective:"LO26.4", feedback:"Human capital, physical capital, and technology work together." },
  { id:14153, sourceGame: "nationalLedger", difficulty:"legendary", conceptCluster:"growth_productivity", primarySkill:"growth_policy", secondarySkills:["productivity_calculation"], repairSkill:"growth_policy", commonError:"Focusing on short-run spending instead of policies that raise long-run productivity.", q:"Which policy package best targets productivity rather than merely short-run demand?", options:["R&D support, stable property rights, education, infrastructure, and investment incentives","Temporary rebates only","Price ceilings on output","Higher transfer payments without investment"], a:0, tag:"growth_policy", type:"interpretation", objective:"LO26.4", feedback:"Long-run productivity policy builds capital, skills, technology, and institutions." },
  { id:14154, sourceGame: "nationalLedger", difficulty:"legendary", conceptCluster:"growth_productivity", primarySkill:"growth_policy", secondarySkills:["productivity_calculation"], repairSkill:"growth_policy", commonError:"Focusing on short-run spending instead of policies that raise long-run productivity.", q:"Why can population growth reduce GDP per person even while raising total GDP?", options:["More workers can raise total output, but capital per worker and output per person may fall if capital does not keep up","Population growth always raises productivity","GDP per person ignores population","Capital per worker automatically rises with population"], a:0, tag:"growth_policy", type:"interpretation", objective:"LO26.4", feedback:"Population growth can dilute capital per worker unless investment keeps pace." },
  { id:14155, sourceGame: "nationalLedger", difficulty:"legendary", conceptCluster:"growth_productivity", primarySkill:"productivity_calculation", secondarySkills:["real_gdp_per_person"], repairSkill:"productivity_calculation", commonError:"Confusing total output with output per unit of labor.", q:"A poor country and a rich country both add $1,000 of capital per worker. Why might the poor country gain more output per worker?", options:["Capital is scarcer, so its marginal product may be higher","Rich countries never use capital","Poor countries do not face diminishing returns","The CPI is lower in poor countries"], a:0, tag:"catch_up_growth", type:"interpretation", objective:"LO26.3", feedback:"The catch-up effect depends on higher marginal returns to capital where capital is scarce." },
  { id:14156, sourceGame: "nationalLedger", difficulty:"legendary", conceptCluster:"growth_productivity", primarySkill:"productivity_calculation", secondarySkills:["real_gdp_per_person"], repairSkill:"productivity_calculation", commonError:"Confusing total output with output per unit of labor.", q:"A country's real GDP per worker rises while real GDP per person is flat. What likely happened?", options:["The share of the population working fell or population composition changed","Productivity must have fallen","Real GDP must have fallen","The CPI must have doubled"], a:0, tag:"productivity", type:"integration", objective:"LO26.2", feedback:"Output per worker can rise while output per person remains flat if fewer people are working relative to population." },
  { id:14157, sourceGame: "nationalLedger", difficulty:"legendary", conceptCluster:"labor_market", primarySkill:"unemployment_rate", secondarySkills:["labor_force_calculation", "labor_force_participation"], repairSkill:"unemployment_rate", commonError:"Dividing unemployed workers by the whole population instead of the labor force.", q:"An economy has 170M employed, 10M unemployed, and 70M not in the labor force. Then 5M unemployed become discouraged and 5M not in the labor force find jobs. What is the new unemployment rate?", options:["2.78%","5.56%","5.26%","8.33%"], a:0, tag:"labor_force_stats", type:"multi-step", objective:"LO29.1", feedback:"New employed = 175M, unemployed = 5M, labor force = 180M. Unemployment = 5/180 = 2.78%." },
  { id:14158, sourceGame: "nationalLedger", difficulty:"legendary", conceptCluster:"labor_market", primarySkill:"labor_force_participation", secondarySkills:["labor_force_calculation"], repairSkill:"labor_force_participation", commonError:"Using unemployed workers instead of the labor force in the participation formula.", q:"Adult population is 280M, labor force participation is 65%, and unemployment rate is 6%. How many people are employed?", options:["171.08M","182M","16.8M","263.2M"], a:0, tag:"labor_force_stats", type:"calculation", objective:"LO29.1", feedback:"Labor force = 0.65 x 280 = 182M. Unemployed = 0.06 x 182 = 10.92M. Employed = 171.08M." },
  { id:14159, sourceGame: "nationalLedger", difficulty:"legendary", conceptCluster:"labor_market", primarySkill:"unemployment_rate", secondarySkills:["labor_force_calculation", "labor_force_participation"], repairSkill:"unemployment_rate", commonError:"Dividing unemployed workers by the whole population instead of the labor force.", q:"An economy has 90 employed, 10 unemployed, and 50 not in the labor force. Five employed workers lose jobs and search; five unemployed workers stop searching. What happens to unemployment rate?", options:["It rises slightly to 10.5%","It rises to 15%","It falls to 5%","It becomes 0%"], a:0, tag:"labor_force_stats", type:"multi-step", objective:"LO29.1", feedback:"Employed falls to 85; unemployed remains 10; labor force remains 95? Wait: original LF 100; five employed become unemployed, five unemployed leave LF, so LF = 95 and unemployed = 10. Rate = 10/95 = 10.53%, so no listed answer is exact." },
  { id:14160, sourceGame: "nationalLedger", difficulty:"legendary", conceptCluster:"labor_market", primarySkill:"labor_force_participation", secondarySkills:["labor_force_calculation"], repairSkill:"labor_force_participation", commonError:"Using unemployed workers instead of the labor force in the participation formula.", q:"The unemployment rate falls while labor force participation also falls. Which interpretation is most careful?", options:["Some improvement may be real, but worker exit from the labor force may also be lowering measured unemployment","The labor market definitely improved","Employment must have risen","Cyclical unemployment must be zero"], a:0, tag:"labor_force_stats", type:"interpretation", objective:"LO29.1", feedback:"A falling unemployment rate can be misleading when participation falls." },
  { id:14161, sourceGame: "nationalLedger", difficulty:"legendary", conceptCluster:"labor_market", primarySkill:"employment_classification", secondarySkills:["discouraged_workers"], repairSkill:"employment_classification", commonError:"Classifying people by desire for work instead of paid work and active search status.", q:"A jobless worker applied to three jobs last week. Another jobless worker wants work but last searched two months ago. A third works 3 hours per week but wants full-time work. How are they classified?", options:["Unemployed; not in labor force; employed","Unemployed; unemployed; unemployed","Employed; unemployed; not in labor force","Not in labor force; unemployed; employed"], a:0, tag:"employment_categories", type:"multi-step", objective:"LO29.2", feedback:"Recent active search means unemployed; no recent search means not in labor force; any paid work means employed." },
  { id:14162, sourceGame: "nationalLedger", difficulty:"legendary", conceptCluster:"labor_market", primarySkill:"employment_classification", secondarySkills:["discouraged_workers"], repairSkill:"employment_classification", commonError:"Classifying people by desire for work instead of paid work and active search status.", q:"Which case makes the headline unemployment rate look better than the actual labor market experience?", options:["A rise in discouraged workers and involuntary part-time workers","A rise in full-time employment","More unemployed workers actively searching","More job openings filled"], a:0, tag:"employment_categories", type:"interpretation", objective:"LO29.2", feedback:"Discouraged and involuntary part-time workers are not fully captured by the headline unemployment rate." },
  { id:14163, sourceGame: "nationalLedger", difficulty:"legendary", conceptCluster:"labor_market", primarySkill:"structural_unemployment", secondarySkills:["natural_rate"], repairSkill:"structural_unemployment", commonError:"Confusing permanent mismatch with short-run job search or weak demand.", q:"A worker is laid off because a recession reduces sales. Six months later, the worker's old industry adopts technology that permanently eliminates the job type. How should the unemployment diagnosis change?", options:["It begins as cyclical but may become structural if the old job type does not return","It is always frictional","It is never unemployment","It must be natural unemployment only"], a:0, tag:"unemployment_types", type:"integration", objective:"LO29.3", feedback:"Weak demand causes cyclical unemployment, but permanent skill/job mismatch is structural." },
  { id:14164, sourceGame: "nationalLedger", difficulty:"legendary", conceptCluster:"labor_market", primarySkill:"structural_unemployment", secondarySkills:["natural_rate"], repairSkill:"structural_unemployment", commonError:"Confusing permanent mismatch with short-run job search or weak demand.", q:"A nurse moving between hospitals, a cashier displaced by automation, and a waiter laid off during recession represent which types, in order?", options:["Frictional, structural, cyclical","Structural, frictional, cyclical","Cyclical, structural, frictional","Frictional, cyclical, structural"], a:0, tag:"unemployment_types", type:"multi-step", objective:"LO29.3", feedback:"Job search is frictional; automation mismatch is structural; recession layoff is cyclical." },
  { id:14165, sourceGame: "nationalLedger", difficulty:"legendary", conceptCluster:"labor_market", primarySkill:"natural_rate", secondarySkills:["frictional_unemployment", "structural_unemployment"], repairSkill:"natural_rate", commonError:"Assuming healthy economies should have zero unemployment.", q:"Why does the natural rate of unemployment not equal zero?", options:["Search frictions and structural mismatches remain even in normal times","Cyclical unemployment is permanent","Everyone who wants work is always counted as unemployed","Minimum wages always bind every labor market"], a:0, tag:"natural_unemployment", type:"interpretation", objective:"LO29.5", feedback:"The natural rate includes frictional and structural unemployment." },
  { id:14166, sourceGame: "nationalLedger", difficulty:"legendary", conceptCluster:"labor_market", primarySkill:"minimum_wage_surplus", secondarySkills:["unions_efficiency_wages"], repairSkill:"minimum_wage_surplus", commonError:"Forgetting that a binding wage floor creates a surplus when labor supplied exceeds labor demanded.", q:"A minimum wage rises above equilibrium. At the new wage, 140 workers want jobs and firms hire 95. What is the labor surplus, and what does it represent?", options:["45 workers; unemployment created by the wage floor","235 workers; total labor market size","95 workers; employment created by the wage floor","140 workers; labor demand"], a:0, tag:"labor_market_policy", type:"calculation", objective:"LO29.4", feedback:"Surplus = quantity supplied - quantity demanded = 140 - 95 = 45 workers." },
  { id:14167, sourceGame: "nationalLedger", difficulty:"legendary", conceptCluster:"labor_market", primarySkill:"frictional_unemployment", secondarySkills:["natural_rate"], repairSkill:"frictional_unemployment", commonError:"Confusing normal job search with skill mismatch or recession layoffs.", q:"Unemployment insurance becomes more generous. Which is the best balanced evaluation?", options:["It protects income and may improve job matching, but can lengthen search and raise frictional unemployment","It only creates structural unemployment","It eliminates job search costs without tradeoffs","It guarantees lower natural unemployment"], a:0, tag:"labor_market_policy", type:"interpretation", objective:"LO29.4", feedback:"Unemployment insurance has benefits and search-incentive tradeoffs." },
  { id:14168, sourceGame: "nationalLedger", difficulty:"legendary", conceptCluster:"labor_market", primarySkill:"unions_efficiency_wages", secondarySkills:["minimum_wage_surplus"], repairSkill:"unions_efficiency_wages", commonError:"Missing how above-equilibrium wages can create unemployment even when they have benefits.", q:"A union wage raises pay from $18 to $25. Firms reduce employment, but workers who remain employed earn more. What is the insider-outsider issue?", options:["Employed union workers may benefit while workers priced out of jobs lose","All workers gain equally","The unemployment rate must fall","Only consumers of imports are affected"], a:0, tag:"labor_market_policy", type:"interpretation", objective:"LO29.4", feedback:"Union wage gains can create benefits for insiders and costs for outsiders." },
  { id:14169, sourceGame: "nationalLedger", difficulty:"legendary", conceptCluster:"labor_market", primarySkill:"unions_efficiency_wages", secondarySkills:["minimum_wage_surplus"], repairSkill:"unions_efficiency_wages", commonError:"Missing how above-equilibrium wages can create unemployment even when they have benefits.", q:"A firm pays above-market wages and observes lower quits, more applicants, and better effort. Why can this wage persist?", options:["The wage may pay for itself through efficiency-wage effects","The firm is violating GDP accounting","Higher wages always reduce productivity","The wage must create cyclical unemployment only"], a:0, tag:"labor_market_policy", type:"interpretation", objective:"LO29.4", feedback:"Efficiency wages can raise productivity, reduce turnover, and attract better workers." },
  { id:14170, sourceGame: "nationalLedger", difficulty:"legendary", conceptCluster:"labor_market", primarySkill:"cyclical_unemployment", secondarySkills:["natural_rate"], repairSkill:"cyclical_unemployment", commonError:"Confusing recession-driven unemployment with natural unemployment.", q:"The economy recovers from recession, but unemployment remains elevated among workers whose skills no longer match job openings. What remains after cyclical unemployment falls?", options:["Structural unemployment","Only frictional unemployment","No unemployment","Inflation unemployment"], a:0, tag:"unemployment_types", type:"interpretation", objective:"LO29.3", feedback:"Persistent mismatch after recovery is structural unemployment." },
  { id:14171, sourceGame: "nationalLedger", difficulty:"legendary", conceptCluster:"labor_market", primarySkill:"unemployment_rate", secondarySkills:["labor_force_calculation", "labor_force_participation"], repairSkill:"unemployment_rate", commonError:"Dividing unemployed workers by the whole population instead of the labor force.", q:"If unemployed workers stop searching at the same time firms hire some unemployed workers, why is the unemployment rate hard to interpret?", options:["It may fall for both good reasons and bad reasons at the same time","It must rise because employment rises","It becomes meaningless because GDP changes","It always equals labor force participation"], a:0, tag:"labor_force_stats", type:"interpretation", objective:"LO29.1", feedback:"Hiring improves labor markets, but labor-force exit can also reduce measured unemployment." },
  { id:14172, sourceGame: "nationalLedger", difficulty:"legendary", conceptCluster:"labor_market", primarySkill:"unions_efficiency_wages", secondarySkills:["minimum_wage_surplus"], repairSkill:"unions_efficiency_wages", commonError:"Missing how above-equilibrium wages can create unemployment even when they have benefits.", q:"Which policy most directly targets structural unemployment?", options:["Retraining workers for expanding industries","More generous unemployment insurance with no training","Lowering the CPI basket cost","Changing GDP from nominal to real"], a:0, tag:"labor_market_policy", type:"interpretation", objective:"LO29.4", feedback:"Structural unemployment comes from mismatch, so retraining can help." },
  { id:14173, sourceGame: "nationalLedger", difficulty:"legendary", conceptCluster:"labor_market", primarySkill:"unions_efficiency_wages", secondarySkills:["minimum_wage_surplus"], repairSkill:"unions_efficiency_wages", commonError:"Missing how above-equilibrium wages can create unemployment even when they have benefits.", q:"Which policy most directly affects frictional unemployment?", options:["Job-search assistance that improves matching speed","A tariff on imports","A new GDP deflator base year","A tax on capital gains"], a:0, tag:"labor_market_policy", type:"interpretation", objective:"LO29.4", feedback:"Frictional unemployment is about search and matching, so better matching can reduce it." },
  { id:14174, sourceGame: "nationalLedger", difficulty:"legendary", conceptCluster:"labor_market", primarySkill:"employment_classification", secondarySkills:["discouraged_workers"], repairSkill:"employment_classification", commonError:"Classifying people by desire for work instead of paid work and active search status.", q:"A country has low unemployment but many workers are involuntarily part time. What is the best conclusion?", options:["The headline unemployment rate may understate labor underutilization","The economy must be at full well-being","All part-time work is unemployment","Labor force participation must be zero"], a:0, tag:"employment_categories", type:"interpretation", objective:"LO29.2", feedback:"Workers can be counted as employed even when their hours are inadequate." },
  { id:14175, sourceGame: "nationalLedger", difficulty:"legendary", conceptCluster:"labor_market", primarySkill:"natural_rate", secondarySkills:["frictional_unemployment", "structural_unemployment"], repairSkill:"natural_rate", commonError:"Assuming healthy economies should have zero unemployment.", q:"Suppose natural unemployment is 4.5% and actual unemployment is 8%. What is the likely cyclical unemployment?", options:["3.5 percentage points","4.5 percentage points","8 percentage points","12.5 percentage points"], a:0, tag:"natural_unemployment", type:"calculation", objective:"LO29.5", feedback:"Cyclical unemployment is actual minus natural: 8 - 4.5 = 3.5 percentage points." },
  { id:14176, sourceGame: "nationalLedger", difficulty:"legendary", conceptCluster:"labor_market", primarySkill:"natural_rate", secondarySkills:["frictional_unemployment", "structural_unemployment"], repairSkill:"natural_rate", commonError:"Assuming healthy economies should have zero unemployment.", q:"Suppose actual unemployment is 4%, natural unemployment is 5%, and inflationary pressure is rising. What is the likely labor-market interpretation?", options:["The economy may be operating below the natural rate, creating unusually tight labor markets","Cyclical unemployment is strongly positive","Structural unemployment must be zero","All unemployment is discouraged workers"], a:0, tag:"natural_unemployment", type:"interpretation", objective:"LO29.5", feedback:"Actual unemployment below the natural rate suggests tight labor markets and possible inflationary pressure." },
  { id:14177, sourceGame: "nationalLedger", difficulty:"legendary", conceptCluster:"labor_market", primarySkill:"structural_unemployment", secondarySkills:["natural_rate"], repairSkill:"structural_unemployment", commonError:"Confusing permanent mismatch with short-run job search or weak demand.", q:"A worker is unemployed because moving to available jobs is too costly, even though jobs exist elsewhere. Which type is most likely?", options:["Structural unemployment","Frictional unemployment only","Cyclical unemployment only","Not in the labor force"], a:0, tag:"unemployment_types", type:"trap", objective:"LO29.3", feedback:"Geographic mismatch is a form of structural unemployment." },
  { id:14178, sourceGame: "nationalLedger", difficulty:"legendary", conceptCluster:"labor_market", primarySkill:"frictional_unemployment", secondarySkills:["natural_rate"], repairSkill:"frictional_unemployment", commonError:"Confusing normal job search with skill mismatch or recession layoffs.", q:"A recession increases layoffs, while unemployment insurance helps workers avoid immediate hardship but lengthens some searches. Which pair of concepts is involved?", options:["Cyclical unemployment and frictional unemployment incentives","Only structural unemployment","GDP deflator and CPI","Natural resources and capital deepening"], a:0, tag:"labor_market_policy", type:"integration", objective:"LO29.4", feedback:"The recession creates cyclical unemployment; unemployment insurance affects job-search incentives." },
  { id:14179, sourceGame: "nationalLedger", difficulty:"legendary", conceptCluster:"labor_market", primarySkill:"labor_force_participation", secondarySkills:["labor_force_calculation"], repairSkill:"labor_force_participation", commonError:"Using unemployed workers instead of the labor force in the participation formula.", q:"If measured unemployment falls because 1M unemployed workers become discouraged, while employment is unchanged, what happens to labor force participation?", options:["It falls","It rises","It stays unchanged","It becomes equal to unemployment"], a:0, tag:"labor_force_stats", type:"interpretation", objective:"LO29.1", feedback:"Discouraged workers leave the labor force, so labor force participation falls." }
],

legendaryBoss: [
  // =====================================================
  // SET 1 — REAL WAGES + CPI BIAS + LABOR RESPONSE
  // =====================================================
  { id: 20000, q: "The Market Marshal shows a worker's wage rising from $28 to $30 while the CPI rises from 250 to 275. The worker says, 'I got a raise, so I am better off.' What is the best answer?", options: ["No; nominal wages rose about 7.1%, but prices rose 10%, so the real wage fell", "Yes; nominal wages rose by $2, so purchasing power must have increased", "No; real wages fell exactly 10% because the CPI rose 10%", "Yes; any wage increase above zero raises real income"], a: 0, tag: "real_wages", type: "legendary", objective: "LO25.4", difficulty: "legendaryBoss", conceptCluster: "inflation_real_wages_labor_incentives", primarySkill: "real_wage_percentage_comparison", secondarySkills: ["inflation_adjustment", "purchasing_power", "nominal_vs_real"], repairSkill: "real_vs_nominal_values", commonError: "compares_dollar_raise_without_adjusting_for_inflation", sourceGame: "equilibriumCrisis", feedback: "The wage rose about 7.1%, while prices rose 10%. Since prices rose faster than wages, the worker's real wage fell." },
  { id: 20001, q: "A CPI basket costs $100 in the base year and $140 this year. But consumers shifted toward cheaper substitutes, so their actual cost of maintaining a similar standard of living rose closer to $128. What is the best interpretation?", options: ["The fixed-basket CPI reports 40% inflation, but it likely overstates the true cost-of-living increase", "The CPI reports 28% inflation because consumers changed baskets", "The CPI reports 12% inflation because $140 minus $128 equals $12", "The CPI cannot be calculated because substitution occurred"], a: 0, tag: "cpi_bias", type: "legendary", objective: "LO25.2", difficulty: "legendaryBoss", conceptCluster: "cpi_substitution_bias_cost_of_living", primarySkill: "fixed_basket_bias_interpretation", secondarySkills: ["inflation_rate_calculation", "substitution_effect", "cost_of_living"], repairSkill: "cpi_bias_types", commonError: "uses_actual_substituted_basket_as_the_fixed_cpi_basket", sourceGame: "equilibriumCrisis", feedback: "The fixed CPI basket gives 40% inflation, but if consumers substitute toward cheaper goods, the CPI can overstate the true rise in living costs." },
  { id: 20002, q: "A union contract gives workers a CPI-based 6% raise. The CPI overstates inflation because of substitution bias and quality improvements. Which result is most likely?", options: ["Real wages may rise because the raise is tied to an index that overstates the true cost increase", "Real wages must fall because CPI inflation is positive", "Real wages must stay unchanged because the contract uses CPI", "Nominal wages fall because quality improvements reduce prices"], a: 0, tag: "indexation", type: "legendary", objective: "LO25.2", difficulty: "legendaryBoss", conceptCluster: "cpi_bias_indexation_real_wages", primarySkill: "indexed_contract_bias_analysis", secondarySkills: ["real_wage_interpretation", "quality_bias", "substitution_bias"], repairSkill: "cpi_bias_interpretation", commonError: "assumes_indexed_wages_always_hold_real_wages_constant", sourceGame: "equilibriumCrisis", feedback: "If CPI overstates true inflation, a CPI-indexed raise can increase real wages more than intended." },

  // =====================================================
  // SET 2 — REAL INTEREST + UNEXPECTED INFLATION + CREDIT MARKETS
  // =====================================================
  { id: 20003, q: "A lender issues a loan at 11% nominal interest expecting 4% inflation. Actual inflation turns out to be 9%. Which statement is correct?", options: ["The actual real return is about 2%, so the borrower gains relative to what the lender expected", "The actual real return is about 7%, so the lender receives exactly what was expected", "The actual real return is about 20%, so both borrower and lender gain", "The actual real return is about -5%, so the borrower pays more in real terms"], a: 0, tag: "real_interest", type: "legendary", objective: "LO25.5", difficulty: "legendaryBoss", conceptCluster: "unexpected_inflation_credit_market_redistribution", primarySkill: "unexpected_inflation_real_return_analysis", secondarySkills: ["real_interest_rate", "borrower_lender_effects", "inflation_expectations"], repairSkill: "real_interest_rate_interpretation", commonError: "uses_expected_inflation_after_actual_inflation_is_known", sourceGame: "equilibriumCrisis", feedback: "Expected real return was about 7%, but actual real return was about 2%. Unexpected inflation helps borrowers and hurts lenders." },
  { id: 20004, q: "A saver earns 8% nominal interest, inflation is 6%, and their wage rises 4%. Which statement best connects the two real effects?", options: ["The saver earns a positive real return on savings, but the real wage falls", "The saver earns a negative real return, but the real wage rises", "Both the real return and real wage rise", "Both the real return and real wage fall"], a: 0, tag: "real_nominal", type: "legendary", objective: "LO25.5", difficulty: "legendaryBoss", conceptCluster: "real_interest_real_wage_combined_analysis", primarySkill: "combined_real_value_comparison", secondarySkills: ["real_interest_rate", "real_wage_adjustment", "inflation"], repairSkill: "real_vs_nominal_values", commonError: "treats_all_nominal_increases_as_real_increases", sourceGame: "equilibriumCrisis", feedback: "The real interest rate is about 2%, but the wage increase is below inflation, so the real wage falls." },
  { id: 20005, q: "The Market Marshal offers four economies. Which has the highest approximate real interest rate?", options: ["Nominal interest 7%, inflation -1%", "Nominal interest 11%, inflation 8%", "Nominal interest 5%, inflation 2%", "Nominal interest 9%, inflation 7%"], a: 0, tag: "real_interest", type: "legendary", objective: "LO25.5", difficulty: "legendaryBoss", conceptCluster: "real_interest_comparison_inflation", primarySkill: "real_interest_rate_ranking", secondarySkills: ["deflation", "nominal_interest", "inflation_adjustment"], repairSkill: "real_interest_rate_formula", commonError: "chooses_highest_nominal_interest_rate", sourceGame: "equilibriumCrisis", feedback: "Approximate real interest equals nominal interest minus inflation. With 7% nominal interest and -1% inflation, the real rate is about 8%." },

  // =====================================================
  // SET 3 — LABOR FORCE FLOWS + MISLEADING UNEMPLOYMENT SIGNALS
  // =====================================================
  { id: 20006, q: "In Year 1, employed = 150 million, unemployed = 10 million, and not in labor force = 90 million. In Year 2, employed = 152 million, unemployed = 8 million, and not in labor force = 95 million. What is the best interpretation?", options: ["Employment rose, the unemployment rate fell, but labor-force participation fell", "Employment rose, unemployment rose, and labor-force participation rose", "Employment fell because not-in-labor-force increased", "The unemployment rate stayed constant because the labor force stayed at 160 million"], a: 0, tag: "labor_force_calculation", type: "legendary", objective: "LO29.1", difficulty: "legendaryBoss", conceptCluster: "labor_force_statistics_macro_interpretation", primarySkill: "multi_year_labor_force_analysis", secondarySkills: ["unemployment_rate", "labor_force_participation", "employment_change"], repairSkill: "labor_force_calculation", commonError: "looks_only_at_unemployment_rate_without_participation", sourceGame: "equilibriumCrisis", feedback: "Employment rises from 150 to 152. The unemployment rate falls from 10/160 to 8/160. But participation falls because adult population rises while the labor force stays at 160." },
  { id: 20007, q: "The unemployment rate falls from 6% to 4.8%, but employment does not increase and labor-force participation falls sharply. What is the most defensible conclusion?", options: ["The labor market may be weaker than the unemployment rate suggests because people exited the labor force", "The labor market definitely improved because the unemployment rate fell", "Productivity must have increased because unemployment fell", "Inflation must have fallen because labor-force participation fell"], a: 0, tag: "unemployment_limits", type: "legendary", objective: "LO29.2", difficulty: "legendaryBoss", conceptCluster: "unemployment_rate_limits_discouraged_workers", primarySkill: "labor_market_signal_quality_analysis", secondarySkills: ["discouraged_workers", "labor_force_participation", "macro_interpretation"], repairSkill: "unemployment_rate_limits", commonError: "treats_falling_unemployment_rate_as_automatically_good", sourceGame: "equilibriumCrisis", feedback: "A falling unemployment rate can be misleading if people stop looking for work and leave the labor force." },
  { id: 20008, q: "A recession ends. Some discouraged workers begin searching again before finding jobs. What can happen to the unemployment rate and why?", options: ["It can rise temporarily because people reenter the labor force and are counted as unemployed while searching", "It must fall because reentering workers are automatically employed", "It must stay constant because discouraged workers were already unemployed", "It can rise only if CPI rises"], a: 0, tag: "labor_force", type: "legendary", objective: "LO29.2", difficulty: "legendaryBoss", conceptCluster: "discouraged_workers_reentry_unemployment_rate", primarySkill: "labor_force_reentry_effect", secondarySkills: ["unemployment_rate_limits", "business_cycle_recovery", "job_search"], repairSkill: "discouraged_worker_classification", commonError: "forgets_that_reentrants_can_raise_measured_unemployment", sourceGame: "equilibriumCrisis", feedback: "When discouraged workers resume searching, they reenter the labor force and may be counted as unemployed until they find jobs." },

  // =====================================================
  // SET 4 — MINIMUM WAGE + PRICE FLOOR + LABOR SURPLUS + REAL WAGE
  // =====================================================
  { id: 20009, q: "At a $12 equilibrium wage, firms hire 1,000 workers and 1,000 workers want jobs. A $16 minimum wage leads firms to demand 850 workers while 1,250 workers want jobs. Prices then rise 20%. Which interpretation is strongest?", options: ["The nominal wage floor creates a 400-worker surplus, but the real value of the $16 wage is partly eroded by inflation", "The nominal wage floor creates a 250-worker shortage, and inflation raises the real wage further", "The nominal wage floor creates no unemployment because 1,250 workers want jobs", "The nominal wage floor creates a 150-worker surplus because employment falls from 1,000 to 850"], a: 0, tag: "minimum_wage", type: "legendary", objective: "LO6.2", difficulty: "legendaryBoss", conceptCluster: "price_floor_labor_surplus_real_wage", primarySkill: "minimum_wage_surplus_real_wage_analysis", secondarySkills: ["labor_surplus_calculation", "inflation_adjustment", "price_floor"], repairSkill: "price_floor_surplus", commonError: "uses_employment_loss_instead_of_qs_minus_qd_for_surplus", sourceGame: "equilibriumCrisis", feedback: "The labor surplus is 1,250 - 850 = 400 workers. Inflation also reduces the purchasing power of the higher nominal wage." },
  { id: 20010, q: "A binding minimum wage raises labor costs in restaurants. Restaurants hire fewer low-skill workers and raise menu prices. Which chain best synthesizes the effect?", options: ["Price floor in labor market → lower labor demanded → higher production costs → higher output prices", "Price ceiling in labor market → labor shortage → lower production costs → lower CPI", "Tax wedge in output market → more labor demanded → lower unemployment", "Substitution bias → higher labor productivity → no job loss"], a: 0, tag: "minimum_wage", type: "legendary", objective: "LO6.2", difficulty: "legendaryBoss", conceptCluster: "labor_price_floor_output_market_adjustment", primarySkill: "cross_market_policy_chain", secondarySkills: ["law_of_demand", "cost_shift", "market_price_adjustment"], repairSkill: "minimum_wage_unemployment", commonError: "isolates_minimum_wage_from_output_market_effects", sourceGame: "equilibriumCrisis", feedback: "A binding wage floor can reduce labor demanded and raise firms' costs, which can push output prices upward." },
  { id: 20011, q: "The Market Marshal says: 'This policy improves pay for some workers, worsens access to jobs for others, and may raise consumer prices.' Which policy is most likely being described?", options: ["A binding minimum wage above equilibrium", "A nonbinding price ceiling above equilibrium", "A decrease in CPI caused by quality improvements", "A tax cut on sellers in a competitive market"], a: 0, tag: "policy_tradeoffs", type: "legendary", objective: "LO1.1", difficulty: "legendaryBoss", conceptCluster: "minimum_wage_tradeoffs_incentives_prices", primarySkill: "policy_tradeoff_identification", secondarySkills: ["price_floor", "labor_surplus", "cost_pass_through"], repairSkill: "policy_tradeoff_analysis", commonError: "identifies_policy_by_intended_benefit_only", sourceGame: "equilibriumCrisis", feedback: "A binding minimum wage helps some workers who keep jobs, can reduce employment for others, and may raise business costs and consumer prices." },

  // =====================================================
  // SET 5 — PRICE CEILINGS + INFLATION + HIDDEN COSTS + CPI LIMITS
  // =====================================================
  { id: 20012, q: "During a supply shock, equilibrium rent would rise to $1,400, but a city caps rent at $1,000. Quantity demanded is 70,000 units and quantity supplied is 45,000 units. Tenants also spend more time searching. What is the best answer?", options: ["There is a 25,000-unit shortage, and the full economic cost includes nonmoney costs like search time", "There is a 25,000-unit surplus, and the full economic cost falls to exactly $1,000", "There is a 45,000-unit shortage, and search time is counted perfectly in CPI", "There is no shortage because the legal rent is lower"], a: 0, tag: "price_ceilings", type: "legendary", objective: "LO6.1", difficulty: "legendaryBoss", conceptCluster: "price_ceiling_shortage_hidden_costs_inflation", primarySkill: "ceiling_shortage_full_cost_analysis", secondarySkills: ["shortage_calculation", "opportunity_cost", "nonprice_rationing"], repairSkill: "price_ceiling_shortage", commonError: "confuses_lower_legal_price_with_lower_total_cost", sourceGame: "equilibriumCrisis", feedback: "The shortage is 70,000 - 45,000 = 25,000 units. Search time and rationing raise the full cost even if legal rent is capped." },
  { id: 20013, q: "A government caps gasoline prices below equilibrium during an oil shock. Official gasoline prices stop rising, but stations run out, drivers wait in long lines, and black-market resale appears. What is the deepest problem with saying inflation was solved?", options: ["The posted price is capped, but scarcity reappears through shortages, waiting costs, and side payments", "Inflation is solved because CPI captures all waiting costs perfectly", "The market has a surplus because buyers want more gas", "The price ceiling shifts supply right by lowering the posted price"], a: 0, tag: "price_controls_inflation", type: "legendary", objective: "LO6.1", difficulty: "legendaryBoss", conceptCluster: "price_controls_inflation_measurement_hidden_costs", primarySkill: "official_price_vs_full_cost_analysis", secondarySkills: ["shortages", "black_markets", "cpi_limits"], repairSkill: "nonprice_rationing", commonError: "treats_posted_price_as_total_economic_cost", sourceGame: "equilibriumCrisis", feedback: "A price ceiling can suppress the posted price while increasing nonmoney costs and creating shortages or black markets." },
  { id: 20014, q: "A binding price ceiling causes landlords to reduce maintenance. Rent is cheaper for lucky tenants, but housing quality falls. What concept combination is being tested?", options: ["Price control incentives and CPI quality-measurement limits", "Tax incidence and real interest rates", "Catch-up growth and discouraged workers", "GDP final-goods accounting and nominal wages"], a: 0, tag: "price_controls_quality", type: "legendary", objective: "LO25.2", difficulty: "legendaryBoss", conceptCluster: "price_controls_quality_change_cpi_limits", primarySkill: "quality_adjustment_policy_analysis", secondarySkills: ["price_ceiling", "incentives", "quality_bias"], repairSkill: "cpi_quality_bias", commonError: "ignores_quality_decline_when_interpreting_lower_prices", sourceGame: "equilibriumCrisis", feedback: "A lower legal price can come with worse quality, and quality changes are one reason cost-of-living measurement gets messy." },

  // =====================================================
  // SET 6 — TAX INCIDENCE + ELASTICITY + DEADWEIGHT LOGIC
  // =====================================================
  { id: 20015, q: "A $4 tax is placed on a good. After adjustment, buyers pay $2.75 more and sellers receive $1.25 less. Which conclusion is best?", options: ["Buyers bear more of the burden, so demand is likely less elastic than supply", "Sellers bear more of the burden, so supply is likely less elastic than demand", "Buyers and sellers split the burden equally because the tax is $4", "The legal taxpayer must be the buyer because buyers pay $2.75 more"], a: 0, tag: "tax_incidence", type: "legendary", objective: "LO6.5", difficulty: "legendaryBoss", conceptCluster: "tax_incidence_elasticity_burden_split", primarySkill: "tax_burden_elasticity_inference", secondarySkills: ["buyer_price", "seller_price", "less_elastic_side"], repairSkill: "tax_incidence_elasticity", commonError: "uses_legal_tax_assignment_instead_of_price_changes", sourceGame: "equilibriumCrisis", feedback: "Buyers bear $2.75 of the $4 tax. The side bearing more burden is usually less elastic." },
  { id: 20016, q: "A tax reduces quantity only slightly but raises the buyer price substantially. Which market condition best explains this?", options: ["Demand is relatively inelastic, so buyers keep purchasing despite the higher price", "Demand is relatively elastic, so buyers leave the market completely", "Supply is perfectly elastic, so sellers bear the full burden", "The tax must be legally assigned to buyers"], a: 0, tag: "tax_incidence", type: "legendary", objective: "LO6.5", difficulty: "legendaryBoss", conceptCluster: "tax_elasticity_quantity_response", primarySkill: "tax_quantity_burden_elasticity_analysis", secondarySkills: ["inelastic_demand", "market_shrinkage", "buyer_burden"], repairSkill: "tax_incidence_elasticity", commonError: "thinks_large_price_change_requires_large_quantity_change", sourceGame: "equilibriumCrisis", feedback: "When demand is inelastic, buyers do not reduce quantity much, so they can bear much of the tax through higher prices." },
  { id: 20017, q: "The Market Marshal compares two taxes. Tax A is on insulin with very inelastic demand. Tax B is on restaurant meals with more elastic demand. Which tax likely creates less quantity reduction but places more burden on buyers?", options: ["Tax A, because insulin demand is less elastic", "Tax B, because restaurant meals are easier to avoid", "Both taxes have identical effects because all taxes create wedges", "Neither tax affects quantity if sellers legally pay it"], a: 0, tag: "tax_incidence", type: "legendary", objective: "LO6.5", difficulty: "legendaryBoss", conceptCluster: "tax_policy_elasticity_comparison", primarySkill: "cross_market_tax_incidence_comparison", secondarySkills: ["inelastic_demand", "quantity_response", "buyer_burden"], repairSkill: "elasticity_tax_burden", commonError: "ignores_differences_in_elasticity_across_goods", sourceGame: "equilibriumCrisis", feedback: "A tax on a good with very inelastic demand causes less quantity reduction and places more burden on buyers." },

  // =====================================================
  // SET 7 — PRODUCTIVITY + STRUCTURAL CHANGE + REAL LIVING STANDARDS
  // =====================================================
  { id: 20018, q: "Country A has nominal wages rise 12% while prices rise 12%. Country B has nominal wages rise 5%, prices rise 1%, and output per worker rises. Which country shows the stronger evidence of improved real living standards?", options: ["Country B, because real wages and productivity rose", "Country A, because nominal wages rose faster", "Both are equal because both have wage growth", "Country A, because inflation confirms higher productivity"], a: 0, tag: "productivity", type: "legendary", objective: "LO26.2", difficulty: "legendaryBoss", conceptCluster: "productivity_real_wages_living_standards", primarySkill: "real_living_standard_evidence_analysis", secondarySkills: ["real_wage_growth", "productivity_growth", "inflation_adjustment"], repairSkill: "productivity_living_standard_link", commonError: "chooses_larger_nominal_wage_growth", sourceGame: "equilibriumCrisis", feedback: "Country B has real wage growth and rising productivity. Country A's nominal wage gain is wiped out by inflation." },
  { id: 20019, q: "Automation raises output per worker and lowers production costs, but some workers in the old process lose jobs and need retraining. Which answer best avoids the trap?", options: ["Productivity can improve long-run living standards while causing short-run structural unemployment", "Automation must reduce living standards because some workers lose jobs", "Automation eliminates unemployment because output rises", "Automation only affects CPI and not labor markets"], a: 0, tag: "structural_unemployment", type: "legendary", objective: "LO29.3", difficulty: "legendaryBoss", conceptCluster: "automation_productivity_structural_unemployment", primarySkill: "productivity_displacement_tradeoff_analysis", secondarySkills: ["technological_knowledge", "skill_mismatch", "long_run_growth"], repairSkill: "structural_unemployment_definition", commonError: "treats_growth_and_displacement_as_mutually_exclusive", sourceGame: "equilibriumCrisis", feedback: "Technology can raise productivity and living standards over time while displacing some workers whose skills no longer match the market." },
  { id: 20020, q: "A poor country attracts capital investment and adopts existing technology. Growth accelerates, but after decades the growth rate slows as capital becomes abundant. Which paired concepts best explain the pattern?", options: ["Catch-up growth followed by diminishing returns to capital", "Substitution bias followed by cyclical unemployment", "Price ceilings followed by tax incidence", "Discouraged workers followed by CPI quality bias"], a: 0, tag: "growth", type: "legendary", objective: "LO26.4", difficulty: "legendaryBoss", conceptCluster: "catch_up_growth_diminishing_returns", primarySkill: "growth_pattern_diagnosis", secondarySkills: ["capital_accumulation", "technology_adoption", "diminishing_returns"], repairSkill: "catch_up_growth", commonError: "expects_fast_growth_to_continue_forever", sourceGame: "equilibriumCrisis", feedback: "Poorer countries can grow quickly through catch-up, but growth can slow as capital accumulation faces diminishing returns." },

  // =====================================================
  // SET 8 — FULL EQUILIBRIUM CRISIS SYNTHESIS
  // =====================================================
  { id: 20021, q: "A supply shock raises food prices. The government caps prices below equilibrium. Official prices rise less, but shortages emerge, quality falls, and households spend more time searching. What is the best synthesis?", options: ["The ceiling suppresses posted prices but worsens allocation and hides part of the full cost of scarcity", "The ceiling eliminates inflation and improves allocation because prices are lower", "The ceiling creates a surplus and raises producer incentives", "The ceiling shifts demand left because consumers want more food"], a: 0, tag: "equilibrium_crisis", type: "legendary", objective: "LO6.1", difficulty: "legendaryBoss", conceptCluster: "supply_shock_price_controls_cpi_limits_allocation", primarySkill: "policy_shock_full_cost_synthesis", secondarySkills: ["price_ceiling_shortage", "quality_bias", "opportunity_cost", "market_allocation"], repairSkill: "price_control_synthesis", commonError: "equates_lower_posted_price_with_better_outcome", sourceGame: "equilibriumCrisis", feedback: "A ceiling can reduce the posted price while causing shortages, lower quality, waiting costs, and misallocation." },
  { id: 20022, q: "A government raises the minimum wage during high inflation. Nominal wages rise for workers who keep jobs, firms reduce low-skill hiring, and consumer prices rise in labor-intensive sectors. Which answer best captures the whole chain?", options: ["The policy can raise nominal pay for some, reduce employment opportunities for others, and still leave real gains uncertain because prices rise", "The policy guarantees real wage growth and higher employment because legal wages increased", "The policy has no price effect because only labor markets change", "The policy lowers unemployment because more workers want jobs at the higher wage"], a: 0, tag: "labor_policy_inflation", type: "legendary", objective: "LO6.2", difficulty: "legendaryBoss", conceptCluster: "minimum_wage_inflation_employment_real_wages", primarySkill: "minimum_wage_inflation_synthesis", secondarySkills: ["real_wage_adjustment", "labor_surplus", "cost_pass_through"], repairSkill: "minimum_wage_policy_tradeoffs", commonError: "uses_nominal_wage_change_as_complete_policy_evaluation", sourceGame: "equilibriumCrisis", feedback: "The real effect depends on employment, prices, and purchasing power. A higher legal wage is not the whole story." },
  { id: 20023, q: "The final Market Marshal trap: unemployment falls, CPI inflation slows because price ceilings cap posted prices, real wages appear stable, and productivity is flat. Which warning is most important?", options: ["The indicators may be distorted by labor-force exits, hidden price-control costs, and lack of productivity growth", "The economy is clearly stronger because unemployment and CPI inflation both fell", "Stable real wages prove productivity increased", "Price ceilings improve welfare whenever inflation slows"], a: 0, tag: "macro_synthesis", type: "legendary", objective: "LO29.2", difficulty: "legendaryBoss", conceptCluster: "labor_inflation_price_controls_productivity_synthesis", primarySkill: "multi_indicator_macro_diagnosis", secondarySkills: ["unemployment_rate_limits", "price_control_hidden_costs", "real_wages", "productivity"], repairSkill: "macro_indicator_synthesis", commonError: "reads_headline_indicators_without_checking_measurement_distortions", sourceGame: "equilibriumCrisis", feedback: "Headline indicators can mislead. Falling unemployment may reflect labor-force exits, capped prices may hide shortages, and flat productivity weakens long-run living standards." }
],	

easyBoss: [
  // =====================================================
  // SET 1 — TRADEOFFS + GDP MEASUREMENT
  // =====================================================
  { id: 17000, q: "The Signal Breaker opens the first gate: 'Every choice leaves something behind.' What is a tradeoff?", options: ["Giving up one thing to get something else", "A tax placed on buyers", "A legal maximum price", "A measure of total national output"], a: 0, tag: "tradeoffs", type: "definition", objective: "LO1.1", difficulty: "easyBoss", conceptCluster: "core_principles_gdp_measurement", primarySkill: "tradeoff_identification", secondarySkills: ["scarcity_definition"], repairSkill: "tradeoff_identification", commonError: "confuses_tradeoff_with_money_price", sourceGame: "equilibriumCrisis", feedback: "A tradeoff exists when choosing one option means giving up another option." },
  { id: 17001, q: "A student works an extra shift instead of studying for an economics exam. What is part of the opportunity cost of working?", options: ["The value of the lost study time", "Only the wage earned from working", "Only the price of the textbook", "The total GDP of the economy"], a: 0, tag: "opportunity_cost", type: "interpretation", objective: "LO1.2", difficulty: "easyBoss", conceptCluster: "core_principles_gdp_measurement", primarySkill: "opportunity_cost_identification", secondarySkills: ["tradeoff_identification"], repairSkill: "opportunity_cost_definition", commonError: "ignores_nonmoney_opportunity_cost", sourceGame: "equilibriumCrisis", feedback: "Opportunity cost includes what is given up, including time and the value of the next best alternative." },
  { id: 17002, q: "The Signal Breaker shifts the trap: a country produces more goods this year, but some of that production replaces worn-out equipment. What GDP issue is being hinted at?", options: ["GDP measures production, but it does not directly show all changes in well-being", "GDP counts only leisure time", "GDP automatically subtracts every environmental cost", "GDP ignores all market production"], a: 0, tag: "gdp_wellbeing", type: "trap", objective: "LO24.5", difficulty: "easyBoss", conceptCluster: "gdp_measurement", primarySkill: "gdp_wellbeing_limits", secondarySkills: ["gdp_definition"], repairSkill: "gdp_wellbeing_limits", commonError: "treats_gdp_as_perfect_wellbeing_measure", sourceGame: "equilibriumCrisis", feedback: "GDP measures market production, but it is not a perfect measure of well-being." },

  // =====================================================
  // SET 2 — OPPORTUNITY COST + GDP COUNTING
  // =====================================================
  { id: 17003, q: "The Signal Breaker offers two routes: work for $120 or attend a free review session. If the student attends the review, what is the opportunity cost?", options: ["The $120 work shift that was given up", "Zero, because the review session is free", "The total amount spent by all students", "Only the cost of the classroom"], a: 0, tag: "opportunity_cost", type: "interpretation", objective: "LO1.2", difficulty: "easyBoss", conceptCluster: "core_principles", primarySkill: "next_best_alternative", secondarySkills: ["opportunity_cost_definition"], repairSkill: "opportunity_cost_definition", commonError: "assumes_free_activity_has_no_opportunity_cost", sourceGame: "equilibriumCrisis", feedback: "A free activity can still have an opportunity cost if it means giving up another valuable option." },
  { id: 17004, q: "Which transaction would be counted in U.S. GDP?", options: ["A new car produced and sold in the United States this year", "A used car resold from one household to another", "A parent cooking dinner at home", "A stock purchase through a brokerage account"], a: 0, tag: "gdp", type: "definition", objective: "LO24.2", difficulty: "easyBoss", conceptCluster: "gdp_measurement", primarySkill: "gdp_counted_not_counted", secondarySkills: ["final_vs_intermediate_goods"], repairSkill: "gdp_counted_not_counted", commonError: "counts_used_goods_or_financial_transactions_in_gdp", sourceGame: "equilibriumCrisis", feedback: "GDP counts newly produced final goods and services within a country during a period." },
  { id: 17005, q: "The Signal Breaker lists four items: a new laptop, a used bike, homemade dinner, and a stock purchase. Which one clearly belongs in GDP?", options: ["The new laptop", "The used bike", "The homemade dinner", "The stock purchase"], a: 0, tag: "gdp", type: "trap", objective: "LO24.2", difficulty: "easyBoss", conceptCluster: "gdp_measurement", primarySkill: "gdp_counted_not_counted", secondarySkills: ["market_production", "newly_produced_goods"], repairSkill: "gdp_counted_not_counted", commonError: "counts_nonmarket_or_resale_activity", sourceGame: "equilibriumCrisis", feedback: "The new laptop is newly produced and sold in a market. Used goods, home production, and stock trades are not counted the same way." },

  // =====================================================
  // SET 3 — MARGINAL THINKING + GDP COMPONENTS
  // =====================================================
  { id: 17006, q: "The Signal Breaker says: 'Do not ask what was already spent. Ask what changes next.' What kind of reasoning is this?", options: ["Marginal reasoning", "GDP accounting", "Tax incidence", "Price floor analysis"], a: 0, tag: "marginal", type: "definition", objective: "LO1.3", difficulty: "easyBoss", conceptCluster: "core_principles", primarySkill: "marginal_reasoning_identification", secondarySkills: ["marginal_benefit_cost_rule"], repairSkill: "marginal_benefit_cost_decision", commonError: "focuses_on_total_or_sunk_cost_instead_of_marginal_change", sourceGame: "equilibriumCrisis", feedback: "Marginal reasoning compares the extra benefit and extra cost of the next action." },
  { id: 17007, q: "A business can earn $900 from one more project, but completing it costs $650. What should it do?", options: ["Complete the project because marginal benefit exceeds marginal cost", "Reject the project because any cost is bad", "Ignore the extra revenue", "Complete the project only if GDP rises"], a: 0, tag: "marginal", type: "interpretation", objective: "LO1.3", difficulty: "easyBoss", conceptCluster: "core_principles", primarySkill: "marginal_benefit_cost_decision", secondarySkills: ["basic_net_benefit"], repairSkill: "marginal_benefit_cost_decision", commonError: "gets_mb_mc_rule_backwards", sourceGame: "equilibriumCrisis", feedback: "The marginal benefit is greater than the marginal cost, so the project adds net benefit." },
  { id: 17008, q: "A household buys groceries, a firm buys machinery, and the government pays workers to repair roads. Which GDP components are involved?", options: ["Consumption, investment, and government purchases", "Only consumption", "Only net exports", "Only transfer payments"], a: 0, tag: "gdp_components", type: "trap", objective: "LO24.3", difficulty: "easyBoss", conceptCluster: "gdp_measurement", primarySkill: "gdp_component_classification", secondarySkills: ["consumption_investment_government"], repairSkill: "gdp_components", commonError: "puts_all_spending_into_consumption", sourceGame: "equilibriumCrisis", feedback: "Household groceries are consumption, machinery is investment, and road repair workers are government purchases." },

  // =====================================================
  // SET 4 — MODELS + GDP DEFINITION
  // =====================================================
  { id: 17009, q: "The Signal Breaker shows a simplified diagram of households, firms, markets, and money flows. Why do economists use models like this?", options: ["To simplify reality and focus on key relationships", "To include every detail of the real economy", "To eliminate scarcity", "To avoid making assumptions"], a: 0, tag: "models", type: "definition", objective: "LO2.1", difficulty: "easyBoss", conceptCluster: "economic_models_gdp", primarySkill: "model_purpose", secondarySkills: ["assumptions_role"], repairSkill: "model_purpose", commonError: "thinks_models_must_include_every_detail", sourceGame: "equilibriumCrisis", feedback: "Models simplify reality so economists can focus on the most important relationships." },
  { id: 17010, q: "GDP is best defined as:", options: ["The market value of all final goods and services produced within a country in a given period", "The total value of all used goods sold this year", "The total value of all financial transactions", "The amount of money held by households"], a: 0, tag: "gdp", type: "definition", objective: "LO24.2", difficulty: "easyBoss", conceptCluster: "gdp_measurement", primarySkill: "gdp_definition", secondarySkills: ["final_goods_services"], repairSkill: "gdp_definition", commonError: "counts_financial_transactions_or_used_goods_as_gdp", sourceGame: "equilibriumCrisis", feedback: "GDP measures the market value of final goods and services produced within a country during a period." },
  { id: 17011, q: "The Signal Breaker asks why a tire sold to a car manufacturer is usually not counted separately in GDP when the final car is sold. What is the answer?", options: ["Counting both the tire and the car would double count production", "Intermediate goods are never useful", "The tire was not produced in a market", "GDP only counts services"], a: 0, tag: "gdp", type: "trap", objective: "LO24.2", difficulty: "easyBoss", conceptCluster: "gdp_measurement", primarySkill: "final_vs_intermediate_goods", secondarySkills: ["double_counting"], repairSkill: "final_vs_intermediate_goods", commonError: "double_counts_intermediate_goods", sourceGame: "equilibriumCrisis", feedback: "GDP counts final goods to avoid double counting intermediate goods already included in the final product's value." },

  // =====================================================
  // SET 5 — MARKET ALLOCATION + INCOME/EXPENDITURE
  // =====================================================
  { id: 17012, q: "The Signal Breaker says: 'Prices guide resources without a central commander.' What is this describing?", options: ["Market allocation", "A price ceiling", "A GDP deflator", "A discouraged worker"], a: 0, tag: "markets", type: "definition", objective: "LO1.6", difficulty: "easyBoss", conceptCluster: "market_allocation_gdp", primarySkill: "market_allocation_definition", secondarySkills: ["price_signal_allocation"], repairSkill: "market_allocation_definition", commonError: "confuses_market_allocation_with_government_assignment", sourceGame: "equilibriumCrisis", feedback: "In market allocation, households and firms use prices and voluntary exchange to guide resource use." },
  { id: 17013, q: "Why does total income equal total expenditure for the economy as a whole?", options: ["Every dollar spent by a buyer becomes income for a seller", "GDP counts only government spending", "Imports are always zero", "Households never save"], a: 0, tag: "income_expenditure", type: "interpretation", objective: "LO24.1", difficulty: "easyBoss", conceptCluster: "gdp_measurement", primarySkill: "income_equals_expenditure", secondarySkills: ["circular_flow_components"], repairSkill: "income_equals_expenditure", commonError: "misses_two_sides_of_each_transaction", sourceGame: "equilibriumCrisis", feedback: "For the economy as a whole, spending by buyers becomes income for sellers." },
  { id: 17014, q: "The Signal Breaker sets a trap: if one person's spending is another person's income, does that mean every transaction increases GDP?", options: ["No, GDP counts current production of final goods and services, not every transaction", "Yes, every financial transaction raises GDP", "Yes, all used goods sales raise GDP again", "No, GDP only counts taxes"], a: 0, tag: "income_expenditure", type: "trap", objective: "LO24.1", difficulty: "easyBoss", conceptCluster: "gdp_measurement", primarySkill: "income_expenditure_gdp_limits", secondarySkills: ["gdp_counted_not_counted"], repairSkill: "gdp_counted_not_counted", commonError: "thinks_all_transactions_count_in_gdp", sourceGame: "equilibriumCrisis", feedback: "Income and expenditure are two sides of transactions, but GDP only counts current production of final goods and services." },

  // =====================================================
  // SET 6 — POSITIVE/NORMATIVE + GDP WELL-BEING
  // =====================================================
  { id: 17015, q: "The Signal Breaker asks: 'Which statement is positive?'", options: ["Higher investment spending increases GDP, holding other components constant", "The government should spend more", "GDP is the fairest possible measure", "Every country should maximize GDP at all costs"], a: 0, tag: "positive_normative", type: "definition", objective: "LO2.4", difficulty: "easyBoss", conceptCluster: "economic_thinking_gdp", primarySkill: "positive_vs_normative", secondarySkills: ["policy_statement_classification"], repairSkill: "positive_vs_normative", commonError: "confuses_policy_or_value_claims_with_testable_claims", sourceGame: "equilibriumCrisis", feedback: "A positive statement is testable. If investment rises and other components stay fixed, GDP rises." },
  { id: 17016, q: "A country has higher GDP, but also more pollution and longer work hours. What should the student conclude?", options: ["GDP is useful, but it does not capture every part of well-being", "GDP must have fallen", "GDP includes leisure and pollution perfectly", "GDP only measures unemployment"], a: 0, tag: "gdp_wellbeing", type: "interpretation", objective: "LO24.5", difficulty: "easyBoss", conceptCluster: "gdp_measurement", primarySkill: "gdp_wellbeing_limits", secondarySkills: ["gdp_definition"], repairSkill: "gdp_wellbeing_limits", commonError: "treats_gdp_as_complete_measure_of_living_standards", sourceGame: "equilibriumCrisis", feedback: "GDP is useful because income matters, but it leaves out things like leisure, environmental quality, and some nonmarket activity." },
  { id: 17017, q: "The Signal Breaker gives the final trap: GDP rises after a natural disaster because rebuilding spending increases. What is the best interpretation?", options: ["GDP may rise because production rises, but that does not mean people are automatically better off", "GDP cannot rise after disasters", "GDP only counts happiness", "Rebuilding is never counted in GDP"], a: 0, tag: "gdp_wellbeing", type: "trap", objective: "LO24.5", difficulty: "easyBoss", conceptCluster: "gdp_measurement", primarySkill: "gdp_wellbeing_limits", secondarySkills: ["gdp_counted_not_counted"], repairSkill: "gdp_wellbeing_limits", commonError: "assumes_higher_gdp_always_means_higher_wellbeing", sourceGame: "equilibriumCrisis", feedback: "GDP can rise when rebuilding activity increases, but that does not automatically mean well-being improved." },

  // =====================================================
  // SET 7 — CIRCULAR FLOW + GDP COMPONENT CLASSIFICATION
  // =====================================================
  { id: 17018, q: "In the circular-flow model, households usually provide which resource to firms?", options: ["Factors of production", "Final goods and services", "Price ceilings", "GDP deflators"], a: 0, tag: "circular_flow", type: "definition", objective: "LO2.2", difficulty: "easyBoss", conceptCluster: "economic_models_gdp", primarySkill: "households_firms_roles", secondarySkills: ["circular_flow_components"], repairSkill: "circular_flow_components", commonError: "reverses_household_and_firm_roles", sourceGame: "equilibriumCrisis", feedback: "Households provide factors of production such as labor, land, and capital to firms." },
  { id: 17019, q: "A family buys a new refrigerator for its home. Which GDP component does this most directly enter?", options: ["Consumption", "Investment", "Government purchases", "Net exports"], a: 0, tag: "gdp_components", type: "interpretation", objective: "LO24.3", difficulty: "easyBoss", conceptCluster: "gdp_measurement", primarySkill: "consumption_component", secondarySkills: ["gdp_component_classification"], repairSkill: "gdp_components", commonError: "puts_household_durable_goods_into_investment", sourceGame: "equilibriumCrisis", feedback: "Household purchases of goods and services are consumption, even when the good is durable." },
  { id: 17020, q: "A firm buys a new machine to produce more output next year. Which GDP component does this enter?", options: ["Investment", "Consumption", "Government purchases", "Net exports"], a: 0, tag: "gdp_components", type: "trap", objective: "LO24.3", difficulty: "easyBoss", conceptCluster: "gdp_measurement", primarySkill: "investment_component", secondarySkills: ["gdp_component_classification"], repairSkill: "gdp_components", commonError: "confuses_business_investment_with_financial_investment", sourceGame: "equilibriumCrisis", feedback: "Business purchases of capital equipment count as investment in GDP accounting." },

  // =====================================================
  // SET 8 — MICRO/MACRO + GDP AS MACRO MEASURE
  // =====================================================
  { id: 17021, q: "The Signal Breaker asks which question is macroeconomic.", options: ["How fast is the nation's GDP growing?", "How many workers should one coffee shop hire?", "How should one consumer spend a gift card?", "How should one firm price one sandwich?"], a: 0, tag: "micro_macro", type: "definition", objective: "LO2.3", difficulty: "easyBoss", conceptCluster: "economic_thinking_gdp", primarySkill: "micro_vs_macro", secondarySkills: ["macroeconomics_definition"], repairSkill: "micro_vs_macro", commonError: "confuses_individual_market_with_economy_wide_question", sourceGame: "equilibriumCrisis", feedback: "GDP growth is an economy-wide issue, so it is macroeconomic." },
  { id: 17022, q: "Why is GDP usually studied in macroeconomics rather than microeconomics?", options: ["It measures total production for the economy as a whole", "It measures one firm's output only", "It measures only one household's choices", "It tracks only one product's demand curve"], a: 0, tag: "gdp", type: "interpretation", objective: "LO24.2", difficulty: "easyBoss", conceptCluster: "gdp_measurement", primarySkill: "gdp_as_macro_measure", secondarySkills: ["micro_vs_macro"], repairSkill: "gdp_definition", commonError: "treats_gdp_as_single_firm_measure", sourceGame: "equilibriumCrisis", feedback: "GDP measures aggregate production for the whole economy, which makes it a macroeconomic measure." },
  { id: 17023, q: "The Signal Breaker's final gate asks: which pairing is correct?", options: ["GDP growth is macro; one firm's hiring decision is micro", "GDP growth is micro; one firm's hiring decision is macro", "Both are always micro", "Both are always normative"], a: 0, tag: "micro_macro", type: "trap", objective: "LO2.3", difficulty: "easyBoss", conceptCluster: "economic_thinking_gdp", primarySkill: "micro_macro_pairing", secondarySkills: ["gdp_as_macro_measure"], repairSkill: "micro_vs_macro", commonError: "reverses_micro_and_macro", sourceGame: "equilibriumCrisis", feedback: "GDP growth concerns the whole economy, while one firm's hiring decision is about an individual firm." }
],
   
mediumBoss: [
  // =====================================================
  // SET 1 — CPI + SUBSTITUTION + INFLATION MEASUREMENT
  // =====================================================
  { id: 18000, q: "The Measure Warden raises the price of beef while chicken stays cheaper. Consumers start buying more chicken. Which CPI problem does this expose?", options: ["Substitution bias because the fixed basket does not fully adjust when consumers switch goods", "GDP double counting because beef is an intermediate good", "Structural unemployment because workers lack skills", "A binding price ceiling because suppliers produce too much"], a: 0, tag: "cpi_bias", type: "interpretation", objective: "LO25.2", difficulty: "mediumBoss", conceptCluster: "inflation_measurement_consumer_behavior", primarySkill: "cpi_substitution_bias", secondarySkills: ["law_of_demand", "consumer_response_to_prices"], repairSkill: "cpi_bias_types", commonError: "treats_cpi_basket_as_perfect_measure_of_cost_of_living", sourceGame: "equilibriumCrisis", feedback: "The CPI uses a fixed basket, so it can overstate inflation when consumers substitute toward relatively cheaper goods." },
  { id: 18001, q: "A price index rises from 125 to 150. What is the inflation rate?", options: ["20%", "25%", "50%", "150%"], a: 0, tag: "inflation", type: "calculation", objective: "LO25.1", difficulty: "mediumBoss", conceptCluster: "inflation_measurement", primarySkill: "inflation_rate_calculation", secondarySkills: ["percentage_change"], repairSkill: "inflation_rate_formula", commonError: "divides_by_current_index_instead_of_previous_index", sourceGame: "equilibriumCrisis", feedback: "Inflation is calculated as (150 - 125) / 125 x 100 = 20%." },
  { id: 18002, q: "The Measure Warden says inflation is 8%, but many consumers avoided the goods whose prices rose the most. What is the best interpretation?", options: ["Measured CPI inflation may overstate the rise in the true cost of living", "Measured CPI inflation must equal zero", "Measured CPI inflation only tracks unemployment", "Measured CPI inflation proves real income rose"], a: 0, tag: "cpi_bias", type: "trap", objective: "LO25.2", difficulty: "mediumBoss", conceptCluster: "inflation_measurement_consumer_behavior", primarySkill: "cpi_bias_interpretation", secondarySkills: ["substitution_effect", "cost_of_living_measurement"], repairSkill: "cpi_bias_types", commonError: "assumes_price_index_perfectly_matches_lived_costs", sourceGame: "equilibriumCrisis", feedback: "If consumers substitute away from goods with large price increases, a fixed CPI basket can overstate the true rise in the cost of living." },

  // =====================================================
  // SET 2 — NOMINAL/REAL + INCENTIVES
  // =====================================================
  { id: 18003, q: "The Measure Warden offers a worker a 5% raise while prices rise 8%. What happened to the worker's real wage?", options: ["It fell because prices rose faster than the nominal wage", "It rose because any nominal raise increases purchasing power", "It stayed exactly the same because wages and prices are unrelated", "It became a transfer payment"], a: 0, tag: "real_nominal", type: "interpretation", objective: "LO25.4", difficulty: "mediumBoss", conceptCluster: "inflation_real_values_incentives", primarySkill: "real_wage_interpretation", secondarySkills: ["inflation_adjustment", "purchasing_power"], repairSkill: "real_vs_nominal_values", commonError: "confuses_nominal_raise_with_real_raise", sourceGame: "equilibriumCrisis", feedback: "A nominal raise does not guarantee higher purchasing power. If prices rise faster than wages, the real wage falls." },
  { id: 18004, q: "A loan pays 9% nominal interest while inflation is 4%. What is the approximate real interest rate?", options: ["5%", "9%", "13%", "4%"], a: 0, tag: "real_interest", type: "calculation", objective: "LO25.5", difficulty: "mediumBoss", conceptCluster: "inflation_interest_rates", primarySkill: "real_interest_rate_calculation", secondarySkills: ["nominal_minus_inflation"], repairSkill: "real_interest_rate_formula", commonError: "adds_inflation_to_nominal_interest_rate", sourceGame: "equilibriumCrisis", feedback: "The approximate real interest rate is nominal interest minus inflation: 9% - 4% = 5%." },
  { id: 18005, q: "The Measure Warden sets a trap: a saver earns 6% interest, but inflation is 7%. Which statement is correct?", options: ["The saver has more dollars but less purchasing power", "The saver has fewer dollars but more purchasing power", "The saver must be unemployed", "The saver caused a price ceiling"], a: 0, tag: "real_interest", type: "trap", objective: "LO25.5", difficulty: "mediumBoss", conceptCluster: "inflation_real_values", primarySkill: "real_interest_rate_interpretation", secondarySkills: ["purchasing_power", "real_vs_nominal_values"], repairSkill: "real_interest_rate_formula", commonError: "thinks_more_dollars_always_means_more_real_value", sourceGame: "equilibriumCrisis", feedback: "The nominal balance rises, but because inflation is higher than the interest rate, purchasing power falls." },

  // =====================================================
  // SET 3 — PRODUCTIVITY + GROWTH + LIVING STANDARDS
  // =====================================================
  { id: 18006, q: "The Growth Sentinel asks why one country can support higher wages and living standards over time. Which answer best connects Chapters 1 and 26?", options: ["Higher productivity allows workers to produce more output per hour", "Higher nominal prices automatically create more real wealth", "A price ceiling always increases available goods", "Unemployment insurance directly raises productivity"], a: 0, tag: "productivity", type: "interpretation", objective: "LO26.2", difficulty: "mediumBoss", conceptCluster: "growth_productivity_living_standards", primarySkill: "productivity_living_standard_link", secondarySkills: ["standards_of_living", "real_output"], repairSkill: "productivity_definition", commonError: "confuses_higher_prices_with_higher_real_output", sourceGame: "equilibriumCrisis", feedback: "Long-run living standards depend heavily on productivity, meaning output produced per worker or per hour." },
  { id: 18007, q: "A country invests in better machines, worker training, and new technology. Which productivity factors are being strengthened?", options: ["Physical capital, human capital, and technological knowledge", "Only natural resources", "Only transfer payments", "Only the CPI basket"], a: 0, tag: "productivity", type: "definition", objective: "LO26.3", difficulty: "mediumBoss", conceptCluster: "growth_productivity_inputs", primarySkill: "productivity_factor_classification", secondarySkills: ["physical_capital", "human_capital", "technology"], repairSkill: "productivity_determinants", commonError: "treats_productivity_as_only_worker_effort", sourceGame: "equilibriumCrisis", feedback: "Machines are physical capital, training is human capital, and new production methods reflect technological knowledge." },
  { id: 18008, q: "The Growth Sentinel shows a PPF shifting outward after years of investment in capital and technology. What is the best interpretation?", options: ["The economy's productive capacity has increased", "The economy moved inside the PPF because resources are idle", "The CPI basket became fixed", "A tax wedge disappeared"], a: 0, tag: "ppf_growth", type: "trap", objective: "LO26.3", difficulty: "mediumBoss", conceptCluster: "models_growth_productive_capacity", primarySkill: "ppf_growth_interpretation", secondarySkills: ["productive_capacity", "economic_models"], repairSkill: "ppf_shift_growth", commonError: "confuses_movement_along_ppf_with_outward_shift", sourceGame: "equilibriumCrisis", feedback: "An outward PPF shift means the economy can produce more because resources, technology, or productivity improved." },

  // =====================================================
  // SET 4 — UNEMPLOYMENT CLASSIFICATION + LABOR FORCE
  // =====================================================
  { id: 18009, q: "The Labor Warden finds a worker who lost a job, has not worked this week, and has actively searched for work in the last four weeks. How is that worker classified?", options: ["Unemployed", "Employed", "Not in the labor force", "Structurally impossible to classify"], a: 0, tag: "unemployment", type: "definition", objective: "LO29.2", difficulty: "mediumBoss", conceptCluster: "labor_force_classification", primarySkill: "employment_status_classification", secondarySkills: ["labor_force_definition"], repairSkill: "labor_force_categories", commonError: "classifies_all_nonworkers_as_out_of_labor_force", sourceGame: "equilibriumCrisis", feedback: "A person without a job who is actively looking for work is counted as unemployed and remains in the labor force." },
  { id: 18010, q: "An unemployed worker becomes discouraged and stops looking for work. What happens immediately in the official labor-force statistics?", options: ["The person leaves the labor force and is no longer counted as unemployed", "The unemployment rate must rise because the person still lacks a job", "The person becomes employed", "The labor force must increase"], a: 0, tag: "labor_force", type: "interpretation", objective: "LO29.2", difficulty: "mediumBoss", conceptCluster: "labor_force_unemployment_limits", primarySkill: "discouraged_worker_effect", secondarySkills: ["unemployment_rate_limits"], repairSkill: "discouraged_worker_classification", commonError: "counts_discouraged_workers_as_officially_unemployed", sourceGame: "equilibriumCrisis", feedback: "Discouraged workers are not counted as unemployed because they are no longer actively looking for work." },
