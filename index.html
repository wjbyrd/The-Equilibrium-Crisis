{ "id": 14042, sourceGame: "marketGate", "q": "A rent ceiling is set below equilibrium. After one year, renters with apartments pay less, but new renters struggle to find units. What is the best welfare-style interpretation?", "options": ["The policy transfers some surplus to lucky renters but creates shortage and misallocation", "The policy increases total surplus because rent is lower", "The policy creates a surplus of apartments", "The policy is nonbinding because some tenants still rent units"], "a": 0, "tag": "price_ceiling", "type": "synthesis", "objective": "LO6.1", "difficulty": "legendary", "conceptCluster": "legendary_market_gate", "primarySkill": "ceiling_distribution_tradeoff", "secondarySkills": ["shortage", "misallocation"], "repairSkill": "ceiling_unintended_consequences", "commonError": "judges_policy_only_by_lower_price_for_some_buyers", "feedback": "A binding ceiling can help some buyers while creating shortages and misallocation for others." },
{ "id": 14043, sourceGame: "marketGate", "q": "A minimum wage is above equilibrium. Firms respond by cutting hours, raising hiring standards, and using more automation. What principle is being tested?", "options": ["People and firms respond to incentives on multiple margins", "Price floors eliminate tradeoffs", "Higher wages always increase labor demanded", "The wage floor is nonbinding if any workers are hired"], "a": 0, "tag": "price_floor", "type": "synthesis", "objective": "LO1.4", "difficulty": "legendary", "conceptCluster": "legendary_market_gate", "primarySkill": "incentives_unintended_consequences", "secondarySkills": ["minimum_wage_tradeoff", "labor_demand"], "repairSkill": "minimum_wage_tradeoff", "commonError": "looks_only_at_hourly_wage_and_ignores_adjustment_margins", "feedback": "A wage floor changes incentives, so firms can adjust through hiring, hours, standards, prices, or technology." },
{ "id": 14044, sourceGame: "marketGate", "q": "A legal maximum price is set above equilibrium. A student predicts a shortage. What is wrong?", "options": ["A ceiling above equilibrium is nonbinding and does not create a shortage", "Any price ceiling always creates a shortage", "A ceiling above equilibrium creates a surplus", "A ceiling above equilibrium is actually a price floor"], "a": 0, "tag": "price_ceiling", "type": "trap", "objective": "LO6.1", "difficulty": "legendary", "conceptCluster": "legendary_market_gate", "primarySkill": "nonbinding_price_ceiling", "secondarySkills": ["equilibrium_price"], "repairSkill": "nonbinding_price_ceiling", "commonError": "thinks_all_ceilings_bind", "feedback": "A price ceiling binds only when it is below equilibrium." },
{ "id": 14045, sourceGame: "marketGate", "q": "A legal minimum price is set below equilibrium. A student predicts a surplus. What is wrong?", "options": ["A floor below equilibrium is nonbinding and does not create a surplus", "Any price floor always creates a surplus", "A floor below equilibrium creates a shortage", "A floor below equilibrium is actually a price ceiling"], "a": 0, "tag": "price_floor", "type": "trap", "objective": "LO6.2", "difficulty": "legendary", "conceptCluster": "legendary_market_gate", "primarySkill": "nonbinding_price_floor", "secondarySkills": ["equilibrium_price"], "repairSkill": "nonbinding_price_floor", "commonError": "thinks_all_floors_bind", "feedback": "A price floor binds only when it is above equilibrium." },
{ "id": 14046, sourceGame: "marketGate", "q": "At a rent ceiling of $900, quantity demanded is 4,000 apartments and quantity supplied is 2,700 apartments. Which answer best states the result?", "options": ["A shortage of 1,300 apartments", "A surplus of 1,300 apartments", "A shortage of 2,700 apartments", "A surplus of 4,000 apartments"], "a": 0, "tag": "price_ceiling", "type": "calculation", "objective": "LO6.1", "difficulty": "legendary", "conceptCluster": "legendary_market_gate", "primarySkill": "shortage_calculation", "secondarySkills": ["quantity_demanded", "quantity_supplied"], "repairSkill": "binding_ceiling_shortage", "commonError": "reverses_qd_and_qs", "feedback": "Shortage equals quantity demanded minus quantity supplied: 4,000 - 2,700 = 1,300." },
{ "id": 14047, sourceGame: "marketGate", "q": "At a price floor of $18, quantity supplied is 900 units and quantity demanded is 550 units. Which answer best states the result?", "options": ["A surplus of 350 units", "A shortage of 350 units", "A surplus of 550 units", "A shortage of 900 units"], "a": 0, "tag": "price_floor", "type": "calculation", "objective": "LO6.2", "difficulty": "legendary", "conceptCluster": "legendary_market_gate", "primarySkill": "surplus_calculation", "secondarySkills": ["quantity_supplied", "quantity_demanded"], "repairSkill": "binding_floor_surplus", "commonError": "subtracts_qs_from_qd_for_floor", "feedback": "Surplus equals quantity supplied minus quantity demanded: 900 - 550 = 350." },
{ "id": 14048, sourceGame: "marketGate", "q": "A binding price ceiling on gasoline leads stations to sell out early. Some stations favor regular customers. What is the best interpretation?", "options": ["The shortage creates nonprice rationing", "The market clears because the legal price is low", "The ceiling creates a surplus", "The ceiling increases supply"], "a": 0, "tag": "price_ceiling", "type": "synthesis", "objective": "LO6.1", "difficulty": "legendary", "conceptCluster": "legendary_market_gate", "primarySkill": "nonprice_rationing", "secondarySkills": ["shortage", "incentives"], "repairSkill": "ceiling_unintended_consequences", "commonError": "thinks_low_legal_price_solves_scarcity", "feedback": "When price cannot ration the good, other methods like waiting, favoritism, and side payments can take over." },
{ "id": 14049, sourceGame: "marketGate", "q": "A binding price floor on milk leaves producers with unsold inventory. Which hidden cost is most likely?", "options": ["Waste, storage costs, or government purchases to support the price", "Long lines among buyers because quantity demanded exceeds quantity supplied", "Black-market premiums from buyers competing for scarce milk", "No cost because producers receive a higher legal price"], "a": 0, "tag": "price_floor", "type": "synthesis", "objective": "LO6.2", "difficulty": "legendary", "conceptCluster": "legendary_market_gate", "primarySkill": "floor_unintended_consequences", "secondarySkills": ["surplus", "producer_incentives"], "repairSkill": "minimum_wage_tradeoff", "commonError": "ignores_costs_of_surplus", "feedback": "A binding floor creates a surplus, which can lead to waste, storage costs, or policy costs." },
{ "id": 14050, sourceGame: "marketGate", "q": "A rent ceiling causes landlords to convert apartments into short-term rentals outside the regulated market. What does this show?", "options": ["A policy can change incentives and reduce quantity supplied in the regulated market", "A ceiling always increases quantity supplied", "A ceiling eliminates opportunity cost for landlords", "A ceiling is nonbinding if landlords find loopholes"], "a": 0, "tag": "price_ceiling", "type": "synthesis", "objective": "LO6.1", "difficulty": "legendary", "conceptCluster": "legendary_market_gate", "primarySkill": "ceiling_supply_response", "secondarySkills": ["incentives", "unintended_consequences"], "repairSkill": "ceiling_unintended_consequences", "commonError": "assumes_legal_price_change_does_not_affect_supplier_behavior", "feedback": "A binding ceiling lowers returns in the regulated market and can push suppliers to adjust around the policy." },
{ "id": 14051, sourceGame: "marketGate", "q": "A wage floor raises pay for workers who keep jobs but reduces entry-level openings. Which economic idea best frames the policy debate?", "options": ["An efficiency-equity tradeoff", "A movement along the PPF with no opportunity cost", "A nonbinding ceiling", "A fixed CPI basket"], "a": 0, "tag": "price_floor", "type": "synthesis", "objective": "LO1.1", "difficulty": "legendary", "conceptCluster": "legendary_market_gate", "primarySkill": "efficiency_equity_tradeoff", "secondarySkills": ["minimum_wage", "labor_surplus"], "repairSkill": "policy_tradeoff_analysis", "commonError": "analyzes_only_winners_or_only_losers", "feedback": "The policy can improve outcomes for some workers while reducing efficiency or job access for others." },
{ "id": 14052, sourceGame: "marketGate", "q": "A city wants affordable housing and proposes a rent ceiling below equilibrium. Which economist response is positive rather than normative?", "options": ["The ceiling will likely create a shortage if set below equilibrium", "The city should accept shortages to help poorer renters", "The policy is morally required", "Housing is too important to leave to markets"], "a": 0, "tag": "positive_normative", "type": "trap", "objective": "LO2.4", "difficulty": "legendary", "conceptCluster": "legendary_market_gate", "primarySkill": "positive_normative_distinction", "secondarySkills": ["price_ceiling"], "repairSkill": "positive_normative_distinction", "commonError": "confuses_policy_analysis_with_policy_preference", "feedback": "Predicting a shortage from a binding ceiling is a testable positive claim." },
{ "id": 14053, sourceGame: "marketGate", "q": "A minimum wage is set above equilibrium, but employment does not fall much. Which explanation best fits supply and demand logic?", "options": ["Labor demand may be relatively inelastic over that range", "The law of demand has been disproven", "The wage floor must be below equilibrium", "Higher wages always increase quantity demanded for labor"], "a": 0, "tag": "price_floor", "type": "synthesis", "objective": "LO6.2", "difficulty": "legendary", "conceptCluster": "legendary_market_gate", "primarySkill": "labor_demand_elasticity_interpretation", "secondarySkills": ["minimum_wage", "quantity_demanded"], "repairSkill": "minimum_wage_tradeoff", "commonError": "expects_large_quantity_change_from_every_price_change", "feedback": "If labor demand is relatively inelastic, employment may fall only modestly when wages rise." },
{ "id": 14054, sourceGame: "marketGate", "q": "A price ceiling lowers the posted price from $30 to $20, but buyers spend two extra hours searching. What mistake does a posted-price-only analysis make?", "options": ["It ignores opportunity costs and nonmoney rationing", "It double-counts producer surplus", "It treats a price ceiling as a price floor", "It assumes supply shifts right"], "a": 0, "tag": "price_ceiling", "type": "synthesis", "objective": "LO1.2", "difficulty": "legendary", "conceptCluster": "legendary_market_gate", "primarySkill": "full_cost_opportunity_cost_analysis", "secondarySkills": ["nonprice_rationing", "shortage"], "repairSkill": "opportunity_cost_definition", "commonError": "treats_money_price_as_total_cost", "feedback": "The money price is not the full cost when buyers must spend time searching or waiting." },

{ "id": 14061, sourceGame: "marketGate", "q": "A $5 tax is imposed. Buyers pay $3 more and sellers receive $2 less than before. Which side bears more burden and what does that imply?", "options": ["Buyers bear more, suggesting demand is less elastic than supply", "Sellers bear more, suggesting supply is less elastic than demand", "Both bear the same burden because the tax is $5", "The legal taxpayer bears all of the burden"], "a": 0, "tag": "tax_incidence", "type": "synthesis", "objective": "LO6.5", "difficulty": "legendary", "conceptCluster": "legendary_market_gate", "primarySkill": "tax_burden_elasticity_inference", "secondarySkills": ["tax_wedge", "elasticity"], "repairSkill": "tax_incidence_elasticity", "commonError": "ignores_price_changes_when_assigning_burden", "feedback": "Buyers bear $3 of the $5 tax. The side with less elastic behavior tends to bear more burden." },
{ "id": 14062, sourceGame: "marketGate", "q": "A seller-side tax shifts the supply curve upward. Which statement best explains why buyers still pay part of the tax?", "options": ["The market price adjusts, so the burden depends on elasticities rather than legal assignment", "Buyers voluntarily pay taxes for sellers", "The demand curve shifts right by the tax amount", "The tax creates a price ceiling"], "a": 0, "tag": "tax_incidence", "type": "trap", "objective": "LO6.4", "difficulty": "legendary", "conceptCluster": "legendary_market_gate", "primarySkill": "statutory_vs_economic_incidence", "secondarySkills": ["tax_equivalence", "market_adjustment"], "repairSkill": "tax_incidence_equivalence", "commonError": "confuses_who_remits_tax_with_who_bears_tax", "feedback": "Legal remittance does not determine economic burden. Prices adjust based on supply and demand elasticities." },
{ "id": 14063, sourceGame: "marketGate", "q": "A tax is placed on buyers instead of sellers. In a standard supply-demand model, why is the final outcome similar to an equal seller tax?", "options": ["Either tax creates the same wedge between buyer price and seller price", "Only buyer taxes reduce quantity", "Only seller taxes raise prices", "The tax disappears if buyers legally pay it"], "a": 0, "tag": "tax_incidence", "type": "synthesis", "objective": "LO6.4", "difficulty": "legendary", "conceptCluster": "legendary_market_gate", "primarySkill": "buyer_seller_tax_equivalence", "secondarySkills": ["tax_wedge", "equilibrium"], "repairSkill": "tax_incidence_equivalence", "commonError": "thinks_legal_side_changes_total_wedge_effect", "feedback": "A buyer tax or seller tax of the same size creates the same wedge and reduces quantity similarly." },
{ "id": 14064, sourceGame: "marketGate", "q": "A $7 tax reduces quantity from 500 to 420 units. What does this show beyond tax revenue?", "options": ["The tax shrinks the market by discouraging mutually beneficial trades", "The tax increases market size because government collects revenue", "The tax leaves buyers and sellers unaffected if revenue is spent", "The tax creates a surplus because quantity falls"], "a": 0, "tag": "tax", "type": "interpretation", "objective": "LO6.3", "difficulty": "legendary", "conceptCluster": "legendary_market_gate", "primarySkill": "tax_quantity_effect", "secondarySkills": ["deadweight_loss_logic", "market_size"], "repairSkill": "tax_quantity_effect", "commonError": "focuses_only_on_tax_revenue", "feedback": "A tax reduces quantity traded, meaning some mutually beneficial exchanges no longer happen." },
{ "id": 14065, sourceGame: "marketGate", "q": "A tax on cigarettes causes only a small drop in quantity but a large increase in buyer price. What does that suggest?", "options": ["Demand is relatively inelastic, so buyers bear much of the burden", "Demand is relatively elastic, so sellers bear all of the burden", "Supply must be perfectly inelastic", "The tax is nonbinding"], "a": 0, "tag": "tax_incidence", "type": "synthesis", "objective": "LO6.5", "difficulty": "legendary", "conceptCluster": "legendary_market_gate", "primarySkill": "inelastic_demand_tax_burden", "secondarySkills": ["quantity_response", "buyer_price"], "repairSkill": "tax_incidence_elasticity", "commonError": "assumes_large_price_change_requires_elastic_demand", "feedback": "When buyers do not reduce quantity much, demand is relatively inelastic and buyers bear more of the tax." },
{ "id": 14066, sourceGame: "marketGate", "q": "A tax on luxury boat rentals causes quantity rented to collapse while buyer price rises only slightly. What does that suggest?", "options": ["Demand is relatively elastic, so sellers likely bear more of the burden", "Demand is relatively inelastic, so buyers bear nearly all of the burden", "The tax must have increased demand", "The tax must be legally paid by buyers"], "a": 0, "tag": "tax_incidence", "type": "synthesis", "objective": "LO6.5", "difficulty": "legendary", "conceptCluster": "legendary_market_gate", "primarySkill": "elastic_demand_tax_burden", "secondarySkills": ["quantity_response", "seller_burden"], "repairSkill": "tax_incidence_elasticity", "commonError": "assigns_burden_to_buyers_whenever_buyer_price_rises", "feedback": "If buyers reduce quantity sharply, demand is elastic and sellers often bear more burden through lower net prices." },
{ "id": 14067, sourceGame: "marketGate", "q": "Before tax, price is $20 and quantity is 1,000. After a $6 tax, buyers pay $24, sellers receive $18, and quantity is 850. What is tax revenue?", "options": ["$5,100", "$6,000", "$3,400", "$20,400"], "a": 0, "tag": "tax", "type": "calculation", "objective": "LO6.3", "difficulty": "legendary", "conceptCluster": "legendary_market_gate", "primarySkill": "tax_revenue_calculation", "secondarySkills": ["tax_wedge", "after_tax_quantity"], "repairSkill": "tax_revenue_calculation", "commonError": "uses_original_quantity_instead_of_after_tax_quantity", "feedback": "Tax revenue equals tax per unit times after-tax quantity: $6 × 850 = $5,100." },
{ "id": 14068, sourceGame: "marketGate", "q": "Before tax, price is $20. After tax, buyers pay $24 and sellers receive $18. Which statement correctly splits the burden?", "options": ["Buyers bear $4 and sellers bear $2", "Buyers bear $2 and sellers bear $4", "Buyers bear $6 and sellers bear $0", "Buyers bear $24 and sellers bear $18"], "a": 0, "tag": "tax_incidence", "type": "calculation", "objective": "LO6.5", "difficulty": "legendary", "conceptCluster": "legendary_market_gate", "primarySkill": "tax_burden_split", "secondarySkills": ["buyer_price", "seller_price"], "repairSkill": "tax_burden_split", "commonError": "uses_after_tax_prices_as_burden_amounts", "feedback": "Buyers pay $4 more than before, while sellers receive $2 less than before." },
{ "id": 14069, sourceGame: "marketGate", "q": "A tax on a good raises government revenue but reduces quantity traded. Which answer best connects taxes to market efficiency?", "options": ["Some trades with benefits above costs no longer occur because the tax wedge blocks them", "All lost trades were inefficient anyway", "Tax revenue always exceeds any efficiency loss", "Taxes improve efficiency whenever buyers dislike higher prices"], "a": 0, "tag": "tax", "type": "synthesis", "objective": "LO6.3", "difficulty": "legendary", "conceptCluster": "legendary_market_gate", "primarySkill": "tax_deadweight_loss_logic", "secondarySkills": ["tax_wedge", "market_size"], "repairSkill": "tax_quantity_effect", "commonError": "thinks_revenue_cancels_lost_surplus", "feedback": "A tax wedge can prevent trades that would have benefited both buyers and sellers." },
{ "id": 14070, sourceGame: "marketGate", "q": "A seller argues, 'The tax is legally charged to buyers, so my business cannot be affected.' What is the best response?", "options": ["Wrong; buyer taxes can reduce demand faced by sellers and lower quantity sold", "Correct; only the legal taxpayer changes behavior", "Correct; seller revenue cannot change when buyers pay the tax", "Wrong; the tax becomes a price floor"], "a": 0, "tag": "tax_incidence", "type": "trap", "objective": "LO6.4", "difficulty": "legendary", "conceptCluster": "legendary_market_gate", "primarySkill": "tax_equivalence_application", "secondarySkills": ["seller_revenue", "quantity_effect"], "repairSkill": "tax_incidence_equivalence", "commonError": "assumes_nonlegal_side_is_unaffected", "feedback": "Even when buyers remit the tax, sellers can be affected through lower quantity sold and changed equilibrium prices." },
{ "id": 14071, sourceGame: "marketGate", "q": "A tax is imposed on a market where supply is perfectly inelastic. Who bears the tax burden?", "options": ["Sellers bear the burden because quantity supplied cannot respond", "Buyers bear the burden because demand slopes downward", "The burden is split equally by law", "No one bears the burden because quantity does not change"], "a": 0, "tag": "tax_incidence", "type": "trap", "objective": "LO6.5", "difficulty": "legendary", "conceptCluster": "legendary_market_gate", "primarySkill": "perfectly_inelastic_supply_tax_burden", "secondarySkills": ["elasticity_extreme_case"], "repairSkill": "tax_incidence_elasticity", "commonError": "thinks_no_quantity_change_means_no_burden", "feedback": "The side that cannot adjust bears more burden. Perfectly inelastic supply means sellers bear the tax." },
{ "id": 14072, sourceGame: "marketGate", "q": "A tax is imposed on a market where demand is perfectly inelastic. Who bears the tax burden?", "options": ["Buyers bear the burden because quantity demanded does not respond", "Sellers bear the burden because they collect the money", "The government bears the burden", "No one bears the burden because quantity does not change"], "a": 0, "tag": "tax_incidence", "type": "trap", "objective": "LO6.5", "difficulty": "legendary", "conceptCluster": "legendary_market_gate", "primarySkill": "perfectly_inelastic_demand_tax_burden", "secondarySkills": ["elasticity_extreme_case"], "repairSkill": "tax_incidence_elasticity", "commonError": "thinks_legal_collection_determines_burden", "feedback": "If buyers do not change quantity demanded at all, buyers bear the tax burden." },
{ "id": 14073, sourceGame: "marketGate", "q": "A tax causes buyers to pay more, sellers to receive less, and quantity to fall. Which statement is false?", "options": ["The side legally assigned the tax must bear the entire burden", "The tax creates a wedge between buyer and seller prices", "The market quantity falls after the tax", "Buyers and sellers can both be worse off per unit traded"], "a": 0, "tag": "tax_incidence", "type": "trap", "objective": "LO6.4", "difficulty": "legendary", "conceptCluster": "legendary_market_gate", "primarySkill": "tax_incidence_misconception_detection", "secondarySkills": ["statutory_incidence", "economic_incidence"], "repairSkill": "tax_incidence_equivalence", "commonError": "chooses_true_tax_wedge_statement_as_false", "feedback": "The legal assignment does not determine the entire burden. Market elasticities matter." },
{ "id": 14074, sourceGame: "marketGate", "q": "A city taxes ride-share trips. Riders pay higher prices, drivers receive less per trip, and fewer trips occur. What is the best synthesis?", "options": ["The tax wedge is shared and shrinks the number of exchanges", "The tax affects only riders if they see the fee at checkout", "The tax affects only drivers if the platform remits it", "The tax increases quantity because government revenue rises"], "a": 0, "tag": "tax_incidence", "type": "synthesis", "objective": "LO6.3", "difficulty": "legendary", "conceptCluster": "legendary_market_gate", "primarySkill": "tax_wedge_market_shrinkage_synthesis", "secondarySkills": ["buyer_price", "seller_price", "quantity_effect"], "repairSkill": "tax_wedge_calculation", "commonError": "focuses_on_payment_interface_instead_of_market_outcome", "feedback": "A tax creates a wedge shared by market participants and reduces the quantity traded." },
{ "id": 14078, sourceGame: "marketGate", "q": "A mayor says, 'Rent control will reduce average rent by 15%.' An economist says, 'Rent control should be used even if it creates shortages.' Which classification is correct?", "options": ["The first is positive if testable; the second is normative because it recommends policy", "Both are positive because both mention rent control", "Both are normative because both involve government policy", "The first is normative and the second is positive"], "a": 0, "tag": "positive_normative", "type": "multi-step", "objective": "LO2.4", "difficulty": "legendary", "conceptCluster": "legendary_market_gate", "primarySkill": "positive_normative_comparison", "secondarySkills": ["policy_analysis", "testable_claims"], "repairSkill": "positive_normative_distinction", "commonError": "classifies_all_policy_claims_as_normative", "feedback": "A testable prediction is positive. A recommendation about what should be done is normative." },
{ "id": 14079, sourceGame: "marketGate", "q": "A university raises parking fines. Parking violations fall, but students start parking in nearby neighborhoods. What is the best interpretation?", "options": ["The policy changed incentives and created an unintended margin of adjustment", "The policy failed to create incentives because students still park", "Opportunity cost disappeared because fines are legal penalties", "The policy shifted the PPF outward"], "a": 0, "tag": "incentives", "type": "synthesis", "objective": "LO1.4", "difficulty": "legendary", "conceptCluster": "legendary_market_gate", "primarySkill": "incentives_unintended_consequences", "secondarySkills": ["behavioral_response", "policy_design"], "repairSkill": "incentives_unintended_consequences", "commonError": "looks_only_at_intended_behavior_change", "feedback": "People respond to incentives in intended and unintended ways." },
{ "id": 14080, sourceGame: "marketGate", "q": "An economist leaves out foreign trade when modeling a local haircut market. Why is that not automatically a flaw?", "options": ["A model can omit details to isolate the relationship being studied", "A model is valid only if it includes every institution", "Foreign trade never matters in economics", "Models are used to avoid assumptions"], "a": 0, "tag": "models", "type": "interpretation", "objective": "LO2.1", "difficulty": "legendary", "conceptCluster": "legendary_market_gate", "primarySkill": "model_purpose", "secondarySkills": ["assumptions", "simplification"], "repairSkill": "model_purpose", "commonError": "thinks_simplification_means_uselessness", "feedback": "Models simplify reality on purpose so economists can focus on key relationships." },
{ "id": 14081, sourceGame: "marketGate", "q": "A statement says, 'A tax on soda reduces soda consumption by 8%.' Another says, 'The government should tax soda to improve health.' Which answer is correct?", "options": ["The first is positive; the second is normative", "The first is normative; the second is positive", "Both are positive", "Both are normative"], "a": 0, "tag": "positive_normative", "type": "trap", "objective": "LO2.4", "difficulty": "legendary", "conceptCluster": "legendary_market_gate", "primarySkill": "positive_normative_distinction", "secondarySkills": ["tax_policy", "testability"], "repairSkill": "positive_normative_distinction", "commonError": "mistakes_policy_topic_for_normative_statement", "feedback": "A measurable effect is positive. A recommendation about what government should do is normative." },
{ "id": 14082, sourceGame: "marketGate", "q": "A subsidy for electric cars increases purchases, but also mostly benefits households who would have bought electric cars anyway. What idea is being tested?", "options": ["Incentives can create intended responses and unintended distributional effects", "Subsidies remove scarcity", "A subsidy is the same as a binding price ceiling", "Consumers ignore incentives when products are expensive"], "a": 0, "tag": "incentives", "type": "synthesis", "objective": "LO1.4", "difficulty": "legendary", "conceptCluster": "legendary_market_gate", "primarySkill": "incentives_policy_evaluation", "secondarySkills": ["unintended_consequences", "marginal_response"], "repairSkill": "incentives_unintended_consequences", "commonError": "judges_policy_only_by_intended_goal", "feedback": "Incentives change behavior, but the actual benefits may not land exactly where policymakers intended." },
{ "id": 14083, sourceGame: "marketGate", "q": "A circular-flow model shows households supplying labor to firms and receiving wages. Which market is being described?", "options": ["The market for factors of production", "The market for final goods and services", "The market for price ceilings", "The market for tax revenue"], "a": 0, "tag": "circular_flow", "type": "interpretation", "objective": "LO2.2", "difficulty": "legendary", "conceptCluster": "legendary_market_gate", "primarySkill": "circular_flow_roles", "secondarySkills": ["factor_market", "households_firms"], "repairSkill": "circular_flow_components", "commonError": "reverses_product_and_factor_markets", "feedback": "Households provide factors of production such as labor in factor markets and receive income." },
{ "id": 14084, sourceGame: "marketGate", "q": "A student says, 'The minimum wage should rise because fairness matters more than efficiency.' What is the best classification?", "options": ["Normative, because it makes a value judgment about what should matter more", "Positive, because it mentions efficiency", "Positive, because it discusses wages", "Neither, because economics cannot discuss fairness"], "a": 0, "tag": "positive_normative", "type": "trap", "objective": "LO2.4", "difficulty": "legendary", "conceptCluster": "legendary_market_gate", "primarySkill": "normative_value_judgment", "secondarySkills": ["efficiency_equity_tradeoff"], "repairSkill": "positive_normative_distinction", "commonError": "treats_economic_vocabulary_as_making_claim_positive", "feedback": "The statement recommends what should happen and ranks values, so it is normative." },
{ "id": 14085, sourceGame: "marketGate", "q": "A company pays bonuses for speed. Output rises, but quality complaints increase. What does this show?", "options": ["Incentives work, but poorly designed incentives can distort behavior", "Incentives do not affect workers", "Marginal analysis requires ignoring quality", "The policy created a price ceiling"], "a": 0, "tag": "incentives", "type": "synthesis", "objective": "LO1.4", "difficulty": "legendary", "conceptCluster": "legendary_market_gate", "primarySkill": "incentive_design_tradeoff", "secondarySkills": ["unintended_consequences", "marginal_behavior"], "repairSkill": "incentives_unintended_consequences", "commonError": "counts_only_intended_metric_improvement", "feedback": "People respond to the measured incentive, which can improve one outcome while damaging another." },
{ "id": 14086, sourceGame: "marketGate", "q": "An economist uses a PPF model with only two goods even though real economies produce millions. Why is that acceptable?", "options": ["The model simplifies reality to clarify scarcity and tradeoffs", "The model proves real economies produce only two goods", "The model removes opportunity cost", "The model is normative because it uses a graph"], "a": 0, "tag": "models", "type": "interpretation", "objective": "LO2.1", "difficulty": "legendary", "conceptCluster": "legendary_market_gate", "primarySkill": "model_simplification", "secondarySkills": ["ppf", "scarcity"], "repairSkill": "model_purpose", "commonError": "rejects_models_for_omitting_real_world_detail", "feedback": "A PPF strips the economy down to two goods so the tradeoff logic is visible." },
{ "id": 14087, sourceGame: "marketGate", "q": "A researcher says, 'When rent control is below equilibrium, quantity demanded exceeds quantity supplied.' What type of statement is this?", "options": ["Positive, because it is a testable claim about market outcomes", "Normative, because rent control is controversial", "Normative, because it uses the word equilibrium", "Neither, because models cannot be tested"], "a": 0, "tag": "positive_normative", "type": "trap", "objective": "LO2.4", "difficulty": "legendary", "conceptCluster": "legendary_market_gate", "primarySkill": "positive_statement_identification", "secondarySkills": ["price_ceiling", "shortage"], "repairSkill": "positive_normative_distinction", "commonError": "classifies_controversial_topic_as_normative_even_when_claim_is_testable", "feedback": "The statement predicts a testable relationship, so it is positive." },
{ "id": 14088, sourceGame: "marketGate", "q": "A city reduces bus fares to increase ridership. Ridership rises, but crowding makes some riders switch back to cars. What is the strongest lesson?", "options": ["Policy changes incentives, but secondary effects can offset part of the intended response", "Lower prices always increase welfare for every rider", "Crowding proves the law of demand is false", "The bus market has no scarcity because fares fell"], "a": 0, "tag": "incentives", "type": "synthesis", "objective": "LO1.4", "difficulty": "legendary", "conceptCluster": "legendary_market_gate", "primarySkill": "incentives_secondary_effects", "secondarySkills": ["law_of_demand", "unintended_consequences"], "repairSkill": "incentives_unintended_consequences", "commonError": "stops_analysis_after_first_order_effect", "feedback": "The fare cut increases quantity demanded, but crowding changes the experience and creates a secondary response." },
{ "id": 14089, sourceGame: "marketGate", "q": "A model predicts that a binding price ceiling creates shortages, but a real city also has black markets, quality decline, and favoritism. What does this say about the model?", "options": ["The model captures the core shortage logic, while real-world institutions shape how the shortage appears", "The model is useless because it did not list every consequence", "The model proves black markets cannot happen", "The model becomes normative once real examples are added"], "a": 0, "tag": "models", "type": "synthesis", "objective": "LO2.1", "difficulty": "legendary", "conceptCluster": "legendary_market_gate", "primarySkill": "model_application_limits", "secondarySkills": ["price_ceiling", "nonprice_rationing"], "repairSkill": "model_purpose", "commonError": "rejects_model_because_it_is_not_exhaustive", "feedback": "A simple model explains the core mechanism. Real-world details determine the specific form the shortage takes." },

  { id:14090, sourceGame: "nationalLedger", difficulty:"legendary", conceptCluster:"gdp_components", primarySkill:"imports_exports_nx", secondarySkills:["gdp_components_identity"], repairSkill:"imports_exports_nx", commonError:"Adding imports instead of subtracting them through net exports.", q:"A country reports C = $18T, I = $4T, G = $7T, exports = $3T, imports = $5T, and $2T of unsold domestic output added to inventories already included in I. What is GDP, and what common mistake should be avoided?", options:["$27T; do not add inventories again because they are already included in investment","$29T; inventories should be added after the GDP identity","$31T; imports should be added because consumers bought them","$25T; exports should be excluded because foreigners bought them"], a:0, tag:"gdp_components", type:"multi-step", objective:"LO24.3", feedback:"GDP = 18 + 4 + 7 + (3 - 5) = 27. Inventories are already part of investment, so adding them again double counts." },
  { id:14091, sourceGame: "nationalLedger", difficulty:"legendary", conceptCluster:"gdp_measurement", primarySkill:"gdp_counting_rules", secondarySkills:["intermediate_vs_final_goods"], repairSkill:"gdp_counting_rules", commonError:"Counting transactions that are not current domestic production, such as used goods, financial assets, or foreign production.", q:"A U.S. household buys a $45,000 car made in Japan, and a Japanese household buys a $50,000 tractor made in Iowa. What is the net direct effect on U.S. GDP from these two transactions?", options:["U.S. GDP rises by $50,000 because only the Iowa tractor is U.S. production","U.S. GDP rises by $95,000 because both purchases are final goods","U.S. GDP rises by $5,000 because exports minus imports equals $5,000","U.S. GDP falls by $45,000 because imports reduce GDP"], a:0, tag:"gdp_definition", type:"trap", objective:"LO24.2", feedback:"GDP counts domestic production. The imported car is not U.S. production; the Iowa tractor is." },
  { id:14092, sourceGame: "nationalLedger", difficulty:"legendary", conceptCluster:"gdp_measurement", primarySkill:"gdp_counting_rules", secondarySkills:["intermediate_vs_final_goods"], repairSkill:"gdp_counting_rules", commonError:"Counting transactions that are not current domestic production, such as used goods, financial assets, or foreign production.", q:"A firm imports $200,000 of components, adds $150,000 of domestic labor and capital services, and sells the final product domestically for $350,000. How much does this production add to domestic GDP?", options:["$150,000","$200,000","$350,000","$550,000"], a:0, tag:"gdp_definition", type:"calculation", objective:"LO24.2", feedback:"Only domestic value added counts in domestic GDP. Imported components are not domestic production." },
  { id:14093, sourceGame: "nationalLedger", difficulty:"legendary", conceptCluster:"gdp_measurement", primarySkill:"intermediate_vs_final_goods", secondarySkills:["gdp_counting_rules"], repairSkill:"intermediate_vs_final_goods", commonError:"Double-counting intermediate goods instead of counting final value or value added.", q:"A bakery buys flour for $90, pays workers $120, pays rent and interest of $40, and sells bread to households for $300. What is the bakery's value added?", options:["$210","$300","$250","$120"], a:0, tag:"gdp_definition", type:"calculation", objective:"LO24.2", feedback:"Value added equals final sales minus intermediate inputs: 300 - 90 = 210." },
  { id:14094, sourceGame: "nationalLedger", difficulty:"legendary", conceptCluster:"gdp_components", primarySkill:"gdp_components_identity", secondarySkills:["imports_exports_nx", "inventory_investment"], repairSkill:"gdp_components_identity", commonError:"Mixing up the GDP expenditure components or forgetting the C + I + G + NX identity.", q:"A government pays $80B to contractors to repair roads and sends $80B in unemployment benefits. Recipients spend half the benefits on domestic final goods and save the rest. What is the direct GDP increase described?", options:["$120B","$80B","$160B","$40B"], a:0, tag:"gdp_components", type:"multi-step", objective:"LO24.3", feedback:"Road repair is government purchases of $80B. Half of the transfers spent on domestic final goods adds $40B of consumption. Transfers themselves do not count." },
  { id:14095, sourceGame: "nationalLedger", difficulty:"legendary", conceptCluster:"real_nominal_gdp", primarySkill:"gdp_deflator", secondarySkills:["nominal_vs_real_gdp"], repairSkill:"gdp_deflator", commonError:"Forgetting that the GDP deflator compares nominal GDP to real GDP.", q:"Nominal GDP rises from $24T to $30T while the GDP deflator rises from 120 to 150. What happens to real GDP?", options:["It is unchanged","It rises by 25%","It falls by 20%","It rises by 5%"], a:0, tag:"real_nominal_gdp", type:"calculation", objective:"LO24.4", feedback:"Initial real GDP = 24/1.20 = 20. New real GDP = 30/1.50 = 20. Real GDP is unchanged." },
  { id:14096, sourceGame: "nationalLedger", difficulty:"legendary", conceptCluster:"real_nominal_gdp", primarySkill:"nominal_vs_real_gdp", secondarySkills:["gdp_deflator"], repairSkill:"nominal_vs_real_gdp", commonError:"Confusing price changes with real output changes.", q:"An economy produces 100 computers at $1,000 and 500 meals at $20 in the base year. This year it produces 120 computers at $900 and 550 meals at $24. What is this year's real GDP using base-year prices?", options:["$131,000","$121,200","$108,000","$145,200"], a:0, tag:"real_nominal_gdp", type:"calculation", objective:"LO24.4", feedback:"Real GDP = 120($1,000) + 550($20) = $120,000 + $11,000 = $131,000." },
  { id:14097, sourceGame: "nationalLedger", difficulty:"legendary", conceptCluster:"real_nominal_gdp", primarySkill:"nominal_vs_real_gdp", secondarySkills:["gdp_deflator"], repairSkill:"nominal_vs_real_gdp", commonError:"Confusing price changes with real output changes.", q:"The same economy produces 120 computers at $900 and 550 meals at $24 this year. What is this year's nominal GDP?", options:["$121,200","$131,000","$145,200","$108,000"], a:0, tag:"real_nominal_gdp", type:"calculation", objective:"LO24.4", feedback:"Nominal GDP = 120($900) + 550($24) = $108,000 + $13,200 = $121,200." },
  { id:14098, sourceGame: "nationalLedger", difficulty:"legendary", conceptCluster:"gdp_components", primarySkill:"gdp_components_identity", secondarySkills:["imports_exports_nx", "inventory_investment"], repairSkill:"gdp_components_identity", commonError:"Mixing up the GDP expenditure components or forgetting the C + I + G + NX identity.", q:"A firm produces $10M of goods in December but sells $7M in December and $3M in January. How should the $3M be treated for December GDP?", options:["It counts as inventory investment in December","It is excluded until January","It counts as consumption in December","It is subtracted from December GDP"], a:0, tag:"gdp_components", type:"trap", objective:"LO24.3", feedback:"Goods produced but not sold are counted as inventory investment in the period produced." },
  { id:14099, sourceGame: "nationalLedger", difficulty:"legendary", conceptCluster:"gdp_measurement", primarySkill:"gdp_counting_rules", secondarySkills:["intermediate_vs_final_goods"], repairSkill:"gdp_counting_rules", commonError:"Counting transactions that are not current domestic production, such as used goods, financial assets, or foreign production.", q:"A homeowner pays a contractor $12,000 for repairs, buys $4,000 of imported appliances, and sells an old table for $500. What is the direct effect on domestic GDP?", options:["$12,000","$16,000","$15,500","$12,500"], a:0, tag:"gdp_definition", type:"multi-step", objective:"LO24.2", feedback:"The contractor's domestic repair service counts. Imported appliances do not add to domestic GDP, and the used table resale does not count." },
  { id:14100, sourceGame: "nationalLedger", difficulty:"legendary", conceptCluster:"gdp_measurement", primarySkill:"income_expenditure_identity", secondarySkills:["gdp_counting_rules"], repairSkill:"income_expenditure_identity", commonError:"Treating spending and income as unrelated totals instead of two sides of the same transaction.", q:"If GDP measured by expenditure is $26T and income data show wages of $15T, rent and interest of $4T, profits of $5T, and other production income of $2T, what does this show?", options:["Income and expenditure reconcile at $26T","Income is short by $2T","GDP should be $24T because other production income is excluded","GDP should be $30T because income and spending are added together"], a:0, tag:"gdp_income_expenditure", type:"multi-step", objective:"LO24.1", feedback:"The income categories sum to $26T, matching expenditure GDP." },
  { id:14101, sourceGame: "nationalLedger", difficulty:"legendary", conceptCluster:"gdp_measurement", primarySkill:"gdp_counting_rules", secondarySkills:["intermediate_vs_final_goods"], repairSkill:"gdp_counting_rules", commonError:"Counting transactions that are not current domestic production, such as used goods, financial assets, or foreign production.", q:"A student says GDP is higher when a used car is resold because the buyer spends money and the seller receives income. What is the best correction?", options:["The resale creates income for the seller but does not represent current production of a final good","All income transactions count in GDP","Used goods count if sold above market value","Only the buyer's spending counts, not the seller's income"], a:0, tag:"gdp_definition", type:"trap", objective:"LO24.2", feedback:"GDP measures current production. Used goods were counted when first produced." },
  { id:14102, sourceGame: "nationalLedger", difficulty:"legendary", conceptCluster:"gdp_components", primarySkill:"inventory_investment", secondarySkills:["gdp_components_identity"], repairSkill:"inventory_investment", commonError:"Excluding unsold current production instead of counting it as inventory investment.", q:"A domestic firm produces $2M in software, sells $1.2M to domestic households, $500,000 to foreign customers, and keeps $300,000 unsold. What is counted in domestic GDP?", options:["$2M","$1.2M","$1.7M","$1.5M"], a:0, tag:"gdp_components", type:"multi-step", objective:"LO24.3", feedback:"All current domestic production counts: consumption, exports, and inventory investment together equal $2M." },
  { id:14103, sourceGame: "nationalLedger", difficulty:"legendary", conceptCluster:"real_nominal_gdp", primarySkill:"gdp_deflator", secondarySkills:["nominal_vs_real_gdp"], repairSkill:"gdp_deflator", commonError:"Forgetting that the GDP deflator compares nominal GDP to real GDP.", q:"If nominal GDP rises by 12% while real GDP rises by 3%, what is the best approximate interpretation?", options:["Most of the nominal increase reflects price increases rather than output growth","Real output fell sharply","Prices must have fallen by 9%","GDP cannot be compared over time"], a:0, tag:"real_nominal_gdp", type:"interpretation", objective:"LO24.4", feedback:"Nominal GDP reflects price and output changes; real GDP isolates output. The gap mostly reflects inflation." },
  { id:14104, sourceGame: "nationalLedger", difficulty:"legendary", conceptCluster:"gdp_wellbeing", primarySkill:"gdp_wellbeing_limits", secondarySkills:["gdp_counting_rules"], repairSkill:"gdp_wellbeing_limits", commonError:"Assuming higher GDP automatically means higher overall well-being.", q:"Country A has GDP per person of $70,000 but severe pollution, long work hours, and high inequality. Country B has GDP per person of $60,000 with cleaner air, more leisure, and broader access to services. What is the best conclusion?", options:["GDP per person alone cannot settle which country has higher well-being","Country A must have higher well-being because GDP per person is higher","Country B must have higher GDP once adjusted","GDP is useless because it does not measure anything important"], a:0, tag:"gdp_wellbeing", type:"interpretation", objective:"LO24.5", feedback:"GDP per person is useful but incomplete because it misses leisure, pollution, inequality, and other quality-of-life issues." },
  { id:14105, sourceGame: "nationalLedger", difficulty:"legendary", conceptCluster:"gdp_wellbeing", primarySkill:"gdp_wellbeing_limits", secondarySkills:["gdp_counting_rules"], repairSkill:"gdp_wellbeing_limits", commonError:"Assuming higher GDP automatically means higher overall well-being.", q:"A country rebuilds after a flood. Construction spending raises GDP, but households have lost homes and possessions. What does this show?", options:["GDP can rise even while welfare falls because rebuilding replaces destroyed assets","GDP must fall whenever disaster occurs","GDP subtracts the value of destroyed property automatically","Rebuilding is excluded because it follows a disaster"], a:0, tag:"gdp_wellbeing", type:"interpretation", objective:"LO24.5", feedback:"GDP counts current production but does not fully subtract the welfare loss from destruction." },
  { id:14106, sourceGame: "nationalLedger", difficulty:"legendary", conceptCluster:"gdp_measurement", primarySkill:"gdp_counting_rules", secondarySkills:["intermediate_vs_final_goods"], repairSkill:"gdp_counting_rules", commonError:"Counting transactions that are not current domestic production, such as used goods, financial assets, or foreign production.", q:"A U.S. firm earns profits from a factory located in Vietnam. Why is this not part of U.S. GDP?", options:["GDP counts production within U.S. borders, not income earned abroad by U.S. residents","Profits are never counted in income accounting","Foreign production counts only if imported back to the U.S.","GDP counts only wages"], a:0, tag:"gdp_definition", type:"trap", objective:"LO24.2", feedback:"GDP is domestic production. Income earned abroad relates more to national income measures, not U.S. GDP." },
  { id:14107, sourceGame: "nationalLedger", difficulty:"legendary", conceptCluster:"gdp_components", primarySkill:"imports_exports_nx", secondarySkills:["gdp_components_identity"], repairSkill:"imports_exports_nx", commonError:"Adding imports instead of subtracting them through net exports.", q:"If C rises by $2T entirely because households buy imports, what happens to GDP through the expenditure identity?", options:["GDP is unchanged because C rises by $2T and NX falls by $2T","GDP rises by $2T because consumption rises","GDP falls by $2T because imports are bad","GDP rises by $4T because trade expands"], a:0, tag:"gdp_components", type:"trap", objective:"LO24.3", feedback:"Imports enter C but are subtracted in NX, so domestic production is unchanged." },
  { id:14108, sourceGame: "nationalLedger", difficulty:"legendary", conceptCluster:"real_nominal_gdp", primarySkill:"gdp_deflator", secondarySkills:["nominal_vs_real_gdp"], repairSkill:"gdp_deflator", commonError:"Forgetting that the GDP deflator compares nominal GDP to real GDP.", q:"An economy produces 50 units at $10 in year 1 and 60 units at $12 in year 2. Using year 1 as base, what are year 2 nominal GDP, real GDP, and the GDP deflator?", options:["$720, $600, 120","$600, $720, 83.3","$720, $720, 100","$500, $600, 120"], a:0, tag:"real_nominal_gdp", type:"multi-step", objective:"LO24.4", feedback:"Nominal GDP = 60 x 12 = 720. Real GDP = 60 x 10 = 600. Deflator = 720/600 x 100 = 120." },
  { id:14109, sourceGame: "nationalLedger", difficulty:"legendary", conceptCluster:"gdp_wellbeing", primarySkill:"gdp_wellbeing_limits", secondarySkills:["gdp_counting_rules"], repairSkill:"gdp_wellbeing_limits", commonError:"Assuming higher GDP automatically means higher overall well-being.", q:"A country has GDP of $2T and population of 20M. Another has GDP of $4T and population of 80M. Which has higher GDP per person?", options:["The first country, with $100,000 per person versus $50,000","The second country, because total GDP is larger","They are equal because both are measured in trillions","It cannot be determined without imports"], a:0, tag:"gdp_wellbeing", type:"calculation", objective:"LO24.5", feedback:"GDP per person is $2T/20M = $100,000 and $4T/80M = $50,000." },
  { id:14110, sourceGame: "nationalLedger", difficulty:"legendary", conceptCluster:"gdp_measurement", primarySkill:"gdp_counting_rules", secondarySkills:["intermediate_vs_final_goods"], repairSkill:"gdp_counting_rules", commonError:"Counting transactions that are not current domestic production, such as used goods, financial assets, or foreign production.", q:"A household pays $30 for a restaurant meal, including $5 of sales tax. How should this be interpreted for GDP?", options:["The market value paid for the final service is counted, while tax details affect income distribution/accounting treatment","Only the pre-tax $25 counts because taxes are never linked to GDP","Only the $5 tax counts as government purchases","Nothing counts because meals are services"], a:0, tag:"gdp_definition", type:"trap", objective:"LO24.2", feedback:"GDP counts the market value of final goods and services; taxes do not turn the meal into government purchases." },
  { id:14111, sourceGame: "nationalLedger", difficulty:"legendary", conceptCluster:"gdp_components", primarySkill:"gdp_components_identity", secondarySkills:["imports_exports_nx", "inventory_investment"], repairSkill:"gdp_components_identity", commonError:"Mixing up the GDP expenditure components or forgetting the C + I + G + NX identity.", q:"A firm buys a new domestically produced machine for $1M and a share of stock in another company for $1M. What is the direct effect on GDP?", options:["GDP rises by $1M because the machine is new capital; the stock purchase is a financial transaction","GDP rises by $2M because both are investments","GDP does not change because firms made both purchases","GDP rises only from the stock purchase"], a:0, tag:"gdp_components", type:"trap", objective:"LO24.3", feedback:"Economic investment in GDP means new capital goods, not financial asset purchases." },
  { id:14112, sourceGame: "nationalLedger", difficulty:"legendary", conceptCluster:"real_nominal_gdp", primarySkill:"gdp_deflator", secondarySkills:["nominal_vs_real_gdp"], repairSkill:"gdp_deflator", commonError:"Forgetting that the GDP deflator compares nominal GDP to real GDP.", q:"If an economy's nominal GDP doubles while real GDP rises by only 20%, what must be true?", options:["Much of the nominal increase came from higher prices","Output must have doubled","The GDP deflator must have fallen","Imports must have equaled exports"], a:0, tag:"real_nominal_gdp", type:"interpretation", objective:"LO24.4", feedback:"Nominal GDP reflects prices and quantities; real GDP shows output grew much less than nominal GDP." },
  { id:14113, sourceGame: "nationalLedger", difficulty:"legendary", conceptCluster:"prices_inflation", primarySkill:"cpi_calculation", secondarySkills:["inflation_rate"], repairSkill:"cpi_calculation", commonError:"Using the wrong basket cost or forgetting to multiply by 100.", q:"A CPI basket has 6 gallons of gas and 4 meals. Base prices are $3 per gallon and $12 per meal. Current prices are $4.50 per gallon and $15 per meal. What is the current CPI?", options:["131.82","137.50","151.20","127.27"], a:0, tag:"cpi_inflation", type:"calculation", objective:"LO25.1", feedback:"Base cost = 6(3)+4(12)=66. Current cost = 6(4.5)+4(15)=87. CPI = 100 x 87/66 = 131.82. Wait, none say 131.82; the question is a trap because no listed option is correct." },
  { id:14114, sourceGame: "nationalLedger", difficulty:"legendary", conceptCluster:"prices_inflation", primarySkill:"inflation_rate", secondarySkills:["cpi_calculation"], repairSkill:"inflation_rate", commonError:"Using the CPI point change instead of the percentage change.", q:"A CPI basket costs $800 in the base year, $1,000 last year, and $1,080 this year. What is this year's inflation rate?", options:["8%","35%","25%","10%"], a:0, tag:"cpi_inflation", type:"calculation", objective:"LO25.1", feedback:"Last year's CPI = 125 and this year's CPI = 135. Inflation = (135 - 125)/125 = 8%." },
  { id:14115, sourceGame: "nationalLedger", difficulty:"legendary", conceptCluster:"prices_inflation", primarySkill:"cpi_calculation", secondarySkills:["inflation_rate"], repairSkill:"cpi_calculation", commonError:"Using the wrong basket cost or forgetting to multiply by 100.", q:"A basket has 10 units of A and 5 units of B. Base prices are A = $4 and B = $8. Current prices are A = $6 and B = $10. What is the CPI?", options:["137.5","150","125","160"], a:0, tag:"cpi_inflation", type:"calculation", objective:"LO25.1", feedback:"Base cost = 10(4)+5(8)=80. Current cost = 10(6)+5(10)=110. CPI = 137.5." },
  { id:14116, sourceGame: "nationalLedger", difficulty:"legendary", conceptCluster:"prices_inflation", primarySkill:"inflation_rate", secondarySkills:["cpi_calculation"], repairSkill:"inflation_rate", commonError:"Using the CPI point change instead of the percentage change.", q:"If CPI rises from 160 to 176 and nominal wages rise from $20 to $21, what happens to the real wage?", options:["It falls because prices rose 10% while nominal wages rose 5%","It rises because nominal wages rose","It stays unchanged because both CPI and wages rose","It doubles because CPI is above 100"], a:0, tag:"cpi_inflation", type:"multi-step", objective:"LO25.1", feedback:"Inflation is 10%; nominal wages rose 5%, so the real wage falls." },
  { id:14117, sourceGame: "nationalLedger", difficulty:"legendary", conceptCluster:"prices_inflation", primarySkill:"inflation_rate", secondarySkills:["cpi_calculation"], repairSkill:"inflation_rate", commonError:"Using the CPI point change instead of the percentage change.", q:"The CPI rises from 240 to 252. A student says inflation is 12 percentage points. What is the correct inflation rate?", options:["5%","12%","4.76%","252%"], a:0, tag:"cpi_inflation", type:"trap", objective:"LO25.1", feedback:"Inflation is the percentage change: (252 - 240)/240 = 5%, not 12 percentage points." },
  { id:14118, sourceGame: "nationalLedger", difficulty:"legendary", conceptCluster:"prices_inflation", primarySkill:"substitution_bias", secondarySkills:["quality_new_goods_bias"], repairSkill:"substitution_bias", commonError:"Ignoring that consumers switch toward relatively cheaper goods.", q:"A new generic drug enters the market at a much lower price than the brand-name drug, and consumers switch rapidly. Why might the CPI overstate cost-of-living growth?", options:["The fixed basket may keep pricing the old mix and miss substitution toward the cheaper generic","The CPI always ignores medicine","The GDP deflator includes only generic drugs","Quality change always raises measured inflation"], a:0, tag:"cpi_bias", type:"interpretation", objective:"LO25.2", feedback:"Substitution toward cheaper alternatives can make actual cost-of-living growth lower than a fixed basket suggests." },
  { id:14119, sourceGame: "nationalLedger", difficulty:"legendary", conceptCluster:"prices_inflation", primarySkill:"quality_new_goods_bias", secondarySkills:["substitution_bias"], repairSkill:"quality_new_goods_bias", commonError:"Treating all price increases as inflation even when quality or product variety improves.", q:"A laptop price rises 15%, but processing speed doubles and battery life improves. What is the measurement problem?", options:["Unmeasured quality improvement may cause the CPI to overstate inflation","Substitution bias is impossible because quality changed","The GDP deflator must fall","The laptop must be excluded from all price indexes"], a:0, tag:"cpi_bias", type:"interpretation", objective:"LO25.2", feedback:"Some price increases reflect better quality, not only higher prices for the same good." },
  { id:14120, sourceGame: "nationalLedger", difficulty:"legendary", conceptCluster:"prices_inflation", primarySkill:"substitution_bias", secondarySkills:["quality_new_goods_bias"], repairSkill:"substitution_bias", commonError:"Ignoring that consumers switch toward relatively cheaper goods.", q:"A streaming service did not exist in the base year and later gives consumers a cheaper alternative to cable. Which CPI problems are most directly involved?", options:["Introduction of new goods and substitution bias","Only GDP deflator bias","Only cyclical unemployment","Only nominal interest error"], a:0, tag:"cpi_bias", type:"multi-step", objective:"LO25.2", feedback:"New goods improve choice, and substitution toward them can reduce actual cost-of-living increases." },
  { id:14121, sourceGame: "nationalLedger", difficulty:"legendary", conceptCluster:"prices_inflation", primarySkill:"substitution_bias", secondarySkills:["quality_new_goods_bias"], repairSkill:"substitution_bias", commonError:"Ignoring that consumers switch toward relatively cheaper goods.", q:"If CPI inflation is 7% but the fixed basket misses major quality gains and substitution toward cheaper goods, the CPI most likely:", options:["Overstates the rise in the cost of living","Understates the rise in the cost of living by definition","Perfectly measures welfare","Measures only domestic production"], a:0, tag:"cpi_bias", type:"interpretation", objective:"LO25.2", feedback:"Substitution and quality improvements usually make CPI overstate true cost-of-living increases." },
  { id:14122, sourceGame: "nationalLedger", difficulty:"legendary", conceptCluster:"prices_inflation", primarySkill:"cpi_vs_gdp_deflator", secondarySkills:["cpi_calculation"], repairSkill:"cpi_vs_gdp_deflator", commonError:"Confusing a fixed consumer basket with current domestic production prices.", q:"Imported oil prices rise 30%, while domestically produced capital goods prices fall 10%. Which statement is best?", options:["CPI may rise while the GDP deflator may not rise as much because imported oil is excluded from domestic production","GDP deflator must rise more because oil is imported","CPI ignores oil because it is energy","Both indexes must move identically"], a:0, tag:"cpi_vs_deflator", type:"interpretation", objective:"LO25.3", feedback:"CPI includes imported consumer goods; GDP deflator reflects domestic production prices." },
  { id:14123, sourceGame: "nationalLedger", difficulty:"legendary", conceptCluster:"prices_inflation", primarySkill:"cpi_vs_gdp_deflator", secondarySkills:["cpi_calculation"], repairSkill:"cpi_vs_gdp_deflator", commonError:"Confusing a fixed consumer basket with current domestic production prices.", q:"A domestically produced business machine becomes more expensive, but imported consumer clothing becomes cheaper. Which index is more directly affected by the machine price?", options:["GDP deflator","CPI","Unemployment rate","Labor force participation rate"], a:0, tag:"cpi_vs_deflator", type:"interpretation", objective:"LO25.3", feedback:"Domestically produced capital goods are part of GDP and affect the GDP deflator." },
  { id:14124, sourceGame: "nationalLedger", difficulty:"legendary", conceptCluster:"prices_inflation", primarySkill:"cpi_vs_gdp_deflator", secondarySkills:["cpi_calculation"], repairSkill:"cpi_vs_gdp_deflator", commonError:"Confusing a fixed consumer basket with current domestic production prices.", q:"Why can the CPI overstate inflation while the GDP deflator still moves differently for valid reasons?", options:["The CPI has fixed-basket issues, while the GDP deflator covers current domestic production rather than a fixed consumer basket","Both measure the exact same goods but use different names","The GDP deflator measures unemployment","The CPI measures only exports"], a:0, tag:"cpi_vs_deflator", type:"integration", objective:"LO25.3", feedback:"These indexes differ both because of CPI bias issues and because they cover different baskets." },
  { id:14125, sourceGame: "nationalLedger", difficulty:"legendary", conceptCluster:"prices_inflation", primarySkill:"inflation_adjustment", secondarySkills:["cpi_calculation"], repairSkill:"inflation_adjustment", commonError:"Comparing nominal dollar amounts across years without adjusting for the price level.", q:"A salary was $55,000 when CPI was 125. The CPI is now 200. What current salary has the same purchasing power?", options:["$88,000","$68,750","$34,375","$110,000"], a:0, tag:"inflation_adjustment", type:"calculation", objective:"LO25.4", feedback:"Today's dollars = 55,000 x 200/125 = 88,000." },
  { id:14126, sourceGame: "nationalLedger", difficulty:"legendary", conceptCluster:"prices_inflation", primarySkill:"inflation_adjustment", secondarySkills:["cpi_calculation"], repairSkill:"inflation_adjustment", commonError:"Comparing nominal dollar amounts across years without adjusting for the price level.", q:"A house cost $90,000 when CPI was 75. In today's dollars, it equals $360,000. What is today's CPI?", options:["300","225","400","120"], a:0, tag:"inflation_adjustment", type:"calculation", objective:"LO25.4", feedback:"360,000 = 90,000 x current CPI/75, so current CPI = 300." },
  { id:14127, sourceGame: "nationalLedger", difficulty:"legendary", conceptCluster:"prices_inflation", primarySkill:"inflation_adjustment", secondarySkills:["cpi_calculation"], repairSkill:"inflation_adjustment", commonError:"Comparing nominal dollar amounts across years without adjusting for the price level.", q:"A current income of $84,000 equals $60,000 in year-T dollars. If CPI today is 210, what was CPI in year T?", options:["150","140","160","294"], a:0, tag:"inflation_adjustment", type:"calculation", objective:"LO25.4", feedback:"60,000 = 84,000 x CPI_T/210, so CPI_T = 150." },
  { id:14128, sourceGame: "nationalLedger", difficulty:"legendary", conceptCluster:"prices_inflation", primarySkill:"real_interest_rate", secondarySkills:["inflation_rate"], repairSkill:"real_interest_rate", commonError:"Forgetting to subtract inflation from the nominal interest rate.", q:"A borrower signs a fixed-rate loan at 8% when expected inflation is 3%. Actual inflation is 10%. What happened to the lender's real return?", options:["It fell from expected 5% to actual -2%","It rose from expected 5% to actual 18%","It stayed at 8%","It became exactly 10%"], a:0, tag:"interest_inflation", type:"multi-step", objective:"LO25.5", feedback:"Expected real return = 8 - 3 = 5. Actual real return = 8 - 10 = -2." },
  { id:14129, sourceGame: "nationalLedger", difficulty:"legendary", conceptCluster:"prices_inflation", primarySkill:"real_interest_rate", secondarySkills:["inflation_rate"], repairSkill:"real_interest_rate", commonError:"Forgetting to subtract inflation from the nominal interest rate.", q:"A saver earns 6% nominal interest. CPI inflation is 9%. Which is true?", options:["The account balance rises in dollars, but purchasing power falls by about 3%","The saver gains 15% purchasing power","The real interest rate is 6% because that is what the bank reports","Inflation is irrelevant if nominal interest is positive"], a:0, tag:"interest_inflation", type:"interpretation", objective:"LO25.5", feedback:"Real interest is approximately 6 - 9 = -3%, so purchasing power falls." },
  { id:14130, sourceGame: "nationalLedger", difficulty:"legendary", conceptCluster:"prices_inflation", primarySkill:"real_interest_rate", secondarySkills:["inflation_rate"], repairSkill:"real_interest_rate", commonError:"Forgetting to subtract inflation from the nominal interest rate.", q:"If a lender wants a 4% real return and expects 6% inflation, what nominal rate should be charged, approximately?", options:["10%","2%","6%","24%"], a:0, tag:"interest_inflation", type:"calculation", objective:"LO25.5", feedback:"Nominal rate ≈ real rate + expected inflation = 4 + 6 = 10%." },
  { id:14131, sourceGame: "nationalLedger", difficulty:"legendary", conceptCluster:"prices_inflation", primarySkill:"real_interest_rate", secondarySkills:["inflation_rate"], repairSkill:"real_interest_rate", commonError:"Forgetting to subtract inflation from the nominal interest rate.", q:"Nominal interest is 12%, actual inflation is 8%, and expected inflation was 5%. What are actual and expected real interest rates?", options:["Actual 4%; expected 7%","Actual 7%; expected 4%","Actual 20%; expected 17%","Actual -4%; expected -7%"], a:0, tag:"interest_inflation", type:"calculation", objective:"LO25.5", feedback:"Actual real = 12 - 8 = 4. Expected real = 12 - 5 = 7." },
  { id:14132, sourceGame: "nationalLedger", difficulty:"legendary", conceptCluster:"prices_inflation", primarySkill:"real_interest_rate", secondarySkills:["inflation_rate"], repairSkill:"real_interest_rate", commonError:"Forgetting to subtract inflation from the nominal interest rate.", q:"Which statement correctly links CPI adjustment and real interest rates?", options:["Both adjust nominal dollar figures for changes in purchasing power","Both measure domestic production only","Both ignore inflation","Both are calculated from exports minus imports"], a:0, tag:"interest_inflation", type:"integration", objective:"LO25.5", feedback:"Inflation adjustment and real interest rates both focus on purchasing power rather than raw dollars." },
  { id:14133, sourceGame: "nationalLedger", difficulty:"legendary", conceptCluster:"prices_inflation", primarySkill:"inflation_rate", secondarySkills:["cpi_calculation"], repairSkill:"inflation_rate", commonError:"Using the CPI point change instead of the percentage change.", q:"A basket cost $1,200 in the base year. CPI is now 150. Last year CPI was 125. What is the basket cost now and the inflation rate since last year?", options:["$1,800 and 20%","$1,500 and 25%","$1,800 and 25%","$1,500 and 20%"], a:0, tag:"cpi_inflation", type:"multi-step", objective:"LO25.1", feedback:"Current basket cost = 1,200 x 1.5 = 1,800. Inflation = (150 - 125)/125 = 20%." },
  { id:14134, sourceGame: "nationalLedger", difficulty:"legendary", conceptCluster:"prices_inflation", primarySkill:"cpi_vs_gdp_deflator", secondarySkills:["cpi_calculation"], repairSkill:"cpi_vs_gdp_deflator", commonError:"Confusing a fixed consumer basket with current domestic production prices.", q:"A country imports most consumer goods but produces mostly capital equipment. Imported consumer prices rise while domestic capital prices fall. Which statement is most accurate?", options:["CPI and GDP deflator can move in opposite directions","CPI and GDP deflator must move together","GDP deflator must include imported consumer goods","CPI must include capital equipment bought by firms"], a:0, tag:"cpi_vs_deflator", type:"integration", objective:"LO25.3", feedback:"Different baskets mean the CPI and GDP deflator can diverge sharply." },
  { id:14135, sourceGame: "nationalLedger", difficulty:"legendary", conceptCluster:"growth_productivity", primarySkill:"rule_of_70", secondarySkills:["real_gdp_per_person"], repairSkill:"rule_of_70", commonError:"Forgetting that doubling time is approximately 70 divided by the growth rate.", q:"Country A starts at $40,000 real GDP per person and grows at 2%. Country B starts at $20,000 and grows at 6%. Using the Rule of 70, which is most accurate?", options:["B can reach A's current level in about 12 years, while A doubles in about 35 years","B cannot catch A because it starts poorer","A doubles in about 12 years and B doubles in about 35 years","Both double in about 20 years"], a:0, tag:"growth_differences", type:"multi-step", objective:"LO26.1", feedback:"B doubles in about 70/6 = 11.7 years. A doubles in about 35 years." },
  { id:14136, sourceGame: "nationalLedger", difficulty:"legendary", conceptCluster:"growth_productivity", primarySkill:"real_gdp_per_person", secondarySkills:["productivity_calculation"], repairSkill:"real_gdp_per_person", commonError:"Comparing total GDP instead of output per person.", q:"A country's real GDP rises 5%, population rises 3%, and average hours per worker rise 1%. Approximate growth in real GDP per person is:", options:["About 2%","About 8%","About 1%","About 5%"], a:0, tag:"growth_differences", type:"calculation", objective:"LO26.1", feedback:"Real GDP per person grows roughly GDP growth minus population growth: 5% - 3% = 2%." },
  { id:14137, sourceGame: "nationalLedger", difficulty:"legendary", conceptCluster:"growth_productivity", primarySkill:"real_gdp_per_person", secondarySkills:["productivity_calculation"], repairSkill:"real_gdp_per_person", commonError:"Comparing total GDP instead of output per person.", q:"Country X has real GDP of $900B and population of 30M. Country Y has real GDP of $1.6T and population of 80M. Which has higher real GDP per person?", options:["Country X with $30,000 versus Country Y with $20,000","Country Y because total real GDP is larger","They are equal","It cannot be determined without CPI"], a:0, tag:"growth_differences", type:"calculation", objective:"LO26.1", feedback:"X: 900B/30M = 30,000. Y: 1.6T/80M = 20,000." },
  { id:14138, sourceGame: "nationalLedger", difficulty:"legendary", conceptCluster:"growth_productivity", primarySkill:"real_gdp_per_person", secondarySkills:["productivity_calculation"], repairSkill:"real_gdp_per_person", commonError:"Comparing total GDP instead of output per person.", q:"A poor country grows quickly after gaining stable property rights, schools, and foreign investment. Which explanation is strongest?", options:["The country is combining catch-up potential with institutions that allow capital and productivity growth","Growth must be caused only by inflation","Poor countries grow automatically regardless of policy","Property rights reduce investment"], a:0, tag:"growth_differences", type:"integration", objective:"LO26.1", feedback:"Catch-up growth is more likely when institutions support investment, human capital, and technology adoption." },
  { id:14139, sourceGame: "nationalLedger", difficulty:"legendary", conceptCluster:"growth_productivity", primarySkill:"real_gdp_per_person", secondarySkills:["productivity_calculation"], repairSkill:"real_gdp_per_person", commonError:"Comparing total GDP instead of output per person.", q:"A country has high total GDP but low GDP per person. What is the likely explanation?", options:["It has a large population relative to output","It must have low inflation","It must have high productivity","It has no labor force"], a:0, tag:"growth_differences", type:"interpretation", objective:"LO26.1", feedback:"Total GDP can be high while GDP per person is low if population is very large." },
  { id:14140, sourceGame: "nationalLedger", difficulty:"legendary", conceptCluster:"growth_productivity", primarySkill:"productivity_calculation", secondarySkills:["real_gdp_per_person"], repairSkill:"productivity_calculation", commonError:"Confusing total output with output per unit of labor.", q:"Output rises from 80,000 units to 100,000 units while labor rises from 4,000 hours to 5,500 hours. What happens to productivity?", options:["It falls from 20 to about 18.18 units per hour","It rises from 20 to 25 units per hour","It stays at 20 units per hour","It rises from 18.18 to 20 units per hour"], a:0, tag:"productivity", type:"calculation", objective:"LO26.2", feedback:"Initial productivity = 80,000/4,000 = 20. New productivity = 100,000/5,500 ≈ 18.18." },
  { id:14141, sourceGame: "nationalLedger", difficulty:"legendary", conceptCluster:"growth_productivity", primarySkill:"productivity_calculation", secondarySkills:["real_gdp_per_person"], repairSkill:"productivity_calculation", commonError:"Confusing total output with output per unit of labor.", q:"A country raises output per worker from $60,000 to $75,000 while population is unchanged. What is the productivity growth rate?", options:["25%","15%","20%","75%"], a:0, tag:"productivity", type:"calculation", objective:"LO26.2", feedback:"Growth = (75,000 - 60,000)/60,000 = 25%." },
  { id:14142, sourceGame: "nationalLedger", difficulty:"legendary", conceptCluster:"growth_productivity", primarySkill:"productivity_calculation", secondarySkills:["real_gdp_per_person"], repairSkill:"productivity_calculation", commonError:"Confusing total output with output per unit of labor.", q:"Two countries have equal real GDP per person, but one works far fewer hours per person. What can be inferred?", options:["The country with fewer hours likely has higher output per hour","They must have identical productivity per hour","The country with more hours must be richer","Real GDP per person cannot be compared"], a:0, tag:"productivity", type:"interpretation", objective:"LO26.2", feedback:"Equal output per person with fewer hours implies greater output per hour." },
  { id:14143, sourceGame: "nationalLedger", difficulty:"legendary", conceptCluster:"growth_productivity", primarySkill:"productivity_calculation", secondarySkills:["real_gdp_per_person"], repairSkill:"productivity_calculation", commonError:"Confusing total output with output per unit of labor.", q:"A country adds workers and total output rises, but output per worker falls. What is the best interpretation?", options:["Total GDP rose, but productivity declined, so living-standard gains are weaker","Productivity must rise because output rose","Real GDP per person must rise faster than GDP","The Rule of 70 no longer applies"], a:0, tag:"productivity", type:"interpretation", objective:"LO26.2", feedback:"Total output and productivity can move in different directions." },
  { id:14144, sourceGame: "nationalLedger", difficulty:"legendary", conceptCluster:"growth_productivity", primarySkill:"physical_capital", secondarySkills:["productivity_calculation"], repairSkill:"physical_capital", commonError:"Confusing tools and equipment with worker skills.", q:"A factory adds machines but does not train workers to use them well. Output rises only slightly. Which concept best explains the weak result?", options:["Physical capital and human capital are complements; capital alone may have limited effect","Natural resources always dominate machines","GDP excludes machines","Human capital reduces productivity"], a:0, tag:"productivity_factors", type:"integration", objective:"LO26.3", feedback:"Capital is more productive when workers have the skills to use it effectively." },
  { id:14145, sourceGame: "nationalLedger", difficulty:"legendary", conceptCluster:"growth_productivity", primarySkill:"physical_capital", secondarySkills:["productivity_calculation"], repairSkill:"physical_capital", commonError:"Confusing tools and equipment with worker skills.", q:"A country discovers oil but has weak courts, low education, and poor infrastructure. Why might productivity remain low?", options:["Natural resources do not guarantee high productivity without institutions, human capital, and physical capital","Oil is not a natural resource","Education matters only in service economies","Infrastructure lowers capital per worker"], a:0, tag:"productivity_factors", type:"interpretation", objective:"LO26.3", feedback:"Natural resources can help, but productivity depends on several complementary factors." },
  { id:14146, sourceGame: "nationalLedger", difficulty:"legendary", conceptCluster:"growth_productivity", primarySkill:"physical_capital", secondarySkills:["productivity_calculation"], repairSkill:"physical_capital", commonError:"Confusing tools and equipment with worker skills.", q:"A new production method doubles output using the same workers and machines. Which productivity factor changed most directly?", options:["Technological knowledge","Physical capital per worker","Natural resources per worker","Labor force participation"], a:0, tag:"productivity_factors", type:"trap", objective:"LO26.3", feedback:"A better method of production is technological knowledge, not necessarily more physical capital." },
  { id:14147, sourceGame: "nationalLedger", difficulty:"legendary", conceptCluster:"growth_productivity", primarySkill:"physical_capital", secondarySkills:["productivity_calculation"], repairSkill:"physical_capital", commonError:"Confusing tools and equipment with worker skills.", q:"A country builds ports, roads, and power grids while also expanding vocational education. Which factors are increased?", options:["Physical capital and human capital","Only natural resources","Only technological knowledge","Only population growth"], a:0, tag:"productivity_factors", type:"multi-step", objective:"LO26.3", feedback:"Infrastructure is physical capital; vocational education builds human capital." },
  { id:14148, sourceGame: "nationalLedger", difficulty:"legendary", conceptCluster:"growth_productivity", primarySkill:"productivity_calculation", secondarySkills:["real_gdp_per_person"], repairSkill:"productivity_calculation", commonError:"Confusing total output with output per unit of labor.", q:"If capital per worker rises from $50,000 to $100,000 and output per worker rises from $70,000 to $90,000, what does this suggest?", options:["Capital increased productivity, but less than proportionally, consistent with diminishing returns","Capital had no effect","Output per worker doubled","Diminishing returns means output must fall"], a:0, tag:"diminishing_returns", type:"interpretation", objective:"LO26.3", feedback:"Capital doubled, but output per worker rose by less than double, consistent with diminishing returns." },
  { id:14149, sourceGame: "nationalLedger", difficulty:"legendary", conceptCluster:"growth_productivity", primarySkill:"physical_capital", secondarySkills:["productivity_calculation"], repairSkill:"physical_capital", commonError:"Confusing tools and equipment with worker skills.", q:"A low-capital economy gets basic tools and output jumps sharply. Later, additional tools add smaller gains. Which pattern is this?", options:["Catch-up effect followed by diminishing returns","CPI substitution bias followed by inflation","Frictional unemployment followed by cyclical unemployment","Imports followed by exports"], a:0, tag:"catch_up_growth", type:"integration", objective:"LO26.3", feedback:"Capital is highly productive when scarce, but additional capital eventually yields smaller gains." },
