  { id: 13026, sourceGame: "marketGate", q: "A luxury tax causes quantity sold to fall sharply and tax revenue disappoints. What is the strongest explanation?", options: ["Demand or supply is relatively elastic, so participants avoid the taxed exchange", "The tax must be too small to matter", "The burden must fall entirely on buyers", "A tax always increases total revenue"], a: 0, tag: "taxes", type: "integration", objective: "LO6.3", difficulty: "elite", conceptCluster: "government_policy", primarySkill: "elasticity_tax_revenue_quantity", secondarySkills: ["tax_quantity_effect"], repairSkill: "tax_wedge_incidence", commonError: "assumes_higher_tax_always_means_higher_revenue", feedback: "If market participants respond strongly, quantity falls sharply and tax revenue may be lower than expected." },
  { id: 13027, sourceGame: "marketGate", q: "A country invests more in capital goods today, sacrificing consumer goods. In a PPF framework, what is the likely long-run implication?", options: ["More future growth because capital accumulation can expand productive capacity", "No future effect because PPF choices never matter", "Immediate elimination of scarcity", "A binding price floor in the capital market"], a: 0, tag: "ppf", type: "integration", objective: "LO2.2", difficulty: "elite", conceptCluster: "economic_models", primarySkill: "current_vs_future_consumption_ppf", secondarySkills: ["ppf_growth"], repairSkill: "ppf_growth", commonError: "misses_current_consumption_future_growth_tradeoff", feedback: "Choosing more capital goods today can increase future productive capacity and shift the PPF outward later." },
  { id: 13028, sourceGame: "marketGate", q: "An economy moves from inside its PPF to a point on the PPF and then later shifts the PPF outward. What sequence is correct?", options: ["First efficiency improves, then productive capacity grows", "First scarcity disappears, then opportunity cost disappears", "First demand shifts, then price controls bind", "First the economy becomes unattainable, then efficient"], a: 0, tag: "ppf", type: "integration", objective: "LO2.2", difficulty: "elite", conceptCluster: "economic_models", primarySkill: "ppf_efficiency_vs_growth_sequence", secondarySkills: ["movement_inside_to_frontier", "ppf_growth"], repairSkill: "ppf_efficiency_status", commonError: "confuses_efficiency_gain_with_growth", feedback: "Moving from inside to the frontier is improved efficiency. Shifting the frontier outward is growth." },
  { id: 13029, sourceGame: "marketGate", q: "A new technology improves only production of medical devices, not food. Which PPF interpretation is best?", options: ["The frontier rotates outward on the medical-device axis", "The entire frontier must shift inward", "The economy moves inside the PPF", "The law of demand no longer applies"], a: 0, tag: "ppf", type: "application", objective: "LO2.2", difficulty: "elite", conceptCluster: "economic_models", primarySkill: "ppf_one_good_technology_change", secondarySkills: ["ppf_growth"], repairSkill: "ppf_growth", commonError: "thinks_all_technology_shifts_both_goods_equally", feedback: "Technology that improves only one good expands capacity for that good, rotating the PPF outward along that axis." },
  { id: 13030, sourceGame: "marketGate", q: "A student says, 'This point is inside the PPF, so it is impossible.' What is the correction?", options: ["Inside the PPF is attainable but inefficient", "Inside the PPF is unattainable", "Inside the PPF is efficient", "Inside the PPF means economic growth"], a: 0, tag: "ppf", type: "trap", objective: "LO2.2", difficulty: "elite", conceptCluster: "economic_models", primarySkill: "ppf_efficiency_status", secondarySkills: ["attainable_unattainable"], repairSkill: "ppf_efficiency_status", commonError: "confuses_inside_ppf_with_outside_ppf", feedback: "A point inside the PPF can be produced, but it wastes or underuses resources." },
  { id: 13031, sourceGame: "marketGate", q: "A student says, 'This point is outside the PPF, so it is efficient.' What is the correction?", options: ["Outside the PPF is unattainable with current resources and technology", "Outside the PPF is inefficient but possible", "Outside the PPF means unemployment", "Outside the PPF means a binding ceiling"], a: 0, tag: "ppf", type: "trap", objective: "LO2.2", difficulty: "elite", conceptCluster: "economic_models", primarySkill: "attainable_unattainable", secondarySkills: ["ppf_efficiency_status"], repairSkill: "ppf_efficiency_status", commonError: "confuses_outside_ppf_with_efficient", feedback: "Outside the PPF means the economy cannot reach that point with current resources and technology." },
  { id: 13032, sourceGame: "marketGate", q: "A company already spent $80,000 developing software. It can spend $15,000 more to launch and expects $20,000 in revenue. What is the best marginal decision?", options: ["Launch because the additional benefit exceeds the additional cost by $5,000", "Do not launch because total cost is $95,000", "Launch only if revenue covers the sunk $80,000", "Do not launch because sunk costs always matter most"], a: 0, tag: "marginal", type: "multi-step", objective: "LO1.3", difficulty: "elite", conceptCluster: "core_principles", primarySkill: "sunk_cost_avoidance", secondarySkills: ["marginal_benefit_cost_decision"], repairSkill: "marginal_benefit_cost_decision", commonError: "includes_sunk_cost_in_marginal_decision", feedback: "The $80,000 is sunk. The launch decision compares the extra $15,000 cost to the extra $20,000 revenue." },
  { id: 13033, sourceGame: "marketGate", q: "A student says college costs $25,000 because tuition and books cost $25,000. The student could also earn $38,000 working full time. What is missing?", options: ["The forgone wages should be included in opportunity cost", "Only tuition matters for opportunity cost", "Forgone wages are sunk costs", "Opportunity cost ignores alternatives"], a: 0, tag: "opportunity_cost", type: "trap", objective: "LO1.2", difficulty: "elite", conceptCluster: "core_principles", primarySkill: "opportunity_cost_full_cost", secondarySkills: ["forgone_wages"], repairSkill: "opportunity_cost_definition", commonError: "counts_only_direct_money_costs", feedback: "Opportunity cost includes explicit costs and the value of the next best alternative, including forgone wages." },
  { id: 13034, sourceGame: "marketGate", q: "A student chooses a free ticket to a concert over a work shift that pays $90 and a study session worth $60. What is the opportunity cost of the concert?", options: ["$90", "$150", "$60", "$0 because the ticket is free"], a: 0, tag: "opportunity_cost", type: "trap", objective: "LO1.2", difficulty: "elite", conceptCluster: "core_principles", primarySkill: "next_best_alternative", secondarySkills: ["opportunity_cost_identification"], repairSkill: "opportunity_cost_definition", commonError: "adds_all_forgone_options_instead_of_next_best", feedback: "Opportunity cost is the value of the next best alternative, not every alternative combined. The next best option is the $90 shift." },
  { id: 13035, sourceGame: "marketGate", q: "A policy improves equity but reduces total surplus. Which answer best frames the issue?", options: ["It is an efficiency-equity tradeoff, not proof the policy is automatically good or bad", "It is a market equilibrium with no tradeoff", "It proves equality and efficiency always rise together", "It is only a positive statement with no value judgment"], a: 0, tag: "tradeoffs", type: "integration", objective: "LO1.1", difficulty: "elite", conceptCluster: "core_principles", primarySkill: "efficiency_equity_policy_tradeoff", secondarySkills: ["positive_vs_normative"], repairSkill: "efficiency_vs_equality", commonError: "treats_tradeoff_as_automatic_policy_answer", feedback: "Policies often involve tradeoffs. A reduction in efficiency may or may not be justified by equity goals." },
  { id: 13036, sourceGame: "marketGate", q: "An economist says, 'A rent ceiling below equilibrium will reduce housing quality over time.' Another says, 'The city should accept that cost to help low-income renters.' Which pairing is correct?", options: ["First is positive; second is normative", "First is normative; second is positive", "Both are positive", "Both are normative"], a: 0, tag: "positive_normative", type: "integration", objective: "LO2.4", difficulty: "elite", conceptCluster: "economic_thinking", primarySkill: "positive_normative_pairing", secondarySkills: ["policy_statement_classification"], repairSkill: "positive_vs_normative", commonError: "treats_all_policy_discussion_as_normative", feedback: "The first is testable. The second recommends what policy should do, so it is normative." },
  { id: 13037, sourceGame: "marketGate", q: "A market is efficient before a pollution externality is considered. Once pollution costs to bystanders are included, the market produces too much. What changed?", options: ["Private costs differed from social costs", "Demand became perfectly inelastic", "The PPF shifted outward", "A price floor became nonbinding"], a: 0, tag: "market_failure", type: "integration", objective: "LO1.6", difficulty: "elite", conceptCluster: "core_principles", primarySkill: "externality_social_cost", secondarySkills: ["government_response_to_market_failure"], repairSkill: "market_failure_types", commonError: "ignores_costs_to_bystanders", feedback: "A negative externality means the market ignores some social costs, so private production can exceed the efficient level." },
  { id: 13038, sourceGame: "marketGate", q: "A government responds to pollution with a tax. Which chain best explains the logic?", options: ["External cost → market overproduction → corrective tax raises private cost → quantity falls", "External cost → market underproduction → price ceiling raises quantity", "Scarcity disappears → supply increases → tax revenue falls to zero", "Tax burden depends only on who writes the check"], a: 0, tag: "market_failure", type: "integration", objective: "LO1.6", difficulty: "elite", conceptCluster: "core_principles", primarySkill: "corrective_tax_externality_logic", secondarySkills: ["tax_quantity_effect", "externality_identification"], repairSkill: "market_failure_types", commonError: "cannot_connect_externality_to_tax_policy", feedback: "A corrective tax makes private decision makers face more of the social cost, reducing overproduction." },
  { id: 13039, sourceGame: "marketGate", q: "A product becomes cheaper after supply increases, so quantity demanded rises. Which answer uses the most precise language?", options: ["Quantity demanded rises because price falls; demand itself does not necessarily change", "Demand rises because buyers purchase more", "Supply falls because price falls", "Demand and supply both increase automatically"], a: 0, tag: "demand", type: "trap", objective: "LO4.2", difficulty: "elite", conceptCluster: "supply_demand", primarySkill: "movement_vs_demand_shift", secondarySkills: ["price_signal_allocation"], repairSkill: "movement_vs_demand_shift", commonError: "calls_movement_along_demand_a_demand_shift", feedback: "A lower price causes movement along the demand curve, increasing quantity demanded. Demand only shifts when a non-price determinant changes." },
  { id:13040, sourceGame: "nationalLedger", difficulty:"elite", conceptCluster:"gdp_measurement", primarySkill:"income_expenditure_identity", secondarySkills:["gdp_counting_rules"], repairSkill:"income_expenditure_identity", commonError:"Treating spending and income as unrelated totals instead of two sides of the same transaction.", q:"A country reports $18T in consumption, $5T in investment, $6T in government purchases, $4T in exports, and $5T in imports. Separately, income data show $20T in wages, $4T in rents and interest, and $4T in profits plus other production income. What is the best conclusion?", options:["The expenditure and income approaches both imply GDP of $28T","The expenditure approach implies $38T while income implies $28T","Imports should be added, so GDP is $38T","Income cannot be used to measure GDP"], a:0, tag:"gdp_income_expenditure", type:"multi-step", objective:"LO24.1", feedback:"Expenditure GDP = 18 + 5 + 6 + (4 - 5) = 28. Income also totals 20 + 4 + 4 = 28." },
  { id:13041, sourceGame: "nationalLedger", difficulty:"elite", conceptCluster:"gdp_measurement", primarySkill:"income_expenditure_identity", secondarySkills:["gdp_counting_rules"], repairSkill:"income_expenditure_identity", commonError:"Treating spending and income as unrelated totals instead of two sides of the same transaction.", q:"A student argues that total spending must exceed total income because consumers sometimes borrow to spend. What is the best correction?", options:["Borrowing changes who supplies funds, but the spending still becomes income to sellers","Borrowed spending is excluded from GDP","Borrowing makes imports negative","Income only counts wages, so the student is correct"], a:0, tag:"gdp_income_expenditure", type:"trap", objective:"LO24.1", feedback:"Borrowing can finance spending, but the expenditure still becomes income for producers." },
  { id:13042, sourceGame: "nationalLedger", difficulty:"elite", conceptCluster:"gdp_measurement", primarySkill:"income_expenditure_identity", secondarySkills:["gdp_counting_rules"], repairSkill:"income_expenditure_identity", commonError:"Treating spending and income as unrelated totals instead of two sides of the same transaction.", q:"A firm produces $1M of output, sells $800,000 to customers, and adds $200,000 to inventory. It pays $600,000 in wages, $100,000 in rent, $100,000 in interest, and has $200,000 in profit. Which statement is correct?", options:["GDP rises by $1M and income generated also totals $1M","GDP rises only by $800,000 because inventories are unsold","GDP rises by $1.2M because inventory is added to sales","GDP rises by wages only"], a:0, tag:"gdp_income_expenditure", type:"multi-step", objective:"LO24.1", feedback:"Unsold output is inventory investment, so all $1M counts; income payments also total $1M." },
  { id:13043, sourceGame: "nationalLedger", difficulty:"elite", conceptCluster:"gdp_measurement", primarySkill:"intermediate_vs_final_goods", secondarySkills:["gdp_counting_rules"], repairSkill:"intermediate_vs_final_goods", commonError:"Double-counting intermediate goods instead of counting final value or value added.", q:"A farmer sells wheat to a miller for $60, the miller sells flour to a bakery for $110, and the bakery sells bread to consumers for $180. What is the value added by the bakery?", options:["$70","$110","$180","$350"], a:0, tag:"gdp_definition", type:"calculation", objective:"LO24.2", feedback:"The bakery's value added is final bread value minus flour input cost: 180 - 110 = 70." },
  { id:13044, sourceGame: "nationalLedger", difficulty:"elite", conceptCluster:"gdp_measurement", primarySkill:"gdp_counting_rules", secondarySkills:["intermediate_vs_final_goods"], repairSkill:"gdp_counting_rules", commonError:"Counting transactions that are not current domestic production, such as used goods, financial assets, or foreign production.", q:"A U.S. household buys a new $30,000 car built in Mexico, while a Mexican household buys a new $40,000 car built in Michigan. What is the net effect on U.S. GDP from these two transactions?", options:["U.S. GDP rises by $40,000","U.S. GDP rises by $70,000","U.S. GDP rises by $10,000","U.S. GDP is unchanged"], a:0, tag:"gdp_definition", type:"multi-step", objective:"LO24.2", feedback:"Only the car produced in Michigan counts in U.S. GDP. The imported car affects consumption and imports but not domestic production." },
  { id:13045, sourceGame: "nationalLedger", difficulty:"elite", conceptCluster:"gdp_measurement", primarySkill:"gdp_counting_rules", secondarySkills:["intermediate_vs_final_goods"], repairSkill:"gdp_counting_rules", commonError:"Counting transactions that are not current domestic production, such as used goods, financial assets, or foreign production.", q:"Which transaction is most likely counted in current GDP?", options:["A homeowner pays a licensed contractor to build a new deck","A homeowner builds a deck alone using leftover materials already owned","A household buys shares in a construction company","A collector resells an antique table"], a:0, tag:"gdp_definition", type:"trap", objective:"LO24.2", feedback:"Paid current market production counts. Financial transactions, used-good sales, and unpaid household production generally do not." },
  { id:13046, sourceGame: "nationalLedger", difficulty:"elite", conceptCluster:"gdp_measurement", primarySkill:"intermediate_vs_final_goods", secondarySkills:["gdp_counting_rules"], repairSkill:"intermediate_vs_final_goods", commonError:"Double-counting intermediate goods instead of counting final value or value added.", q:"A firm imports $500,000 of parts, adds $300,000 of domestic labor and capital services, and sells the final good domestically for $800,000. What is the contribution to domestic GDP?", options:["$300,000","$500,000","$800,000","$1.3M"], a:0, tag:"gdp_definition", type:"multi-step", objective:"LO24.2", feedback:"Only domestic value added counts in domestic GDP. Imported inputs are not domestic production." },
  { id:13047, sourceGame: "nationalLedger", difficulty:"elite", conceptCluster:"gdp_measurement", primarySkill:"gdp_counting_rules", secondarySkills:["intermediate_vs_final_goods"], repairSkill:"gdp_counting_rules", commonError:"Counting transactions that are not current domestic production, such as used goods, financial assets, or foreign production.", q:"A country produces only two goods. In 2025 it produces 100 meals at $20 and 50 laptops at $1,000. It imports 10 additional laptops at $900 each for households. What domestic production value is counted in GDP?", options:["$52,000","$61,000","$50,000","$43,000"], a:0, tag:"gdp_definition", type:"calculation", objective:"LO24.2", feedback:"GDP counts domestic production: 100($20) + 50($1,000) = $52,000. Imported laptops are not domestic production." },
  { id:13048, sourceGame: "nationalLedger", difficulty:"elite", conceptCluster:"gdp_components", primarySkill:"imports_exports_nx", secondarySkills:["gdp_components_identity"], repairSkill:"imports_exports_nx", commonError:"Adding imports instead of subtracting them through net exports.", q:"Consumption is $9T, investment is $3T, government purchases are $4T, exports are $2T, and imports are $3T. Then households buy $1T more imported goods, with no change in domestic production. What happens to measured GDP?", options:["It does not change because C rises by $1T and NX falls by $1T","It rises by $1T because consumption rises","It falls by $1T because imports rise","It rises by $2T because trade increases"], a:0, tag:"gdp_components", type:"multi-step", objective:"LO24.3", feedback:"Imported consumption raises C but lowers NX by the same amount, so domestic GDP is unchanged." },
  { id:13049, sourceGame: "nationalLedger", difficulty:"elite", conceptCluster:"gdp_components", primarySkill:"gdp_components_identity", secondarySkills:["imports_exports_nx", "inventory_investment"], repairSkill:"gdp_components_identity", commonError:"Mixing up the GDP expenditure components or forgetting the C + I + G + NX identity.", q:"A government spends $100B hiring workers to build bridges and also sends $100B in Social Security payments. If recipients spend all Social Security payments on current domestic goods, what is the maximum direct GDP increase described?", options:["$200B","$100B","$0","$300B"], a:0, tag:"gdp_components", type:"multi-step", objective:"LO24.3", feedback:"Bridge spending is government purchases, and household spending from transfers can count as consumption. The transfer itself is not counted separately." },
  { id:13050, sourceGame: "nationalLedger", difficulty:"elite", conceptCluster:"gdp_components", primarySkill:"inventory_investment", secondarySkills:["gdp_components_identity"], repairSkill:"inventory_investment", commonError:"Excluding unsold current production instead of counting it as inventory investment.", q:"A firm produces $500M in goods, sells $450M, and unintentionally accumulates $50M in inventories. Which GDP component includes the unsold goods?", options:["Investment","Consumption","Government purchases","Net exports"], a:0, tag:"gdp_components", type:"interpretation", objective:"LO24.3", feedback:"Inventory accumulation is counted as investment, even when unplanned." },
  { id:13051, sourceGame: "nationalLedger", difficulty:"elite", conceptCluster:"gdp_components", primarySkill:"imports_exports_nx", secondarySkills:["gdp_components_identity"], repairSkill:"imports_exports_nx", commonError:"Adding imports instead of subtracting them through net exports.", q:"If C = $15T, I = $4T, G = $6T, imports = $5T, and GDP = $23T, what are exports?", options:["$3T","$2T","$7T","-$3T"], a:0, tag:"gdp_components", type:"calculation", objective:"LO24.3", feedback:"GDP = C + I + G + X - M. 23 = 15 + 4 + 6 + X - 5, so X = 3." },
  { id:13052, sourceGame: "nationalLedger", difficulty:"elite", conceptCluster:"gdp_components", primarySkill:"gdp_components_identity", secondarySkills:["imports_exports_nx", "inventory_investment"], repairSkill:"gdp_components_identity", commonError:"Mixing up the GDP expenditure components or forgetting the C + I + G + NX identity.", q:"A household buys a newly built condo for $250,000 and pays $3,000 in property taxes. Which is the best GDP treatment?", options:["The condo counts as investment; the tax payment itself is not a purchase of a current final good or service","Both count as consumption","The condo is consumption and the tax is government purchases","Neither counts"], a:0, tag:"gdp_components", type:"trap", objective:"LO24.3", feedback:"New residential construction is investment. A tax payment is not itself government purchase of a final good or service." },
  { id:13053, sourceGame: "nationalLedger", difficulty:"elite", conceptCluster:"real_nominal_gdp", primarySkill:"gdp_deflator", secondarySkills:["nominal_vs_real_gdp"], repairSkill:"gdp_deflator", commonError:"Forgetting that the GDP deflator compares nominal GDP to real GDP.", q:"Nominal GDP rises from $25T to $30T. The GDP deflator rises from 100 to 120. What happens to real GDP?", options:["It is unchanged","It rises by 20%","It falls by 20%","It rises by 25%"], a:0, tag:"real_nominal_gdp", type:"calculation", objective:"LO24.4", feedback:"Initial real GDP = 25. New real GDP = 30 / 1.20 = 25. Real GDP is unchanged." },
  { id:13054, sourceGame: "nationalLedger", difficulty:"elite", conceptCluster:"real_nominal_gdp", primarySkill:"gdp_deflator", secondarySkills:["nominal_vs_real_gdp"], repairSkill:"gdp_deflator", commonError:"Forgetting that the GDP deflator compares nominal GDP to real GDP.", q:"An economy produces 20 units at $5 in the base year. This year it produces 25 units at $8. What are nominal GDP and real GDP this year?", options:["Nominal GDP = $200; real GDP = $125","Nominal GDP = $125; real GDP = $200","Nominal GDP = $160; real GDP = $100","Nominal GDP = $200; real GDP = $200"], a:0, tag:"real_nominal_gdp", type:"calculation", objective:"LO24.4", feedback:"Nominal GDP uses current price: 25 x 8 = 200. Real GDP uses base price: 25 x 5 = 125." },
  { id:13055, sourceGame: "nationalLedger", difficulty:"elite", conceptCluster:"real_nominal_gdp", primarySkill:"gdp_deflator", secondarySkills:["nominal_vs_real_gdp"], repairSkill:"gdp_deflator", commonError:"Forgetting that the GDP deflator compares nominal GDP to real GDP.", q:"Real GDP rises by 4%, while nominal GDP rises by 9%. What is the most reasonable interpretation?", options:["Output rose and the price level also rose","Only output rose","Only prices rose","Both output and prices fell"], a:0, tag:"real_nominal_gdp", type:"interpretation", objective:"LO24.4", feedback:"Real GDP captures output growth; nominal GDP rising faster suggests prices rose too." },
  { id:13056, sourceGame: "nationalLedger", difficulty:"elite", conceptCluster:"real_nominal_gdp", primarySkill:"gdp_deflator", secondarySkills:["nominal_vs_real_gdp"], repairSkill:"gdp_deflator", commonError:"Forgetting that the GDP deflator compares nominal GDP to real GDP.", q:"If nominal GDP is $36T and real GDP is $30T, then the GDP deflator indicates:", options:["The price level is 20% above the base-year level","The price level is 20% below the base-year level","Real output is 120% higher than nominal output","Inflation is exactly 120% this year"], a:0, tag:"real_nominal_gdp", type:"interpretation", objective:"LO24.4", feedback:"GDP deflator = 36/30 x 100 = 120, meaning prices are 20% above the base-year level." },
  { id:13057, sourceGame: "nationalLedger", difficulty:"elite", conceptCluster:"gdp_wellbeing", primarySkill:"gdp_wellbeing_limits", secondarySkills:["gdp_counting_rules"], repairSkill:"gdp_wellbeing_limits", commonError:"Assuming higher GDP automatically means higher overall well-being.", q:"Country A has higher GDP per person than Country B, but Country B has cleaner air, more leisure, and longer life expectancy. What should an economist conclude?", options:["GDP per person is useful but incomplete for comparing well-being","Country A must have higher well-being in every respect","Country B must have higher GDP once adjusted correctly","GDP ignores all market output"], a:0, tag:"gdp_wellbeing", type:"interpretation", objective:"LO24.5", feedback:"GDP per person helps compare material output but misses some important well-being measures." },
  { id:13058, sourceGame: "nationalLedger", difficulty:"elite", conceptCluster:"gdp_wellbeing", primarySkill:"gdp_wellbeing_limits", secondarySkills:["gdp_counting_rules"], repairSkill:"gdp_wellbeing_limits", commonError:"Assuming higher GDP automatically means higher overall well-being.", q:"A hurricane destroys homes, and rebuilding activity raises GDP. Why is this not necessarily an improvement in well-being?", options:["GDP counts rebuilding production but does not subtract the welfare loss from destruction itself","GDP excludes all construction","GDP counts only leisure","GDP always falls after disasters"], a:0, tag:"gdp_wellbeing", type:"interpretation", objective:"LO24.5", feedback:"GDP can rise from rebuilding even though society is replacing destroyed assets." },
  { id:13059, sourceGame: "nationalLedger", difficulty:"elite", conceptCluster:"gdp_wellbeing", primarySkill:"gdp_wellbeing_limits", secondarySkills:["gdp_counting_rules"], repairSkill:"gdp_wellbeing_limits", commonError:"Assuming higher GDP automatically means higher overall well-being.", q:"A country increases GDP by requiring longer work hours and reducing vacation time. What GDP limitation does this expose?", options:["GDP does not fully account for lost leisure","GDP excludes wages","GDP cannot count final goods","GDP only counts imports"], a:0, tag:"gdp_wellbeing", type:"interpretation", objective:"LO24.5", feedback:"GDP measures production but does not fully value leisure." },
  { id:13060, sourceGame: "nationalLedger", difficulty:"elite", conceptCluster:"prices_inflation", primarySkill:"cpi_calculation", secondarySkills:["inflation_rate"], repairSkill:"cpi_calculation", commonError:"Using the wrong basket cost or forgetting to multiply by 100.", q:"A CPI basket contains 5 bus tickets and 2 meals. Base-year prices are $2 per bus ticket and $10 per meal. Current prices are $3 per bus ticket and $14 per meal. What is the CPI?", options:["143.3","136.7","150.0","130.0"], a:0, tag:"cpi_inflation", type:"calculation", objective:"LO25.1", feedback:"Base cost = 5(2)+2(10)=30. Current cost = 5(3)+2(14)=43. CPI = 100 x 43/30 = 143.3." },
  { id:13061, sourceGame: "nationalLedger", difficulty:"elite", conceptCluster:"prices_inflation", primarySkill:"inflation_rate", secondarySkills:["cpi_calculation"], repairSkill:"inflation_rate", commonError:"Using the CPI point change instead of the percentage change.", q:"The CPI is 180 in year 1, 198 in year 2, and 207.9 in year 3. What is the inflation rate from year 2 to year 3?", options:["5%","10%","15.5%","27.9%"], a:0, tag:"cpi_inflation", type:"calculation", objective:"LO25.1", feedback:"Inflation = (207.9 - 198)/198 x 100 = 5%." },
  { id:13062, sourceGame: "nationalLedger", difficulty:"elite", conceptCluster:"prices_inflation", primarySkill:"cpi_calculation", secondarySkills:["inflation_rate"], repairSkill:"cpi_calculation", commonError:"Using the wrong basket cost or forgetting to multiply by 100.", q:"A basket cost $320 in the base year. The CPI is now 175. What does the basket cost now?", options:["$560","$495","$375","$182.86"], a:0, tag:"cpi_inflation", type:"calculation", objective:"LO25.1", feedback:"Current cost = 320 x 175/100 = $560." },
  { id:13063, sourceGame: "nationalLedger", difficulty:"elite", conceptCluster:"prices_inflation", primarySkill:"inflation_rate", secondarySkills:["cpi_calculation"], repairSkill:"inflation_rate", commonError:"Using the CPI point change instead of the percentage change.", q:"A CPI basket costs $500 in the base year, $650 last year, and $702 this year. What is this year's inflation rate?", options:["8%","40.4%","30%","10.4%"], a:0, tag:"cpi_inflation", type:"calculation", objective:"LO25.1", feedback:"Last year's CPI = 130 and this year's CPI = 140.4. Inflation = (140.4 - 130)/130 = 8%." },
  { id:13064, sourceGame: "nationalLedger", difficulty:"elite", conceptCluster:"prices_inflation", primarySkill:"substitution_bias", secondarySkills:["quality_new_goods_bias"], repairSkill:"substitution_bias", commonError:"Ignoring that consumers switch toward relatively cheaper goods.", q:"A fixed CPI basket includes 10 gallons of gasoline and 10 bus rides. Gas prices double, bus fares barely rise, and consumers switch heavily toward buses. What does the CPI likely do?", options:["Overstates the rise in cost of living because it misses substitution","Understates inflation because gas doubled","Perfectly measures welfare because the basket is fixed","Stops measuring transportation prices"], a:0, tag:"cpi_bias", type:"multi-step", objective:"LO25.2", feedback:"The CPI fixed basket can exaggerate cost-of-living increases when consumers substitute away from goods whose prices rise." },
  { id:13065, sourceGame: "nationalLedger", difficulty:"elite", conceptCluster:"prices_inflation", primarySkill:"quality_new_goods_bias", secondarySkills:["substitution_bias"], repairSkill:"quality_new_goods_bias", commonError:"Treating all price increases as inflation even when quality or product variety improves.", q:"A medical procedure rises in price from $2,000 to $2,600, but the new version cuts recovery time in half and lowers risk. Why is CPI measurement difficult?", options:["Part of the higher price reflects quality improvement, not just inflation","Medical care is never included in CPI","Quality improvements always make inflation negative","GDP deflator and CPI are identical"], a:0, tag:"cpi_bias", type:"interpretation", objective:"LO25.2", feedback:"Quality change makes it hard to know how much of a price increase is true inflation." },
  { id:13066, sourceGame: "nationalLedger", difficulty:"elite", conceptCluster:"prices_inflation", primarySkill:"quality_new_goods_bias", secondarySkills:["substitution_bias"], repairSkill:"quality_new_goods_bias", commonError:"Treating all price increases as inflation even when quality or product variety improves.", q:"Which scenario combines two CPI biases at once?", options:["A new streaming service appears and consumers substitute away from expensive cable","A worker becomes unemployed during a recession","Exports rise faster than imports","Government purchases increase"], a:0, tag:"cpi_bias", type:"interpretation", objective:"LO25.2", feedback:"New goods and substitution both complicate CPI measurement." },
  { id:13067, sourceGame: "nationalLedger", difficulty:"elite", conceptCluster:"prices_inflation", primarySkill:"substitution_bias", secondarySkills:["quality_new_goods_bias"], repairSkill:"substitution_bias", commonError:"Ignoring that consumers switch toward relatively cheaper goods.", q:"If official CPI inflation is 6%, but consumers increasingly substitute toward cheaper goods and product quality improves, the true cost-of-living increase may be:", options:["Less than 6%","Exactly 6% by definition","Greater than 6% no matter what","Unrelated to consumer prices"], a:0, tag:"cpi_bias", type:"interpretation", objective:"LO25.2", feedback:"Substitution and quality improvements often mean CPI overstates true cost-of-living increases." },
  { id:13068, sourceGame: "nationalLedger", difficulty:"elite", conceptCluster:"prices_inflation", primarySkill:"quality_new_goods_bias", secondarySkills:["substitution_bias"], repairSkill:"quality_new_goods_bias", commonError:"Treating all price increases as inflation even when quality or product variety improves.", q:"A student's laptop costs 25% more than five years ago, but it is faster, lighter, and has much longer battery life. Which answer best avoids the trap?", options:["The full 25% price increase should not automatically be treated as pure inflation","The CPI must ignore the laptop because quality changed","The GDP deflator counts it as unemployment","The real price definitely rose by 25%"], a:0, tag:"cpi_bias", type:"trap", objective:"LO25.2", feedback:"Quality improvements mean some of the price increase may reflect a better product, not just inflation." },
  { id:13069, sourceGame: "nationalLedger", difficulty:"elite", conceptCluster:"prices_inflation", primarySkill:"cpi_vs_gdp_deflator", secondarySkills:["cpi_calculation"], repairSkill:"cpi_vs_gdp_deflator", commonError:"Confusing a fixed consumer basket with current domestic production prices.", q:"Imported coffee prices rise sharply, while prices of domestically produced machinery fall. Which index is likely pushed up more directly by the coffee price increase?", options:["CPI","GDP deflator","Labor force participation rate","Real GDP"], a:0, tag:"cpi_vs_deflator", type:"interpretation", objective:"LO25.3", feedback:"Imported consumer goods affect the CPI more directly than the GDP deflator." },
  { id:13070, sourceGame: "nationalLedger", difficulty:"elite", conceptCluster:"prices_inflation", primarySkill:"cpi_vs_gdp_deflator", secondarySkills:["cpi_calculation"], repairSkill:"cpi_vs_gdp_deflator", commonError:"Confusing a fixed consumer basket with current domestic production prices.", q:"Domestic firms produce fewer computers and more health care services. Computer prices fall while health care prices rise. Why might the GDP deflator respond differently from the CPI?", options:["The GDP deflator's basket shifts with current domestic production, while the CPI basket is fixed","The CPI never includes health care","The GDP deflator includes imports only","The CPI measures only wages"], a:0, tag:"cpi_vs_deflator", type:"interpretation", objective:"LO25.3", feedback:"The GDP deflator reflects the changing composition of current production." },
  { id:13071, sourceGame: "nationalLedger", difficulty:"elite", conceptCluster:"prices_inflation", primarySkill:"cpi_vs_gdp_deflator", secondarySkills:["cpi_calculation"], repairSkill:"cpi_vs_gdp_deflator", commonError:"Confusing a fixed consumer basket with current domestic production prices.", q:"Which pair is correctly matched?", options:["CPI: fixed consumer basket; GDP deflator: current domestic production","CPI: current exports only; GDP deflator: fixed imported basket","CPI: unemployment; GDP deflator: labor force","CPI: real output; GDP deflator: nominal output only"], a:0, tag:"cpi_vs_deflator", type:"definition", objective:"LO25.3", feedback:"The CPI and GDP deflator both measure prices, but their baskets differ." },
  { id:13072, sourceGame: "nationalLedger", difficulty:"elite", conceptCluster:"prices_inflation", primarySkill:"cpi_vs_gdp_deflator", secondarySkills:["cpi_calculation"], repairSkill:"cpi_vs_gdp_deflator", commonError:"Confusing a fixed consumer basket with current domestic production prices.", q:"A country produces only domestic wheat and imports all oil. Oil prices rise while wheat prices are unchanged. What is most likely?", options:["CPI rises more than the GDP deflator if consumers buy oil","GDP deflator rises more because oil is imported","Both indexes are unchanged","Real GDP must rise"], a:0, tag:"cpi_vs_deflator", type:"multi-step", objective:"LO25.3", feedback:"Imported oil affects consumer prices but is not domestic production, so it is not directly in the GDP deflator." },
  { id:13073, sourceGame: "nationalLedger", difficulty:"elite", conceptCluster:"prices_inflation", primarySkill:"inflation_adjustment", secondarySkills:["cpi_calculation"], repairSkill:"inflation_adjustment", commonError:"Comparing nominal dollar amounts across years without adjusting for the price level.", q:"A worker earned $42,000 when the CPI was 140. The CPI is now 245. What income today has the same purchasing power?", options:["$73,500","$58,800","$24,000","$105,000"], a:0, tag:"inflation_adjustment", type:"calculation", objective:"LO25.4", feedback:"Today's dollars = 42000 x 245/140 = 73500." },
  { id:13074, sourceGame: "nationalLedger", difficulty:"elite", conceptCluster:"prices_inflation", primarySkill:"inflation_adjustment", secondarySkills:["cpi_calculation"], repairSkill:"inflation_adjustment", commonError:"Comparing nominal dollar amounts across years without adjusting for the price level.", q:"A car cost $8,000 in the past when the CPI was 80. The equivalent current-dollar price is $28,000. What is the current CPI?", options:["280","350","224","160"], a:0, tag:"inflation_adjustment", type:"calculation", objective:"LO25.4", feedback:"28000 = 8000 x current CPI/80, so current CPI = 280." },
  { id:13075, sourceGame: "nationalLedger", difficulty:"elite", conceptCluster:"prices_inflation", primarySkill:"inflation_adjustment", secondarySkills:["cpi_calculation"], repairSkill:"inflation_adjustment", commonError:"Comparing nominal dollar amounts across years without adjusting for the price level.", q:"A current salary of $96,000 is equivalent to $60,000 in year-T dollars. If the current CPI is 240, what was the CPI in year T?", options:["150","160","180","384"], a:0, tag:"inflation_adjustment", type:"calculation", objective:"LO25.4", feedback:"60000 = 96000 x CPI_T/240, so CPI_T = 150." },
  { id:13076, sourceGame: "nationalLedger", difficulty:"elite", conceptCluster:"prices_inflation", primarySkill:"real_interest_rate", secondarySkills:["inflation_rate"], repairSkill:"real_interest_rate", commonError:"Forgetting to subtract inflation from the nominal interest rate.", q:"A lender expects 3% inflation and wants a 4% real return. What nominal interest rate should the lender charge approximately?", options:["7%","1%","12%","4%"], a:0, tag:"interest_inflation", type:"calculation", objective:"LO25.5", feedback:"Nominal interest rate ≈ real interest rate + expected inflation = 4% + 3% = 7%." },
  { id:13077, sourceGame: "nationalLedger", difficulty:"elite", conceptCluster:"prices_inflation", primarySkill:"real_interest_rate", secondarySkills:["inflation_rate"], repairSkill:"real_interest_rate", commonError:"Forgetting to subtract inflation from the nominal interest rate.", q:"A loan has a fixed nominal rate of 5%. Expected inflation was 2%, but actual inflation is 6%. What happened to the real interest rate relative to what was expected?", options:["It was 4 percentage points lower than expected","It was 4 percentage points higher than expected","It stayed the same","It became exactly 5%"], a:0, tag:"interest_inflation", type:"multi-step", objective:"LO25.5", feedback:"Expected real rate was 3%; actual real rate was -1%, so it was 4 points lower." },
  { id:13078, sourceGame: "nationalLedger", difficulty:"elite", conceptCluster:"prices_inflation", primarySkill:"real_interest_rate", secondarySkills:["inflation_rate"], repairSkill:"real_interest_rate", commonError:"Forgetting to subtract inflation from the nominal interest rate.", q:"If nominal interest is 11% and real interest is 4%, what inflation rate is implied?", options:["7%","15%","4%","11%"], a:0, tag:"interest_inflation", type:"calculation", objective:"LO25.5", feedback:"Inflation = nominal interest - real interest = 11% - 4% = 7%." },
  { id:13079, sourceGame: "nationalLedger", difficulty:"elite", conceptCluster:"prices_inflation", primarySkill:"real_interest_rate", secondarySkills:["inflation_rate"], repairSkill:"real_interest_rate", commonError:"Forgetting to subtract inflation from the nominal interest rate.", q:"A saver earns 3% nominal interest while inflation is 5%. Which statement is most accurate?", options:["The saver has more dollars but less purchasing power","The saver has fewer dollars and less purchasing power","The saver has more purchasing power because nominal interest is positive","Inflation does not affect savings"], a:0, tag:"interest_inflation", type:"interpretation", objective:"LO25.5", feedback:"A positive nominal return can still be a negative real return when inflation is higher." },
  { id:13080, sourceGame: "nationalLedger", difficulty:"elite", conceptCluster:"growth_productivity", primarySkill:"rule_of_70", secondarySkills:["real_gdp_per_person"], repairSkill:"rule_of_70", commonError:"Forgetting that doubling time is approximately 70 divided by the growth rate.", q:"Country A has real GDP per person of $20,000 and grows at 2%. Country B has real GDP per person of $10,000 and grows at 6%. Using the Rule of 70, what is the strongest long-run implication?", options:["B can catch up because it doubles much faster than A","A must always remain richer because it starts ahead","B cannot grow because it is poorer","Both double every 35 years"], a:0, tag:"growth_differences", type:"multi-step", objective:"LO26.1", feedback:"A doubles in about 35 years; B doubles in about 11.7 years, so B can catch up if growth persists." },
  { id:13081, sourceGame: "nationalLedger", difficulty:"elite", conceptCluster:"growth_productivity", primarySkill:"real_gdp_per_person", secondarySkills:["productivity_calculation"], repairSkill:"real_gdp_per_person", commonError:"Comparing total GDP instead of output per person.", q:"A country grows real GDP by 6% while population grows by 2%. Approximately what happens to real GDP per person?", options:["It rises by about 4%","It rises by 8%","It falls by 4%","It is unchanged"], a:0, tag:"growth_differences", type:"calculation", objective:"LO26.1", feedback:"Real GDP per person grows roughly by real GDP growth minus population growth, or about 4%." },
  { id:13082, sourceGame: "nationalLedger", difficulty:"elite", conceptCluster:"growth_productivity", primarySkill:"real_gdp_per_person", secondarySkills:["productivity_calculation"], repairSkill:"real_gdp_per_person", commonError:"Comparing total GDP instead of output per person.", q:"A country with rapid population growth sees total real GDP rise but real GDP per person stay flat. What is the best interpretation?", options:["Output is rising, but not faster than population","Living standards must be rising quickly","Productivity must have doubled","Inflation explains all growth"], a:0, tag:"growth_differences", type:"interpretation", objective:"LO26.1", feedback:"Living standards are better captured by output per person, not total output alone." },
  { id:13083, sourceGame: "nationalLedger", difficulty:"elite", conceptCluster:"growth_productivity", primarySkill:"rule_of_70", secondarySkills:["real_gdp_per_person"], repairSkill:"rule_of_70", commonError:"Forgetting that doubling time is approximately 70 divided by the growth rate.", q:"Using the Rule of 70, Country X growing at 3.5% doubles in about how many years, and Country Y growing at 1.75% doubles in about how many years?", options:["20 years and 40 years","10 years and 20 years","35 years and 70 years","40 years and 20 years"], a:0, tag:"growth_differences", type:"calculation", objective:"LO26.1", feedback:"70/3.5 = 20 and 70/1.75 = 40." },
  { id:13084, sourceGame: "nationalLedger", difficulty:"elite", conceptCluster:"growth_productivity", primarySkill:"real_gdp_per_person", secondarySkills:["productivity_calculation"], repairSkill:"real_gdp_per_person", commonError:"Comparing total GDP instead of output per person.", q:"Which country is most likely to experience the catch-up effect, other things equal?", options:["A poor country with low capital per worker but improving institutions","A rich country with already abundant capital and stagnant technology","A country banning investment","A country with no property rights"], a:0, tag:"growth_differences", type:"interpretation", objective:"LO26.1", feedback:"The catch-up effect is most plausible where capital is scarce and institutions allow investment." },
  { id:13085, sourceGame: "nationalLedger", difficulty:"elite", conceptCluster:"growth_productivity", primarySkill:"productivity_calculation", secondarySkills:["real_gdp_per_person"], repairSkill:"productivity_calculation", commonError:"Confusing total output with output per unit of labor.", q:"Output rises from 50,000 to 60,000 while labor hours rise from 10,000 to 12,500. What happens to productivity?", options:["It falls from 5 to 4.8 units per hour","It rises from 5 to 6 units per hour","It stays at 5 units per hour","It rises from 4.8 to 5 units per hour"], a:0, tag:"productivity", type:"calculation", objective:"LO26.2", feedback:"Initial productivity = 50,000/10,000 = 5. New productivity = 60,000/12,500 = 4.8." },
  { id:13086, sourceGame: "nationalLedger", difficulty:"elite", conceptCluster:"growth_productivity", primarySkill:"productivity_calculation", secondarySkills:["real_gdp_per_person"], repairSkill:"productivity_calculation", commonError:"Confusing total output with output per unit of labor.", q:"A country's output per worker rises from $80,000 to $92,000. What is the percentage increase in productivity?", options:["15%","12%","20%","8%"], a:0, tag:"productivity", type:"calculation", objective:"LO26.2", feedback:"Increase = 12,000 on a base of 80,000, so productivity rises by 15%." },
  { id:13087, sourceGame: "nationalLedger", difficulty:"elite", conceptCluster:"growth_productivity", primarySkill:"productivity_calculation", secondarySkills:["real_gdp_per_person"], repairSkill:"productivity_calculation", commonError:"Confusing total output with output per unit of labor.", q:"Two countries have the same real GDP, but Country A has half as many workers as Country B. What must be true?", options:["Country A has higher output per worker","Country B has higher productivity","Both have the same productivity","Country A has lower real GDP per worker by definition"], a:0, tag:"productivity", type:"interpretation", objective:"LO26.2", feedback:"Producing the same output with fewer workers means higher productivity." },
  { id:13088, sourceGame: "nationalLedger", difficulty:"elite", conceptCluster:"growth_productivity", primarySkill:"productivity_calculation", secondarySkills:["real_gdp_per_person"], repairSkill:"productivity_calculation", commonError:"Confusing total output with output per unit of labor.", q:"A country raises output by increasing labor force participation, but output per worker falls. What is the most precise conclusion?", options:["Total production rose, but productivity declined","Living standards must have doubled","Productivity rose because employment rose","Real GDP cannot rise when productivity falls"], a:0, tag:"productivity", type:"interpretation", objective:"LO26.2", feedback:"More workers can raise total output even while output per worker falls." },
  { id:13089, sourceGame: "nationalLedger", difficulty:"elite", conceptCluster:"growth_productivity", primarySkill:"physical_capital", secondarySkills:["productivity_calculation"], repairSkill:"physical_capital", commonError:"Confusing tools and equipment with worker skills.", q:"A government gives firms tax incentives to buy machines, funds technical colleges, and expands broadband infrastructure. Which productivity factors are targeted?", options:["Physical capital, human capital, and technological/infrastructure support","Only natural resources","Only labor force measurement","Only inflation correction"], a:0, tag:"productivity_factors", type:"multi-step", objective:"LO26.3", feedback:"Machines are physical capital, technical colleges build human capital, and broadband supports technological/infrastructure capacity." },
  { id:13090, sourceGame: "nationalLedger", difficulty:"elite", conceptCluster:"growth_productivity", primarySkill:"physical_capital", secondarySkills:["productivity_calculation"], repairSkill:"physical_capital", commonError:"Confusing tools and equipment with worker skills.", q:"Which change most clearly increases human capital rather than physical capital?", options:["Workers complete coding and equipment-maintenance training","Firms buy new robots","A country discovers copper deposits","A port adds new cranes"], a:0, tag:"productivity_factors", type:"trap", objective:"LO26.3", feedback:"Training raises worker knowledge and skills, which is human capital." },
  { id:13091, sourceGame: "nationalLedger", difficulty:"elite", conceptCluster:"growth_productivity", primarySkill:"physical_capital", secondarySkills:["productivity_calculation"], repairSkill:"physical_capital", commonError:"Confusing tools and equipment with worker skills.", q:"A country has abundant natural resources but weak education, poor infrastructure, and unstable property rights. What is the best growth interpretation?", options:["Natural resources alone may not generate high productivity without human capital, physical capital, technology, and institutions","Natural resources guarantee high living standards","Education is irrelevant if resources are abundant","GDP must equal natural resource value"], a:0, tag:"productivity_factors", type:"interpretation", objective:"LO26.3", feedback:"Natural resources help, but productivity also depends on skills, capital, technology, and institutions." },
  { id:13092, sourceGame: "nationalLedger", difficulty:"elite", conceptCluster:"growth_productivity", primarySkill:"physical_capital", secondarySkills:["productivity_calculation"], repairSkill:"physical_capital", commonError:"Confusing tools and equipment with worker skills.", q:"A new algorithm lets firms produce the same output with fewer machines and workers. Which factor best explains the improvement?", options:["Technological knowledge","Natural resources","Labor force participation","CPI substitution"], a:0, tag:"productivity_factors", type:"interpretation", objective:"LO26.3", feedback:"A better production method is technological knowledge." },
  { id:13093, sourceGame: "nationalLedger", difficulty:"elite", conceptCluster:"growth_productivity", primarySkill:"productivity_calculation", secondarySkills:["real_gdp_per_person"], repairSkill:"productivity_calculation", commonError:"Confusing total output with output per unit of labor.", q:"A country doubles its capital stock, but output rises by less than double. Which concept is most directly illustrated?", options:["Diminishing returns to capital","The Rule of 70","CPI overstatement","Cyclical unemployment"], a:0, tag:"diminishing_returns", type:"interpretation", objective:"LO26.3", feedback:"Diminishing returns means additional capital raises output, but by less and less as capital accumulates." },
  { id:13094, sourceGame: "nationalLedger", difficulty:"elite", conceptCluster:"growth_productivity", primarySkill:"physical_capital", secondarySkills:["productivity_calculation"], repairSkill:"physical_capital", commonError:"Confusing tools and equipment with worker skills.", q:"A poor country receives basic tractors for farms that previously used hand tools. A rich country adds another advanced tractor to farms already full of equipment. Which investment likely has the higher marginal return?", options:["The poor country's investment, because capital is scarcer","The rich country's investment, because diminishing returns never apply","Both must have identical returns","Neither investment affects productivity"], a:0, tag:"catch_up_growth", type:"interpretation", objective:"LO26.3", feedback:"Capital tends to have higher marginal returns when it is scarce." },
  { id:13095, sourceGame: "nationalLedger", difficulty:"elite", conceptCluster:"growth_productivity", primarySkill:"productivity_calculation", secondarySkills:["real_gdp_per_person"], repairSkill:"productivity_calculation", commonError:"Confusing total output with output per unit of labor.", q:"Which statement best connects diminishing returns and the catch-up effect?", options:["Poor countries may grow faster because added capital has high returns where capital is scarce, but returns fall as capital accumulates","Poor countries grow slower because every new unit of capital has zero return","Rich countries grow faster because diminishing returns help them","Catch-up occurs because inflation is lower in rich countries"], a:0, tag:"catch_up_growth", type:"interpretation", objective:"LO26.3", feedback:"The catch-up effect relies on high returns to scarce capital, but diminishing returns eventually reduce those gains." },
  { id:13096, sourceGame: "nationalLedger", difficulty:"elite", conceptCluster:"growth_productivity", primarySkill:"growth_policy", secondarySkills:["productivity_calculation"], repairSkill:"growth_policy", commonError:"Focusing on short-run spending instead of policies that raise long-run productivity.", q:"A government wants growth but repeatedly changes tax rules, seizes assets, and restricts courts. Which policy failure matters most?", options:["Weak property rights and instability discourage investment","Too much human capital","Too much technological knowledge","Too much labor-force accuracy"], a:0, tag:"growth_policy", type:"interpretation", objective:"LO26.4", feedback:"Unstable property rights reduce incentives to invest and innovate." },
  { id:13097, sourceGame: "nationalLedger", difficulty:"elite", conceptCluster:"growth_productivity", primarySkill:"growth_policy", secondarySkills:["productivity_calculation"], repairSkill:"growth_policy", commonError:"Focusing on short-run spending instead of policies that raise long-run productivity.", q:"Why might openness to foreign investment raise productivity?", options:["It can bring capital, technology, management practices, and links to global markets","It guarantees no domestic firms fail","It lowers productivity by definition","It only changes the CPI basket"], a:0, tag:"growth_policy", type:"interpretation", objective:"LO26.4", feedback:"Foreign investment can increase capital and transmit technology or business practices." },
  { id:13098, sourceGame: "nationalLedger", difficulty:"elite", conceptCluster:"growth_productivity", primarySkill:"growth_policy", secondarySkills:["productivity_calculation"], repairSkill:"growth_policy", commonError:"Focusing on short-run spending instead of policies that raise long-run productivity.", q:"A country funds education but blocks firms from adopting new technologies and discourages investment. What is the likely issue?", options:["Human capital gains may not fully translate into productivity without capital and technology","Education alone guarantees growth","Technology restrictions raise productivity","Investment is unrelated to output per worker"], a:0, tag:"growth_policy", type:"interpretation", objective:"LO26.4", feedback:"Productivity growth usually requires complementary gains in skills, capital, and technology." },
  { id:13099, sourceGame: "nationalLedger", difficulty:"elite", conceptCluster:"growth_productivity", primarySkill:"growth_policy", secondarySkills:["productivity_calculation"], repairSkill:"growth_policy", commonError:"Focusing on short-run spending instead of policies that raise long-run productivity.", q:"Which policy package is most internally consistent for long-run growth?", options:["Protect property rights, encourage saving and investment, support education, allow trade, and promote R&D","Raise uncertainty, block trade, reduce schooling, and discourage investment","Focus only on transfer payments and ignore productivity","Ban foreign technology and subsidize capital decay"], a:0, tag:"growth_policy", type:"interpretation", objective:"LO26.4", feedback:"Long-run growth policy should support capital accumulation, human capital, technology, trade, and stable institutions." },
  { id:13100, sourceGame: "nationalLedger", difficulty:"elite", conceptCluster:"labor_market", primarySkill:"labor_force_participation", secondarySkills:["labor_force_calculation"], repairSkill:"labor_force_participation", commonError:"Using unemployed workers instead of the labor force in the participation formula.", q:"An economy has 155 million employed, 9 million unemployed, and 96 million not in the labor force. What are the unemployment rate and labor force participation rate?", options:["5.49% unemployment and 63.08% participation","5.81% unemployment and 59.62% participation","3.46% unemployment and 63.08% participation","5.49% unemployment and 59.62% participation"], a:0, tag:"labor_force_stats", type:"multi-step", objective:"LO29.1", feedback:"Labor force = 164M; unemployment = 9/164 = 5.49%; adult population = 260M; participation = 164/260 = 63.08%." },
  { id:13101, sourceGame: "nationalLedger", difficulty:"elite", conceptCluster:"labor_market", primarySkill:"unemployment_rate", secondarySkills:["labor_force_calculation", "labor_force_participation"], repairSkill:"unemployment_rate", commonError:"Dividing unemployed workers by the whole population instead of the labor force.", q:"An economy has 120 employed, 8 unemployed, and 72 not in the labor force. Four unemployed workers find jobs, and six people outside the labor force begin searching but do not find work. What is the new unemployment rate?", options:["7.46%","6.25%","10.94%","5.97%"], a:0, tag:"labor_force_stats", type:"multi-step", objective:"LO29.1", feedback:"New employed = 124, unemployed = 10, labor force = 134. Unemployment = 10/134 = 7.46%." },
  { id:13102, sourceGame: "nationalLedger", difficulty:"elite", conceptCluster:"labor_market", primarySkill:"labor_force_participation", secondarySkills:["labor_force_calculation"], repairSkill:"labor_force_participation", commonError:"Using unemployed workers instead of the labor force in the participation formula.", q:"Adult population is 300 million. Labor force participation is 62%. The unemployment rate is 5%. How many people are unemployed?", options:["9.3 million","15 million","114 million","186 million"], a:0, tag:"labor_force_stats", type:"calculation", objective:"LO29.1", feedback:"Labor force = 0.62 x 300 = 186M. Unemployed = 0.05 x 186 = 9.3M." },
  { id:13103, sourceGame: "nationalLedger", difficulty:"elite", conceptCluster:"labor_market", primarySkill:"unemployment_rate", secondarySkills:["labor_force_calculation", "labor_force_participation"], repairSkill:"unemployment_rate", commonError:"Dividing unemployed workers by the whole population instead of the labor force.", q:"The unemployment rate falls from 6% to 5%, but employment also falls. What likely happened?", options:["Some unemployed workers left the labor force","Labor demand must have increased","Every discouraged worker found a job","The adult population became zero"], a:0, tag:"labor_force_stats", type:"interpretation", objective:"LO29.1", feedback:"The unemployment rate can fall even when employment falls if enough jobless workers stop searching." },
  { id:13104, sourceGame: "nationalLedger", difficulty:"elite", conceptCluster:"labor_market", primarySkill:"labor_force_participation", secondarySkills:["labor_force_calculation"], repairSkill:"labor_force_participation", commonError:"Using unemployed workers instead of the labor force in the participation formula.", q:"An economy has 200 adults. 130 are employed and 10 are unemployed. If 10 employed workers retire and stop looking for work, what happens to labor force participation?", options:["It falls from 70% to 65%","It rises from 65% to 70%","It stays at 70%","It falls from 65% to 60%"], a:0, tag:"labor_force_stats", type:"calculation", objective:"LO29.1", feedback:"Initial labor force = 140, participation = 70%. New labor force = 130, participation = 65%." },
  { id:13105, sourceGame: "nationalLedger", difficulty:"elite", conceptCluster:"labor_market", primarySkill:"employment_classification", secondarySkills:["discouraged_workers"], repairSkill:"employment_classification", commonError:"Classifying people by desire for work instead of paid work and active search status.", q:"A person works 5 hours per week for pay but wants 40 hours. How is this person treated in the headline unemployment rate?", options:["Counted as employed, even though underemployment is present","Counted as unemployed because they want more hours","Counted as not in the labor force","Counted as discouraged"], a:0, tag:"employment_categories", type:"trap", objective:"LO29.2", feedback:"The official unemployment rate counts part-time workers as employed, even if they want full-time work." },
  { id:13106, sourceGame: "nationalLedger", difficulty:"elite", conceptCluster:"labor_market", primarySkill:"employment_classification", secondarySkills:["discouraged_workers"], repairSkill:"employment_classification", commonError:"Classifying people by desire for work instead of paid work and active search status.", q:"A jobless person applies for work this week. Another jobless person wants work but last applied three months ago. How are they classified?", options:["The first is unemployed; the second is not in the labor force","Both are unemployed","Both are employed","The first is not in the labor force; the second is unemployed"], a:0, tag:"employment_categories", type:"multi-step", objective:"LO29.2", feedback:"Active recent search is required to be counted as unemployed." },
  { id:13107, sourceGame: "nationalLedger", difficulty:"elite", conceptCluster:"labor_market", primarySkill:"employment_classification", secondarySkills:["discouraged_workers"], repairSkill:"employment_classification", commonError:"Classifying people by desire for work instead of paid work and active search status.", q:"Which change would reduce the unemployment rate without improving the number of people employed?", options:["Unemployed workers become discouraged and stop searching","Part-time workers become full-time workers","Discouraged workers begin looking for jobs","New firms hire unemployed workers"], a:0, tag:"employment_categories", type:"trap", objective:"LO29.2", feedback:"When unemployed workers stop searching, they leave the labor force and measured unemployment can fall." },
  { id:13108, sourceGame: "nationalLedger", difficulty:"elite", conceptCluster:"labor_market", primarySkill:"discouraged_workers", secondarySkills:["employment_classification"], repairSkill:"discouraged_workers", commonError:"Counting discouraged workers as unemployed even after they stop actively searching.", q:"A recession causes job loss, and some unemployed workers become discouraged. Why might the unemployment rate understate the recession's damage?", options:["Discouraged workers are not counted as unemployed once they stop searching","Discouraged workers are counted twice","All discouraged workers are counted as employed","The unemployment rate includes only retired people"], a:0, tag:"employment_categories", type:"interpretation", objective:"LO29.2", feedback:"Discouraged workers leave the labor force, which can hide labor market weakness." },
  { id:13109, sourceGame: "nationalLedger", difficulty:"elite", conceptCluster:"labor_market", primarySkill:"employment_classification", secondarySkills:["discouraged_workers"], repairSkill:"employment_classification", commonError:"Classifying people by desire for work instead of paid work and active search status.", q:"A survey classifies people as employed, unemployed, or not in the labor force. Which person is most likely misread by the headline unemployment rate as doing better than they are?", options:["A part-time worker who wants full-time work","A full-time worker satisfied with their job","A retiree who does not want work","A student not seeking employment"], a:0, tag:"employment_categories", type:"interpretation", objective:"LO29.2", feedback:"Involuntary part-time workers are counted as employed, even though their labor situation is weak." },
  { id:13110, sourceGame: "nationalLedger", difficulty:"elite", conceptCluster:"labor_market", primarySkill:"structural_unemployment", secondarySkills:["natural_rate"], repairSkill:"structural_unemployment", commonError:"Confusing permanent mismatch with short-run job search or weak demand.", q:"A recession closes restaurants temporarily, while automation permanently reduces demand for cashiers. Which unemployment types are present?", options:["Cyclical and structural","Only frictional","Only cyclical","Only natural"], a:0, tag:"unemployment_types", type:"multi-step", objective:"LO29.3", feedback:"Recession-related layoffs are cyclical; permanent automation mismatch is structural." },
  { id:13111, sourceGame: "nationalLedger", difficulty:"elite", conceptCluster:"labor_market", primarySkill:"structural_unemployment", secondarySkills:["natural_rate"], repairSkill:"structural_unemployment", commonError:"Confusing permanent mismatch with short-run job search or weak demand.", q:"A worker leaves a job voluntarily to search for a better match during a strong economy. A different worker loses a job because their industry permanently shrinks. Which pairing is correct?", options:["Frictional; structural","Structural; frictional","Cyclical; frictional","Natural; cyclical"], a:0, tag:"unemployment_types", type:"multi-step", objective:"LO29.3", feedback:"Voluntary job search is frictional; long-term industry decline creates structural unemployment." },
  { id:13112, sourceGame: "nationalLedger", difficulty:"elite", conceptCluster:"labor_market", primarySkill:"cyclical_unemployment", secondarySkills:["natural_rate"], repairSkill:"cyclical_unemployment", commonError:"Confusing recession-driven unemployment with natural unemployment.", q:"Why is cyclical unemployment not part of the natural rate?", options:["It reflects short-run downturns rather than normal job search or structural mismatch","It is always caused by unions","It exists only because workers quit to find better jobs","It is another name for frictional unemployment"], a:0, tag:"unemployment_types", type:"definition", objective:"LO29.3", feedback:"The natural rate includes frictional and structural unemployment, not recession-driven cyclical unemployment." },
  { id:13113, sourceGame: "nationalLedger", difficulty:"elite", conceptCluster:"labor_market", primarySkill:"structural_unemployment", secondarySkills:["natural_rate"], repairSkill:"structural_unemployment", commonError:"Confusing permanent mismatch with short-run job search or weak demand.", q:"Which worker is most clearly structurally unemployed?", options:["A typist whose skills are outdated after firms switch to new software systems","A nurse moving between hospitals in the same city","A waiter laid off during a short recession","A teacher taking summer vacation but returning in August"], a:0, tag:"unemployment_types", type:"trap", objective:"LO29.3", feedback:"Structural unemployment involves a mismatch between worker skills and available jobs." },
  { id:13114, sourceGame: "nationalLedger", difficulty:"elite", conceptCluster:"labor_market", primarySkill:"structural_unemployment", secondarySkills:["natural_rate"], repairSkill:"structural_unemployment", commonError:"Confusing permanent mismatch with short-run job search or weak demand.", q:"A worker has the right skills but needs time to find the right employer. Another has obsolete skills and needs retraining. What separates the two cases?", options:["Search time versus skill mismatch","Nominal versus real wages","CPI versus GDP deflator","Imports versus exports"], a:0, tag:"unemployment_types", type:"interpretation", objective:"LO29.3", feedback:"Frictional unemployment is search time; structural unemployment is mismatch." },
  { id:13115, sourceGame: "nationalLedger", difficulty:"elite", conceptCluster:"labor_market", primarySkill:"minimum_wage_surplus", secondarySkills:["unions_efficiency_wages"], repairSkill:"minimum_wage_surplus", commonError:"Forgetting that a binding wage floor creates a surplus when labor supplied exceeds labor demanded.", q:"A binding minimum wage raises the wage from $10 to $14. At $14, firms demand 80 workers and 120 workers want jobs. What is the labor surplus?", options:["40 workers","80 workers","120 workers","200 workers"], a:0, tag:"labor_market_policy", type:"calculation", objective:"LO29.4", feedback:"Labor surplus = quantity supplied - quantity demanded = 120 - 80 = 40 workers." },
  { id:13116, sourceGame: "nationalLedger", difficulty:"elite", conceptCluster:"labor_market", primarySkill:"frictional_unemployment", secondarySkills:["natural_rate"], repairSkill:"frictional_unemployment", commonError:"Confusing normal job search with skill mismatch or recession layoffs.", q:"Unemployment insurance gives workers time to search, but also reduces urgency. Which unemployment type is most directly affected?", options:["Frictional unemployment","Cyclical unemployment only","GDP unemployment","Imported unemployment"], a:0, tag:"labor_market_policy", type:"interpretation", objective:"LO29.4", feedback:"Unemployment insurance most directly affects job search behavior, which relates to frictional unemployment." },
  { id:13117, sourceGame: "nationalLedger", difficulty:"elite", conceptCluster:"labor_market", primarySkill:"unions_efficiency_wages", secondarySkills:["minimum_wage_surplus"], repairSkill:"unions_efficiency_wages", commonError:"Missing how above-equilibrium wages can create unemployment even when they have benefits.", q:"A union wage raises pay for employed members but reduces hiring by firms. Which statement best captures the tradeoff?", options:["Insiders may benefit while some outsiders face reduced job opportunities","All workers must benefit equally","The unemployment rate must fall to zero","The policy only affects CPI"], a:0, tag:"labor_market_policy", type:"interpretation", objective:"LO29.4", feedback:"Union wage gains can help employed members but reduce opportunities for workers not hired." },
  { id:13118, sourceGame: "nationalLedger", difficulty:"elite", conceptCluster:"labor_market", primarySkill:"unions_efficiency_wages", secondarySkills:["minimum_wage_surplus"], repairSkill:"unions_efficiency_wages", commonError:"Missing how above-equilibrium wages can create unemployment even when they have benefits.", q:"A firm pays above-equilibrium wages and finds quits fall, applicant quality improves, and effort rises. Which theory explains this?", options:["Efficiency wage theory","CPI substitution theory","Net export theory","Discouraged worker theory"], a:0, tag:"labor_market_policy", type:"interpretation", objective:"LO29.4", feedback:"Efficiency wage theory explains why above-equilibrium wages may raise productivity or reduce turnover." },
  { id:13119, sourceGame: "nationalLedger", difficulty:"elite", conceptCluster:"labor_market", primarySkill:"natural_rate", secondarySkills:["frictional_unemployment", "structural_unemployment"], repairSkill:"natural_rate", commonError:"Assuming healthy economies should have zero unemployment.", q:"An economy has no recessionary unemployment, but still has workers searching between jobs and workers mismatched by skills. What unemployment remains?", options:["The natural rate of unemployment","Only cyclical unemployment","No unemployment at all","Only discouraged-worker unemployment"], a:0, tag:"natural_unemployment", type:"interpretation", objective:"LO29.5", feedback:"The natural rate remains because frictional and structural unemployment persist even without cyclical unemployment." }
],
};

function shuffleOptions(question){
    let q = {
        id: question.id,
        q: question.q,
        options: [...question.options],
        a: question.a,
        feedback: question.feedback,
        hint: question.hint,
        tag: question.tag,
        type: question.type,
        objective: question.objective,
        image: question.image,
		difficulty: question.difficulty,
        conceptCluster: question.conceptCluster,
        primarySkill: question.primarySkill,
        secondarySkills: question.secondarySkills || [],
        repairSkill: question.repairSkill,
        commonError: question.commonError
    };

    let correct = q.options[q.a];

    for(let i = q.options.length - 1; i > 0; i--){
        let j = Math.floor(Math.random() * (i + 1));
        [q.options[i], q.options[j]] = [q.options[j], q.options[i]];
    }

    q.a = q.options.indexOf(correct);

    return q;
}

// QUESTION SELECTION ENGINE — DO NOT MODIFY
// =============================================
// Handles:
// - non-repetition
// - difficulty filtering
// - type balancing
//
// Breaking this = repeated questions or bad difficulty scaling
     
// 3. Remove the special calculated rooms block from randomQuestion()
function randomQuestion(poolName) {
    let pool = questionBanks[poolName];

    if (!pool) return null;

    let used = [
        ...usedQuestions.easy,
        ...usedQuestions.medium,
        ...usedQuestions.hard,
        ...usedQuestions.easyBoss,
        ...usedQuestions.mediumBoss,
        ...usedQuestions.finalBoss,
    ];

    let available = pool.filter(q => !used.includes(q.id));

    if(available.length === 0){
        usedQuestions[poolName] = [];
        available = pool;
    }

    let filtered = available;
    if (lastTypes.length >= 2) {
        let last1 = lastTypes[lastTypes.length - 1];
        let last2 = lastTypes[lastTypes.length - 2];

        if (last1 === last2) {
            filtered = available.filter(q => q.type !== last1);
            if (filtered.length === 0) filtered = available;
        }
    }

    let question = filtered[Math.floor(Math.random() * filtered.length)];

    usedQuestions[poolName].push(question.id);

    lastTypes.push(question.type);
    if(lastTypes.length > 3){
        lastTypes.shift();
    }

    return question;
}

function updateMazeTrack() {
    const track = document.getElementById("mazeTrack");
    track.innerHTML = ""; // Clear the old grid
    
    for (let i = 1; i <= 30; i++) {
        const box = document.createElement("div");
        box.setAttribute("role","img");
        box.setAttribute("aria-label",`Room ${i} of 30`);
        box.className = "maze-box";
        
        // Determine the icon and state
        if (i < room) {
            box.innerText = "⬜";
            box.style.opacity = "0.6";
        } else if (i === room) {
            box.classList.add("active"); // Trigger the blue pulse
            box.setAttribute("aria-label",`Current room ${i} of 30`);
            box.innerText = "🟦";
        } else {
            // Boss icons for future rooms
            if (i === 10){box.innerHTML = '<img src="breaker.png" class="boss-icon">';box.classList.add("boss10");}
            else if (i === 20){box.innerHTML = '<img src="warden.png" class="boss-icon">';box.classList.add("boss20");}
            else if (i === 30){box.innerHTML = '<img src="marshal.png" class="boss-icon">';box.classList.add("boss30");}
            else box.innerText = "🟨";
        }
        
        track.appendChild(box);
    }
}

// RANDOMIZATION SYSTEM — DO NOT MODIFY CORE LOGIC
// =============================================
// Controls fair, non-repeating selection of:
// - calculation generators
// - question pools
//
// Uses "shuffle + bag" system to ensure:
// - no immediate repeats
// - full coverage before reuse
//
// ---------------------------------------------
// SAFE TO EDIT:
// - adding new generators (calculationGenerators)
// - modifying pool content
//
// DO NOT MODIFY:
// - shuffle logic
// - bag system (calcBag, _remaining)
// - pop() usage
//
// Breaking this WILL cause:
// - repeated questions
// - uneven distribution
// - predictable patterns
//
// This ensures randomness WITHOUT repetition.
// =============================================     

// Fisher-Yates shuffle (uniform random order)
// Do not modify — ensures unbiased randomness     
function shuffle(arr){
    for(let i = arr.length - 1; i > 0; i--){
        const j = Math.floor(Math.random() * (i + 1));
        [arr[i], arr[j]] = [arr[j], arr[i]];
    }
    return arr;
}

// Generic bag-based random picker for any pool
// Prevents repeats until pool is exhausted
function pickRandom(pool){
    if(!pool._remaining || pool._remaining.length === 0){
        pool._remaining = shuffle([...pool]);
    }
    return pool._remaining.pop();
}

let currentMusic = null;

function stopAllMusic(){

    if(bossMusic) bossMusic.pause();
    if(finalBossMusic) finalBossMusic.pause();
}

function playExplorationMusic(){

    stopAllMusic();
    bgMusic.play();
    currentMusic = "exploration";

}

function playFinalBossMusic(){

function displayQuestion() {

function setAnswerButtonsDisabled(disabled){

function checkRapidGuessing(isCorrect, responseTime){
    rapidGuessHistory.push({
        correct: isCorrect ? 1 : 0,
        responseTime: responseTime
    });

    if(rapidGuessHistory.length > RAPID_GUESS_CONFIG.windowSize){
        rapidGuessHistory.shift();
    }

    if(rapidGuessHistory.length < RAPID_GUESS_CONFIG.minAttempts){
        return {
            triggered: false,
            avgTime: responseTime,
            accuracy: isCorrect ? 1 : 0
        };
    }

    const recent = rapidGuessHistory.slice(-RAPID_GUESS_CONFIG.windowSize);

    const avgTime = recent.reduce((sum, item) => sum + item.responseTime, 0) / recent.length;
    const accuracy = recent.reduce((sum, item) => sum + item.correct, 0) / recent.length;

    return {
        triggered: avgTime < RAPID_GUESS_CONFIG.avgTimeMs && accuracy < RAPID_GUESS_CONFIG.maxAccuracy,
        avgTime,
        accuracy
    };
}

// =============================================
// COMPLETION CODE GENERATOR — DO NOT MODIFY
// =============================================
// This function creates a unique verification code
// based on player performance:
//
// Inputs:
// - name (player)
// - accuracy (% correct)
// - streak (max streak)
// - total (questions answered)
//
// It generates a deterministic hash so that:
// - codes are reproducible
// - codes cannot be easily faked manually
//
// ---------------------------------------------
// DO NOT CHANGE:
// - string structure (name|acc|streak|total|CITADEL00)
// - hashing logic
// - return format ("GATE-...")
//
// Changing this WILL:
// - invalidate all existing completion codes
// - break verification consistency
//
// ---------------------------------------------
// SAFE TO EDIT (if absolutely necessary):
// - "ARCHIVE42" → change only if rebranding ALL codes
// - "ARCH-" prefix → cosmetic only
//
// This is NOT encryption.
// It is a lightweight integrity check.
// =============================================
function generateCode(name, acc, streak, total){
    let str = `${name}|${acc}|${streak}|${total}|CRISIS07`;
    let hash = 0;

    for(let i = 0; i < str.length; i++){
        hash = (hash << 5) - hash + str.charCodeAt(i);
        hash |= 0;
    }

    return "CRS-" + Math.abs(hash).toString(36).toUpperCase();
}

// =============================================
// ARRAY SHUFFLE UTILITY — SAFE TO USE, DO NOT MODIFY
// =============================================
// Fisher-Yates shuffle algorithm.
//
// Used to randomize:
// - question order
// - calculation generators
// - any randomized sequences
//
// DO NOT MODIFY unless you understand:
// - uniform randomness
// - bias in random selection
//
// Breaking this = predictable patterns in questions
// =============================================     
function shuffleArray(arr){
    for(let i=arr.length-1;i>0;i--){ let j=Math.floor(Math.random()*(i+1)); [arr[i],arr[j]]=[arr[j],arr[i]]; }
    return arr;
}

// HIGH SCORE TRACKING — OPTIONAL FEATURE

// Stores top completion times in browser (localStorage)
//
// - Saves name, time, and date
// - Sorts fastest → slowest
// - Keeps top 5 results only
//
// SAFE TO EDIT:
// - number of scores kept (slice)
// - displayed fields (name/date)
//
// WARNING:
// Clearing browser data will erase scores.
// =============================================
function updateHighScores(newTimeMs) {
    let scores = JSON.parse(localStorage.getItem("gauntletHighScores")) || [];
    scores.push({ name: username, time: newTimeMs, date: new Date().toLocaleDateString() });
    
    // Sort by time (lowest/fastest first) and keep top 5
    scores.sort((a, b) => a.time - b.time);
    scores = scores.slice(0, 5);
    
    localStorage.setItem("gauntletHighScores", JSON.stringify(scores));
    return scores;
}

// TIME FORMATTER — SAFE UTILITY
// =============================================
// Converts milliseconds → readable format (Xm Ys)
//
// Used for:
// - victory screen
// - performance tracking
//
// Safe to modify format if desired.

function formatTime(ms) {
    let mins = Math.floor(ms / 60000);
    let secs = Math.floor((ms / 1000) % 60);
    return `${mins}m ${secs}s`;
}
