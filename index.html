  { id:11149, sourceGame: "nationalLedger", difficulty:"medium", conceptCluster:"labor_market", primarySkill:"unemployment_rate", secondarySkills:["labor_force_calculation", "labor_force_participation"], repairSkill:"unemployment_rate", commonError:"Dividing unemployed workers by the whole population instead of the labor force.", q:"Using 140 million employed and 10 million unemployed, what is the unemployment rate?", options:["5.0%","6.7%","7.1%","10.0%"], a:1, tag:"labor_force_stats", type:"calculation", objective:"LO29.1", feedback:"Unemployment rate = 10 / 150 x 100 = 6.7%." },
  { id:11150, sourceGame: "nationalLedger", difficulty:"medium", conceptCluster:"labor_market", primarySkill:"labor_force_participation", secondarySkills:["labor_force_calculation"], repairSkill:"labor_force_participation", commonError:"Using unemployed workers instead of the labor force in the participation formula.", q:"If the labor force is 150 million and the adult population is 200 million, what is the labor force participation rate?", options:["50%","66.7%","75%","150%"], a:2, tag:"labor_force_stats", type:"calculation", objective:"LO29.1", feedback:"Labor force participation = 150 / 200 x 100 = 75%." },
  { id:11151, sourceGame: "nationalLedger", difficulty:"medium", conceptCluster:"labor_market", primarySkill:"unemployment_rate", secondarySkills:["labor_force_calculation", "labor_force_participation"], repairSkill:"unemployment_rate", commonError:"Dividing unemployed workers by the whole population instead of the labor force.", q:"If 2 million unemployed workers become discouraged and stop looking for work, what happens immediately to the measured unemployment rate?", options:["It rises because discouraged workers become unemployed","It falls because they leave the labor force","It is unchanged because employment rises","It becomes 100%"], a:1, tag:"labor_force_stats", type:"interpretation", objective:"LO29.1", feedback:"Discouraged workers leave the labor force, which can lower the measured unemployment rate." },
  { id:11152, sourceGame: "nationalLedger", difficulty:"medium", conceptCluster:"labor_market", primarySkill:"unemployment_rate", secondarySkills:["labor_force_calculation", "labor_force_participation"], repairSkill:"unemployment_rate", commonError:"Dividing unemployed workers by the whole population instead of the labor force.", q:"An economy has 90 employed, 10 unemployed, and 50 not in the labor force. If 5 unemployed workers stop looking, what is the new unemployment rate?", options:["5.3%","10%","15%","50%"], a:0, tag:"labor_force_stats", type:"calculation", objective:"LO29.1", feedback:"New unemployed = 5 and new labor force = 95, so unemployment = 5/95 = 5.3%." },
  { id:11153, sourceGame: "nationalLedger", difficulty:"medium", conceptCluster:"labor_market", primarySkill:"employment_classification", secondarySkills:["discouraged_workers"], repairSkill:"employment_classification", commonError:"Classifying people by desire for work instead of paid work and active search status.", q:"A parent who stays home full-time and is not seeking paid work is classified as:", options:["Employed","Unemployed","Not in the labor force","Structurally unemployed"], a:2, tag:"employment_categories", type:"interpretation", objective:"LO29.2", feedback:"Someone not working and not looking for paid work is not in the labor force." },
  { id:11154, sourceGame: "nationalLedger", difficulty:"medium", conceptCluster:"labor_market", primarySkill:"employment_classification", secondarySkills:["discouraged_workers"], repairSkill:"employment_classification", commonError:"Classifying people by desire for work instead of paid work and active search status.", q:"A person works one hour for pay during the survey week while looking for full-time work. How is the person classified?", options:["Unemployed","Employed","Not in the labor force","Discouraged worker"], a:1, tag:"employment_categories", type:"trap", objective:"LO29.2", feedback:"A person who does any paid work during the survey period is counted as employed." },
  { id:11155, sourceGame: "nationalLedger", difficulty:"medium", conceptCluster:"labor_market", primarySkill:"employment_classification", secondarySkills:["discouraged_workers"], repairSkill:"employment_classification", commonError:"Classifying people by desire for work instead of paid work and active search status.", q:"A worker without a job sends out applications during the last four weeks. How is the worker classified?", options:["Employed","Unemployed","Not in the labor force","Retired"], a:1, tag:"employment_categories", type:"interpretation", objective:"LO29.2", feedback:"Actively looking for work while jobless means the person is unemployed." },
  { id:11156, sourceGame: "nationalLedger", difficulty:"medium", conceptCluster:"labor_market", primarySkill:"discouraged_workers", secondarySkills:["employment_classification"], repairSkill:"discouraged_workers", commonError:"Counting discouraged workers as unemployed even after they stop actively searching.", q:"A discouraged worker wants a job but stopped searching because they believe no jobs are available. How is this worker classified in official unemployment statistics?", options:["Employed","Unemployed","Not in the labor force","Part of investment"], a:2, tag:"employment_categories", type:"interpretation", objective:"LO29.2", feedback:"Discouraged workers are not in the labor force because they are not actively searching." },
  { id:11157, sourceGame: "nationalLedger", difficulty:"medium", conceptCluster:"labor_market", primarySkill:"employment_classification", secondarySkills:["discouraged_workers"], repairSkill:"employment_classification", commonError:"Classifying people by desire for work instead of paid work and active search status.", q:"Which classification is most likely to make the unemployment rate understate labor market weakness?", options:["Counting discouraged workers as not in the labor force","Counting active job seekers as unemployed","Counting paid workers as employed","Counting unemployed workers in the labor force"], a:0, tag:"employment_categories", type:"interpretation", objective:"LO29.2", feedback:"Discouraged workers are excluded from unemployment, which can hide labor market weakness." },
  { id:11158, sourceGame: "nationalLedger", difficulty:"medium", conceptCluster:"labor_market", primarySkill:"structural_unemployment", secondarySkills:["natural_rate"], repairSkill:"structural_unemployment", commonError:"Confusing permanent mismatch with short-run job search or weak demand.", q:"A college graduate takes two months to find a first job that matches their skills. This is most likely:", options:["Frictional unemployment","Structural unemployment","Cyclical unemployment","Not in the labor force"], a:0, tag:"unemployment_types", type:"interpretation", objective:"LO29.3", feedback:"Job search while matching workers and firms is frictional unemployment." },
  { id:11159, sourceGame: "nationalLedger", difficulty:"medium", conceptCluster:"labor_market", primarySkill:"structural_unemployment", secondarySkills:["natural_rate"], repairSkill:"structural_unemployment", commonError:"Confusing permanent mismatch with short-run job search or weak demand.", q:"A coal miner loses work because the economy shifts permanently toward other energy sources and the miner lacks transferable skills. This is:", options:["Frictional unemployment","Structural unemployment","Cyclical unemployment","Seasonal inflation"], a:1, tag:"unemployment_types", type:"interpretation", objective:"LO29.3", feedback:"A long-term mismatch between skills and available jobs is structural unemployment." },
  { id:11160, sourceGame: "nationalLedger", difficulty:"medium", conceptCluster:"labor_market", primarySkill:"cyclical_unemployment", secondarySkills:["natural_rate"], repairSkill:"cyclical_unemployment", commonError:"Confusing recession-driven unemployment with natural unemployment.", q:"A hotel lays off workers because a recession reduces travel demand. This is:", options:["Frictional unemployment","Structural unemployment","Cyclical unemployment","Natural unemployment only"], a:2, tag:"unemployment_types", type:"interpretation", objective:"LO29.3", feedback:"Layoffs from weak demand during a recession are cyclical unemployment." },
  { id:11161, sourceGame: "nationalLedger", difficulty:"medium", conceptCluster:"labor_market", primarySkill:"structural_unemployment", secondarySkills:["natural_rate"], repairSkill:"structural_unemployment", commonError:"Confusing permanent mismatch with short-run job search or weak demand.", q:"Which type of unemployment would still exist even when the economy is healthy?", options:["Frictional unemployment","Only cyclical unemployment","Only recession unemployment","No unemployment"], a:0, tag:"unemployment_types", type:"definition", objective:"LO29.3", feedback:"Frictional unemployment exists because workers and firms take time to match." },
  { id:11162, sourceGame: "nationalLedger", difficulty:"medium", conceptCluster:"labor_market", primarySkill:"frictional_unemployment", secondarySkills:["natural_rate"], repairSkill:"frictional_unemployment", commonError:"Confusing normal job search with skill mismatch or recession layoffs.", q:"Which statement correctly distinguishes structural from frictional unemployment?", options:["Structural unemployment reflects deeper skill or location mismatches, while frictional unemployment reflects normal job search","Frictional unemployment is always permanent, while structural unemployment lasts one day","Structural unemployment is caused only by inflation","They are the same thing"], a:0, tag:"unemployment_types", type:"interpretation", objective:"LO29.3", feedback:"Structural unemployment is about mismatch; frictional unemployment is about normal search." },
  { id:11163, sourceGame: "nationalLedger", difficulty:"medium", conceptCluster:"labor_market", primarySkill:"minimum_wage_surplus", secondarySkills:["unions_efficiency_wages"], repairSkill:"minimum_wage_surplus", commonError:"Forgetting that a binding wage floor creates a surplus when labor supplied exceeds labor demanded.", q:"A binding minimum wage above equilibrium creates unemployment because:", options:["Quantity of labor supplied exceeds quantity of labor demanded","Quantity of labor demanded exceeds quantity supplied","All workers leave the labor force","Firms hire more low-skill workers"], a:0, tag:"labor_market_policy", type:"interpretation", objective:"LO29.4", feedback:"A wage floor above equilibrium creates a surplus of labor." },
  { id:11164, sourceGame: "nationalLedger", difficulty:"medium", conceptCluster:"labor_market", primarySkill:"frictional_unemployment", secondarySkills:["natural_rate"], repairSkill:"frictional_unemployment", commonError:"Confusing normal job search with skill mismatch or recession layoffs.", q:"How can unemployment insurance improve worker outcomes even if it lengthens unemployment spells?", options:["It gives workers income support and time to find better job matches","It eliminates structural mismatch immediately","It forces all firms to hire","It lowers the labor force to zero"], a:0, tag:"labor_market_policy", type:"interpretation", objective:"LO29.4", feedback:"Unemployment insurance can support job seekers, but may also reduce urgency to accept a job quickly." },
  { id:11165, sourceGame: "nationalLedger", difficulty:"medium", conceptCluster:"labor_market", primarySkill:"unions_efficiency_wages", secondarySkills:["minimum_wage_surplus"], repairSkill:"unions_efficiency_wages", commonError:"Missing how above-equilibrium wages can create unemployment even when they have benefits.", q:"A union negotiates wages above the competitive equilibrium. What is the likely effect in that labor market?", options:["More workers want jobs than firms want to hire","Firms hire every worker who wants a job","Labor demand shifts to infinity","The unemployment rate is impossible to calculate"], a:0, tag:"labor_market_policy", type:"interpretation", objective:"LO29.4", feedback:"Above-equilibrium wages can create a surplus of labor in that market." },
  { id:11166, sourceGame: "nationalLedger", difficulty:"medium", conceptCluster:"labor_market", primarySkill:"unions_efficiency_wages", secondarySkills:["minimum_wage_surplus"], repairSkill:"unions_efficiency_wages", commonError:"Missing how above-equilibrium wages can create unemployment even when they have benefits.", q:"Efficiency wage theory says firms may pay above-equilibrium wages because higher wages can:", options:["Improve worker effort, reduce turnover, or attract better workers","Guarantee zero unemployment","Eliminate all inflation","Make GDP equal CPI"], a:0, tag:"labor_market_policy", type:"definition", objective:"LO29.4", feedback:"Efficiency wages can make workers more productive or reduce costly turnover." },
  { id:11167, sourceGame: "nationalLedger", difficulty:"medium", conceptCluster:"labor_market", primarySkill:"natural_rate", secondarySkills:["frictional_unemployment", "structural_unemployment"], repairSkill:"natural_rate", commonError:"Assuming healthy economies should have zero unemployment.", q:"Why does the natural rate of unemployment remain positive in the long run?", options:["Normal job search and structural mismatches remain even when cyclical unemployment is absent","Every worker is always unemployed","Inflation forces GDP to fall","The CPI excludes discouraged workers"], a:0, tag:"natural_unemployment", type:"interpretation", objective:"LO29.5", feedback:"The natural rate includes frictional and structural unemployment that persist in normal times." }
],
	
hard: [
  { id: 12000, sourceGame: "marketGate", q: "A student can earn $120 working Saturday or attend a free exam review session. If attending the session raises her expected exam score enough to be worth $180 to her, what is the net benefit of attending the review?", options: ["$60", "$120", "$180", "$300"], a: 0, tag: "opportunity_cost", type: "calculation", objective: "LO1.2", difficulty: "hard", conceptCluster: "core_principles", primarySkill: "opportunity_cost_net_benefit", secondarySkills: ["marginal_benefit_cost_decision"], repairSkill: "opportunity_cost_calculation", commonError: "ignores_forgone_wages", feedback: "The opportunity cost is the $120 in forgone wages. Net benefit is $180 - $120 = $60." },
  { id: 12001, sourceGame: "marketGate", q: "A firm already spent $5,000 designing a product. It can spend $1,200 more to launch it and earn $1,700 in revenue. What should it do if it is using marginal reasoning?", options: ["Launch, because the marginal benefit exceeds the marginal cost by $500", "Do not launch, because total spending is $6,200", "Do not launch, because the $5,000 sunk cost is too large", "Launch only if total revenue exceeds all past costs"], a: 0, tag: "marginal", type: "calculation", objective: "LO1.3", difficulty: "hard", conceptCluster: "core_principles", primarySkill: "sunk_cost_avoidance", secondarySkills: ["marginal_benefit_cost_decision"], repairSkill: "marginal_benefit_cost_decision", commonError: "includes_sunk_cost_in_marginal_decision", feedback: "The $5,000 is sunk. The launch decision compares the extra $1,200 cost with the extra $1,700 revenue." },
  { id: 12002, sourceGame: "marketGate", q: "A city gives bus riders a $2 subsidy per ride. Ridership rises, but crowding increases and wait times get longer. What is the best interpretation?", options: ["The subsidy changed incentives and produced an unintended consequence", "The subsidy eliminated scarcity", "The subsidy created a price floor", "The subsidy proves marginal analysis is irrelevant"], a: 0, tag: "incentives", type: "application", objective: "LO1.4", difficulty: "hard", conceptCluster: "core_principles", primarySkill: "incentives_unintended_consequences", secondarySkills: ["behavior_response_to_incentives"], repairSkill: "incentive_definition", commonError: "misses_unintended_consequence_of_incentives", feedback: "The subsidy encouraged more bus use, but the higher ridership created crowding and longer waits." },
  { id: 12003, sourceGame: "marketGate", q: "A policy gives every household $500 to increase spending. Some households spend it, but others save it. What does this show about incentives?", options: ["People may respond differently to the same incentive", "The incentive has no opportunity cost", "Markets cannot allocate resources", "The policy must create a binding price ceiling"], a: 0, tag: "incentives", type: "application", objective: "LO1.4", difficulty: "hard", conceptCluster: "core_principles", primarySkill: "heterogeneous_incentive_response", secondarySkills: ["behavior_response_to_incentives"], repairSkill: "incentive_definition", commonError: "assumes_same_incentive_same_response_for_everyone", feedback: "The same incentive can lead to different behavior depending on household needs, expectations, and constraints." },
  { id: 12004, sourceGame: "marketGate", q: "A country can produce either 80 units of food or 40 units of machinery. If resources are fully specialized at either end, what is the opportunity cost of one unit of machinery?", options: ["2 units of food", "0.5 units of food", "40 units of food", "80 units of food"], a: 0, tag: "ppf", type: "calculation", objective: "LO2.2", difficulty: "hard", conceptCluster: "economic_models", primarySkill: "ppf_opportunity_cost", secondarySkills: ["opportunity_cost_calculation"], repairSkill: "ppf_opportunity_cost", commonError: "divides_machinery_by_food_instead_of_food_by_machinery", feedback: "Producing 40 machinery requires giving up 80 food, so one machinery costs 2 food." },
  { id: 12005, sourceGame: "marketGate", q: "A PPF table shows that moving from Bundle B to Bundle C increases wheat from 40 to 55 but reduces corn from 90 to 60. What is the opportunity cost per additional unit of wheat?", options: ["2 units of corn", "15 units of corn", "30 units of corn", "0.5 units of corn"], a: 0, tag: "ppf", type: "calculation", objective: "LO2.2", difficulty: "hard", conceptCluster: "economic_models", primarySkill: "ppf_opportunity_cost_per_unit", secondarySkills: ["ppf_coordinate_reading"], repairSkill: "ppf_opportunity_cost", commonError: "uses_gain_in_wheat_as_cost", feedback: "Wheat rises by 15 and corn falls by 30. Opportunity cost per wheat is 30 / 15 = 2 corn." },
  { id: 12006, sourceGame: "marketGate", q: "A PPF is bowed outward. Moving from low production of Good X to high production of Good X requires giving up larger and larger amounts of Good Y. What principle does this show?", options: ["Increasing opportunity cost", "Constant opportunity cost", "A binding price floor", "A tax wedge"], a: 0, tag: "ppf", type: "interpretation", objective: "LO2.2", difficulty: "hard", conceptCluster: "economic_models", primarySkill: "increasing_opportunity_cost", secondarySkills: ["ppf_shape_interpretation"], repairSkill: "increasing_opportunity_cost", commonError: "misses_bowed_ppf_as_increasing_cost", feedback: "A bowed-out PPF shows increasing opportunity cost as resources are shifted toward one good." },
  { id: 12007, sourceGame: "marketGate", q: "An economy is producing inside its PPF because some labor and capital are idle. Which change moves it toward the frontier without shifting the frontier?", options: ["Putting unemployed resources back to work", "Discovering a new technology", "Increasing the capital stock", "Expanding the labor force permanently"], a: 0, tag: "ppf", type: "application", objective: "LO2.2", difficulty: "hard", conceptCluster: "economic_models", primarySkill: "movement_to_ppf_vs_ppf_shift", secondarySkills: ["ppf_efficiency_status"], repairSkill: "ppf_efficiency_status", commonError: "confuses_using_idle_resources_with_growth", feedback: "Using idle resources moves the economy toward the existing PPF. New technology or more resources shift the PPF outward." },
  { id: 12008, sourceGame: "marketGate", q: "A storm destroys factories and equipment. What happens to the economy's PPF?", options: ["It shifts inward", "It shifts outward", "The economy moves along the same PPF only", "The PPF becomes a demand curve"], a: 0, tag: "ppf", type: "application", objective: "LO2.2", difficulty: "hard", conceptCluster: "economic_models", primarySkill: "ppf_inward_shift", secondarySkills: ["ppf_growth"], repairSkill: "ppf_growth", commonError: "confuses_resource_loss_with_inefficiency_inside_ppf", feedback: "A loss of productive resources reduces what the economy can produce, shifting the PPF inward." },
  { id: 12009, sourceGame: "marketGate", q: "A new technology improves only the production of Good X, not Good Y. What happens to the PPF?", options: ["It rotates outward on the Good X axis", "It shifts inward equally for both goods", "It creates a shortage of Good Y", "It becomes a price ceiling"], a: 0, tag: "ppf", type: "application", objective: "LO2.2", difficulty: "hard", conceptCluster: "economic_models", primarySkill: "ppf_one_good_technology_change", secondarySkills: ["ppf_growth"], repairSkill: "ppf_growth", commonError: "thinks_all_growth_shifts_both_axes_equally", feedback: "Technology that helps only one good expands production possibilities for that good, rotating the PPF outward on that axis." },
  { id: 12010, sourceGame: "marketGate", q: "An economist says, 'Rent control reduces the quantity of rental housing supplied.' The statement is controversial, but testable. What kind of statement is it?", options: ["Positive", "Normative", "Equity-based only", "A value judgment"], a: 0, tag: "positive_normative", type: "trap", objective: "LO2.4", difficulty: "hard", conceptCluster: "economic_thinking", primarySkill: "positive_vs_normative", secondarySkills: ["policy_statement_classification"], repairSkill: "positive_vs_normative", commonError: "assumes_controversial_policy_claim_is_normative", feedback: "A statement can be controversial and still be positive if it makes a testable claim." },
  { id: 12011, sourceGame: "marketGate", q: "An economist says, 'The city should accept some efficiency loss to make housing more affordable.' What makes this normative?", options: ["It uses a value judgment about what policy should do", "It can be tested with rental data alone", "It describes only current prices", "It states the law of demand"], a: 0, tag: "positive_normative", type: "interpretation", objective: "LO2.4", difficulty: "hard", conceptCluster: "economic_thinking", primarySkill: "normative_policy_reasoning", secondarySkills: ["positive_vs_normative"], repairSkill: "positive_vs_normative", commonError: "misses_should_and_value_tradeoff", feedback: "The statement recommends what policy should do, so it is normative." },
  { id: 12012, sourceGame: "marketGate", q: "A simplified model assumes only households and firms, even though the real economy also includes government and foreign trade. Why might the model still be useful?", options: ["It isolates basic flows before adding complications", "It proves government and trade do not exist", "It makes all predictions exact", "It removes the need for economic reasoning"], a: 0, tag: "models", type: "application", objective: "LO2.1", difficulty: "hard", conceptCluster: "economic_thinking", primarySkill: "model_simplification_value", secondarySkills: ["circular_flow_components"], repairSkill: "model_purpose", commonError: "thinks_simplification_invalidates_model", feedback: "Models simplify reality to focus on important relationships before adding more detail." },
  { id: 12013, sourceGame: "marketGate", q: "A household buys groceries in the product market and sells labor in the factor market. In the circular-flow model, which flow goes from firms to households in factor markets?", options: ["Income such as wages, rent, and profit", "Goods and services", "Consumer spending", "Price ceilings"], a: 0, tag: "circular_flow", type: "application", objective: "LO2.2", difficulty: "hard", conceptCluster: "economic_models", primarySkill: "circular_flow_income_factor_market", secondarySkills: ["households_firms_roles"], repairSkill: "circular_flow_components", commonError: "reverses_money_and_resource_flows", feedback: "Households provide factors of production, and firms pay income for those factors." },
  { id: 12014, sourceGame: "marketGate", q: "A researcher studies how a new tax affects the market for soda. Another researcher studies how inflation affects all consumers. Which pairing is correct?", options: ["Soda tax is microeconomics; inflation is macroeconomics", "Soda tax is macroeconomics; inflation is microeconomics", "Both are only microeconomics", "Both are only macroeconomics"], a: 0, tag: "micro_macro", type: "application", objective: "LO2.3", difficulty: "hard", conceptCluster: "economic_thinking", primarySkill: "micro_vs_macro", secondarySkills: ["policy_topic_classification"], repairSkill: "micro_vs_macro", commonError: "classifies_any_tax_as_macro", feedback: "A specific product market is microeconomics. Economy-wide inflation is macroeconomics." },
  { id: 12015, sourceGame: "marketGate", q: "The price of headphones falls from $80 to $60, and consumers buy more headphones. What is the most precise statement?", options: ["Quantity demanded increases", "Demand increases", "Supply increases", "Demand shifts right"], a: 0, tag: "demand", type: "trap", objective: "LO4.2", difficulty: "hard", conceptCluster: "supply_demand", primarySkill: "movement_vs_demand_shift", secondarySkills: ["law_of_demand"], repairSkill: "movement_vs_demand_shift", commonError: "treats_own_price_change_as_demand_shift", feedback: "A change in the good's own price causes movement along demand, so quantity demanded changes." },
  { id: 12016, sourceGame: "marketGate", q: "A consumer's income rises, and meal delivery is a normal good. At every price, consumers now want more meal delivery. What happened?", options: ["Demand increased", "Quantity demanded increased because price fell", "Supply increased", "Demand decreased"], a: 0, tag: "demand", type: "application", objective: "LO4.2", difficulty: "hard", conceptCluster: "supply_demand", primarySkill: "demand_shifters_income", secondarySkills: ["normal_good_income"], repairSkill: "demand_shifters", commonError: "confuses_shift_with_movement_along_curve", feedback: "Income is a demand shifter. For a normal good, higher income increases demand." },
  { id: 12017, sourceGame: "marketGate", q: "The price of peanut butter rises. If jelly is a complement, what happens in the jelly market?", options: ["Demand for jelly decreases", "Demand for jelly increases", "Supply of jelly decreases", "Quantity demanded of jelly increases"], a: 0, tag: "demand", type: "application", objective: "LO4.2", difficulty: "hard", conceptCluster: "supply_demand", primarySkill: "demand_shifters_related_goods", secondarySkills: ["complement_good_definition"], repairSkill: "related_goods_demand", commonError: "gets_complement_effect_backwards", feedback: "Peanut butter and jelly are complements. If peanut butter gets more expensive, demand for jelly falls." },
  { id: 12018, sourceGame: "marketGate", q: "The price of bus rides rises. If subway rides are substitutes, what happens in the subway market?", options: ["Demand for subway rides increases", "Demand for subway rides decreases", "Supply of subway rides decreases", "Quantity supplied of bus rides increases"], a: 0, tag: "demand", type: "application", objective: "LO4.2", difficulty: "hard", conceptCluster: "supply_demand", primarySkill: "demand_shifters_related_goods", secondarySkills: ["substitute_good_definition"], repairSkill: "related_goods_demand", commonError: "gets_substitute_effect_backwards", feedback: "When the price of a substitute rises, demand for the other good increases." },
  { id: 12019, sourceGame: "marketGate", q: "Consumers expect the price of coffee to fall next month. What happens to current demand for coffee, other things equal?", options: ["Current demand decreases", "Current demand increases", "Current quantity supplied increases", "Supply shifts left"], a: 0, tag: "demand", type: "application", objective: "LO4.2", difficulty: "hard", conceptCluster: "supply_demand", primarySkill: "demand_shifters_expectations", secondarySkills: ["demand_shift_direction"], repairSkill: "demand_shifters", commonError: "gets_future_price_expectation_effect_backwards", feedback: "If buyers expect a lower future price, they delay purchases, reducing current demand." },
  { id: 12020, sourceGame: "marketGate", q: "The price of handmade tables rises, and sellers produce more tables. What happened?", options: ["Quantity supplied increased", "Supply increased", "Demand increased", "Supply shifted right"], a: 0, tag: "supply", type: "trap", objective: "LO4.3", difficulty: "hard", conceptCluster: "supply_demand", primarySkill: "movement_vs_supply_shift", secondarySkills: ["law_of_supply"], repairSkill: "movement_vs_supply_shift", commonError: "treats_own_price_change_as_supply_shift", feedback: "A change in the good's own price causes movement along supply, so quantity supplied changes." },
  { id: 12021, sourceGame: "marketGate", q: "A new production method cuts the cost of making solar panels. What happens in the solar panel market?", options: ["Supply increases, price falls, and quantity rises", "Supply decreases, price rises, and quantity falls", "Demand increases, price rises, and quantity rises", "Quantity demanded decreases because supply rose"], a: 0, tag: "supply", type: "application", objective: "LO4.3", difficulty: "hard", conceptCluster: "supply_demand", primarySkill: "supply_shifters_technology", secondarySkills: ["equilibrium_prediction"], repairSkill: "supply_shifters", commonError: "confuses_supply_increase_with_demand_increase", feedback: "Lower production costs increase supply, which lowers price and raises quantity." },
  { id: 12022, sourceGame: "marketGate", q: "A tax on producers raises the cost of selling bottled water. What is the likely market effect?", options: ["Supply decreases, price rises, and quantity falls", "Supply increases, price falls, and quantity rises", "Demand decreases, price falls, and quantity falls", "Demand increases because taxes fund public services"], a: 0, tag: "supply", type: "application", objective: "LO4.3", difficulty: "hard", conceptCluster: "supply_demand", primarySkill: "tax_as_supply_shifter", secondarySkills: ["supply_shift_equilibrium_prediction"], repairSkill: "supply_shifters", commonError: "does_not_treat_tax_as_cost_increase", feedback: "A tax on producers raises production cost, shifting supply left and reducing quantity." },
  { id: 12023, sourceGame: "marketGate", q: "Producers expect the future price of a product to rise sharply, so they hold inventory back today. What happens to current supply?", options: ["Current supply decreases", "Current supply increases", "Current demand decreases", "Quantity supplied increases because current price changed"], a: 0, tag: "supply", type: "application", objective: "LO4.3", difficulty: "hard", conceptCluster: "supply_demand", primarySkill: "supply_shifters_expectations", secondarySkills: ["supply_shift_direction"], repairSkill: "supply_shifters", commonError: "gets_producer_expectation_effect_backwards", feedback: "If sellers expect higher future prices, they may reduce current supply to sell later." },
  { id: 12024, sourceGame: "marketGate", q: "Demand increases while supply decreases. What can be predicted with certainty?", options: ["Equilibrium price rises", "Equilibrium quantity rises", "Equilibrium price falls", "Equilibrium quantity falls"], a: 0, tag: "equilibrium", type: "trap", objective: "LO4.4", difficulty: "hard", conceptCluster: "supply_demand", primarySkill: "double_shift_ambiguous_quantity", secondarySkills: ["market_change_prediction"], repairSkill: "equilibrium_prediction", commonError: "claims_quantity_change_is_certain_in_opposing_shifts", feedback: "Both shifts push price up, but quantity depends on which shift is larger." },
  { id: 12025, sourceGame: "marketGate", q: "Demand decreases while supply increases. What can be predicted with certainty?", options: ["Equilibrium price falls", "Equilibrium quantity rises", "Equilibrium price rises", "Equilibrium quantity falls"], a: 0, tag: "equilibrium", type: "trap", objective: "LO4.4", difficulty: "hard", conceptCluster: "supply_demand", primarySkill: "double_shift_ambiguous_quantity", secondarySkills: ["market_change_prediction"], repairSkill: "equilibrium_prediction", commonError: "claims_quantity_change_is_certain_in_opposing_shifts", feedback: "Both shifts push price down, but quantity is ambiguous." },
  { id: 12026, sourceGame: "marketGate", q: "Demand and supply both increase. What can be predicted with certainty?", options: ["Equilibrium quantity rises", "Equilibrium price rises", "Equilibrium price falls", "Equilibrium quantity falls"], a: 0, tag: "equilibrium", type: "trap", objective: "LO4.4", difficulty: "hard", conceptCluster: "supply_demand", primarySkill: "double_shift_ambiguous_price", secondarySkills: ["market_change_prediction"], repairSkill: "equilibrium_prediction", commonError: "claims_price_change_is_certain_when_both_curves_shift_right", feedback: "Both shifts increase quantity, but price depends on which shift is larger." },
  { id: 12027, sourceGame: "marketGate", q: "Demand and supply both decrease. What can be predicted with certainty?", options: ["Equilibrium quantity falls", "Equilibrium price rises", "Equilibrium price falls", "Equilibrium quantity rises"], a: 0, tag: "equilibrium", type: "trap", objective: "LO4.4", difficulty: "hard", conceptCluster: "supply_demand", primarySkill: "double_shift_ambiguous_price", secondarySkills: ["market_change_prediction"], repairSkill: "equilibrium_prediction", commonError: "claims_price_change_is_certain_when_both_curves_shift_left", feedback: "Both shifts reduce quantity, but price is ambiguous." },
  { id: 12028, sourceGame: "marketGate", q: "A market has Qd = 500 - 10P and Qs = 100 + 10P. What is the equilibrium price?", options: ["$20", "$30", "$40", "$50"], a: 0, tag: "equilibrium", type: "calculation", objective: "LO4.4", difficulty: "hard", conceptCluster: "supply_demand", primarySkill: "algebraic_equilibrium_price", secondarySkills: ["equilibrium_calculation"], repairSkill: "equilibrium_definition", commonError: "does_not_set_qd_equal_to_qs", feedback: "Set Qd = Qs: 500 - 10P = 100 + 10P. Then 400 = 20P, so P = 20." },
  { id: 12029, sourceGame: "marketGate", q: "A market has Qd = 500 - 10P and Qs = 100 + 10P. At the equilibrium price, what is equilibrium quantity?", options: ["300", "200", "400", "500"], a: 0, tag: "equilibrium", type: "calculation", objective: "LO4.4", difficulty: "hard", conceptCluster: "supply_demand", primarySkill: "algebraic_equilibrium_quantity", secondarySkills: ["algebraic_equilibrium_price"], repairSkill: "equilibrium_definition", commonError: "solves_price_but_fails_to_substitute_back", feedback: "From the previous setup, P = 20. Substitute into either equation: Qd = 500 - 200 = 300." },
  { id: 12030, sourceGame: "marketGate", q: "At a price of $12, quantity demanded is 180 and quantity supplied is 120. What exists, and what should happen to price in an unregulated market?", options: ["A shortage; price should rise", "A surplus; price should fall", "A shortage; price should fall", "A surplus; price should rise"], a: 0, tag: "surplus_shortage", type: "calculation", objective: "LO4.4", difficulty: "hard", conceptCluster: "supply_demand", primarySkill: "shortage_price_pressure", secondarySkills: ["surplus_shortage_calculation"], repairSkill: "surplus_shortage_identification", commonError: "reverses_shortage_and_surplus_pressure", feedback: "Qd exceeds Qs by 60, so there is a shortage. Shortages push price upward." },
  { id: 12031, sourceGame: "marketGate", q: "At a price of $25, quantity supplied is 240 and quantity demanded is 160. What exists, and what should happen to price in an unregulated market?", options: ["A surplus; price should fall", "A shortage; price should rise", "A surplus; price should rise", "A shortage; price should fall"], a: 0, tag: "surplus_shortage", type: "calculation", objective: "LO4.4", difficulty: "hard", conceptCluster: "supply_demand", primarySkill: "surplus_price_pressure", secondarySkills: ["surplus_shortage_calculation"], repairSkill: "surplus_shortage_identification", commonError: "reverses_surplus_and_shortage_pressure", feedback: "Qs exceeds Qd by 80, so there is a surplus. Surpluses push price downward." },
  { id: 12032, sourceGame: "marketGate", q: "A drought destroys wheat crops. At the same time, a health trend increases demand for wheat bread. What happens to price and quantity in the wheat market?", options: ["Price rises; quantity is ambiguous", "Price falls; quantity rises", "Price rises; quantity definitely rises", "Price falls; quantity is ambiguous"], a: 0, tag: "equilibrium", type: "application", objective: "LO4.4", difficulty: "hard", conceptCluster: "supply_demand", primarySkill: "double_shift_ambiguous_quantity", secondarySkills: ["supply_decrease_market_effect", "demand_increase_market_effect"], repairSkill: "equilibrium_prediction", commonError: "assumes_quantity_moves_with_demand_only", feedback: "Demand increases and supply decreases. Both raise price, but quantity depends on which shift dominates." },
  { id: 12033, sourceGame: "marketGate", q: "A new technology lowers production costs while consumer interest in the good falls. What happens to equilibrium price and quantity?", options: ["Price falls; quantity is ambiguous", "Price rises; quantity falls", "Price falls; quantity definitely rises", "Price rises; quantity is ambiguous"], a: 0, tag: "equilibrium", type: "application", objective: "LO4.4", difficulty: "hard", conceptCluster: "supply_demand", primarySkill: "double_shift_ambiguous_quantity", secondarySkills: ["supply_increase_market_effect", "demand_decrease_market_effect"], repairSkill: "equilibrium_prediction", commonError: "assumes_quantity_moves_with_supply_only", feedback: "Supply increases and demand decreases. Both lower price, but quantity is ambiguous." },
  { id: 12034, sourceGame: "marketGate", q: "A binding rent ceiling is imposed below equilibrium. Quantity demanded is 1,200 apartments and quantity supplied is 850. What is the shortage?", options: ["350 apartments", "850 apartments", "1,200 apartments", "2,050 apartments"], a: 0, tag: "price_ceiling", type: "calculation", objective: "LO6.1", difficulty: "hard", conceptCluster: "government_policy", primarySkill: "ceiling_shortage_calculation", secondarySkills: ["binding_price_ceiling"], repairSkill: "ceiling_shortage_calculation", commonError: "adds_qd_and_qs_instead_of_subtracting", feedback: "Shortage is Qd - Qs: 1,200 - 850 = 350 apartments." },
  { id: 12035, sourceGame: "marketGate", q: "A price ceiling is set at $18 when equilibrium price is $25. At $18, Qd = 900 and Qs = 600. Which statement is correct?", options: ["The ceiling is binding and creates a shortage of 300", "The ceiling is nonbinding and creates no shortage", "The ceiling is binding and creates a surplus of 300", "The ceiling is a price floor because it is below equilibrium"], a: 0, tag: "price_ceiling", type: "calculation", objective: "LO6.1", difficulty: "hard", conceptCluster: "government_policy", primarySkill: "binding_ceiling_shortage_calculation", secondarySkills: ["ceiling_shortage_calculation"], repairSkill: "binding_price_ceiling", commonError: "gets_ceiling_binding_and_shortage_backwards", feedback: "A ceiling below equilibrium is binding. Shortage is 900 - 600 = 300." },
  { id: 12036, sourceGame: "marketGate", q: "A price ceiling is set above equilibrium. Why does it usually have no effect?", options: ["Because the market price can still settle below the legal maximum", "Because all price ceilings create shortages", "Because sellers are forced to charge the maximum", "Because quantity supplied must equal zero"], a: 0, tag: "price_ceiling", type: "interpretation", objective: "LO6.1", difficulty: "hard", conceptCluster: "government_policy", primarySkill: "nonbinding_price_ceiling", secondarySkills: ["binding_price_ceiling"], repairSkill: "binding_price_ceiling", commonError: "thinks_legal_maximum_must_be_actual_price", feedback: "A nonbinding ceiling is above equilibrium, so the market can still reach equilibrium below the legal maximum." },
  { id: 12037, sourceGame: "marketGate", q: "A rent ceiling lowers the money rent but causes long search times, side payments, and poorer maintenance. What is the best interpretation?", options: ["The legal price is lower, but the full cost to renters may include nonmoney costs", "The ceiling eliminated scarcity", "The ceiling created a surplus of apartments", "The price ceiling shifted demand left"], a: 0, tag: "price_ceiling", type: "application", objective: "LO6.1", difficulty: "hard", conceptCluster: "government_policy", primarySkill: "ceiling_unintended_consequences", secondarySkills: ["nonmoney_rationing_costs"], repairSkill: "binding_price_ceiling", commonError: "ignores_nonmoney_costs_under_shortage", feedback: "A binding ceiling can lower the legal price but create search costs, rationing, and quality decline." },
  { id: 12038, sourceGame: "marketGate", q: "A binding price floor is imposed above equilibrium. Quantity supplied is 700 and quantity demanded is 460. What is the surplus?", options: ["240 units", "460 units", "700 units", "1,160 units"], a: 0, tag: "price_floor", type: "calculation", objective: "LO6.2", difficulty: "hard", conceptCluster: "government_policy", primarySkill: "floor_surplus_calculation", secondarySkills: ["binding_price_floor"], repairSkill: "floor_surplus_calculation", commonError: "adds_qs_and_qd_instead_of_subtracting", feedback: "Surplus is Qs - Qd: 700 - 460 = 240 units." },
  { id: 12039, sourceGame: "marketGate", q: "A minimum wage is set at $16 when equilibrium wage is $12. At $16, labor supplied is 95,000 and labor demanded is 72,000. What is the labor surplus?", options: ["23,000 workers", "72,000 workers", "95,000 workers", "167,000 workers"], a: 0, tag: "price_floor", type: "calculation", objective: "LO6.2", difficulty: "hard", conceptCluster: "government_policy", primarySkill: "minimum_wage_surplus_calculation", secondarySkills: ["floor_surplus_calculation"], repairSkill: "floor_surplus_calculation", commonError: "adds_labor_supplied_and_labor_demanded", feedback: "The labor surplus is labor supplied minus labor demanded: 95,000 - 72,000 = 23,000." },
  { id: 12040, sourceGame: "marketGate", q: "A price floor is set below equilibrium. Why does it usually have no effect?", options: ["Because the market price can still settle above the legal minimum", "Because all price floors create surpluses", "Because buyers must pay the legal minimum even if equilibrium is higher", "Because quantity demanded must equal zero"], a: 0, tag: "price_floor", type: "interpretation", objective: "LO6.2", difficulty: "hard", conceptCluster: "government_policy", primarySkill: "nonbinding_price_floor", secondarySkills: ["binding_price_floor"], repairSkill: "binding_price_floor", commonError: "thinks_legal_minimum_must_be_actual_price", feedback: "A nonbinding floor is below equilibrium, so the market can still reach equilibrium above the legal minimum." },
  { id: 12041, sourceGame: "marketGate", q: "A binding agricultural price floor causes farmers to produce more than buyers want to purchase. What problem follows?", options: ["Unsold surplus output", "A shortage of the crop", "A lower legal price", "A rightward demand shift"], a: 0, tag: "price_floor", type: "application", objective: "LO6.2", difficulty: "hard", conceptCluster: "government_policy", primarySkill: "floor_surplus_effect", secondarySkills: ["binding_price_floor"], repairSkill: "binding_price_floor", commonError: "confuses_floor_surplus_with_ceiling_shortage", feedback: "A binding price floor creates a surplus because quantity supplied exceeds quantity demanded." },
  { id: 12042, sourceGame: "marketGate", q: "A $5 tax causes buyers to pay $3 more than before and sellers to receive $2 less than before. How is the burden split?", options: ["Buyers bear $3 and sellers bear $2", "Buyers bear $2 and sellers bear $3", "Sellers bear all $5", "Buyers bear all $5"], a: 0, tag: "tax_incidence", type: "calculation", objective: "LO6.5", difficulty: "hard", conceptCluster: "government_policy", primarySkill: "buyer_seller_tax_burden", secondarySkills: ["tax_burden_calculation"], repairSkill: "tax_incidence_less_elastic_side", commonError: "confuses_tax_size_with_single_side_burden", feedback: "The buyer burden is the price increase paid by buyers. The seller burden is the price decrease received by sellers." },
  { id: 12043, sourceGame: "marketGate", q: "Before a tax, buyers pay $30 and sellers receive $30. After a tax, buyers pay $34 and sellers receive $27. What is the tax per unit?", options: ["$7", "$4", "$3", "$61"], a: 0, tag: "taxes", type: "calculation", objective: "LO6.3", difficulty: "hard", conceptCluster: "government_policy", primarySkill: "tax_wedge_calculation", secondarySkills: ["price_paid_vs_received"], repairSkill: "tax_wedge_incidence", commonError: "uses_only_buyer_price_change", feedback: "The tax wedge is the buyer price minus the seller price: $34 - $27 = $7." },
  { id: 12044, sourceGame: "marketGate", q: "Before a tax, buyers pay $30 and sellers receive $30. After a tax, buyers pay $34 and sellers receive $27. Who bears more of the burden?", options: ["Buyers", "Sellers", "They split it equally", "No one bears any burden"], a: 0, tag: "tax_incidence", type: "calculation", objective: "LO6.5", difficulty: "hard", conceptCluster: "government_policy", primarySkill: "tax_burden_calculation", secondarySkills: ["tax_wedge_calculation"], repairSkill: "tax_incidence_less_elastic_side", commonError: "looks_only_at_total_tax_not_price_changes", feedback: "Buyers pay $4 more, while sellers receive $3 less. Buyers bear more of the burden." },
  { id: 12045, sourceGame: "marketGate", q: "A tax reduces quantity sold from 500 to 420 units. If the tax is $8 per unit, how much tax revenue is collected?", options: ["$3,360", "$4,000", "$640", "$920"], a: 0, tag: "taxes", type: "calculation", objective: "LO6.3", difficulty: "hard", conceptCluster: "government_policy", primarySkill: "tax_revenue_calculation", secondarySkills: ["tax_quantity_effect"], repairSkill: "tax_wedge_incidence", commonError: "uses_original_quantity_instead_of_after_tax_quantity", feedback: "Tax revenue uses the quantity sold after the tax: $8 × 420 = $3,360." },
  { id: 12046, sourceGame: "marketGate", q: "A $10 tax is imposed. Before the tax, price is $50. After the tax, buyers pay $56 and sellers receive $46. What happened to quantity sold?", options: ["It likely decreased because the tax created a wedge", "It must have increased because buyers pay more", "It stayed exactly the same because the tax is split", "It became zero because all taxes eliminate trade"], a: 0, tag: "taxes", type: "interpretation", objective: "LO6.3", difficulty: "hard", conceptCluster: "government_policy", primarySkill: "tax_quantity_effect", secondarySkills: ["tax_wedge_identification"], repairSkill: "tax_wedge_incidence", commonError: "misses_tax_reduces_trades", feedback: "A tax creates a wedge between buyer and seller prices and usually reduces the quantity traded." },
  { id: 12047, sourceGame: "marketGate", q: "A tax is legally imposed on sellers, but buyers end up paying most of the burden. What does this show?", options: ["Economic incidence does not depend only on legal assignment", "Sellers never pay taxes", "Buyers legally mailed the tax payment", "The tax must be a price ceiling"], a: 0, tag: "tax_incidence", type: "application", objective: "LO6.4", difficulty: "hard", conceptCluster: "government_policy", primarySkill: "legal_vs_economic_tax_incidence", secondarySkills: ["buyer_seller_tax_equivalence"], repairSkill: "tax_equivalence", commonError: "thinks_legal_assignment_determines_full_burden", feedback: "Who legally pays the tax does not determine who bears the economic burden." },
  { id: 12048, sourceGame: "marketGate", q: "If demand is less elastic than supply, why do buyers bear more of a tax?", options: ["Buyers are less able to reduce quantity demanded when price rises", "Buyers legally pay all taxes", "Sellers are less able to adjust quantity supplied", "Demand shifts right after the tax"], a: 0, tag: "tax_incidence", type: "interpretation", objective: "LO6.5", difficulty: "hard", conceptCluster: "government_policy", primarySkill: "tax_incidence_less_elastic_side", secondarySkills: ["elasticity_and_tax_burden"], repairSkill: "tax_incidence_less_elastic_side", commonError: "misses_why_less_elastic_side_bears_more", feedback: "The less elastic side adjusts less, so it bears more of the tax burden." },
  { id: 12049, sourceGame: "marketGate", q: "If supply is perfectly inelastic and demand is elastic, who bears the tax burden?", options: ["Sellers bear most or all of it", "Buyers bear all of it", "No one bears it", "The government bears it because supply is vertical"], a: 0, tag: "tax_incidence", type: "application", objective: "LO6.5", difficulty: "hard", conceptCluster: "government_policy", primarySkill: "extreme_tax_incidence_case", secondarySkills: ["tax_incidence_less_elastic_side"], repairSkill: "tax_incidence_less_elastic_side", commonError: "thinks_buyers_always_bear_tax_when_price_rises", feedback: "The less elastic side bears more of the burden. Perfectly inelastic supply means sellers cannot adjust quantity, so they bear most or all of the burden." },
  { id: 12050, sourceGame: "marketGate", q: "Refer to the PPF graph. Moving from A to B increases Good X by 8 units and reduces Good Y by 5 units. What is the opportunity cost per additional unit of Good X?", options: ["0.625 units of Good Y", "1.6 units of Good Y", "5 units of Good Y", "8 units of Good Y"], a: 0, tag: "ppf", type: "graph_calculation", objective: "LO2.2", difficulty: "hard", conceptCluster: "economic_models", primarySkill: "ppf_opportunity_cost_per_unit", secondarySkills: ["ppf_coordinate_reading"], repairSkill: "ppf_opportunity_cost", commonError: "divides_gain_by_loss_instead_of_loss_by_gain", image: "ppf.png", feedback: "Moving from A to B gains 8 units of Good X and gives up 5 units of Good Y, so opportunity cost per Good X is 5 / 8 = 0.625." },
  { id: 12051, sourceGame: "marketGate", q: "Refer to the PPF graph. Moving from B to C increases Good X by 7 units and reduces Good Y by 10 units. What is the opportunity cost per additional unit of Good X?", options: ["About 1.43 units of Good Y", "0.7 units of Good Y", "7 units of Good Y", "10 units of Good Y"], a: 0, tag: "ppf", type: "graph_calculation", objective: "LO2.2", difficulty: "hard", conceptCluster: "economic_models", primarySkill: "ppf_opportunity_cost_per_unit", secondarySkills: ["ppf_coordinate_reading"], repairSkill: "ppf_opportunity_cost", commonError: "divides_x_gain_by_y_loss", image: "ppf.png", feedback: "Moving from B to C gains 7 units of Good X and gives up 10 units of Good Y, so 10 / 7 is about 1.43." },
  { id: 12052, sourceGame: "marketGate", q: "Refer to the PPF graph. Moving from D to E increases Good X by 4 units and reduces Good Y by 20 units. What is the opportunity cost per additional unit of Good X?", options: ["5 units of Good Y", "4 units of Good Y", "0.2 units of Good Y", "20 units of Good Y"], a: 0, tag: "ppf", type: "graph_calculation", objective: "LO2.2", difficulty: "hard", conceptCluster: "economic_models", primarySkill: "ppf_opportunity_cost_per_unit", secondarySkills: ["increasing_opportunity_cost"], repairSkill: "ppf_opportunity_cost", commonError: "uses_gain_in_x_as_cost", image: "ppf.png", feedback: "Moving from D to E gains 4 units of Good X and gives up 20 units of Good Y, so 20 / 4 = 5." },
  { id: 12053, sourceGame: "marketGate", q: "Refer to the PPF graph. Which move has the highest opportunity cost per additional unit of Good X?", options: ["D to E", "A to B", "B to C", "C to D"], a: 0, tag: "ppf", type: "graph_interpretation", objective: "LO2.2", difficulty: "hard", conceptCluster: "economic_models", primarySkill: "increasing_opportunity_cost", secondarySkills: ["ppf_opportunity_cost_per_unit"], repairSkill: "increasing_opportunity_cost", commonError: "misses_rising_cost_along_bowed_ppf", image: "ppf.png", feedback: "The move from D to E gives up 20 units of Good Y to gain only 4 units of Good X, the highest cost per unit among the listed moves." },
  { id: 12054, sourceGame: "marketGate", q: "Refer to the PPF graph. What pattern is shown by the opportunity cost of Good X as the economy moves from A toward E?", options: ["Opportunity cost rises", "Opportunity cost falls", "Opportunity cost stays constant", "Opportunity cost disappears"], a: 0, tag: "ppf", type: "graph_interpretation", objective: "LO2.2", difficulty: "hard", conceptCluster: "economic_models", primarySkill: "increasing_opportunity_cost", secondarySkills: ["ppf_shape_interpretation"], repairSkill: "increasing_opportunity_cost", commonError: "thinks_all_ppfs_have_constant_opportunity_cost", image: "ppf.png", feedback: "The PPF is bowed outward, so producing more Good X requires giving up larger amounts of Good Y." },
  { id: 12055, sourceGame: "marketGate", q: "Refer to the PPF graph. Moving from E to D means gaining 20 units of Good Y while giving up 4 units of Good X. What is the opportunity cost per additional unit of Good Y?", options: ["0.2 units of Good X", "5 units of Good X", "4 units of Good X", "20 units of Good X"], a: 0, tag: "ppf", type: "graph_calculation", objective: "LO2.2", difficulty: "hard", conceptCluster: "economic_models", primarySkill: "reverse_ppf_opportunity_cost", secondarySkills: ["ppf_coordinate_reading"], repairSkill: "ppf_opportunity_cost", commonError: "does_not_reverse_cost_when_moving_backward", image: "ppf.png", feedback: "Moving from E to D gives up 4 units of Good X to gain 20 units of Good Y, so 4 / 20 = 0.2 units of Good X per Good Y." },
  { id: 12056, sourceGame: "marketGate", q: "Refer to the PPF graph. If the economy is at F and moves to B, what happens?", options: ["It produces the same amount of Good X but more Good Y", "It produces more Good X and less Good Y", "It moves outside the PPF", "It becomes unattainable"], a: 0, tag: "ppf", type: "graph_interpretation", objective: "LO2.2", difficulty: "hard", conceptCluster: "economic_models", primarySkill: "ppf_coordinate_comparison", secondarySkills: ["ppf_efficiency_status"], repairSkill: "ppf_efficiency_status", commonError: "misses_vertical_comparison_same_x_value", image: "ppf.png", feedback: "F and B both have about 8 units of Good X, but B has more Good Y and lies on the PPF." },
  { id: 12057, sourceGame: "marketGate", q: "Refer to the PPF graph. If the economy moves from F to C, what best describes the change?", options: ["It gains both Good X and Good Y by using resources more efficiently", "It gives up Good Y to gain Good X", "It moves from efficient to inefficient production", "It moves beyond current resources"], a: 0, tag: "ppf", type: "graph_interpretation", objective: "LO2.2", difficulty: "hard", conceptCluster: "economic_models", primarySkill: "movement_inside_to_frontier", secondarySkills: ["ppf_efficiency_status"], repairSkill: "ppf_efficiency_status", commonError: "treats_inside_to_frontier_as_standard_tradeoff", image: "ppf.png", feedback: "F is inside the PPF and C is on the PPF. Moving from F to C increases both goods by using idle or misallocated resources." },
  { id: 12058, sourceGame: "marketGate", q: "Refer to the supply and demand shift graph. If the market moves from D1/S1 to D2/S2, what happens to equilibrium price and quantity?", options: ["Price stays the same and quantity rises", "Price rises and quantity stays the same", "Price falls and quantity rises", "Price rises and quantity falls"], a: 0, tag: "equilibrium", type: "graph_interpretation", objective: "LO4.4", difficulty: "hard", conceptCluster: "supply_demand", primarySkill: "simultaneous_shift_comparison", secondarySkills: ["double_shift_ambiguous_price"], repairSkill: "equilibrium_prediction", commonError: "assumes_both_rightward_shifts_must_raise_price", image: "supplydemand1.png", feedback: "D1/S1 gives P2 and Q1. D2/S2 gives P2 and Q3. Price stays at P2 while quantity rises." },
  { id: 12059, sourceGame: "marketGate", q: "Refer to the supply and demand shift graph. If the market moves from D1/S2 to D2/S1, what happens to equilibrium price and quantity?", options: ["Price rises and quantity stays the same", "Price stays the same and quantity rises", "Price falls and quantity stays the same", "Price rises and quantity falls"], a: 0, tag: "equilibrium", type: "graph_interpretation", objective: "LO4.4", difficulty: "hard", conceptCluster: "supply_demand", primarySkill: "simultaneous_shift_comparison", secondarySkills: ["demand_increase_supply_decrease"], repairSkill: "equilibrium_prediction", commonError: "misses_quantity_can_remain_same_with_opposing_shifts", image: "supplydemand1.png", feedback: "D1/S2 gives P1 and Q2. D2/S1 gives P3 and Q2. Price rises while quantity stays the same." },
  { id: 12060, sourceGame: "marketGate", q: "Refer to the supply and demand shift graph. Starting from D2/S1, demand decreases to D1 while supply increases to S2. What happens?", options: ["Price falls and quantity stays the same", "Price rises and quantity stays the same", "Price stays the same and quantity rises", "Price falls and quantity falls"], a: 0, tag: "equilibrium", type: "graph_interpretation", objective: "LO4.4", difficulty: "hard", conceptCluster: "supply_demand", primarySkill: "simultaneous_shift_sequence", secondarySkills: ["demand_decrease_supply_increase"], repairSkill: "equilibrium_prediction", commonError: "cannot_track_two_curve_changes", image: "supplydemand1.png", feedback: "D2/S1 gives P3 and Q2. D1/S2 gives P1 and Q2. Price falls while quantity remains Q2." },
  { id: 12061, sourceGame: "marketGate", q: "Refer to the supply and demand shift graph. Which curve change moves equilibrium from P2, Q1 to P3, Q2?", options: ["Demand increases from D1 to D2 while supply remains S1", "Supply increases from S1 to S2 while demand remains D1", "Demand decreases from D2 to D1 while supply remains S2", "Supply decreases from S2 to S1 while demand remains D1"], a: 0, tag: "demand", type: "graph_interpretation", objective: "LO4.2", difficulty: "hard", conceptCluster: "supply_demand", primarySkill: "demand_shift_direction", secondarySkills: ["equilibrium_comparison"], repairSkill: "demand_shifters", commonError: "mistakes_demand_shift_for_supply_shift", image: "supplydemand1.png", feedback: "P2, Q1 is D1/S1. P3, Q2 is D2/S1. That is a demand increase with supply unchanged." },
  { id: 12062, sourceGame: "marketGate", q: "Refer to the supply and demand shift graph. Which curve change moves equilibrium from P2, Q3 to P1, Q2?", options: ["Demand decreases from D2 to D1 while supply remains S2", "Supply decreases from S2 to S1 while demand remains D2", "Demand increases from D1 to D2 while supply remains S2", "Supply increases from S1 to S2 while demand remains D1"], a: 0, tag: "demand", type: "graph_interpretation", objective: "LO4.2", difficulty: "hard", conceptCluster: "supply_demand", primarySkill: "demand_shift_direction", secondarySkills: ["equilibrium_comparison"], repairSkill: "demand_shifters", commonError: "gets_leftward_demand_shift_backwards", image: "supplydemand1.png", feedback: "P2, Q3 is D2/S2. P1, Q2 is D1/S2. That is a decrease in demand with supply unchanged." },
  { id: 12063, sourceGame: "marketGate", q: "Refer to the supply and demand shift graph. Which movement shows an increase in supply with demand fixed at D2?", options: ["From P3, Q2 to P2, Q3", "From P2, Q1 to P1, Q2", "From P1, Q2 to P2, Q3", "From P2, Q3 to P3, Q2"], a: 0, tag: "supply", type: "graph_interpretation", objective: "LO4.3", difficulty: "hard", conceptCluster: "supply_demand", primarySkill: "supply_shift_direction", secondarySkills: ["equilibrium_comparison"], repairSkill: "supply_shifters", commonError: "uses_d1_equilibrium_when_question_says_d2", image: "supplydemand1.png", feedback: "With demand fixed at D2, moving from S1 to S2 changes equilibrium from P3, Q2 to P2, Q3." },
  { id: 12064, sourceGame: "marketGate", q: "Refer to the supply and demand shift graph. If demand and supply both increase, what does this graph show is possible?", options: ["Quantity rises while price stays the same", "Price must rise and quantity must fall", "Price must fall and quantity must fall", "Quantity must stay the same"], a: 0, tag: "equilibrium", type: "graph_interpretation", objective: "LO4.4", difficulty: "hard", conceptCluster: "supply_demand", primarySkill: "double_shift_ambiguous_price", secondarySkills: ["simultaneous_shift_comparison"], repairSkill: "equilibrium_prediction", commonError: "thinks_double_shift_has_one_forced_price_result", image: "supplydemand1.png", feedback: "The graph shows D1/S1 to D2/S2. Both demand and supply increase, quantity rises, and price remains unchanged." },
  { id: 12065, sourceGame: "marketGate", q: "Refer to the supply and demand shift graph. If demand increases and supply decreases, what does this graph show is possible?", options: ["Price rises while quantity stays the same", "Price falls while quantity rises", "Price stays the same while quantity rises", "Price falls while quantity stays the same"], a: 0, tag: "equilibrium", type: "graph_interpretation", objective: "LO4.4", difficulty: "hard", conceptCluster: "supply_demand", primarySkill: "double_shift_ambiguous_quantity", secondarySkills: ["simultaneous_shift_comparison"], repairSkill: "equilibrium_prediction", commonError: "thinks_quantity_must_change_when_both_curves_shift", image: "supplydemand1.png", feedback: "The graph shows D1/S2 to D2/S1. Demand rises and supply falls, causing price to rise while quantity stays at Q2." },
  { id: 12066, sourceGame: "marketGate", q: "Refer to the price ceiling and price floor graph. If a price ceiling is set at $40, what happens?", options: ["It is nonbinding because it is above equilibrium", "It creates a shortage of 100 units", "It creates a surplus of 100 units", "It forces price down to $20"], a: 0, tag: "price_ceiling", type: "graph_interpretation", objective: "LO6.1", difficulty: "hard", conceptCluster: "government_policy", primarySkill: "nonbinding_price_ceiling", secondarySkills: ["equilibrium_identification"], repairSkill: "binding_price_ceiling", commonError: "thinks_all_price_ceilings_bind", image: "ceilingfloor.png", feedback: "Equilibrium is $30. A ceiling at $40 is above equilibrium, so the market can still settle at $30." },
  { id: 12067, sourceGame: "marketGate", q: "Refer to the price ceiling and price floor graph. If a price floor is set at $20, what happens?", options: ["It is nonbinding because it is below equilibrium", "It creates a shortage of 100 units", "It creates a surplus of 100 units", "It forces price up to $40"], a: 0, tag: "price_floor", type: "graph_interpretation", objective: "LO6.2", difficulty: "hard", conceptCluster: "government_policy", primarySkill: "nonbinding_price_floor", secondarySkills: ["equilibrium_identification"], repairSkill: "binding_price_floor", commonError: "thinks_all_price_floors_bind", image: "ceilingfloor.png", feedback: "Equilibrium is $30. A floor at $20 is below equilibrium, so it does not prevent the market from reaching $30." },
  { id: 12068, sourceGame: "marketGate", q: "Refer to the price ceiling and price floor graph. If a price ceiling is set at $10, what shortage results?", options: ["200 units", "100 units", "300 units", "400 units"], a: 0, tag: "price_ceiling", type: "graph_calculation", objective: "LO6.1", difficulty: "hard", conceptCluster: "government_policy", primarySkill: "ceiling_shortage_calculation", secondarySkills: ["graph_reading"], repairSkill: "ceiling_shortage_calculation", commonError: "adds_qd_and_qs_instead_of_subtracting", image: "ceilingfloor.png", feedback: "At $10, quantity demanded is 300 and quantity supplied is 100. The shortage is 300 - 100 = 200 units." },
  { id: 12069, sourceGame: "marketGate", q: "Refer to the price ceiling and price floor graph. If a price floor is set at $50, what surplus results?", options: ["200 units", "100 units", "300 units", "400 units"], a: 0, tag: "price_floor", type: "graph_calculation", objective: "LO6.2", difficulty: "hard", conceptCluster: "government_policy", primarySkill: "floor_surplus_calculation", secondarySkills: ["graph_reading"], repairSkill: "floor_surplus_calculation", commonError: "adds_qs_and_qd_instead_of_subtracting", image: "ceilingfloor.png", feedback: "At $50, quantity supplied is 300 and quantity demanded is 100. The surplus is 300 - 100 = 200 units." },
  { id: 12070, sourceGame: "marketGate", q: "Refer to the price ceiling and price floor graph. A policy holds the price at $20. What is the full market result?", options: ["A binding price ceiling with a shortage of 100 units", "A nonbinding price ceiling with no effect", "A binding price floor with a surplus of 100 units", "A nonbinding price floor with no effect"], a: 0, tag: "price_ceiling", type: "graph_interpretation", objective: "LO6.1", difficulty: "hard", conceptCluster: "government_policy", primarySkill: "binding_ceiling_shortage_calculation", secondarySkills: ["ceiling_shortage_calculation"], repairSkill: "binding_price_ceiling", commonError: "cannot_connect_binding_status_to_shortage_size", image: "ceilingfloor.png", feedback: "$20 is below the $30 equilibrium, so it is a binding ceiling. At $20, Qd is 250 and Qs is 150, so the shortage is 100." },
  { id: 12071, sourceGame: "marketGate", q: "Refer to the price ceiling and price floor graph. A policy holds the price at $40. What is the full market result if the policy is a legal minimum?", options: ["A binding price floor with a surplus of 100 units", "A nonbinding price floor with no effect", "A binding price ceiling with a shortage of 100 units", "A nonbinding price ceiling with no effect"], a: 0, tag: "price_floor", type: "graph_interpretation", objective: "LO6.2", difficulty: "hard", conceptCluster: "government_policy", primarySkill: "binding_floor_surplus_calculation", secondarySkills: ["floor_surplus_calculation"], repairSkill: "binding_price_floor", commonError: "confuses_floor_with_ceiling_at_same_price", image: "ceilingfloor.png", feedback: "$40 is above the $30 equilibrium, so a legal minimum at $40 is a binding floor. Qs is 250 and Qd is 150, so the surplus is 100." },
  { id: 12072, sourceGame: "marketGate", q: "Refer to the price ceiling and price floor graph. At $50, what are quantity demanded and quantity supplied?", options: ["Quantity demanded is 100 and quantity supplied is 300", "Quantity demanded is 300 and quantity supplied is 100", "Quantity demanded is 150 and quantity supplied is 250", "Quantity demanded is 250 and quantity supplied is 150"], a: 0, tag: "price_floor", type: "graph", objective: "LO6.2", difficulty: "hard", conceptCluster: "government_policy", primarySkill: "floor_quantity_reading", secondarySkills: ["graph_reading"], repairSkill: "floor_surplus_calculation", commonError: "reverses_demand_and_supply_at_high_price", image: "ceilingfloor.png", feedback: "At a high price of $50, buyers demand 100 units while sellers supply 300 units." },
  { id: 12073, sourceGame: "marketGate", q: "Refer to the price ceiling and price floor graph. At $10, what are quantity demanded and quantity supplied?", options: ["Quantity demanded is 300 and quantity supplied is 100", "Quantity demanded is 100 and quantity supplied is 300", "Quantity demanded is 150 and quantity supplied is 250", "Quantity demanded is 250 and quantity supplied is 150"], a: 0, tag: "price_ceiling", type: "graph", objective: "LO6.1", difficulty: "hard", conceptCluster: "government_policy", primarySkill: "ceiling_quantity_reading", secondarySkills: ["graph_reading"], repairSkill: "ceiling_shortage_calculation", commonError: "reverses_demand_and_supply_at_low_price", image: "ceilingfloor.png", feedback: "At a low price of $10, buyers demand 300 units while sellers supply 100 units." },
  { id: 12074, sourceGame: "marketGate", q: "Refer to the tax incidence graph. Before the tax, the equilibrium is $15 and 100 units. After the tax, buyers pay $18, sellers receive $12, and 80 units are sold. What is total tax revenue?", options: ["$480", "$240", "$300", "$600"], a: 0, tag: "taxes", type: "graph_calculation", objective: "LO6.3", difficulty: "hard", conceptCluster: "government_policy", primarySkill: "tax_revenue_calculation", secondarySkills: ["tax_wedge_calculation"], repairSkill: "tax_wedge_incidence", commonError: "uses_original_quantity_instead_of_after_tax_quantity", image: "taxincidence.png", feedback: "The tax is $18 - $12 = $6 per unit. Tax revenue is $6 × 80 = $480." },
  { id: 12075, sourceGame: "marketGate", q: "Refer to the tax incidence graph. What is the total buyer burden after the tax?", options: ["$240", "$480", "$300", "$960"], a: 0, tag: "tax_incidence", type: "graph_calculation", objective: "LO6.5", difficulty: "hard", conceptCluster: "government_policy", primarySkill: "total_buyer_tax_burden", secondarySkills: ["buyer_tax_burden_calculation"], repairSkill: "tax_incidence_less_elastic_side", commonError: "uses_tax_wedge_instead_of_buyer_price_increase", image: "taxincidence.png", feedback: "Buyers pay $3 more than before, and 80 units are sold. Total buyer burden is $3 × 80 = $240." },
  { id: 12076, sourceGame: "marketGate", q: "Refer to the tax incidence graph. What is the total seller burden after the tax?", options: ["$240", "$480", "$300", "$960"], a: 0, tag: "tax_incidence", type: "graph_calculation", objective: "LO6.5", difficulty: "hard", conceptCluster: "government_policy", primarySkill: "total_seller_tax_burden", secondarySkills: ["seller_tax_burden_calculation"], repairSkill: "tax_incidence_less_elastic_side", commonError: "uses_tax_wedge_instead_of_seller_price_decrease", image: "taxincidence.png", feedback: "Sellers receive $3 less than before, and 80 units are sold. Total seller burden is $3 × 80 = $240." },
  { id: 12077, sourceGame: "marketGate", q: "Refer to the tax incidence graph. What is the total burden on buyers and sellers combined?", options: ["$480", "$240", "$960", "$160"], a: 0, tag: "tax_incidence", type: "graph_calculation", objective: "LO6.5", difficulty: "hard", conceptCluster: "government_policy", primarySkill: "total_tax_burden_calculation", secondarySkills: ["tax_revenue_calculation"], repairSkill: "tax_wedge_incidence", commonError: "adds_buyer_and_seller_prices_instead_of_tax_revenue", image: "taxincidence.png", feedback: "The tax is $6 per unit and 80 units are sold. Total tax burden, which becomes revenue, is $480." },
  { id: 12078, sourceGame: "marketGate", q: "Refer to the tax incidence graph. How much consumer-side tax burden per unit is shown?", options: ["$3", "$6", "$12", "$18"], a: 0, tag: "tax_incidence", type: "graph_calculation", objective: "LO6.5", difficulty: "hard", conceptCluster: "government_policy", primarySkill: "buyer_tax_burden_calculation", secondarySkills: ["pre_tax_equilibrium_identification"], repairSkill: "tax_incidence_less_elastic_side", commonError: "uses_full_tax_as_buyer_burden", image: "taxincidence.png", feedback: "Buyers paid $15 before the tax and pay $18 after the tax, so buyers bear $3 per unit." },
  { id: 12079, sourceGame: "marketGate", q: "Refer to the tax incidence graph. How much producer-side tax burden per unit is shown?", options: ["$3", "$6", "$12", "$15"], a: 0, tag: "tax_incidence", type: "graph_calculation", objective: "LO6.5", difficulty: "hard", conceptCluster: "government_policy", primarySkill: "seller_tax_burden_calculation", secondarySkills: ["pre_tax_equilibrium_identification"], repairSkill: "tax_incidence_less_elastic_side", commonError: "uses_full_tax_as_seller_burden", image: "taxincidence.png", feedback: "Sellers received $15 before the tax and receive $12 after the tax, so sellers bear $3 per unit." },
  { id: 12080, sourceGame: "marketGate", q: "Refer to the tax incidence graph. What is the tax wedge and what happens to quantity sold?", options: ["The wedge is $6 and quantity falls from 100 to 80", "The wedge is $3 and quantity falls from 100 to 80", "The wedge is $6 and quantity rises from 80 to 100", "The wedge is $30 and quantity stays at 100"], a: 0, tag: "taxes", type: "graph_interpretation", objective: "LO6.3", difficulty: "hard", conceptCluster: "government_policy", primarySkill: "tax_wedge_and_quantity_effect", secondarySkills: ["tax_wedge_calculation", "tax_quantity_effect"], repairSkill: "tax_wedge_incidence", commonError: "separates_wedge_from_quantity_effect", image: "taxincidence.png", feedback: "The wedge is $18 - $12 = $6, and quantity falls from 100 before the tax to 80 after the tax." },
  { id: 12081, sourceGame: "marketGate", q: "Refer to the tax incidence graph. What does the equal $3 buyer burden and $3 seller burden suggest?", options: ["Buyers and sellers split the tax burden equally in this graph", "Buyers bear the entire tax", "Sellers bear the entire tax", "The tax has no burden because revenue is collected"], a: 0, tag: "tax_incidence", type: "graph_interpretation", objective: "LO6.5", difficulty: "hard", conceptCluster: "government_policy", primarySkill: "equal_tax_incidence_interpretation", secondarySkills: ["buyer_seller_tax_burden"], repairSkill: "tax_incidence_less_elastic_side", commonError: "thinks_tax_revenue_means_no_burden", image: "taxincidence.png", feedback: "Buyers pay $3 more and sellers receive $3 less, so the burden is split evenly in this graph." },
  { id: 12082, sourceGame: "marketGate", q: "Refer to the tax incidence graph. If the tax were legally placed on buyers instead of sellers but the same wedge resulted, what would change in the economic burden?", options: ["Nothing; the economic burden would still depend on the wedge and elasticities", "Buyers would automatically bear all of it", "Sellers would automatically bear all of it", "Quantity would increase"], a: 0, tag: "tax_incidence", type: "graph_interpretation", objective: "LO6.4", difficulty: "hard", conceptCluster: "government_policy", primarySkill: "buyer_seller_tax_equivalence", secondarySkills: ["tax_wedge_identification"], repairSkill: "tax_equivalence", commonError: "thinks_legal_assignment_determines_tax_burden", image: "taxincidence.png", feedback: "The legal assignment does not determine the economic burden. The wedge and elasticities determine how the burden is split." },
  { id: 12083, sourceGame: "marketGate", q: "Refer to the tax incidence graph. Which calculation correctly measures the tax per unit?", options: ["Price paid by buyers minus price received by sellers", "Original equilibrium price minus after-tax quantity", "Original quantity minus after-tax quantity", "Buyer price plus seller price"], a: 0, tag: "taxes", type: "graph_interpretation", objective: "LO6.3", difficulty: "hard", conceptCluster: "government_policy", primarySkill: "tax_wedge_formula", secondarySkills: ["tax_wedge_calculation"], repairSkill: "tax_wedge_incidence", commonError: "uses_quantity_change_as_tax_amount", image: "taxincidence.png", feedback: "The per-unit tax is the wedge between the price buyers pay and the price sellers receive." },
  { id: 12084, sourceGame: "marketGate", q: "Refer to the tax incidence graph. If students use the original quantity of 100 to calculate tax revenue, what mistake are they making?", options: ["They are ignoring that the tax reduces quantity sold to 80", "They are correctly using the pre-tax market size", "They are measuring the buyer burden only", "They are calculating a shortage"], a: 0, tag: "taxes", type: "graph_interpretation", objective: "LO6.3", difficulty: "hard", conceptCluster: "government_policy", primarySkill: "tax_revenue_quantity_base", secondarySkills: ["tax_quantity_effect"], repairSkill: "tax_wedge_incidence", commonError: "uses_pre_tax_quantity_for_tax_revenue", image: "taxincidence.png", feedback: "Tax revenue is based on the quantity actually sold after the tax, which is 80 units." },
  { id:12085, sourceGame: "nationalLedger", difficulty:"hard", conceptCluster:"gdp_measurement", primarySkill:"income_expenditure_identity", secondarySkills:["gdp_counting_rules"], repairSkill:"income_expenditure_identity", commonError:"Treating spending and income as unrelated totals instead of two sides of the same transaction.", q:"A firm produces $600,000 of final output. It pays $350,000 in wages, $100,000 in rent, $50,000 in interest, and keeps $100,000 in profit. What does this example show about GDP measurement?", options:["Expenditure on output and income earned from production both equal $600,000","Only wages count in GDP, so GDP is $350,000","Profit is excluded from GDP, so GDP is $500,000","GDP cannot be measured from income"], a:0, tag:"gdp_income_expenditure", type:"multi-step", objective:"LO24.1", feedback:"The value of final output equals the income generated in producing it: wages, rent, interest, and profit all add to $600,000." },
  { id:12086, sourceGame: "nationalLedger", difficulty:"hard", conceptCluster:"gdp_measurement", primarySkill:"income_expenditure_identity", secondarySkills:["gdp_counting_rules"], repairSkill:"income_expenditure_identity", commonError:"Treating spending and income as unrelated totals instead of two sides of the same transaction.", q:"Suppose total spending on domestically produced final goods is $22 trillion. Firms pay $13 trillion in wages, $3 trillion in rent and interest, and $4 trillion in profit. What must account for the remaining $2 trillion if income and expenditure are to match?", options:["Other income categories such as taxes on production and depreciation-type accounting adjustments","Imports, because imports are always income","Used goods sales","Transfer payments directly counted in GDP"], a:0, tag:"gdp_income_expenditure", type:"multi-step", objective:"LO24.1", feedback:"GDP income accounting includes more than wages, rent, interest, and profit; the identity still requires total income generated by production to match expenditure." },
  { id:12087, sourceGame: "nationalLedger", difficulty:"hard", conceptCluster:"gdp_measurement", primarySkill:"intermediate_vs_final_goods", secondarySkills:["gdp_counting_rules"], repairSkill:"intermediate_vs_final_goods", commonError:"Double-counting intermediate goods instead of counting final value or value added.", q:"Why would counting both the sale of flour to a bakery and the sale of bread to consumers overstate GDP?", options:["It would count the value of the flour once as an intermediate good and again inside the final bread price","It would exclude the baker's labor income","It would treat bread as an import","It would make income less than expenditure by definition"], a:0, tag:"gdp_definition", type:"trap", objective:"LO24.2", feedback:"Intermediate goods are already embodied in the final good, so counting both creates double counting." },
